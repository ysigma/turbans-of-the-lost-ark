      if (util.dist2(p.x, p.z, arkPosition.x, arkPosition.z) < 200 * 200) buildArk();
    }
  }

  function spawnRing() {
    const col = ctx.collectibles;
    if (typeof col?.spawnLoose !== 'function') return;
    ringSpawned = true;
    const y = arkGround + TURBAN_HOVER;
    for (let k = 0; k < RING_COUNT; k++) {
      const a = k / RING_COUNT * TAU + 0.31;
      const lx = Math.cos(a) * RING_R, lz = Math.sin(a) * RING_R;
      col.spawnLoose(new THREE.Vector3(toWorldX(lx, lz), y, toWorldZ(lx, lz)), 1,
        { kind: 'golden', life: Infinity, bounce: false, spread: 0 });
    }
  }

  // ---------------------------------------------------------------- confetti
  function clearConfetti() {
    if (!assets) return;
    const c = assets.confetti;
    c.life.fill(0);
    c.size.fill(0);
    for (let i = 0; i < CONFETTI_COUNT; i++) c.pos[i * 3 + 1] = -1e4;
    c.alive = 0;
    c.posAttr.needsUpdate = true;
    c.sizeAttr.needsUpdate = true;
    c.points.visible = false;
  }

  function burstConfetti(count, y, power) {
    const c = assets.confetti;
    let made = 0;
    for (let i = 0; i < CONFETTI_COUNT && made < count; i++) {
      if (c.life[i] > 0) continue;
      const a = Math.random() * TAU;
      const sp = (1.5 + Math.random() * 4) * power;
      c.pos[i * 3] = Math.cos(a) * 0.3;
      c.pos[i * 3 + 1] = y + (Math.random() - 0.5) * 0.4;
      c.pos[i * 3 + 2] = Math.sin(a) * 0.3;
      c.vel[i * 3] = Math.cos(a) * sp;
      c.vel[i * 3 + 1] = (4 + Math.random() * 5) * power;
      c.vel[i * 3 + 2] = Math.sin(a) * sp;
      c.life[i] = 3.5 + Math.random() * 2;
      c.size[i] = 1;
      made++;
    }
    c.alive += made;
    if (made) c.points.visible = true;
  }

  function updateConfetti(dt, t) {
    const c = assets.confetti;
    if (c.alive <= 0) return;
    const drag = Math.exp(-1.8 * dt);
    let alive = 0;
    for (let i = 0; i < CONFETTI_COUNT; i++) {
      if (c.life[i] <= 0) continue;
      c.life[i] -= dt;
      const i3 = i * 3;
      if (c.life[i] <= 0) {
        c.life[i] = 0;
        c.size[i] = 0;
        c.pos[i3 + 1] = -1e4;
        continue;
      }
      alive++;
      let vy = c.vel[i3 + 1] - 7 * dt;
      if (vy < -1.4) vy = util.damp(vy, -1.4, 6, dt);     // paper flutters, it doesn't plummet
      c.vel[i3] *= drag;
      c.vel[i3 + 2] *= drag;
      c.vel[i3 + 1] = vy;
      const flutter = Math.sin(t * 3 + c.phase[i] * TAU) * 0.6;
      c.pos[i3] += (c.vel[i3] + flutter) * dt;
      c.pos[i3 + 1] += vy * dt;
      c.pos[i3 + 2] += (c.vel[i3 + 2] - flutter * 0.5) * dt;
      if (c.pos[i3 + 1] <= CONFETTI_FLOOR) {   // settles on the courtyard
        c.pos[i3 + 1] = CONFETTI_FLOOR;
        c.vel[i3] = 0; c.vel[i3 + 1] = 0; c.vel[i3 + 2] = 0;
      }
      c.size[i] = Math.min(1, c.life[i] * 1.5);
    }
    c.alive = alive;
    c.posAttr.needsUpdate = true;
    c.sizeAttr.needsUpdate = true;
    if (!alive) c.points.visible = false;
  }

  // ---------------------------------------------------------------- the rumal at rest and at play
  function animateArk(dt, t, mode) {
    const A = assets;
    const victory = mode === 'victory';
    lift = util.damp(lift, victory ? 1 : 0, victory ? 1.4 : 0.9, dt);
    const ease = lift * lift * (3 - 2 * lift);
    rumalSpin += dt * (0.45 + 2.9 * ease);
    const y = RUMAL_Y + ease * VICTORY_LIFT + Math.sin(t * 1.3) * 0.07;
    A.rumalPivot.position.y = y;
    A.rumalPivot.rotation.y = rumalSpin;

    const night = clamp(ctx.sky?.nightFactor ?? 0, 0, 1);
    const cam = ctx.camera.position;
    const near = util.dist2(cam.x, cam.z, arkPosition.x, arkPosition.z) < 170 * 170;

    if (near) {
      // ripple the silk (positions + analytic-ish normals, no allocation)
      const amp = 1 + ease * 0.9;
      const pos = A.clothGeo.attributes.position, nor = A.clothGeo.attributes.normal;
      const pa = pos.array, na = nor.array, U = A.clothU, Vv = A.clothV, Z = A.clothZ;
      const g = CLOTH_SEG + 1;
      for (let i = 0; i < Z.length; i++) {
        Z[i] = clothWave(U[i], Vv[i], t, amp);
        pa[i * 3 + 2] = Z[i];
      }
      for (let iy = 0; iy < g; iy++) {
        const iyA = iy > 0 ? iy - 1 : iy, iyB = iy < g - 1 ? iy + 1 : iy;
        for (let ix = 0; ix < g; ix++) {
          const ixA = ix > 0 ? ix - 1 : ix, ixB = ix < g - 1 ? ix + 1 : ix;
          const i = iy * g + ix;
          const iL = iy * g + ixA, iR = iy * g + ixB, iU = iyA * g + ix, iD = iyB * g + ix;
          const dzdx = (Z[iR] - Z[iL]) / ((U[iR] - U[iL]) * RUMAL_SIZE);
          const dzdy = (Z[iU] - Z[iD]) / ((Vv[iU] - Vv[iD]) * RUMAL_SIZE);
          const inv = 1 / Math.sqrt(dzdx * dzdx + dzdy * dzdy + 1);
          na[i * 3] = -dzdx * inv;
          na[i * 3 + 1] = -dzdy * inv;
          na[i * 3 + 2] = inv;
        }
      }
      pos.needsUpdate = true;
      nor.needsUpdate = true;

      // studs ride the ripple and glint
      const defs = A.studDefs;
      for (let i = 0; i < defs.length; i++) {
        const d = defs[i];
        _pv.set(d[0] * RUMAL_SIZE, d[1] * RUMAL_SIZE, clothWave(d[0], d[1], t, amp) + 0.035);
        _qv.setFromAxisAngle(Z_AXIS, t * 0.9 + d[3]);
        const tw = 0.85 + 0.35 * Math.pow(0.5 + 0.5 * Math.sin(t * 3.4 + d[3] * 2.1), 6);
        _sv.setScalar(d[2] * tw);
        _mv.compose(_pv, _qv, _sv);
        A.studs.setMatrixAt(i, _mv);
      }
      A.studs.instanceMatrix.needsUpdate = true;
      A.studMat.emissiveIntensity = 1.4 + 0.5 * Math.sin(t * 3.1) + ease;

      A.sparkleUniforms.uBurst.value = ease;
      A.pointUniforms.uTime.value = t;
      A.pointUniforms.uScale.value = (ctx.renderer?.domElement?.height || 900) * 0.866;
      A.glow.material.opacity = clamp((0.42 + 0.1 * Math.sin(t * 2.2)) * (1 + 0.6 * night) + ease * 0.3, 0, 1);
      const gs = 4.2 + ease * 3;
      A.glow.scale.set(gs, gs, 1);
    }
    A.sparkles.position.y = y;
    A.root.updateMatrixWorld();

    _v.set(0, y + 0.2, 0);
    A.root.localToWorld(_v);
    light.position.copy(_v);
    light.intensity = (26 + 6 * Math.sin(t * 2.2)) * (1 + 0.8 * night) * (1 + ease);

    if (victory && t >= nextFountain) {
      burstConfetti(48, y, 0.75);
      nextFountain = t + 1.5;
    }
    updateConfetti(dt, t);
  }

  // ---------------------------------------------------------------- the golden beam
  function ensureBeam() {
    if (beam) return beam;
    const time = { value: 0 };
    const opacity = { value: 0 };
    const make = (r0, r1, color, strength) => {
      const geo = new THREE.CylinderGeometry(r1, r0, BEAM_HEIGHT, 20, 1, true);
      geo.translate(0, BEAM_HEIGHT / 2, 0);
      const mesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({
        name: 'ark-beam',
        uniforms: { uColor: { value: new THREE.Color(color).multiplyScalar(strength) }, uTime: time, uOpacity: opacity },
        vertexShader: BEAM_VERT,
        fragmentShader: BEAM_FRAG,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        fog: false,
        toneMapped: false,
      }));
      mesh.frustumCulled = false;
      return mesh;
    };
    const group = new THREE.Group();
    group.name = 'ark-beam';
    group.add(make(1.1, 1.4, '#fff3c4', 1.0));
    group.add(make(3.4, 4.6, '#ffc93c', 0.55));
    group.visible = false;
    ctx.scene.add(group);
    beam = { group, time, opacity };
    return beam;
  }

  function updateBeam(dt, t) {
    const want = compass.stage >= 3;
    if (want) { ensureBeam(); beamFade = Math.min(1, beamFade + dt * 0.5); }
    else beamFade = Math.max(0, beamFade - dt * 2);
    if (!beam) return;
    beam.group.visible = beamFade > 0.001;
    if (!beam.group.visible) return;

    const cam = ctx.camera.position;
    const dh = Math.sqrt(util.dist2(cam.x, cam.z, arkPosition.x, arkPosition.z));
    beam.time.value = t;
    beam.opacity.value = beamFade * (0.12 + 0.88 * sstep(6, 18, dh));   // thin out when you stand in it

    // Beyond BEAM_PROXY, draw it nearer and smaller along the same line of sight: identical on
    // screen, but safely inside the camera's far plane.
    const baseY = arkGround + 0.5;
    _v.set(arkPosition.x - cam.x, baseY - cam.y, arkPosition.z - cam.z);
    const d = _v.length();
    if (d > BEAM_PROXY) {
      const s = BEAM_PROXY / d;
      beam.group.position.copy(cam).addScaledVector(_v, s);
      beam.group.scale.setScalar(s);
    } else {
      beam.group.position.set(arkPosition.x, baseY, arkPosition.z);
      beam.group.scale.setScalar(1);
    }
  }

  // ---------------------------------------------------------------- compass
  function updateCompass(dt, t, px, pz, mode) {
    const total = ctx.state.totalCollected || 0;
    let stage = 0;
    while (stage < 3 && total >= STAGE_AT[stage]) stage++;
    const lo = stage === 0 ? 0 : STAGE_AT[stage - 1];
    compass.charge = stage >= 3 ? 1 : clamp((total - lo) / (STAGE_AT[stage] - lo), 0, 1);

    const dx = arkPosition.x - px, dz = arkPosition.z - pz;
    const d = Math.hypot(dx, dz);
    wobbleAmp = util.damp(wobbleAmp, WOBBLE_AT_STAGE[stage], 1.6, dt);
    if (stage === 0) {
      // not enough turbans: the needle wanders round like an uncle looking for his keys
      needle += dt * (0.85 + 0.55 * Math.sin(t * 0.31));
    } else {
      const n = clamp(1.4 * (0.72 * wobbleNoise.noise2(t * 0.22, 3.1) + 0.28 * wobbleNoise.noise2(t * 1.15, 8.7)), -1, 1);
      needle = util.angleDamp(needle, Math.atan2(-dx, -dz) + wobbleAmp * n, 6, dt);
    }
    needle = util.angleWrap(needle);

    compass.stage = stage;
    compass.angle = needle;
    compass.wobble = wobbleAmp;
    compass.distance = stage < 2 ? null : stage === 2 ? Math.max(50, Math.round(d / 50) * 50) : Math.round(d);
    compass.text = content().compass?.[`stage${stage}`] || '';

    if (mode !== 'title' && stage > announced) {
      for (let s = announced + 1; s <= stage; s++) {
        ctx.events.emit('quest:stage', { stage: s, text: content().compass?.[`stage${s}`] || '' });
      }
      announced = stage;
      ctx.audio?.sfx?.('compass');
    }
  }

  // ---------------------------------------------------------------- arrival and victory
  function proximity(px, pz, t) {
    const d = Math.sqrt(util.dist2(px, pz, arkPosition.x, arkPosition.z));
    if (!heardNear && d < NEAR_R) {
      heardNear = true;
      const line = util.randomLine(content().ark?.nearLines);
      if (line) ctx.hud?.toast?.(line, { tone: 'joke' });
    }
    if (!arrived && d < ARRIVE_R) {
      arrived = true;
      heardNear = true;
      const line = content().ark?.arrive;
      if (line) ctx.hud?.toast?.(line, { tone: 'win' });
    }
    if (d < 90) ctx.audio?.requestDhol?.(0.28 * (1 - d / 90));   // the Ark hums with a faint dhol
    if (!rumalTaken && d < TOUCH_R) triggerVictory(t);
  }

  function triggerVictory(t) {
    rumalTaken = true;
    ctx.state.rumalFound = true;
    ctx.setMode('victory');
    ctx.events.emit('quest:victory', { stats: { ...ctx.state, time: ctx.state.timePlayed } });
    if (arkBuilt) {
      burstConfetti(220, assets.rumalPivot.position.y, 1);
      nextFountain = t + 1.2;
    }
    const line = content().characters?.[ctx.state.character]?.victoryLine;
    if (line) ctx.player?.say?.(line, 4);
  }

  // ---------------------------------------------------------------- lifecycle
  function resetRunFlags() {
    arrived = false;
    heardNear = false;
    ringSpawned = false;
    rumalTaken = false;
    lift = 0;
    nextFountain = 0;
    clearConfetti();
  }

  function reset(seed) {
    removeArk();
    beamFade = 0;
    if (beam) beam.group.visible = false;
    chooseSite(seed);
    ctx.world?.reserveArea?.(arkPosition.x, arkPosition.z, ARK_RESERVE_R, { flatten: true });
    arkGround = heightAt(arkPosition.x, arkPosition.z);
    resetRunFlags();
    wobbleAmp = 0;
  }

  function start() {
    resetRunFlags();
    rumalTaken = !!ctx.state.rumalFound;
    announced = 0;
    wobbleAmp = 0;
    beamFade = 0;
  }

  function update(dt, t) {
    const mode = ctx.state.mode;
    const p = explorerPos();
    const px = p.x, pz = p.z;
    updateCompass(dt, t, px, pz, mode);
    ensureArk();
    if (arkBuilt) {
      if (!ringSpawned && mode === 'playing') spawnRing();
      animateArk(dt, t, mode);
    }
    updateBeam(dt, t);
    if (mode === 'playing') proximity(px, pz, t);
    else if (mode === 'victory') ctx.audio?.requestDhol?.(1);
  }

  ctx.events.on('chunk:load', (e) => {
    if (e && e.cx === arkChunk.cx && e.cz === arkChunk.cz) buildArk();
  });
  ctx.events.on('chunk:unload', (e) => {
    if (e && e.cx === arkChunk.cx && e.cz === arkChunk.cz) removeArk();
  });

  return {
    arkPosition,
    compass,
    isRevealed: () => compass.stage >= 3 || rumalTaken,
    reset,
    start,
    update,
  };
}

return { init };
})();

// ===== landmarks.js =====
const M_landmarks = (function () {
"use strict";
// landmarks.js — the set pieces that make the jungle feel lived in.
// Dhaba checkpoints (steaming chai, a waving chacha, string lights), joke signposts, heckling
// parrots, the dhol tractor, mustard-field scarecrows and mossy ruins. Everything is placed per
// chunk from rngFor(seed, 'landmarks', cx, cz), so a chunk always rebuilds identically. The static
// parts of a chunk are merged into one vertex-coloured mesh; only things that move or carry a
// painted sign get meshes of their own. Geometry, materials and sign textures are shared across
// chunks (textures are reference-counted and disposed when the last user unloads).

const TAU = Math.PI * 2;
const SIGN_FONT = '"Baloo Paaji 2", "Trebuchet MS", sans-serif';

// How often things appear.
const DHABA_CHANCE = 0.2;          // ~1 per 5 chunks
const TRACTOR_CHANCE = 1 / 12;     // ~1 per 12 chunks
const PARROT_CHANCE = 0.5;         // ~1 per 2 chunks
const SIGN_CHANCE = 0.9;           // ~1 per chunk
const DHABA_SPAWN_GAP = 70;        // random dhabas keep this far from the spawn dhaba
const ARK_CLEARANCE = 36;          // keep the Lost Ark's courtyard free of our clutter
const SPAWN_CLEARANCE = 5;         // keep the exact spawn spot clear
const SPAWN_DHABA_DIST = 12;
const SPAWN_DHABA_RESERVE = 6.5;

// Interaction tuning.
const DHABA_TOUCH = 3, DHABA_TALK = 7, DHABA_COOLDOWN = 30, CHAI_SECONDS = 8;
const SIGN_READ = 4;
const PARROT_HECKLE = 10, PARROT_COOLDOWN = 20, SQUAWK_TIME = 1.2, PARROT_BUBBLE = 3.2;
const TRACTOR_FULL = 8, TRACTOR_SILENT = 40, TRACTOR_TOUCH = 4.2, TRACTOR_COOLDOWN = 30;
const DHOL_BPM = 100;
const STEAM_PUFFS = 7;
const ANIM_RANGE = 70, PARROT_SHOW = 60, FACE_SHOW = 110;

// Look.
const SIGN_STYLES = [
  { board: null, ink: '#fff1d6', edge: '#2b170b' },          // bare wood, cream paint
  { board: '#f2c230', ink: '#3a1d0e', edge: '#fff2c8' },     // mustard yellow
  { board: '#e8741a', ink: '#fff6e6', edge: '#5a2307' },     // kesri
  { board: '#1f6f3f', ink: '#fff1d0', edge: '#0c2a17' },     // bottle green
  { board: '#2a4fa8', ink: '#fff6e6', edge: '#0d1a3d' },     // royal blue
];
const BULB_COLORS = ['#ff8a1c', '#ff4f9a', '#f6c343', '#5ef06a', '#5ec8ff'];
const CHACHA_LOOKS = [
  { turban: '#c2185b', apron: '#d84a3a', kurta: '#eef3f6' },
  { turban: '#1f4fd1', apron: '#ff8a1c', kurta: '#f6efe2' },
  { turban: '#f2c230', apron: '#2f8f55', kurta: '#e8f0ff' },
];
const PLATE_TEXT = 'PB-WYKASSA';
const DHABA_SUBTITLE = 'ਚਾਹ  ·  CHAI  ·  PAKORE  ·  OPEN 25 HRS';

// Tiny deterministic generator for template jitter and canvas weathering, so shared art looks
// the same every session and every redraw.
function lcg(seed) {
  let s = (seed >>> 0) || 1;
  return () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// ------------------------------------------------------------------ canvas painting (pure)
function fitFont(g, text, weight, size, minSize, maxW) {
  g.font = `${weight} ${size}px ${SIGN_FONT}`;
  const w = g.measureText(text).width;
  if (w > maxW) {
    size = Math.max(minSize, Math.floor((size * maxW) / w));
    g.font = `${weight} ${size}px ${SIGN_FONT}`;
  }
  return size;
}

function drawWoodGrain(g, W, H, rnd, base) {
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const y = rnd() * H;
    g.globalAlpha = 0.06 + rnd() * 0.12;
    g.strokeStyle = rnd() < 0.55 ? '#3b2210' : '#c8925a';
    g.lineWidth = 1 + rnd() * 3;
    g.beginPath();
    g.moveTo(-10, y);
    g.bezierCurveTo(W * 0.3, y + (rnd() - 0.5) * 14, W * 0.7, y + (rnd() - 0.5) * 14, W + 10, y + (rnd() - 0.5) * 10);
    g.stroke();
  }
  for (let i = 0; i < 3; i++) {
    const kx = rnd() * W, ky = rnd() * H, kr = 5 + rnd() * 9;
    for (let ring = 0; ring < 3; ring++) {
      g.globalAlpha = 0.22 - ring * 0.05;
      g.strokeStyle = '#3b2210';
      g.lineWidth = 2;
      g.beginPath();
      g.ellipse(kx, ky, kr + ring * 5, (kr + ring * 5) * 0.45, 0, 0, TAU);
      g.stroke();
    }
  }
  g.globalAlpha = 1;
}

function drawNail(g, x, y) {
  g.fillStyle = '#2a2420';
  g.beginPath(); g.arc(x, y, 6, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.beginPath(); g.arc(x - 2, y - 2, 2.2, 0, TAU); g.fill();
  g.fillStyle = 'rgba(120,50,20,0.35)';
  g.fillRect(x - 2, y + 5, 4, 12 + (x % 7)); // a little rust streak
}

function drawVignette(g, W, H, strength) {
  const grd = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.62);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(1, `rgba(30,15,5,${strength})`);
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
}

// Two bold lines of paint on a (sometimes painted) wooden plank, chipped and sun-faded.
function drawSignpostCanvas(g, W, H, lines, style, rnd) {
  drawWoodGrain(g, W, H, rnd, '#9a6538');
  if (style.board) {
    g.fillStyle = style.board;
    g.globalAlpha = 0.93;
    g.fillRect(12, 10, W - 24, H - 20);
    g.globalAlpha = 1;
    // Peeling paint: wood shows through in flakes, mostly near the edges.
    for (let i = 0; i < 34; i++) {
      const edge = rnd() < 0.7;
      const x = edge ? (rnd() < 0.5 ? 8 + rnd() * 40 : W - 48 + rnd() * 40) : rnd() * W;
      const y = rnd() * H;
      g.fillStyle = rnd() < 0.5 ? '#8a5a33' : '#a8733f';
      g.beginPath();
      g.ellipse(x, y, 3 + rnd() * 10, 2 + rnd() * 5, rnd() * Math.PI, 0, TAU);
      g.fill();
    }
  }
  // Seam between the two boards of the plank.
  g.fillStyle = 'rgba(30,15,5,0.45)';
  g.fillRect(0, H / 2 - 2, W, 3);

  const l1 = String(lines[0] || ''), l2 = String(lines[1] || '');
  const maxW = W - 64;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  const rows = l2 ? [[l1, H * 0.3], [l2, H * 0.71]] : [[l1, H * 0.5]];
  for (const [text, y] of rows) {
    fitFont(g, text, 700, 64, 30, maxW);
    g.lineWidth = 8;
    g.strokeStyle = style.edge;
    g.globalAlpha = 0.85;
    g.strokeText(text, W / 2, y, maxW);
    g.globalAlpha = 1;
    g.fillStyle = style.ink;
    g.fillText(text, W / 2, y, maxW);
  }
  // Weathering: chips knocked out of the lettering, a few scratches, sun-bleached middle.
  for (let i = 0; i < 110; i++) {
    g.globalAlpha = 0.45 + rnd() * 0.45;
    g.fillStyle = style.board || (rnd() < 0.5 ? '#8a5a33' : '#9a6538');
    g.beginPath();
    g.ellipse(30 + rnd() * (W - 60), 24 + rnd() * (H - 48), 1.2 + rnd() * 4, 1 + rnd() * 2.5, rnd() * Math.PI, 0, TAU);
    g.fill();
  }
  g.strokeStyle = 'rgba(255,240,215,0.25)';
  g.lineWidth = 1.5;
  for (let i = 0; i < 7; i++) {
    const x = rnd() * W, y = rnd() * H;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 20 + rnd() * 50, y + (rnd() - 0.5) * 10); g.stroke();
  }
  g.globalAlpha = 1;
  drawVignette(g, W, H, 0.5);
  drawNail(g, 26, 26); drawNail(g, W - 26, 26); drawNail(g, 26, H - 26); drawNail(g, W - 26, H - 26);
}

// The dhaba's painted board: mustard yellow, big red name, phulkari-diamond borders.
function drawDhabaCanvas(g, W, H, name, rnd) {
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#ffd45e');
  grd.addColorStop(1, '#efb732');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
  const band = 20;
  const cols = ['#ff4f9a', '#ff8a1c', '#2f8f55', '#f6f0e0'];
  for (const y of [0, H - band]) {
    g.fillStyle = '#7a1424';
    g.fillRect(0, y, W, band);
    for (let x = 0, i = 0; x < W; x += band, i++) {
      const cx = x + band / 2, cy = y + band / 2, r = band * 0.38;
      g.fillStyle = cols[i % cols.length];
      g.beginPath();
      g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy);
      g.closePath();
      g.fill();
    }
  }
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  fitFont(g, name, 800, 76, 34, W - 60);
  g.lineWidth = 9;
  g.strokeStyle = '#fff6e0';
  g.strokeText(name, W / 2, H * 0.44, W - 60);
  g.fillStyle = '#b3122e';
  g.fillText(name, W / 2, H * 0.44, W - 60);
  fitFont(g, DHABA_SUBTITLE, 700, 26, 16, W - 80);
  g.fillStyle = '#3a1d0e';
  g.fillText(DHABA_SUBTITLE, W / 2, H * 0.77, W - 80);
  // Rust drips from the top nails and a sun-faded, smoky finish.
  for (let i = 0; i < 6; i++) {
    g.fillStyle = `rgba(120,50,20,${0.15 + rnd() * 0.2})`;
    g.fillRect(rnd() * W, band, 2 + rnd() * 3, 10 + rnd() * 30);
  }
  drawVignette(g, W, H, 0.35);
}

// The scarecrow's sign: marker pen on a bit of old cardboard box.
function drawCardboardCanvas(g, W, H, lines, rnd) {
  g.fillStyle = '#cfa66a';
  g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(110,70,30,0.18)';
  g.lineWidth = 3;
  for (let x = 6; x < W; x += 12) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  g.fillStyle = 'rgba(90,55,20,0.35)';
  for (let i = 0; i < 18; i++) g.fillRect(rnd() * W, rnd() < 0.5 ? 0 : H - 6, 10 + rnd() * 30, 6);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#1d1410';
  const l1 = String(lines[0] || ''), l2 = String(lines[1] || '');
  const rows = l2 ? [[l1, H * 0.32, -0.04], [l2, H * 0.7, 0.03]] : [[l1, H * 0.5, -0.03]];
  for (const [text, y, tilt] of rows) {
    g.save();
    g.translate(W / 2, y);
    g.rotate(tilt);
    fitFont(g, text, 700, 64, 24, W - 40);
    g.fillText(text, 0, 0, W - 40);
    g.restore();
  }
  drawVignette(g, W, H, 0.3);
}

function drawPlateCanvas(g, W, H) {
  g.fillStyle = '#f7f3e8';
  g.fillRect(0, 0, W, H);
  g.strokeStyle = '#111';
  g.lineWidth = 6;
  g.strokeRect(5, 5, W - 10, H - 10);
  g.fillStyle = '#111';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  fitFont(g, PLATE_TEXT, 800, 52, 20, W - 30);
  g.fillText(PLATE_TEXT, W / 2, H / 2 + 2, W - 30);
}

function drawGlowCanvas(g, W, H) {
  const grd = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
}

function init(ctx) {
  const THREE = ctx.THREE;
  const U = ctx.util;
  const content = () => ctx.content || {};

  // Scratch objects (never allocate in per-frame paths).
  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _qId = new THREE.Quaternion();
  const _e = new THREE.Euler();
  const _p = new THREE.Vector3();
  const _s = new THREE.Vector3();
  const _v = new THREE.Vector3();
  const _c = new THREE.Color();
  const Z_AXIS = new THREE.Vector3(0, 0, 1);

  // ---------------------------------------------------------------- shared materials
  const matVC = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  const matGlow = new THREE.MeshBasicMaterial({ vertexColors: true });       // bulbs, fire, headlights
  const matSteam = new THREE.MeshLambertMaterial({
    color: 0xffffff, emissive: 0x8a8a8a, transparent: true, opacity: 0.55, depthWrite: false, flatShading: true,
  });
  let matHalo = null;                                                       // sprite glow, made lazily

  // ---------------------------------------------------------------- painted textures (ref-counted)
  const texCache = new Map();   // key -> {canvas, tex, mat, refs, draw}
  let maxAniso = 0;
  function anisotropy() {
    if (!maxAniso) {
      try { maxAniso = Math.min(8, ctx.renderer?.capabilities?.getMaxAnisotropy?.() || 1); } catch (e) { maxAniso = 1; }
    }
    return maxAniso;
  }
  function makeCanvasTexture(w, h, paint) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const g = canvas.getContext('2d');
    const draw = () => { if (g) { g.clearRect(0, 0, w, h); paint(g, w, h); } };
    draw();
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = anisotropy();
    return { canvas, tex, draw };
  }
  function acquireText(key, w, h, paint) {
    let e = texCache.get(key);
    if (!e) {
      const made = makeCanvasTexture(w, h, paint);
      e = { ...made, mat: new THREE.MeshLambertMaterial({ map: made.tex }), refs: 0 };
      texCache.set(key, e);
    }
    e.refs++;
    return e;
  }
  function releaseText(key) {
    const e = texCache.get(key);
    if (!e) return;
    e.refs--;
    if (e.refs > 0) return;
    e.tex.dispose();
    e.mat.dispose();
    e.canvas.width = 0;
    e.canvas.height = 0;
    texCache.delete(key);
  }
  function haloMaterial() {
    if (!matHalo) {
      const glow = makeCanvasTexture(64, 64, drawGlowCanvas);
      matHalo = new THREE.SpriteMaterial({
        map: glow.tex, color: 0xffb35c, transparent: true, opacity: 0,
        depthWrite: false, blending: THREE.AdditiveBlending,
      });
    }
    return matHalo;
  }

  // Signs are painted immediately with whatever font is available, then repainted once the
  // game's display font (and its Gurmukhi subset) has actually loaded.
  try {
    const fonts = document.fonts;
    if (fonts) {
      const loads = [];
      if (typeof fonts.load === 'function') {
        loads.push(fonts.load(`700 64px ${SIGN_FONT}`), fonts.load(`700 26px ${SIGN_FONT}`, 'ਚਾਹ'));
      }
      Promise.all(loads.map((p) => Promise.resolve(p).catch(() => null)))
        .then(() => fonts.ready)
        .then(() => {
          for (const e of texCache.values()) { e.draw(); e.tex.needsUpdate = true; }
        })
        .catch(() => {});
    }
  } catch (e) { /* fonts API unavailable: the fallback font stays */ }

  // ---------------------------------------------------------------- geometry helpers
  // Every template part is non-indexed with position/normal/color, so parts merge freely.
  let jr = lcg(1);
  const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const Cy = (rt, rb, h, seg = 8) => new THREE.CylinderGeometry(rt, rb, h, seg);
  const Co = (r, h, seg = 6) => new THREE.ConeGeometry(r, h, seg);
  const Sp = (r, ws = 7, hs = 5) => new THREE.SphereGeometry(r, ws, hs);
  const Ic = (r, d = 0) => new THREE.IcosahedronGeometry(r, d);
  const Do = (r, d = 0) => new THREE.DodecahedronGeometry(r, d);
  const To = (r, tube, rs = 4, ts = 12, arc = TAU) => new THREE.TorusGeometry(r, tube, rs, ts, arc);

  function paint(geo, hex, jit) {
    let g = geo.index ? geo.toNonIndexed() : geo;
    if (g !== geo) geo.dispose();
    if (g.getAttribute('uv')) g.deleteAttribute('uv');
    const n = g.getAttribute('position').count;
    const col = new Float32Array(n * 3);
    _c.set(hex);
    for (let i = 0; i < n; i += 3) {
      const k = jit ? 1 - jit * jr() : 1;
      for (let j = 0; j < 3 && i + j < n; j++) {
        const o = (i + j) * 3;
        col[o] = _c.r * k; col[o + 1] = _c.g * k; col[o + 2] = _c.b * k;
      }
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return g;
  }
  // P(geometry, colour, x, y, z, rx, ry, rz, scale (number or [x,y,z]), shade jitter)
  function P(geo, hex, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1, jit = 0) {
    const g = paint(geo, hex, jit);
    _e.set(rx, ry, rz, 'XYZ');
    _q.setFromEuler(_e);
    _p.set(x, y, z);
    if (typeof s === 'number') _s.set(s, s, s); else _s.set(s[0], s[1], s[2]);
    _m.compose(_p, _q, _s);
    g.applyMatrix4(_m);
    return g;
  }
  // A square-section strut from point a to point b.
  function SEG(a, b, thick, hex, jit = 0) {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    const len = Math.hypot(dx, dy, dz) || 1e-3;
    const g = paint(B(thick, thick, len), hex, jit);
    _v.set(dx / len, dy / len, dz / len);
    _q.setFromUnitVectors(Z_AXIS, _v);
    _p.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2);
    _s.set(1, 1, 1);
    _m.compose(_p, _q, _s);
    g.applyMatrix4(_m);
    return g;
  }
  // Apply one transform to a list of already-built parts (for sub-assemblies).
  function moveAll(parts, x, y, z, rx = 0, ry = 0, rz = 0) {
    _e.set(rx, ry, rz, 'XYZ');
    _q.setFromEuler(_e);
    _p.set(x, y, z);
    _s.set(1, 1, 1);
    _m.compose(_p, _q, _s);
    for (const g of parts) g.applyMatrix4(_m);
    return parts;
  }
  function bake(parts) {
    const merged = ctx.mergeGeometries(parts, false);
    for (const g of parts) g.dispose();
    if (!merged) throw new Error('landmarks: could not merge template geometry');
    merged.computeBoundingSphere();
    return merged;
  }
  // A drooping wire of bulbs between two points: wire into `wire`, bulbs into `glow`.
  function stringLights(wire, glow, a, b, sag, bulbs, colourOffset = 0) {
    const steps = bulbs * 2;
    let prev = a;
    for (let k = 1; k <= steps; k++) {
      const u = k / steps;
      const pt = [
        a[0] + (b[0] - a[0]) * u,
        a[1] + (b[1] - a[1]) * u - sag * 4 * u * (1 - u),
        a[2] + (b[2] - a[2]) * u,
      ];
      wire.push(SEG(prev, pt, 0.02, '#262019'));
      if (k % 2 === 1) {
        const hex = BULB_COLORS[(colourOffset + (k >> 1)) % BULB_COLORS.length];
        glow.push(P(Ic(0.055, 0), hex, pt[0], pt[1] - 0.06, pt[2]));
      }
      prev = pt;
    }
  }

  const T = {};   // template cache: shared by every chunk for the lifetime of the module
  function tpl(name, build) {
    if (!T[name]) {
      jr = lcg(U.hash32('landmarks-template', name));
      T[name] = build();
    }
    return T[name];
  }

  // ================================================================ templates
  // All templates are built facing +Z with their origin on the ground.

  // Dhaba: platform, posts, corrugated tin roof, counter, chulha + chai pot, shelf of achaar
  // jars, gas cylinder, bench, signboard frame, string lights. Returns {solid, glow} geometries.
  function dhabaTemplate() {
    return tpl('dhaba', () => {
      const S = [], G = [];
      const wood = '#7a4b27', woodD = '#5b3519', woodL = '#a06a3a';
      S.push(P(B(5.4, 0.5, 4.2), '#b08055', 0, 0, 0, 0, 0, 0, 1, 0.08));
      S.push(P(B(1.4, 0.2, 0.45), woodL, 0.9, 0.1, 2.3, 0, 0, 0, 1, 0.1));            // front step
      for (const [x, z, h] of [[-2.3, 1.75, 2.82], [2.3, 1.75, 2.82], [-2.3, -1.75, 2.4], [2.3, -1.75, 2.4]]) {
        S.push(P(Cy(0.1, 0.13, h, 6), woodD, x, h / 2, z, 0, 0, 0, 1, 0.12));
      }
      S.push(P(B(4.9, 0.14, 0.16), wood, 0, 2.74, 1.75));
      S.push(P(B(4.9, 0.14, 0.16), wood, 0, 2.33, -1.75));
      for (const x of [-2.3, 2.3]) S.push(SEG([x, 2.76, 1.82], [x, 2.35, -1.82], 0.13, wood));

      // Corrugated tin roof: alternating raised strips, one odd blue sheet, rust patches.
      const th = Math.atan2(0.42, 3.5), len = 4.75, slope = Math.tan(th);
      for (let i = 0; i < 12; i++) {
        const x = -2.75 + i * 0.5;
        const col = (i === 3 || i === 4) ? '#3f86b0' : (i % 2 ? '#a7b6ba' : '#93a4a9');
        S.push(P(B(0.5, 0.05, len), col, x, 2.68 + (i % 2) * 0.035, 0, -th, 0, 0, 1, 0.1));
      }
      for (const [x, z, w, d] of [[-1.6, 0.6, 0.45, 0.7], [1.1, -1.0, 0.35, 0.5], [2.2, 1.4, 0.3, 0.35]]) {
        S.push(P(B(w, 0.02, d), '#a4532c', x, 2.73 + z * slope, z, -th, 0, 0, 1, 0.2));
      }

      // Back wall planks and woven side half-walls.
      for (let i = 0; i < 6; i++) {
        S.push(P(B(0.78, 2.1, 0.08), i % 2 ? '#6e4424' : '#80522c', -1.95 + i * 0.78, 1.3, -1.82, 0, 0, 0, 1, 0.1));
      }
      for (const x of [-2.32, 2.32]) S.push(P(B(0.08, 0.9, 3.3), '#c9a15a', x, 0.7, -0.05, 0, 0, 0, 1, 0.12));

      // Counter, painted blue with kesri/pink stripes and phulkari diamonds.
      S.push(P(B(3.2, 0.82, 0.7), '#1f6fb2', -0.35, 0.66, 1.1, 0, 0, 0, 1, 0.05));
      S.push(P(B(3.4, 0.08, 0.85), woodL, -0.35, 1.11, 1.1, 0, 0, 0, 1, 0.08));
      S.push(P(B(3.2, 0.1, 0.02), '#ff8a1c', -0.35, 0.95, 1.46));
      S.push(P(B(3.2, 0.1, 0.02), '#ff4f9a', -0.35, 0.37, 1.46));
      for (let k = 0; k < 6; k++) S.push(P(B(0.15, 0.15, 0.02), '#f6c343', -1.6 + k * 0.5, 0.66, 1.465, 0, 0, Math.PI / 4));
      // Tumblers, a plate of pakoras and a biscuit jar on the counter.
      for (let k = 0; k < 4; k++) S.push(P(Cy(0.045, 0.035, 0.12, 6), '#dff3f7', 0.55 + k * 0.13, 1.21, 1.22));
      S.push(P(Cy(0.2, 0.17, 0.03, 10), '#f4f4f0', -1.25, 1.165, 1.15));
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU;
        S.push(P(Do(0.055), '#c98a2b', -1.25 + Math.cos(a) * 0.09, 1.215, 1.15 + Math.sin(a) * 0.09, a, a, 0, 1, 0.2));
      }

  // Two-sided sign face (front and back both read correctly). Plain uv'd planes for a map.
  function faceTemplate(name, w, h, cx, cy, cz, gap) {
    if (!T[name]) {
      const front = new THREE.PlaneGeometry(w, h);
      front.translate(0, 0, gap);
      const back = new THREE.PlaneGeometry(w, h);
      back.rotateY(Math.PI);
      back.translate(0, 0, -gap);
      const merged = ctx.mergeGeometries([front, back], false);
      front.dispose();
      back.dispose();
      merged.translate(cx, cy, cz);
      merged.computeBoundingSphere();
      T[name] = merged;
    }
    return T[name];
  }

  // ================================================================ state
  const chunks = new Map();                 // chunk key -> record of what we built there
  const dhabas = [], signs = [], parrots = [], tractors = [], scarecrows = [];
  const seen = new Set();                   // signpost/scarecrow ids already read this run
  const cooldowns = new Map();              // id -> game time it is ready again (this run)

  const reported = new Set();

  function safely(what, fn) {
    try { fn(); } catch (e) {
      const msg = `${what}: ${e && e.message ? e.message : e}`;
      if (!reported.has(msg)) { reported.add(msg); console.error('[landmarks]', msg, e); }
    }
  }

  const heightAt = (x, z) => ctx.world?.heightAt?.(x, z) ?? 0;
  const waterAt = (x, z) => ctx.world?.waterDepthAt?.(x, z) ?? 0;

  // Ground height for a footprint: a little below the centre on slopes so nothing floats.
  function groundY(x, z, r) {
    const c = heightAt(x, z);
    let lo = c;
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * TAU;
      const h = heightAt(x + Math.sin(a) * r, z + Math.cos(a) * r);
      if (h < lo) lo = h;
    }
    return lo + (c - lo) * 0.35;
  }

  const _place = new THREE.Matrix4();
  const _pq = new THREE.Quaternion();
  const _pe = new THREE.Euler();
  const _pp = new THREE.Vector3();
  const _ps = new THREE.Vector3();
  // World matrix for a prop: yaw about Y, then an optional lean (rx, rz) in its own frame.
  function placeMatrix(x, y, z, yaw, rx = 0, rz = 0, scale = 1) {
    _pe.set(rx, yaw, rz, 'YXZ');
    _pq.setFromEuler(_pe);
    _pp.set(x, y, z);
    _ps.set(scale, scale, scale);
    return _place.compose(_pp, _pq, _ps);
  }
  // Object3D.rotation.y = yaw maps local (lx, lz) to world (lx·cos + lz·sin, −lx·sin + lz·cos).
  function localToWorld(out, ox, oy, oz, yaw, lx, ly, lz) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    return out.set(ox + lx * c + lz * s, oy + ly, oz - lx * s + lz * c);
  }
  function addColliders(rec, ox, oz, yaw, list, tag, scale = 1) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    for (const [lx, lz, r, h] of list) {
      rec.colliders.push({
        x: ox + (lx * c + lz * s) * scale, z: oz + (-lx * s + lz * c) * scale, r: r * scale, h: h * scale, tag,
      });
    }
  }
  function addStatic(rec, geo, matrix, glow = false) {
    const g = geo.clone();
    g.applyMatrix4(matrix);
    (glow ? rec.glowParts : rec.solidParts).push(g);
  }
  const phaseOf = (id) => ((U.hash32(id) % 10000) / 10000) * TAU;
  function signText(lines) {
    const a = String(lines[0] || '').trim(), b = String(lines[1] || '').trim();
    if (!b) return `“${a}”`;
    return `“${a}${/^[(a-z]/.test(b) ? ' ' : ' / '}${b}”`;
  }

  // ---------------------------------------------------------------- spot finding
  // Placements keep (footprint + 1.6 m) inside their own chunk, so the only solids they can
  // meet are this chunk's own: the layout never depends on which neighbours happen to be loaded.
  function spotOK(rec, x, z, r, opt) {
    const margin = opt.margin ?? r + 1.6;
    if (x < rec.x0 + margin || x > rec.x0 + rec.size - margin || z < rec.z0 + margin || z > rec.z0 + rec.size - margin) return false;
    const ark = ctx.quest?.arkPosition;
    if (ark && Number.isFinite(ark.x) && U.dist2(x, z, ark.x, ark.z) < (ARK_CLEARANCE + r) ** 2) return false;
    if (U.dist2(x, z, spawn.x, spawn.z) < (SPAWN_CLEARANCE + r) ** 2) return false;
    if (spawnDhaba && U.dist2(x, z, spawnDhaba.x, spawnDhaba.z) < (DHABA.footprint + 1 + r) ** 2) return false;
    for (const p of rec.placed) if (U.dist2(x, z, p.x, p.z) < (p.r + r) ** 2) return false;
    if (opt.biome && ctx.world?.biomeAt?.(x, z) !== opt.biome) return false;
    if (waterAt(x, z) > 0.1) return false;
    const c = heightAt(x, z);
    let lo = c, hi = c;
    const ring = r * 0.85;
    if (ring > 0.3) {
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU + 0.3;
        const sx = x + Math.sin(a) * ring, sz = z + Math.cos(a) * ring;
        if (waterAt(sx, sz) > 0.1) return false;
        const h = heightAt(sx, sz);
        if (h < lo) lo = h;
        if (h > hi) hi = h;
      }
    }
    if (hi - lo > (opt.maxRise ?? 1.5)) return false;
    const hits = ctx.world?.queryColliders?.(x, z, r + 2);
    if (hits) {
      for (const h of hits) {
        if (h && U.dist2(x, z, h.x, h.z) < (r + (h.r || 0)) ** 2) return false;
      }
    }
    return true;
  }
  // Clearings first (centre, or a point on the rim with `edge`), then random spots.
  function findSpot(rec, rng, r, opt = {}) {
    if (opt.clearings !== false) {
      for (const c of rec.clearings) {
        if (c.used && !opt.edge) continue;
        let x = c.x, z = c.z;
        if (opt.edge) {
          const a = rng() * TAU, d = Math.max(0, c.r - r - 0.4);
          x += Math.sin(a) * d;
          z += Math.cos(a) * d;
        }
        if (spotOK(rec, x, z, r, opt)) {
          if (!opt.edge) c.used = true;
          return { x, z, clearing: c };
        }
      }
    }
    const m = Math.min(rec.size / 2 - 1, r + 1.6);
    const tries = opt.tries || 14;
    for (let i = 0; i < tries; i++) {
      const x = rec.x0 + U.rand(rng, m, rec.size - m);
      const z = rec.z0 + U.rand(rng, m, rec.size - m);
      if (spotOK(rec, x, z, r, opt)) return { x, z, clearing: null };
    }
    return null;
  }

  // ---------------------------------------------------------------- builders
  function placeDhaba(rec, x, z, yaw, nameIndex, look) {
    const tplD = dhabaTemplate();
    const bodyGeo = chachaTemplate(look), armGeo = chachaArmTemplate(look), puff = puffTemplate();
    const faceGeo = faceTemplate('dhaba-face', DHABA.faceW, DHABA.faceH, DHABA.face[0], DHABA.face[1], DHABA.face[2], 0.034);
    const names = content().dhaba?.names || [];
    const name = names.length ? names[nameIndex % names.length] : "Chacha's Jungle Dhaba";
    const y = groundY(x, z, 2.6) - 0.02;

    const M = placeMatrix(x, y, z, yaw);
    addStatic(rec, tplD.solid, M);
    addStatic(rec, tplD.glow, M, true);

    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.rotation.y = yaw;
    rec.root.add(group);

    const texKey = `dhaba:${name}`;
    const te = acquireText(texKey, 768, 192, (g, w, h) => drawDhabaCanvas(g, w, h, name, lcg(U.hash32('dhaba', name))));
    rec.texKeys.push(texKey);
    group.add(new THREE.Mesh(faceGeo, te.mat));

    const chacha = new THREE.Group();
    chacha.position.set(DHABA.chacha[0], 0.25, DHABA.chacha[2]);
    group.add(chacha);
    const body = new THREE.Mesh(bodyGeo, matVC);
    body.castShadow = true;
    chacha.add(body);
    const arm = new THREE.Mesh(armGeo, matVC);
    arm.position.set(DHABA.shoulder[0], DHABA.shoulder[1], DHABA.shoulder[2]);
    arm.castShadow = true;
    chacha.add(arm);

    const steam = new THREE.InstancedMesh(puff, matSteam, STEAM_PUFFS);
    steam.frustumCulled = false;
    steam.position.set(DHABA.steam[0], DHABA.steam[1], DHABA.steam[2]);
    _s.setScalar(0.0001);
    _p.set(0, 0, 0);
    _m.compose(_p, _qId, _s);
    for (let i = 0; i < STEAM_PUFFS; i++) steam.setMatrixAt(i, _m);
    group.add(steam);
    rec.instanced.push(steam);

    const halo = new THREE.Sprite(haloMaterial());
    halo.position.set(DHABA.halo[0], DHABA.halo[1], DHABA.halo[2]);
    halo.scale.setScalar(4.5);
    group.add(halo);

    const head = localToWorld(new THREE.Vector3(), x, y, z, yaw, DHABA.chacha[0], 2.3, DHABA.chacha[2]);
    const pot = localToWorld(new THREE.Vector3(), x, y, z, yaw, DHABA.steam[0], DHABA.steam[1] + 0.5, DHABA.steam[2]);
    localToWorld(_v, x, 0, z, yaw, DHABA.service[0], 0, DHABA.service[1]);
    const sx = _v.x, sz = _v.z;
    localToWorld(_v, x, 0, z, yaw, DHABA.checkpoint[0], 0, DHABA.checkpoint[1]);
    const cpX = _v.x, cpZ = _v.z;

    addColliders(rec, x, z, yaw, DHABA.colliders, 'dhaba');
    rec.placed.push({ x, z, r: DHABA.footprint });
    const id = `${rec.key}:dhaba`;
    dhabas.push({
      key: rec.key, id, name, x, z, yaw, chacha, arm, steam, head, pot, sx, sz, cpX, cpZ,
      phase: phaseOf(id), turn: 0, wave: 0, cheer: 0,
      readyAt: cooldowns.get(id) || 0, nextTalk: 0, lastTalk: -99,
      pub: { type: 'dhaba', x, z, name },
    });
  }

  function placeSignpost(rec, rng, textRoll) {
    const list = content().signposts || [];
    if (!list.length) return;
    const spot = findSpot(rec, rng, 0.9, { edge: true, maxRise: 2.5 });
    if (!spot) return;
    const idx = Math.floor(textRoll * list.length) % list.length;
    const lines = list[idx];
    let yaw = rng() * TAU;
    if (spot.clearing && U.dist2(spot.x, spot.z, spot.clearing.x, spot.clearing.z) > 1) {
      yaw = Math.atan2(spot.clearing.x - spot.x, spot.clearing.z - spot.z);   // face into the clearing
    }
    const tilt = (rng() - 0.5) * 0.06, lean = (rng() - 0.5) * 0.1;
    const y = groundY(spot.x, spot.z, 0.3) - 0.05;
    const tplS = signpostTemplate();
    const faceGeo = faceTemplate('sign-face', SIGNPOST.faceW, SIGNPOST.faceH, 0, SIGNPOST.faceY, 0, 0.045);
    const M = placeMatrix(spot.x, y, spot.z, yaw, tilt, lean);
    addStatic(rec, tplS, M);

    const texKey = `sign:${idx}`;
    const style = SIGN_STYLES[idx % SIGN_STYLES.length];
    const te = acquireText(texKey, 600, 260, (g, w, h) => drawSignpostCanvas(g, w, h, lines, style, lcg(U.hash32('sign', idx))));
    rec.texKeys.push(texKey);
    const face = new THREE.Mesh(faceGeo, te.mat);
    M.decompose(face.position, face.quaternion, face.scale);
    rec.root.add(face);

    rec.colliders.push({ x: spot.x, z: spot.z, r: 0.22, h: 2.3, tag: 'signpost' });
    rec.placed.push({ x: spot.x, z: spot.z, r: 1.1 });
    const id = `${rec.key}:sign`;
    const text = signText(lines);
    signs.push({ key: rec.key, id, x: spot.x, z: spot.z, face, text, seen: seen.has(id), pub: { type: 'signpost', x: spot.x, z: spot.z, name: text } });
  }

  function placeParrot(rec, rng) {
    const tp = parrotTemplates();
    // Prefer a branch stub on a real trunk inside this chunk; otherwise a perch post.
    const trees = [];
    const hits = ctx.world?.queryColliders?.(rec.x0 + rec.size / 2, rec.z0 + rec.size / 2, rec.size * 0.72) || [];
    for (const h of hits) {
      if (!h || typeof h.tag !== 'string' || !/tree|trunk|palm/i.test(h.tag)) continue;
      if (Number.isFinite(h.h) && h.h < 3) continue;
      const r = h.r || 0.4;
      if (r < 0.15 || r > 1.6) continue;
      if (h.x < rec.x0 + 3 || h.x > rec.x0 + rec.size - 3 || h.z < rec.z0 + 3 || h.z > rec.z0 + rec.size - 3) continue;
      if (U.dist2(h.x, h.z, spawn.x, spawn.z) < 36 || waterAt(h.x, h.z) > 0.1) continue;
      trees.push(h);
    }
    trees.sort((a, b) => a.x - b.x || a.z - b.z);
    let perch = null;
    if (trees.length && rng() < 0.65) {
      const tr = trees[Math.floor(rng() * trees.length) % trees.length];
      const a = rng() * TAU, up = 2.5 + rng() * 1.0;
      const r = (tr.r || 0.4) - 0.06;
      const branch = branchTemplate();
      const M = placeMatrix(tr.x + Math.sin(a) * r, heightAt(tr.x, tr.z) + up, tr.z + Math.cos(a) * r, a, -0.25, 0);
      addStatic(rec, branch, M);
      _v.set(0, 0.07, 0.62).applyMatrix4(M);
      perch = { x: _v.x, y: _v.y, z: _v.z, yaw: a + (rng() - 0.5) * 1.0 };
    } else {
      const spot = findSpot(rec, rng, 0.7, { edge: true, maxRise: 3 });
      if (!spot) return;
      const yaw = rng() * TAU;
      const y = groundY(spot.x, spot.z, 0.3) - 0.05;
      const post = perchTemplate();
      addStatic(rec, post, placeMatrix(spot.x, y, spot.z, yaw));
      rec.colliders.push({ x: spot.x, z: spot.z, r: 0.25, h: 2.3, tag: 'parrot' });
      rec.placed.push({ x: spot.x, z: spot.z, r: 0.8 });
      perch = { x: spot.x, y: y + 2.255, z: spot.z, yaw };
    }

    const group = new THREE.Group();
    group.position.set(perch.x, perch.y, perch.z);
    group.rotation.y = perch.yaw;
    group.scale.setScalar(PARROT.scale);
    rec.root.add(group);
    const body = new THREE.Mesh(tp.body, matVC);
    body.castShadow = true;
    group.add(body);
    const head = new THREE.Mesh(tp.head, matVC);
    head.position.set(PARROT.neck[0], PARROT.neck[1], PARROT.neck[2]);
    head.rotation.order = 'YXZ';
    group.add(head);
    const wingL = new THREE.Mesh(tp.wing, matVC);
    wingL.position.set(-PARROT.wing, PARROT.wingY, 0);
    group.add(wingL);
    const wingR = new THREE.Mesh(tp.wing, matVC);
    wingR.position.set(PARROT.wing, PARROT.wingY, 0);
    group.add(wingR);

    const id = `${rec.key}:parrot`;
    const p = {
      key: rec.key, id, x: perch.x, z: perch.z, baseY: perch.y, yaw: perch.yaw,
      group, head, wingL, wingR, headYaw: 0, phase: phaseOf(id), squawkAt: -99,
      readyAt: cooldowns.get(id) || 0,
      headPos: new THREE.Vector3(perch.x, perch.y + PARROT.head * PARROT.scale, perch.z),
      pub: { type: 'parrot', x: perch.x, z: perch.z, name: 'Parrot' },
    };
    p.getHead = () => p.headPos;
    parrots.push(p);
  }

  function placeTractor(rec, rng) {

    if (!spot) return;

    const y = groundY(spot.x, spot.z, 2.2) - 0.06;
    const tt = tractorTemplate(), rig = speakerTemplate(), plateGeo = plateTemplate();
    const M = placeMatrix(spot.x, y, spot.z, yaw);
    addStatic(rec, tt.solid, M);
    addStatic(rec, tt.glow, M, true);

    const group = new THREE.Group();
    group.position.set(spot.x, y, spot.z);
    group.rotation.y = yaw;
    rec.root.add(group);
    const speakers = new THREE.Mesh(rig, matVC);
    speakers.position.set(TRACTOR.speakers[0], TRACTOR.speakers[1], TRACTOR.speakers[2]);

    const te = acquireText('plate', 320, 80, drawPlateCanvas);

      key: rec.key, id, x: spot.x, z: spot.z, speakers,

  function placeRuin(rec, kind, x, z, yaw, rng) {
    const def = RUINS[kind];
    const scale = 0.9 + rng() * 0.25;
    const y = groundY(x, z, def.r * 0.7) - 0.08;
    const geo = ruinTemplate(kind);
    addStatic(rec, geo, placeMatrix(x, y, z, yaw, 0, 0, scale));
    addColliders(rec, x, z, yaw, def.cols, 'ruins', scale);
    rec.placed.push({ x, z, r: def.r * scale });
  }
  function placeRuins(rec, rng) {
    const heroes = ['arch', 'arch', 'head', 'head', 'pillar'];
    const hero = heroes[Math.floor(rng() * heroes.length) % heroes.length];
    const centre = findSpot(rec, rng, RUINS[hero].r, { clearings: false, maxRise: 2.2, tries: 16 });
    if (!centre) return;
    placeRuin(rec, hero, centre.x, centre.z, rng() * TAU, rng);
    const minor = ['pillar', 'stump', 'stump', 'drums', 'block', 'stack'];
    const count = U.randInt(rng, 2, 4);
    for (let i = 0; i < count; i++) {
      const kind = minor[Math.floor(rng() * minor.length) % minor.length];
      const a = rng() * TAU, dist = RUINS[hero].r + 1.2 + rng() * 4.5, yaw = rng() * TAU;
      const x = centre.x + Math.sin(a) * dist, z = centre.z + Math.cos(a) * dist;
      if (spotOK(rec, x, z, RUINS[kind].r, { maxRise: 2.0 })) placeRuin(rec, kind, x, z, yaw, rng);
    }
  }

  // ---------------------------------------------------------------- chunk lifecycle
  function onChunkLoad(payload) {
    if (!payload || !ctx.world || !Number.isFinite(payload.cx) || !Number.isFinite(payload.cz)) return;
    const key = `${payload.cx},${payload.cz}`;
    if (chunks.has(key)) unloadChunk(key);
    const size = payload.size || ctx.world.CHUNK || 48;
    const root = new THREE.Group();
    root.name = `landmarks ${key}`;
    ctx.scene.add(root);
    const rec = {
      key, cx: payload.cx, cz: payload.cz, size,
      x0: Number.isFinite(payload.x0) ? payload.x0 : payload.cx * size,
      z0: Number.isFinite(payload.z0) ? payload.z0 : payload.cz * size,
      root,
      clearings: (payload.clearings || []).filter((c) => c && Number.isFinite(c.x) && Number.isFinite(c.z))
        .map((c) => ({ x: c.x, z: c.z, r: c.r || 5, used: false })),
      solidParts: [], glowParts: [], geos: [], instanced: [], texKeys: [], colliders: [], placed: [],
    };
    chunks.set(key, rec);

    const rng = U.rngFor(ctx.seed, 'landmarks', rec.cx, rec.cz);
    // Roll every feature up front so spot searches can never change what a chunk contains.
    const roll = { dhaba: rng(), name: rng(), look: rng(), tractor: rng(), parrot: rng(), sign: rng(), text: rng() };
    const mid = { x: rec.x0 + size / 2, z: rec.z0 + size / 2 };
    const biome = payload.biome || ctx.world.biomeAt?.(mid.x, mid.z);
    const lookIndex = Math.floor(roll.look * CHACHA_LOOKS.length);

    if (key === spawnKey && spawnDhaba) {
      safely('spawn dhaba', () => placeDhaba(rec, spawnDhaba.x, spawnDhaba.z, spawnDhaba.yaw, 0, lookIndex));
    } else if (roll.dhaba < DHABA_CHANCE && (!spawnDhaba || U.dist2(mid.x, mid.z, spawnDhaba.x, spawnDhaba.z) > DHABA_SPAWN_GAP ** 2)) {
      safely('dhaba', () => {
        const spot = findSpot(rec, rng, DHABA.footprint, { maxRise: 1.2 });
        const names = content().dhaba?.names || [];
        if (spot) placeDhaba(rec, spot.x, spot.z, rng() * TAU, Math.floor(roll.name * Math.max(1, names.length)), lookIndex);
      });
    }
    if (roll.tractor < TRACTOR_CHANCE) safely('tractor', () => placeTractor(rec, rng));
    if (biome === 'mustard') safely('scarecrow', () => placeScarecrow(rec, rng));
    if (biome === 'ruins') safely('ruins', () => placeRuins(rec, rng));
    if (roll.parrot < PARROT_CHANCE) safely('parrot', () => placeParrot(rec, rng));
    if (roll.sign < SIGN_CHANCE) safely('signpost', () => placeSignpost(rec, rng, roll.text));
    safely('chunk merge', () => finalize(rec));
  }

  function finalize(rec) {
    const batches = [[rec.solidParts, matVC, true], [rec.glowParts, matGlow, false]];
    for (const [parts, mat, shadows] of batches) {
      if (!parts.length) continue;
      const geo = ctx.mergeGeometries(parts, false);
      for (const g of parts) g.dispose();
      parts.length = 0;
      if (!geo) continue;
      geo.computeBoundingSphere();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = shadows;
      mesh.receiveShadow = shadows;
      mesh.matrixAutoUpdate = false;
      mesh.updateMatrix();
      rec.root.add(mesh);
      rec.geos.push(geo);
    }
    if (rec.colliders.length) ctx.world?.addColliders?.(rec.cx, rec.cz, rec.colliders);
  }

  function dropItems(list, key) {
    let w = 0;
    for (let i = 0; i < list.length; i++) if (list[i].key !== key) list[w++] = list[i];
    list.length = w;
  }
  function unloadChunk(key) {
    const rec = chunks.get(key);
    if (!rec) return;
    chunks.delete(key);
    rec.root.removeFromParent();
    for (const g of rec.geos) g.dispose();
    for (const g of rec.solidParts) g.dispose();
    for (const g of rec.glowParts) g.dispose();
    for (const im of rec.instanced) im.dispose();
    for (const k of rec.texKeys) releaseText(k);
    rec.geos.length = 0;
    rec.instanced.length = 0;
    rec.texKeys.length = 0;
    dropItems(dhabas, key);
    dropItems(signs, key);
    dropItems(parrots, key);
    dropItems(tractors, key);
    dropItems(scarecrows, key);
  }

  // The spawn dhaba: ~12 m from spawn, preferably straight ahead of a fresh camera, on dry and
  // gentle ground. Planned during reset() — before any chunk exists — so the world can keep the
  // spot free of trees and level it (reserveArea is only valid in that window).
  function planSpawnDhaba(seed) {
    spawnDhaba = null;
    const W = ctx.world;
    if (!W || typeof W.heightAt !== 'function') return;
    const rng = U.rngFor(seed, 'landmarks', 'spawn-dhaba');
    const flip = rng() < 0.5 ? 1 : -1;
    const ark = ctx.quest?.arkPosition;
    let best = null;
    for (const step of [0, 1, -1, 2, -2, 3, -3, 4]) {
      const a = Math.PI + flip * step * (Math.PI / 4);      // a = PI points along -Z (ahead)
      for (const dist of [SPAWN_DHABA_DIST, SPAWN_DHABA_DIST + 2.5, SPAWN_DHABA_DIST - 1.5]) {
        const x = spawn.x + Math.sin(a) * dist, z = spawn.z + Math.cos(a) * dist;
        if (ark && Number.isFinite(ark.x) && U.dist2(x, z, ark.x, ark.z) < (ARK_CLEARANCE + 8) ** 2) continue;
        let wet = waterAt(x, z), lo = heightAt(x, z), hi = lo;
        for (let k = 0; k < 8; k++) {
          const b = (k / 8) * TAU;
          const sx = x + Math.sin(b) * 4.5, sz = z + Math.cos(b) * 4.5;
          wet += waterAt(sx, sz);
          const h = heightAt(sx, sz);
          if (h < lo) lo = h;
          if (h > hi) hi = h;
        }
        const score = wet * 10 + (hi - lo) + Math.abs(step) * 0.2 + Math.abs(dist - SPAWN_DHABA_DIST) * 0.05;
        if (!best || score < best.score) best = { x, z, wet, score };
      }
      if (best && best.wet === 0 && best.score < 1.2) break;   // dry, gentle, roughly ahead
    }
    if (!best || best.wet > 0.3) return;   // spawn is ringed by water: no dhaba rather than a soggy one
    const yaw = Math.atan2(spawn.x - best.x, spawn.z - best.z);   // the counter faces the player
    spawnDhaba = { x: best.x, z: best.z, yaw };
    try {
      const hs = heightAt(spawn.x, spawn.z), hc = heightAt(best.x, best.z);
      const opts = { flatten: true };
      if (Math.abs(hs - hc) < 1.2) opts.height = Math.max(hs, (W.WATER_LEVEL ?? 0) + 0.6);
      W.reserveArea?.(best.x, best.z, SPAWN_DHABA_RESERVE, opts);
    } catch (e) {
      safely('reserve spawn dhaba', () => { throw e; });
    }
  }

  // ================================================================ per-frame
  function animateSteam(d, t) {
    const steam = d.steam;
    for (let i = 0; i < STEAM_PUFFS; i++) {
      const ph = (t * 0.42 + i / STEAM_PUFFS + d.phase) % 1;
      const size = Math.sin(ph * Math.PI) * (0.1 + ph * 0.24);
      _p.set(Math.sin(t * 1.7 + i * 1.9) * 0.12 * ph + ph * 0.25, ph * 1.7, Math.cos(t * 1.3 + i) * 0.1 * ph);
      _s.setScalar(Math.max(0.0001, size));
      _m.compose(_p, _qId, _s);
      steam.setMatrixAt(i, _m);
    }
    steam.instanceMatrix.needsUpdate = true;
  }

  function animateChacha(d, t, dt, px, pz, d2) {
    let target = 0;
    if (d2 < 400) target = U.clamp(U.angleWrap(Math.atan2(px - d.head.x, pz - d.head.z) - d.yaw), -0.9, 0.9);
    d.turn = U.damp(d.turn, target, 3, dt);
    d.chacha.rotation.y = d.turn;
    d.wave = U.damp(d.wave, d2 < 18 * 18 ? 1 : 0, 3.5, dt);
    if (d.cheer > 0) d.cheer = Math.max(0, d.cheer - dt);
    const cheering = d.cheer > 0;
    const w = cheering ? 1 : d.wave;
    const rest = 0.12 + 0.06 * Math.sin(t * 1.4 + d.phase);
    const up = 2.5 + 0.38 * Math.sin(t * (cheering ? 14 : 9) + d.phase);
    d.arm.rotation.z = rest + (up - rest) * w;
    d.chacha.position.y = 0.25 + (cheering ? Math.abs(Math.sin(t * 10)) * 0.08 : Math.abs(Math.sin(t * 2 + d.phase)) * 0.012);
  }

  function touchDhaba(d, t) {
    d.readyAt = t + DHABA_COOLDOWN;
    cooldowns.set(d.id, d.readyAt);
    d.cheer = 2.2;
    d.nextTalk = t + 12;
    const C = content();
    ctx.player?.setCheckpoint?.(d.cpX, d.cpZ);
    const line = U.randomLine(C.dhaba?.lines);
    if (line) ctx.hud?.toast?.(line, { tone: 'win' });
    ctx.audio?.sfx?.('checkpoint', { position: d.pot });
    ctx.events.emit('checkpoint', { x: d.cpX, z: d.cpZ, name: d.name });
    if (ctx.state) ctx.state.chaiUntil = t + CHAI_SECONDS;
    ctx.events.emit('powerup', { type: 'chai', duration: CHAI_SECONDS });
    ctx.hud?.float?.('CHAI POWER!', d.pot, { color: '#ffb347', size: 1.15, duration: 1.6 });
    // Chacha greets you, unless he is still mid-sentence from spotting you a moment ago.
    const greet = t - d.lastTalk > 3 ? U.randomLine(C.dhaba?.chacha) : '';
    if (greet) {
      d.lastTalk = t;
      ctx.hud?.bubble?.(greet, d.head, 3);
    }
  }

  function animateParrot(p, t, dt, px, pz, d2) {
    const since = t - p.squawkAt;
    const squawking = since >= 0 && since < SQUAWK_TIME;
    let target = 0;
    if (d2 < 256) target = U.clamp(U.angleWrap(Math.atan2(px - p.x, pz - p.z) - p.yaw), -1.1, 1.1);
    p.headYaw = U.damp(p.headYaw, target, 5, dt);
    const nod = Math.sin(t * 2.6 + p.phase) * 0.1 + Math.max(0, Math.sin(t * 0.8 + p.phase * 2) - 0.88) * 3;
    const shout = squawking ? -0.4 * Math.abs(Math.sin(since * 11)) : 0;
    p.head.rotation.set(nod + shout, p.headYaw, Math.sin(t * 1.3 + p.phase) * 0.14);
    let flap;
    if (squawking) {
      flap = Math.sin((Math.PI * since) / SQUAWK_TIME) * (0.45 + 0.95 * Math.abs(Math.sin(since * 24)));
    } else {
      const ruffle = Math.max(0, Math.sin(t * 0.9 + p.phase) - 0.93) * 14;
      flap = ruffle * (0.3 + 0.15 * Math.sin(t * 30));
    }
    p.wingL.rotation.z = -0.04 - flap;
    p.wingR.rotation.z = 0.04 + flap;
    const hop = squawking ? Math.abs(Math.sin(since * 9)) * 0.07 : 0;
    p.group.position.y = p.baseY + hop;
    p.headPos.y = p.baseY + hop + PARROT.head * PARROT.scale;
  }

  function squawk(p, t) {
    p.readyAt = t + PARROT_COOLDOWN;
    cooldowns.set(p.id, p.readyAt);
    p.squawkAt = t;
    const C = content();
    const ch = ctx.state?.character;
    const pool = C.parrots || {};
    const own = ch ? pool[ch] : null;
    const any = pool.any;
    const lines = own && own.length && (Math.random() < 0.6 || !(any && any.length)) ? own : any;
    const who = (C.characters || {})[ch];
    const text = U.fmt(U.randomLine(lines), { name: who?.short || who?.name || 'ji' });
    if (text) ctx.hud?.bubble?.(text, p.getHead, PARROT_BUBBLE);
    ctx.audio?.sfx?.('squawk', { position: p.headPos });
  }

  function update(dt, t) {
    const mode = ctx.state?.mode;
    const pos = ctx.player?.position;
    const px = pos && Number.isFinite(pos.x) ? pos.x : spawn.x;
    const pz = pos && Number.isFinite(pos.z) ? pos.z : spawn.z;
    const interact = mode === 'playing' && t >= quietUntil;
    const night = U.clamp(ctx.sky?.nightFactor ?? 0, 0, 1);
    matGlow.color.setScalar(0.8 + 0.9 * night);
    if (matHalo) {
      matHalo.opacity = 0.6 * night;
      matHalo.visible = night > 0.02;
    }
    const animR2 = (ctx.quality === 'low' ? ANIM_RANGE * 0.6 : ANIM_RANGE) ** 2;

    // Dhabas: steam, chacha, chai, checkpoints.
    for (let i = 0; i < dhabas.length; i++) {
      const d = dhabas[i];
      const d2 = U.dist2(px, pz, d.x, d.z);
      if (d2 < animR2) {
        animateSteam(d, t);
        animateChacha(d, t, dt, px, pz, d2);
      }
      if (!interact) continue;
      if (t >= d.readyAt && U.dist2(px, pz, d.sx, d.sz) <= DHABA_TOUCH * DHABA_TOUCH) {
        touchDhaba(d, t);
      } else if (t >= d.nextTalk && U.dist2(px, pz, d.head.x, d.head.z) <= DHABA_TALK * DHABA_TALK) {
        d.nextTalk = t + 9 + Math.random() * 7;
        const line = U.randomLine(content().dhaba?.chacha);
        if (line) {
          d.lastTalk = t;
          ctx.hud?.bubble?.(line, d.head, 3);
        }
      }
    }

    // Signposts: hide far faces, read each one aloud once per run.
    const faceR2 = FACE_SHOW * FACE_SHOW;
    for (let i = 0; i < signs.length; i++) {
      const s = signs[i];
      const d2 = U.dist2(px, pz, s.x, s.z);
      const vis = d2 < faceR2;
      if (s.face.visible !== vis) s.face.visible = vis;
      if (interact && !s.seen && d2 <= SIGN_READ * SIGN_READ) {
        s.seen = true;
        seen.add(s.id);
        ctx.hud?.toast?.(s.text, { tone: 'joke' });
      }
    }

    // Parrots: idle bobbing, heckling.
    const showR2 = PARROT_SHOW * PARROT_SHOW;
    for (let i = 0; i < parrots.length; i++) {
      const p = parrots[i];
      const d2 = U.dist2(px, pz, p.x, p.z);
      const vis = d2 < showR2;
      if (p.group.visible !== vis) p.group.visible = vis;
      if (!vis) continue;
      animateParrot(p, t, dt, px, pz, d2);
      if (interact && t >= p.readyAt && d2 <= PARROT_HECKLE * PARROT_HECKLE) squawk(p, t);
    }

    // Dhol tractors: speakers thump on the beat; dhol volume by distance.
    let dhol = 0;
    const beat = t * (DHOL_BPM / 60);
    const f = beat - Math.floor(beat);
    const thump = Math.exp(-f * 9) + 0.45 * Math.exp(-((f + 0.5) % 1) * 12);
    for (let i = 0; i < tractors.length; i++) {
      const tr = tractors[i];
      const d2 = U.dist2(px, pz, tr.x, tr.z);
      if (d2 < TRACTOR_SILENT * TRACTOR_SILENT) {
        const v = 1 - U.smoothstep(TRACTOR_FULL, TRACTOR_SILENT, Math.sqrt(d2));
        if (v > dhol) dhol = v;
      }
      if (d2 < animR2 * 2) tr.speakers.scale.set(1 + 0.05 * thump, 1 + 0.09 * thump, 1 + 0.05 * thump);
      if (interact && t >= tr.readyAt && d2 <= TRACTOR_TOUCH * TRACTOR_TOUCH) {
        tr.readyAt = t + TRACTOR_COOLDOWN;
        cooldowns.set(tr.id, tr.readyAt);
        const line = U.randomLine(content().tractor);
        if (line) ctx.hud?.toast?.(line, { tone: 'joke' });
      }
    }
    if (dhol > 0.001 && (mode === 'playing' || mode === 'victory' || mode === 'title')) ctx.audio?.requestDhol?.(dhol);

    // Scarecrows: sway in the breeze; read the sign once per run.
    for (let i = 0; i < scarecrows.length; i++) {
      const c = scarecrows[i];
      const d2 = U.dist2(px, pz, c.x, c.z);
      if (d2 < animR2) {
        c.sway.rotation.z = Math.sin(t * 1.1 + c.phase) * 0.035;
        c.sway.rotation.x = Math.sin(t * 0.8 + c.phase * 1.7) * 0.02;
      }
      if (interact && !c.seen && d2 <= SIGN_READ * SIGN_READ) {
        c.seen = true;
        seen.add(c.id);
        ctx.hud?.toast?.(c.text, { tone: 'joke' });
      }
    }
  }

  // ================================================================ public API
  const CATEGORIES = [dhabas, tractors, parrots, signs, scarecrows];
  function list(x, z, r = Infinity) {
    const out = [];
    if (!Number.isFinite(x) || !Number.isFinite(z)) return out;
    const r2 = r * r;
    for (const items of CATEGORIES) {
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (U.dist2(x, z, it.x, it.z) <= r2) out.push(it.pub);
      }
    }
    return out;
  }

  function nearestCheckpoint(x, z) {
    if (!Number.isFinite(x) || !Number.isFinite(z)) return null;
    let best = null, bestD = Infinity;
    for (let i = 0; i < dhabas.length; i++) {
      const d = dhabas[i];
      const q = U.dist2(x, z, d.cpX, d.cpZ);
      if (q < bestD) { bestD = q; best = d; }
    }
    return best ? { x: best.cpX, z: best.cpZ, name: best.name } : null;
  }

  function reset(seed) {
    for (const key of [...chunks.keys()]) unloadChunk(key);
    seen.clear();
    cooldowns.clear();
    quietUntil = 0;
    spawn = { x: 0, z: 0 };
    const sp = ctx.world?.getSpawnPoint?.();
    if (sp && Number.isFinite(sp.x) && Number.isFinite(sp.z)) spawn = { x: sp.x, z: sp.z };
    const size = ctx.world?.CHUNK || 48;
    spawnKey = `${Math.floor(spawn.x / size)},${Math.floor(spawn.z / size)}`;
    planSpawnDhaba(Number.isFinite(seed) ? seed : ctx.seed);
  }

  function start() {
    seen.clear();
    cooldowns.clear();
    quietUntil = (ctx.time || 0) + 1.5;
    for (const d of dhabas) { d.readyAt = 0; d.nextTalk = 0; d.lastTalk = -99; d.cheer = 0; }
    for (const s of signs) s.seen = false;
    for (const c of scarecrows) c.seen = false;
    for (const p of parrots) { p.readyAt = 0; p.squawkAt = -99; }
    for (const tr of tractors) tr.readyAt = 0;
  }

  ctx.events.on('chunk:load', onChunkLoad);
  ctx.events.on('chunk:unload', (p) => { if (p) unloadChunk(`${p.cx},${p.cz}`); });

  return { list, nearestCheckpoint, update, reset, start };
}

return { init };
})();

// ===== collectibles.js =====
const M_collectibles = (function () {
"use strict";
// collectibles.js — the turbans. Every one an empty, floating dastar (no head inside: that's the
// joke), spinning in the jungle air and waiting to be shouted at.
//
// Owns: the turban mesh builder, per-chunk platformer-ring placement, the instanced renderer
// (LOD + frustum culling, rebuilt every frame from a slot pool), pickup + magnet + combo,
// power-ups (kesri magnet, pink bhangra boost), Sonic-style scatter of loose turbans, night glow
// halos and sparkle bursts. Talks to other modules only through ctx, lazily, at call time.

// ------------------------------------------------------------------ constants
const KIND_NAMES = ['normal', 'pink', 'kesri', 'golden'];
const K_NORMAL = 0, K_PINK = 1, K_KESRI = 2, K_GOLDEN = 3;
const KIND_VALUE = [1, 3, 5, 10];
const KIND_SCALE = [1, 1.12, 1.12, 1.3];

const CAP = 6144;            // placed-turban slots: up to 9×9 resident chunks × ~70, with headroom
const LOOSE_CAP = 320;       // bouncing / permanent loose turbans
const SPECIAL_CAP = 384;     // per special kind, placed + loose
const PARTICLE_CAP = 900;
const HALO_CAP = 1600;
const CAND_CAP = 96;         // placement candidates per chunk

const HOVER = 1.1;           // centre height above ground for placed turbans
const REST_HOVER = 0.72;     // loose turbans settle a little lower
const HALF_H = 0.27;         // rim (mesh origin) → visual centre
const SPIN = 2.5;            // rad/s
const BOB = 0.12, BOB_RATE = 2.2;
const COMBO_WINDOW = 1.4;
const MAGNET_RADIUS = 12, MAGNET_TIME = 10, BHANGRA_TIME = 8;
const LOOSE_GRACE = 0.6, BLINK_TIME = 2;
const GRAVITY = 18;
const FLY_START = 3, FLY_ACCEL = 24, FLY_MAX_TIME = 2.2;
const TAU = Math.PI * 2;

// slot states
const FREE = 0, IDLE = 1, FLYING = 2, COLLECTED = 3, AIR = 4, REST = 5;

// Pattern weights per biome: [trail, arc, circle, zigzag, stack, spiral]
const PATTERN_WEIGHTS = {
  jungle: [3, 2, 1.6, 1.4, 0.7, 1],
  bamboo: [2, 1.5, 1, 4, 0.6, 0.8],
  ruins: [2, 2.5, 1.4, 1, 3, 1.2],
  mustard: [4.5, 1.2, 1, 2.2, 0.4, 1],
  swamp: [3, 2.4, 1, 1, 0.5, 1],
  clearing: [2, 1.5, 3, 1, 0.8, 2.2],
};

// Lathe profiles [radius, y]: the inside band, the rim, then the dome up to the crown.
const PROFILE_HI = {
  inner: [[0.21, 0.2], [0.24, 0.05], [0.27, 0.0]],
  rim: [[0.27, 0.0], [0.305, 0.02], [0.326, 0.1]],
  outer: [[0.326, 0.1], [0.332, 0.22], [0.312, 0.34], [0.26, 0.44], [0.15, 0.515], [0.0, 0.54]],
};
const PROFILE_LO = {
  inner: [[0.23, 0.12], [0.28, 0.0]],
  rim: null,
  outer: [[0.28, 0.0], [0.33, 0.16], [0.3, 0.36], [0.16, 0.5], [0.0, 0.54]],
};

// Vertex paints per kind (sRGB). Normal turbans are greys: the per-instance cloth colour
// multiplies them, so one geometry serves every colour in the palette.
const PAINTS = [
  { body: '#cfcfcf', fold: '#ffffff', rim: '#e8e8e8', stripe: null, inner: '#3c3c3c', cap: '#16110d', brooch: null },
  { body: '#ff4f9a', fold: '#ff7db6', rim: '#f6c343', stripe: '#f6c343', inner: '#7a1840', cap: '#2a0a16', brooch: '#ffe9a8' },
  { body: '#ff8a1c', fold: '#ffb347', rim: '#ff9a2e', stripe: null, inner: '#7a3300', cap: '#2a1200', brooch: null },
  { body: '#ffc93a', fold: '#ffe680', rim: '#f6c343', stripe: null, inner: '#8a5a00', cap: '#3a2600', brooch: '#fffbe8' },
];

const POINTS_VERT = `
attribute vec3 aColor;
attribute float aSize;
attribute float aAlpha;
uniform float uScale;
uniform vec2 uFade;
varying vec3 vTint;
varying float vAlpha;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float dist = max(0.05, -mv.z);
  gl_PointSize = min(320.0, aSize * uScale / dist);
  vTint = aColor;
  vAlpha = aAlpha * (1.0 - smoothstep(uFade.x, uFade.y, dist));
  gl_Position = projectionMatrix * mv;
}`;

const POINTS_FRAG = `
varying vec3 vTint;
varying float vAlpha;
void main() {
  vec2 c = gl_PointCoord - vec2(0.5);
  float d = length(c);
#ifdef STAR
  float core = 1.0 - smoothstep(0.0, 0.2, d);
  float fall = 1.0 - smoothstep(0.1, 0.5, d);
  float rays = (max(0.0, 1.0 - abs(c.x) * 16.0) + max(0.0, 1.0 - abs(c.y) * 16.0)) * fall;
  float a = clamp(core + rays * 0.75, 0.0, 1.0);
#else
  float a = 1.0 - smoothstep(0.0, 0.5, d);
  a *= a;
#endif
  a *= vAlpha;
  if (a < 0.004) discard;
  gl_FragColor = vec4(vTint, a);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

// Night glow: the turban's own colour feeds its emissive, plus a soft warm floor (so even the
// black and navy ones show up) and a rim term so the silhouette reads against dark jungle.
const GLOW_CHUNK = `#include <emissivemap_fragment>
{
  float glowRim = 1.0 - abs(dot(normal, normalize(vViewPosition)));
  totalEmissiveRadiance += (vColor * 0.8 + vec3(0.14, 0.11, 0.06)) * uGlow * (0.45 + 1.1 * glowRim * glowRim);
}`;

function smooth01(a, b, v) {
  const t = Math.min(1, Math.max(0, (v - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function kindIndex(kind) {
  const i = KIND_NAMES.indexOf(kind);
  return i < 0 ? K_NORMAL : i;
}

// ------------------------------------------------------------------ module
function init(ctx) {
  const THREE = ctx.THREE;

  const KINDS = {
    normal: { value: 1 },
    pink: { value: 3, effect: 'bhangra' },
    kesri: { value: 5, effect: 'magnet' },
    golden: { value: 10 },
  };

  // ================================================================ geometry
  function sRGB(hex) { return new THREE.Color(hex); } // ColorManagement converts hex → linear

  function paintGeometry(geom, color) {
    const g = geom.index ? geom.toNonIndexed() : geom;
    if (g !== geom) geom.dispose();
    g.deleteAttribute('uv');
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = color.r; arr[i * 3 + 1] = color.g; arr[i * 3 + 2] = color.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return g;
  }

  function lathe(points, segments) {
    return new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), segments);
  }

  function radiusAt(profile, y) {
    const pts = profile.rim ? profile.rim.concat(profile.outer) : profile.outer;
    for (let i = 0; i < pts.length - 1; i++) {
      const [r0, y0] = pts[i], [r1, y1] = pts[i + 1];
      if (y >= y0 && y <= y1) return r0 + (r1 - r0) * ((y - y0) / Math.max(1e-6, y1 - y0));
    }
    return pts[pts.length - 1][0];
  }

  // A fold of cloth: half a torus wrapping one side from the front to the back, tilted so it
  // dips toward the front centre. Left and right folds meet there, stacking into the dastar's V.
  function fold(profile, h, side, tube, radial, tubular, tilt) {
    const R = radiusAt(profile, h) + 0.012;
    const g = new THREE.TorusGeometry(R, tube, radial, tubular, Math.PI);
    g.rotateX(-Math.PI / 2);                 // arc +X → front (−Z) → −X
    g.rotateY(side * Math.PI / 2);           // now a front-to-back half ring on one side
    g.scale(1, 1, 1 / Math.cos(tilt));       // keep it hugging the dome after the tilt
    g.rotateX(-tilt);                        // front end down, back end up
    g.translate(0, h, 0);

  function sculpt(geom) {

    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      x *= 0.93; z *= 1.07;
      const f = Math.max(0, -z / 0.36), b = Math.max(0, z / 0.36);
      const top = smooth01(0.24, 0.54, y);
      y += 0.12 * Math.pow(f, 1.5) * top - 0.05 * b * top;

      body: sRGB(paint.body), fold: sRGB(paint.fold), rim: sRGB(paint.rim), inner: sRGB(paint.inner),
      cap: sRGB(paint.cap), stripe: paint.stripe ? sRGB(paint.stripe) : null, brooch: paint.brooch ? sRGB(paint.brooch) : null,
    };

      paintGeometry(lathe(P.outer, segs), C.body),

      cap.translate(0, P.inner[0][1], 0);

        heights.forEach((h, k) => {
          const col = k === 0 && C.stripe ? C.stripe : C.fold;
          parts.push(paintGeometry(fold(P, h, s, 0.04, 4, 7, 0.24), col));

        gem.scale(0.8, 1.1, 0.6);
        gem.translate(0, 0.235, -0.365);

      }

    withGlow(lambert({ color: 0xffffff }), glow[K_NORMAL]),
    withGlow(lambert({ emissive: new THREE.Color('#ff4f9a'), emissiveIntensity: 0.12 }), glow[K_PINK]),
    withGlow(lambert({ emissive: new THREE.Color('#ff7a00'), emissiveIntensity: 0.3 }), glow[K_KESRI]),
    withGlow(new THREE.MeshStandardMaterial({

      metalness: 0.5, roughness: 0.3, emissive: new THREE.Color('#ffb000'), emissiveIntensity: 0.45,
    }), glow[K_GOLDEN]),
  ];
