    const mine = clips[id] ? clips[id].recorded.length : 0;
    r.clear.disabled = mine === 0 || (recording && recording.id === id);
    const isRec = !!(recording && recording.id === id);
    r.rec.hidden = recordAvailable === false;
    r.rec.disabled = !!recording && !isRec;
    r.rec.textContent = isRec ? '■ Stop' : 'Record';
    r.rec.setAttribute('aria-pressed', isRec ? 'true' : 'false');
    r.rec.setAttribute('aria-label', isRec ? `Stop recording ${r.label}` : `Record ${r.label}`);
    r.add.disabled = isRec;
    r.play.disabled = muted;
    r.play.title = muted ? 'Sound is muted' : '';
    r.meter.hidden = !isRec;
    r.row.classList.toggle('is-recording', isRec);
  }

  function refreshAllRows() {
    if (!booth) return;
    for (const id of Object.keys(booth.rows)) refreshRow(id);
    booth.norec.hidden = recordAvailable !== false;
  }

  function markRecordUnavailable() {
    recordAvailable = false;
    refreshAllRows();
  }

  function recordSupportedUpfront() {
    const md = navigator.mediaDevices;
    if (!md || typeof md.getUserMedia !== 'function' || typeof window.MediaRecorder !== 'function') return false;
    if (window.isSecureContext === false) return false;
    try {
      const policy = document.permissionsPolicy || document.featurePolicy;
      if (policy && typeof policy.allowsFeature === 'function' && !policy.allowsFeature('microphone')) return false;
    } catch (e) { /* unknown: find out on the first press */ }
    return true;
  }

  function checkRecordAvailability() {
    if (recordAvailable === false) return;
    if (!recordSupportedUpfront()) { markRecordUnavailable(); return; }
    if (recordAvailable === null) recordAvailable = true;
    try {
      const q = navigator.permissions && navigator.permissions.query({ name: 'microphone' });
      if (q && typeof q.then === 'function') {
        q.then((s) => { if (s && s.state === 'denied') markRecordUnavailable(); }).catch(noop);
      }
    } catch (e) { /* permissions API missing: fine */ }
  }

  function onBoothClick(e) {
    const btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn || btn.disabled) return;
    const act = btn.getAttribute('data-act');
    const id = btn.getAttribute('data-id');
    if (act === 'close') { closeBooth(); return; }
    if (!id) return;
    if (act === 'play') {
      unlock();
      setNote(id, '');
      if (!voice(id, { priority: true })) setNote(id, "Couldn't play that just now. Is your sound on?", true);
    } else if (act === 'add') {
      unlock();
      booth.rows[id].file.click();
    } else if (act === 'rec') {
      if (recording && recording.id === id) stopRecording(false);
      else startRecording(id);
    } else if (act === 'clear') {
      clearTakes(id);
    }
  }

  async function acceptFile(id, file) {
    if (file.size > MAX_UPLOAD_BYTES) {
      setNote(id, 'That file is too big. A short clip of a few seconds is all you need.', true);
      return;
    }
    if (file.type && !file.type.startsWith('audio/') && !file.type.startsWith('video/')) {
      setNote(id, "That doesn't look like a sound file. Try an .m4a, .mp3 or .wav.", true);
      return;
    }
    await acceptTake(id, file.slice(0, file.size, file.type || 'audio/mp4'));
  }

  async function acceptTake(id, blob) {
    if (!ensureContext()) {
      setNote(id, "This browser can't play audio clips, so the stand-in voice will keep shouting.", true);
      return;
    }
    setNote(id, 'Checking the clip…');
    const take = makeTake(blob, null);
    try {
      analyseTake(take, await decodeAudio(await blobToArrayBuffer(blob)));
    } catch (e) {
      setNote(id, "Couldn't read that file. Try an .m4a, .mp3 or .wav.", true);
      return;
    }
    if (take.buffer.duration > MAX_CLIP_SECONDS) {
      setNote(id, `That clip is ${take.buffer.duration.toFixed(1)} s long. Keep it under ${MAX_CLIP_SECONDS} s: one big shout is perfect.`, true);
      return;
    }
    if (take.peak < 0.01) {
      setNote(id, "That take is silent. Is the right microphone picked? Give it some Babbu-level volume!", true);
      return;
    }
    const list = clipEntry(id).recorded;
    let replaced = false;
    while (list.length >= MAX_TAKES) { list.shift(); replaced = true; }
    list.push(take);
    const saved = await saveRecorded(id);
    refreshAllRows();   // aliases (waheguru_golden) show this clip too
    const n = list.length;
    let msg = replaced ? `Added, and your oldest take made way: ${n} of ${MAX_TAKES} takes.` : `Added: ${n} of ${MAX_TAKES} takes.`;
    if (!saved) msg += " This browser won't keep it after you close the page, but it plays for now.";
    setNote(id, msg);
    unlock();
    if (isLive() && !muted) playClip(id, take, 1, 1, null);
  }

  async function clearTakes(id) {
    const c = clipEntry(id);
    if (!c.recorded.length) return;
    c.recorded = [];
    const saved = await saveRecorded(id);
    refreshAllRows();
    const fallback = statusOf(id).source === 'bundled' ? 'the game clip' : 'the stand-in voice';
    setNote(id, saved ? `Cleared. Back to ${fallback}.` : `Cleared for now, back to ${fallback}.`);
  }

  async function startRecording(id) {
    if (recording) return;
    if (!recordSupportedUpfront()) { markRecordUnavailable(); return; }
    unlock();
    setNote(id, 'Asking for the microphone…');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      setNote(id, '');
      markRecordUnavailable();
      return;
    }
    if (!boothIsOpen) { stream.getTracks().forEach((tr) => tr.stop()); return; }
    let mime = '';
    try { mime = RECORDER_TYPES.find((m) => window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(m)) || ''; } catch (e) { mime = ''; }
    let rec;
    try {
      rec = mime ? new window.MediaRecorder(stream, { mimeType: mime }) : new window.MediaRecorder(stream);
    } catch (e) {
      stream.getTracks().forEach((tr) => tr.stop());
      setNote(id, '');
      markRecordUnavailable();
      return;
    }
    const r = { id, rec, stream, chunks: [], discard: false, timer: 0, raf: 0, started: performance.now(), analyser: null, source: null, bytes: null };
    if (ac) {
      try {
        r.source = ac.createMediaStreamSource(stream);
        r.analyser = ac.createAnalyser();
        r.analyser.fftSize = 512;
        r.bytes = new Uint8Array(r.analyser.fftSize);
        r.source.connect(r.analyser);
      } catch (e) { r.analyser = null; }
    }
    rec.ondataavailable = (ev2) => { if (ev2.data && ev2.data.size) r.chunks.push(ev2.data); };
    rec.onstop = () => finishRecording(r);
    recording = r;
    try {
      rec.start();
    } catch (e) {
      recording = null;
      cleanupRecording(r);
      setNote(id, "The recorder wouldn't start. Try adding a file instead.", true);
      refreshAllRows();
      return;
    }
    r.timer = setTimeout(() => stopRecording(false), RECORD_SECONDS * 1000);
    setNote(id, 'Recording. Shout it like you mean it!');
    refreshAllRows();
    const rows = booth.rows[id];
    rows.rec.focus();
    const meterLoop = () => {
      if (recording !== r) return;
      let level = 0;
      if (r.analyser) {
        r.analyser.getByteTimeDomainData(r.bytes);
        for (let i = 0; i < r.bytes.length; i++) {
          const a = Math.abs(r.bytes[i] - 128) / 128;
          if (a > level) level = a;
        }
      }
      const left = Math.max(0, RECORD_SECONDS - (performance.now() - r.started) / 1000);
      rows.fill.style.width = `${Math.round(Math.min(1, level * 1.6) * 100)}%`;
      rows.time.textContent = `${left.toFixed(1)} s left`;
      r.raf = requestAnimationFrame(meterLoop);
    };
    meterLoop();
  }

  function cleanupRecording(r) {
    clearTimeout(r.timer);
    cancelAnimationFrame(r.raf);
    try { r.stream.getTracks().forEach((tr) => tr.stop()); } catch (e) { /* already stopped */ }
    try { if (r.source) r.source.disconnect(); } catch (e) { /* gone */ }
  }

  function stopRecording(discard) {
    const r = recording;
    if (!r) return;
    r.discard = !!discard;
    clearTimeout(r.timer);
    try {
      if (r.rec.state !== 'inactive') r.rec.stop();
      else finishRecording(r);
    } catch (e) {
      finishRecording(r);
    }
  }

  function finishRecording(r) {
    if (r.finished) return;
    r.finished = true;
    cleanupRecording(r);
    if (recording === r) recording = null;
    const rows = booth && booth.rows[r.id];
    if (rows) { rows.fill.style.width = '0%'; rows.time.textContent = ''; }
    refreshAllRows();
    if (r.discard) { setNote(r.id, ''); return; }
    if (!r.chunks.length) { setNote(r.id, 'Nothing was recorded. Try again?', true); return; }
    const blob = new Blob(r.chunks, { type: r.rec.mimeType || 'audio/webm' });
    acceptTake(r.id, blob);
  }

  function focusables() {
    if (!booth) return [];
    const nodes = booth.panel.querySelectorAll('button:not([disabled])');
    const out = [];
    for (const n of nodes) if (!n.hidden && n.getClientRects().length) out.push(n);
    return out;
  }

  function onBoothKey(e) {
    if (!boothIsOpen) return;
    if (e.key === 'Escape' || e.code === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeBooth();
      return;
    }
    if (e.key === 'Tab') {
      const list = focusables();
      if (!list.length) { e.preventDefault(); return; }
      const first = list[0], last = list[list.length - 1];
      const active = document.activeElement;
      if (!booth.panel.contains(active)) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      } else if (e.shiftKey && (active === first || active === booth.panel)) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && active === last) {
        e.preventDefault();
        first.focus();
      }
    }
    // Keep game keys (pause, map, jump...) from leaking out while the booth is up.
    e.stopPropagation();
  }

  function openBooth() {
    if (!booth) buildBooth();
    const host = (ctx.dom && ctx.dom.overlay) || document.body;
    if (booth.root.parentNode !== host) host.appendChild(booth.root);
    if (gestureActive()) unlock();
    if (boothIsOpen) {
      if (!booth.panel.contains(document.activeElement)) booth.close.focus();
      return;
    }
    boothIsOpen = true;
    booth.lastFocus = document.activeElement;
    booth.root.hidden = false;
    checkRecordAvailability();
    refreshAllRows();
    window.addEventListener('keydown', onBoothKey, true);
    const firstPlay = booth.panel.querySelector('.vb-play');
    (firstPlay || booth.close).focus({ preventScroll: true });
  }

  function closeBooth() {
    if (!boothIsOpen) return;
    if (recording) stopRecording(true);
    boothIsOpen = false;
    window.removeEventListener('keydown', onBoothKey, true);
    booth.root.hidden = true;
    const back = booth.lastFocus;
    booth.lastFocus = null;
    if (back && back.isConnected && typeof back.focus === 'function' && back !== document.body) {
      try { back.focus({ preventScroll: true }); } catch (e) { /* not focusable any more */ }
    }
  }

  // ---------------------------------------------------------------- lifecycle + API
  function start() {
    dholBase = 0;
  }

  return {
    unlock,
    update,
    voice,
    sfx,
    setDhol,
    requestDhol,
    setMuted,
    get muted() { return muted; },
    setMusic,
    get music() { return musicOn; },
    clipStatus,
    playLine,
    lineReady,
    stopLines,
    openBooth,
    closeBooth,
    get boothOpen() { return boothIsOpen; },
    start,
  };
}

return { init };
})();

// ------------------------------------------------------------------ shaders
const SKY_VERT = /* glsl */ `
varying vec3 vDir;
void main() {
  vDir = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const SKY_FRAG = /* glsl */ `
uniform vec3 uZenith;
uniform vec3 uMid;
uniform vec3 uHorizon;
uniform vec3 uFog;
uniform vec3 uGlowColor;
uniform float uGlow;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform float uSunVis;
uniform vec2 uSunCos;
uniform vec3 uMoonDir;
uniform vec3 uMoonRight;
uniform vec3 uMoonUp;
uniform float uMoonVis;
uniform vec2 uMoonCos;
uniform float uMoonSize;
varying vec3 vDir;

float crater(vec2 p, vec2 c, float r) {
  return 1.0 - smoothstep(r * 0.55, r, length(p - c));
}

void main() {
  vec3 dir = normalize(vDir);
  float h = dir.y;

  // Three-stop gradient: horizon haze -> mid sky -> zenith.
  vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.3, h));
  col = mix(col, uZenith, smoothstep(0.16, 0.92, h));

  // Sun glow: a broad warm wash plus a tighter bloom, strongest along the horizon.
  float sd = max(dot(dir, uSunDir), 0.0);
  float hz = 1.0 - 0.55 * smoothstep(0.0, 0.5, abs(h));
  col += uGlowColor * uGlow * (pow(sd, 5.0) * 0.38 + pow(sd, 40.0) * 0.55) * hz;

  // Sun disc with a soft rim.
  float sunDisc = smoothstep(uSunCos.x, uSunCos.y, dot(dir, uSunDir));
  col = mix(col, uSunColor, sunDisc * uSunVis);

  // Moon: a cool halo, then a gently cratered disc.
  float md = dot(dir, uMoonDir);
  float mh = max(md, 0.0);
  col += vec3(0.55, 0.64, 0.95) * uMoonVis * (pow(mh, 900.0) * 0.4 + pow(mh, 60.0) * 0.07);
  if (md > uMoonCos.x) {
    vec2 p = vec2(dot(dir, uMoonRight), dot(dir, uMoonUp)) / uMoonSize;
    float shade = 1.0 - 0.18 * dot(p, p);
    shade -= 0.13 * crater(p, vec2(-0.32, 0.22), 0.34);
    shade -= 0.10 * crater(p, vec2(0.30, -0.18), 0.24);
    shade -= 0.09 * crater(p, vec2(-0.05, -0.50), 0.20);
    shade -= 0.07 * crater(p, vec2(0.42, 0.42), 0.15);
    vec3 moonCol = vec3(0.96, 0.95, 0.88) * shade;
    col = mix(col, moonCol, smoothstep(uMoonCos.x, uMoonCos.y, md) * uMoonVis);
  }

  // Below the horizon the dome becomes exactly the fog colour, so far terrain melts into it.
  col = mix(col, uFog, 1.0 - smoothstep(-0.07, 0.012, h));

  gl_FragColor = vec4(col, 1.0);
  #include <colorspace_fragment>
}
`;

const STAR_VERT = /* glsl */ `
attribute float aSize;
attribute float aPhase;
attribute vec3 aColor;
uniform float uTime;
uniform float uOpacity;
uniform float uPixelRatio;
uniform vec3 uMoonDir;
uniform float uMoonCut;
varying float vAlpha;
varying vec3 vColor;
void main() {

  vec3 dir = normalize(wp.xyz - cameraPosition);
  float twinkle = 0.62 + 0.38 * sin(uTime * (1.1 + aPhase * 2.9) + aPhase * 57.0);
  float horizon = smoothstep(0.03, 0.28, dir.y);
  float moonCut = 1.0 - smoothstep(uMoonCut - 0.0025, uMoonCut, dot(dir, uMoonDir));
  vAlpha = uOpacity * twinkle * horizon * moonCut;
  vColor = aColor;
  gl_Position = projectionMatrix * viewMatrix * wp;
  gl_PointSize = aSize * uPixelRatio * (0.85 + 0.3 * twinkle);
}
`;

const STAR_FRAG = /* glsl */ `
varying float vAlpha;
varying vec3 vColor;
void main() {
  float d = length(gl_PointCoord - 0.5) * 2.0;
  float a = 1.0 - smoothstep(0.15, 1.0, d);
  gl_FragColor = vec4(vColor, a * a * vAlpha);
  #include <colorspace_fragment>
}
`;

const FIREFLY_VERT = /* glsl */ `
attribute vec4 aSeed;
attribute float aBorn;
uniform float uTime;
uniform float uOpacity;
uniform float uScale;
varying float vAlpha;
void main() {
  float t = uTime;
  vec3 p = position;
  p.x += sin(t * (0.30 + aSeed.x * 0.45) + aSeed.y * 6.2832) * 1.3 + sin(t * 1.9 + aSeed.z * 9.0) * 0.22;
  p.z += cos(t * (0.27 + aSeed.z * 0.50) + aSeed.x * 6.2832) * 1.3 + cos(t * 2.3 + aSeed.y * 7.0) * 0.22;
  p.y += sin(t * (0.45 + aSeed.y * 0.55) + aSeed.w * 6.2832) * 0.42;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  float pulse = sin(t * (0.9 + aSeed.w * 1.7) + aSeed.x * 31.0);
  float blink = smoothstep(-0.35, 0.85, pulse);
  float dist = max(-mv.z, 0.001);
  vAlpha = uOpacity * blink * smoothstep(aBorn, aBorn + 1.2, t) * smoothstep(0.5, 1.8, dist);
  gl_PointSize = clamp(uScale * (0.8 + aSeed.y * 0.5) / dist, 1.0, 40.0);
}
`;

const FIREFLY_FRAG = /* glsl */ `
uniform vec3 uCore;
uniform vec3 uGlow;
varying float vAlpha;
void main() {
  float d = length(gl_PointCoord - 0.5) * 2.0;
  if (d > 1.0) discard;
  float halo = 1.0 - d;
  halo *= halo;
  float core = 1.0 - smoothstep(0.0, 0.3, d);
  gl_FragColor = vec4(uGlow * halo * 0.85 + uCore * core, vAlpha);
  #include <colorspace_fragment>
}
`;

// ------------------------------------------------------------------ module
function init(ctx) {
  const THREE = ctx.THREE;
  const util = ctx.util;
  const scene = ctx.scene;
  const camera = ctx.camera;
  const renderer = ctx.renderer;
  const noRaycast = () => {};

  // ---------------------------------------------------------------- scratch (reused every frame)
  const UP = new THREE.Vector3(0, 1, 0);
  const POLE = new THREE.Vector3(0, Math.sin(SKY_LATITUDE), -Math.cos(SKY_LATITUDE));
  const camPos = new THREE.Vector3();
  const camFwd = new THREE.Vector3();
  const focus = new THREE.Vector3();
  const lastFocus = new THREE.Vector3();
  const desiredLight = new THREE.Vector3();
  const lightDir = new THREE.Vector3(0, 1, 0);
  const basisX = new THREE.Vector3();
  const basisY = new THREE.Vector3();
  const snapped = new THREE.Vector3();
  const lanternTarget = new THREE.Vector3();
  const tmpPos = new THREE.Vector3();
  const tmpScale = new THREE.Vector3();
  const tmpMatrix = new THREE.Matrix4();
  const moonRight = new THREE.Vector3(1, 0, 0);
  const moonUp = new THREE.Vector3(0, 1, 0);
  const shootStart = new THREE.Vector3();
  const shootDir = new THREE.Vector3();

  const SUN_LIGHT_LOW = new THREE.Color('#ffb070');
  const SUN_LIGHT_HIGH = new THREE.Color('#fff1d8');
  const MOON_LIGHT = new THREE.Color('#9fb4ff');
  const SUN_DISC_LOW = new THREE.Color().setRGB(1.0, 0.55, 0.25);
  const SUN_DISC_HIGH = new THREE.Color().setRGB(1.0, 0.97, 0.86);
  const CLOUD_TOP = new THREE.Color('#ffffff');
  const CLOUD_BELLY = new THREE.Color('#c3cde3');

  // ---------------------------------------------------------------- state
  let tod = START_TIME;
  let nightFactor = 0;
  let nightState = false;
  let sunElev = 0;
  let moonElev = 0;
  let sunsetness = 0;
  let lastT = 0;
  let hadFocus = false;
  let ffActive = FIREFLIES_HIGH;
  let ffRespawnAll = true;
  let ffWasVisible = false;
  let shootAge = -1;
  let shootTimer = 14 + Math.random() * 16;
  let toastedShootingStar = false;
  const sunDir = new THREE.Vector3();
  const moonDir = new THREE.Vector3();

  // ---------------------------------------------------------------- palette
  const keys = PALETTE.map((row) => ({
    t: row[0],
    zenith: new THREE.Color(row[1]),
    mid: new THREE.Color(row[2]),
    horizon: new THREE.Color(row[3]),
    glow: new THREE.Color(row[4]),
    hemiSky: new THREE.Color(row[5]),
    hemiGround: new THREE.Color(row[6]),
    hemiI: row[7],
    exposure: row[8],
  }));
  const mood = {
    zenith: new THREE.Color(), mid: new THREE.Color(), horizon: new THREE.Color(), glow: new THREE.Color(),
    hemiSky: new THREE.Color(), hemiGround: new THREE.Color(), hemiI: 1, exposure: 1,
  };

  // ---------------------------------------------------------------- lights
  const sun = new THREE.DirectionalLight(0xfff1d8, SUN_INTENSITY);
  sun.name = 'sky-sun';
  sun.castShadow = true;
  sun.shadow.mapSize.set(SHADOW_MAP_HIGH, SHADOW_MAP_HIGH);
  sun.shadow.bias = -0.0003;
  sun.shadow.normalBias = 0.045;
  const shadowCam = sun.shadow.camera;
  shadowCam.left = -SHADOW_HALF;
  shadowCam.right = SHADOW_HALF;
  shadowCam.top = SHADOW_HALF;
  shadowCam.bottom = -SHADOW_HALF;
  shadowCam.near = 1;
  shadowCam.far = SHADOW_DIST + 90;
  shadowCam.updateProjectionMatrix();
  sun.target.name = 'sky-sun-target';
  scene.add(sun);
  scene.add(sun.target);

  const hemi = new THREE.HemisphereLight(0xd8ecff, 0x66713f, 1.6);
  hemi.name = 'sky-hemi';
  scene.add(hemi);

  // Always in the scene (intensity 0 by day) so the light count never changes and no
  // material has to recompile at dusk.
  const lantern = new THREE.PointLight(0xffb05a, 0, LANTERN_RANGE, LANTERN_DECAY);
  lantern.name = 'sky-lantern';
  lantern.castShadow = false;
  scene.add(lantern);

  // ---------------------------------------------------------------- fog + background
  const fog = new THREE.Fog(0xdcecdf, FOG_NEAR_DAY, FOG_FAR_DAY);
  const background = new THREE.Color(0xdcecdf);
  scene.fog = fog;
  scene.background = background;

  // ---------------------------------------------------------------- sky dome
  const skyUniforms = {
    uZenith: { value: mood.zenith },
    uMid: { value: mood.mid },
    uHorizon: { value: mood.horizon },
    uFog: { value: fog.color },
    uGlowColor: { value: mood.glow },
    uGlow: { value: 0.4 },
    uSunDir: { value: sunDir },
    uSunColor: { value: new THREE.Color() },
    uSunVis: { value: 1 },
    uSunCos: { value: new THREE.Vector2(Math.cos(SUN_RADIUS * 1.25), Math.cos(SUN_RADIUS)) },
    uMoonDir: { value: moonDir },
    uMoonRight: { value: moonRight },
    uMoonUp: { value: moonUp },
    uMoonVis: { value: 0 },
    uMoonCos: { value: new THREE.Vector2(Math.cos(MOON_RADIUS * 1.12), Math.cos(MOON_RADIUS)) },
    uMoonSize: { value: Math.sin(MOON_RADIUS) },
  };
  const domeMat = new THREE.ShaderMaterial({
    name: 'sky-dome',
    uniforms: skyUniforms,
    vertexShader: SKY_VERT,
    fragmentShader: SKY_FRAG,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: false,
    fog: false,
    toneMapped: false,
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(DOME_RADIUS, 48, 24), domeMat);
  dome.name = 'sky-dome';
  dome.renderOrder = -100;
  dome.frustumCulled = false;
  dome.raycast = noRaycast;
  scene.add(dome);

  // ---------------------------------------------------------------- stars
  // Shared uniform objects: the star field and the shooting star read the same clock and moon.
  const sharedTime = { value: 0 };
  const sharedPixelRatio = { value: 1 };
  const sharedMoonDir = { value: moonDir };
  const sharedMoonCut = { value: Math.cos(MOON_RADIUS * 1.3) };

  function makeStarMaterial(name, opacity) {
    return new THREE.ShaderMaterial({
      name,
      uniforms: {
        uTime: sharedTime,
        uOpacity: opacity,
        uPixelRatio: sharedPixelRatio,
        uMoonDir: sharedMoonDir,
        uMoonCut: sharedMoonCut,
      },
      vertexShader: STAR_VERT,
      fragmentShader: STAR_FRAG,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false,
      toneMapped: false,
    });
  }

  function buildStars() {
    // The same sky over every jungle, so the constellations become old friends.
    const rng = util.mulberry32(0x57a25);
    const pos = new Float32Array(STARS_HIGH * 3);
    const size = new Float32Array(STARS_HIGH);
    const phase = new Float32Array(STARS_HIGH);
    const color = new Float32Array(STARS_HIGH * 3);
    const tints = [new THREE.Color('#ffffff'), new THREE.Color('#cfdcff'), new THREE.Color('#ffe2b8')];
    // A band of extra stars, like the Milky Way over the sarson fields.
    let bnx = 0.32, bny = 0.3, bnz = 0.9;
    const bl = Math.hypot(bnx, bny, bnz);
    bnx /= bl; bny /= bl; bnz /= bl;
    for (let i = 0; i < STARS_HIGH; i++) {
      const u = rng() * 2 - 1;
      const a = rng() * TAU;
      const r = Math.sqrt(1 - u * u);
      let x = r * Math.cos(a), y = u, z = r * Math.sin(a);
      const inBand = rng() < 0.35;
      if (inBand) {
        const k = (x * bnx + y * bny + z * bnz) * 0.86;
        x -= bnx * k; y -= bny * k; z -= bnz * k;
        const l = Math.hypot(x, y, z) || 1;
        x /= l; y /= l; z /= l;
      }
      pos[i * 3] = x * STAR_RADIUS;
      pos[i * 3 + 1] = y * STAR_RADIUS;
      pos[i * 3 + 2] = z * STAR_RADIUS;
      const bright = rng() < 0.05;
      size[i] = bright ? util.rand(rng, 3.2, 4.4) : util.rand(rng, 1.5, 2.6) * (inBand ? 0.85 : 1);
      phase[i] = rng();
      const pick = rng();
      const tint = pick < 0.7 ? tints[0] : pick < 0.85 ? tints[1] : tints[2];
      const b = bright ? 1 : util.rand(rng, 0.55, 1);
      color[i * 3] = tint.r * b;
      color[i * 3 + 1] = tint.g * b;
      color[i * 3 + 2] = tint.b * b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
    return geo;
  }

  const starOpacity = { value: 0 };
  const starGeo = buildStars();
  const stars = new THREE.Points(starGeo, makeStarMaterial('sky-stars', starOpacity));
  stars.name = 'sky-stars';
  stars.renderOrder = -90;
  stars.frustumCulled = false;
  stars.raycast = noRaycast;
  stars.visible = false;
  scene.add(stars);

  // ---------------------------------------------------------------- shooting star
  const shootPos = new Float32Array(SHOOT_TRAIL * 3);
  const shootGeo = new THREE.BufferGeometry();
  const shootPosAttr = new THREE.BufferAttribute(shootPos, 3).setUsage(THREE.DynamicDrawUsage);
  {
    const size = new Float32Array(SHOOT_TRAIL);
    const phase = new Float32Array(SHOOT_TRAIL);
    const color = new Float32Array(SHOOT_TRAIL * 3);
    for (let i = 0; i < SHOOT_TRAIL; i++) {
      const k = 1 - i / SHOOT_TRAIL;
      const fade = Math.pow(k, 1.6);
      size[i] = 1.2 + 3.4 * k;
      phase[i] = 0.5;
      color[i * 3] = fade * (0.85 + 0.15 * k);
      color[i * 3 + 1] = fade * (0.9 + 0.1 * k);
      color[i * 3 + 2] = fade;
    }
    shootGeo.setAttribute('position', shootPosAttr);
    shootGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    shootGeo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    shootGeo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
  }
  const shootOpacity = { value: 0 };
  const shooting = new THREE.Points(shootGeo, makeStarMaterial('sky-shooting-star', shootOpacity));
  shooting.name = 'sky-shooting-star';
  shooting.renderOrder = -89;
  shooting.frustumCulled = false;
  shooting.raycast = noRaycast;
  shooting.visible = false;
  scene.add(shooting);

  // ---------------------------------------------------------------- clouds
  const cloudMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, fog: false });
  cloudMat.name = 'sky-clouds';

  function buildCloudGeometry(rng) {
    const parts = [];
    const puffs = util.randInt(rng, 5, 7);
    const length = util.rand(rng, 34, 50);
    for (let i = 0; i < puffs; i++) {
      const f = i / (puffs - 1);
      const middle = 1 - Math.abs(f - 0.5) * 2;
      const r = util.rand(rng, 6, 8.5) + middle * util.rand(rng, 3.5, 6.5);
      const g = new THREE.IcosahedronGeometry(r, 1);
      g.translate((f - 0.5) * length + util.rand(rng, -2.5, 2.5), middle * util.rand(rng, 1.5, 5), util.rand(rng, -5, 5));
      parts.push(g);
    }
    // Two puffs either side give the cloud some depth when seen from below.
    for (let i = 0; i < 2; i++) {
      const g = new THREE.IcosahedronGeometry(util.rand(rng, 6, 9), 1);
      g.translate(util.rand(rng, -length * 0.3, length * 0.3), util.rand(rng, 0, 3), (i ? 1 : -1) * util.rand(rng, 6, 10));
      parts.push(g);
    }
    let geo = ctx.mergeGeometries(parts, false);
    if (geo) {
      for (let i = 0; i < parts.length; i++) parts[i].dispose();
    } else {
      geo = parts[0];
      for (let i = 1; i < parts.length; i++) parts[i].dispose();
    }
    // Flatten the belly and shade it: bright tops, lavender-grey undersides.
    const pos = geo.attributes.position;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < pos.count; i++) {
      let y = pos.getY(i);
      if (y < 0) { y *= 0.3; pos.setY(i, y); }
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    const colors = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const k = util.smoothstep(minY, maxY, pos.getY(i));
      colors[i * 3] = util.lerp(CLOUD_BELLY.r, CLOUD_TOP.r, k);
      colors[i * 3 + 1] = util.lerp(CLOUD_BELLY.g, CLOUD_TOP.g, k);
      colors[i * 3 + 2] = util.lerp(CLOUD_BELLY.b, CLOUD_TOP.b, k);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
    return geo;
  }

  const cloudMeshes = [];
  const clouds = [];
  {
    const shapeRng = util.mulberry32(0xc10d5);
    for (let v = 0; v < CLOUD_VARIANTS; v++) {
      const mesh = new THREE.InstancedMesh(buildCloudGeometry(shapeRng), cloudMat, CLOUDS_PER_VARIANT);
      mesh.name = `sky-clouds-${v}`;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled = false;
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      mesh.raycast = noRaycast;
      scene.add(mesh);
      cloudMeshes.push(mesh);
      for (let i = 0; i < CLOUDS_PER_VARIANT; i++) {
        clouds.push({ mesh, index: i, ox: 0, oz: 0, y: 100, scale: 1, squash: 1, quat: new THREE.Quaternion() });
      }
    }
  }

  function scatterClouds(rng) {
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.ox = rng() * CLOUD_SPAN;
      c.oz = rng() * CLOUD_SPAN;
      c.y = util.rand(rng, 82, 128);
      c.scale = util.rand(rng, 0.75, 1.35);
      c.squash = util.rand(rng, 0.8, 1.05);
      c.quat.setFromAxisAngle(UP, rng() * TAU);
    }
  }
  scatterClouds(util.rngFor(ctx.seed >>> 0, 'sky'));

  // ---------------------------------------------------------------- fireflies
  const ffPos = new Float32Array(FIREFLIES_HIGH * 3);
  const ffSeed = new Float32Array(FIREFLIES_HIGH * 4);
  const ffBorn = new Float32Array(FIREFLIES_HIGH);
  for (let i = 0; i < FIREFLIES_HIGH * 4; i++) ffSeed[i] = Math.random();
  const ffGeo = new THREE.BufferGeometry();
  const ffPosAttr = new THREE.BufferAttribute(ffPos, 3).setUsage(THREE.DynamicDrawUsage);
  const ffBornAttr = new THREE.BufferAttribute(ffBorn, 1).setUsage(THREE.DynamicDrawUsage);
  ffGeo.setAttribute('position', ffPosAttr);
  ffGeo.setAttribute('aSeed', new THREE.BufferAttribute(ffSeed, 4));
  ffGeo.setAttribute('aBorn', ffBornAttr);
  const ffUniforms = {
    uTime: { value: 0 },
    uOpacity: { value: 0 },
    uScale: { value: 100 },
    uCore: { value: new THREE.Color('#fffbd6') },
    uGlow: { value: new THREE.Color('#d4ff5c') },
  };
  const fireflies = new THREE.Points(ffGeo, new THREE.ShaderMaterial({
    name: 'sky-fireflies',
    uniforms: ffUniforms,
    vertexShader: FIREFLY_VERT,
    fragmentShader: FIREFLY_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    toneMapped: false,
  }));
  fireflies.name = 'sky-fireflies';
  fireflies.frustumCulled = false;
  fireflies.raycast = noRaycast;
  fireflies.visible = false;
  scene.add(fireflies);

  function groundAt(x, z, fallback) {
    const h = ctx.world?.heightAt?.(x, z);
    if (typeof h !== 'number' || !Number.isFinite(h)) return fallback;
    const water = ctx.world?.WATER_LEVEL;
    return Math.max(h, typeof water === 'number' ? water : 0);
  }

  // Place firefly i near the focus. With a direction (dirX, dirZ) it lands on the far side of
  // the player along it (so ones left behind reappear ahead); otherwise anywhere in the disc.
  function placeFirefly(i, dirX, dirZ, t) {
    let x, z;
    const len = Math.hypot(dirX, dirZ);
    if (len < 1e-4) {
      const a = Math.random() * TAU;
      const r = Math.sqrt(Math.random()) * FIREFLY_RADIUS;
      x = focus.x + Math.cos(a) * r;
      z = focus.z + Math.sin(a) * r;
    } else {
      const a = Math.atan2(dirZ, dirX) + (Math.random() - 0.5) * 1.6;
      const r = FIREFLY_RADIUS * (0.55 + Math.random() * 0.4);
      x = focus.x + Math.cos(a) * r;
      z = focus.z + Math.sin(a) * r;
    }
    const ground = groundAt(x, z, focus.y);
    ffPos[i * 3] = x;
    ffPos[i * 3 + 1] = ground + 0.35 + Math.random() * Math.random() * 3.2;
    ffPos[i * 3 + 2] = z;
    ffBorn[i] = t + Math.random() * 1.5;
  }

  // ---------------------------------------------------------------- quality
  function applyQuality(q) {
    const low = q === 'low';
    const size = low ? SHADOW_MAP_LOW : SHADOW_MAP_HIGH;
    if (sun.shadow.mapSize.x !== size) {
      sun.shadow.mapSize.set(size, size);
      if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    }
    sun.shadow.normalBias = low ? 0.07 : 0.045;
    starGeo.setDrawRange(0, low ? STARS_LOW : STARS_HIGH);
    ffActive = low ? FIREFLIES_LOW : FIREFLIES_HIGH;
    ffGeo.setDrawRange(0, ffActive);
  }
  applyQuality(ctx.quality);
  ctx.events?.on?.('quality', (e) => applyQuality(e?.quality ?? ctx.quality));

  // ---------------------------------------------------------------- per-frame pieces
  function readCamera() {
    camera.getWorldPosition(camPos);
    camera.getWorldDirection(camFwd);
    camFwd.y = 0;
    const len = camFwd.length();
    if (len > 1e-4) camFwd.multiplyScalar(1 / len);
    else camFwd.set(0, 0, -1);
  }

  function readFocus() {
    const p = ctx.player?.position;
    if (p && Number.isFinite(p.x) && Number.isFinite(p.z)) focus.set(p.x, Number.isFinite(p.y) ? p.y : 0, p.z);
    else focus.copy(camPos);
  }

  function computeCelestial() {
    const theta = (tod - 0.25) * TAU; // 0 at sunrise (east, +X), PI/2 at noon, PI at sunset
    const s = Math.sin(theta), c = Math.cos(theta);
    sunDir.set(c, s * Math.cos(SUN_TILT), s * Math.sin(SUN_TILT));
    moonDir.set(-c, -s * Math.cos(MOON_TILT), -s * Math.sin(MOON_TILT));
    sunElev = sunDir.y;
    moonElev = moonDir.y;
    nightFactor = 1 - util.smoothstep(-0.2, 0.1, sunElev);
    sunsetness = Math.exp(-(sunElev / 0.17) * (sunElev / 0.17));
  }

  function sampleMood() {
    let i = keys.length - 1;
    for (let k = 0; k < keys.length; k++) {
      if (keys[k].t <= tod) i = k;
      else break;
    }
    const a = keys[i];
    const b = keys[(i + 1) % keys.length];
    const t1 = b.t > a.t ? b.t : b.t + 1;
    let f = util.clamp((tod - a.t) / (t1 - a.t), 0, 1);
    f = 0.5 * f + 0.5 * f * f * (3 - 2 * f); // eased, without stalling at each key
    mood.zenith.lerpColors(a.zenith, b.zenith, f);
    mood.mid.lerpColors(a.mid, b.mid, f);
    mood.horizon.lerpColors(a.horizon, b.horizon, f);
    mood.glow.lerpColors(a.glow, b.glow, f);
    mood.hemiSky.lerpColors(a.hemiSky, b.hemiSky, f);
    mood.hemiGround.lerpColors(a.hemiGround, b.hemiGround, f);
    mood.hemiI = util.lerp(a.hemiI, b.hemiI, f);
    mood.exposure = util.lerp(a.exposure, b.exposure, f);
  }

  function updateLights(force) {
    // One shadow-casting light: the sun by day, the moon by night. They swap while both sit on
    // the horizon, where the intensity is zero, so the jump in direction is never seen.
    const sunUp = sunElev >= moonElev;
    desiredLight.copy(sunUp ? sunDir : moonDir);
    if (desiredLight.y < LIGHT_MIN_ELEV) {
      desiredLight.y = LIGHT_MIN_ELEV;
      desiredLight.normalize();
    }
    let intensity;
    if (sunUp) {
      intensity = SUN_INTENSITY * util.smoothstep(0, 0.22, sunElev);
      sun.color.lerpColors(SUN_LIGHT_LOW, SUN_LIGHT_HIGH, util.smoothstep(0.03, 0.45, sunElev));
    } else {
      intensity = MOON_INTENSITY * util.smoothstep(0, 0.22, moonElev);
      sun.color.copy(MOON_LIGHT);
    }
    sun.intensity = intensity;
    sun.shadow.intensity = sunUp ? 1 : 0.75; // softer moon shadows (r165+; harmless otherwise)
    if (force || intensity < 0.02 || desiredLight.dot(lightDir) < LIGHT_STEP_COS) lightDir.copy(desiredLight);

    hemi.color.copy(mood.hemiSky);
    hemi.groundColor.copy(mood.hemiGround);
    hemi.intensity = mood.hemiI;
    renderer.toneMappingExposure = mood.exposure;
  }

  // Keep the ±45 m shadow box on the player, snapped to whole shadow-map texels in light space
  // so shadow edges stay put instead of crawling as the player walks.
  function followShadow() {
    tmpPos.copy(focus).addScaledVector(camFwd, SHADOW_AHEAD);
    basisX.crossVectors(UP, lightDir).normalize(); // same basis the shadow camera's lookAt builds
    basisY.crossVectors(lightDir, basisX);
    const texel = (2 * SHADOW_HALF) / sun.shadow.mapSize.x;
    const sx = Math.round(tmpPos.dot(basisX) / texel) * texel;
    const sy = Math.round(tmpPos.dot(basisY) / texel) * texel;
    const sz = tmpPos.dot(lightDir);
    snapped.copy(basisX).multiplyScalar(sx).addScaledVector(basisY, sy).addScaledVector(lightDir, sz);
    sun.target.position.copy(snapped);
    sun.position.copy(snapped).addScaledVector(lightDir, SHADOW_DIST);
    sun.target.updateMatrixWorld();
    sun.updateMatrixWorld();
  }

  function updateFog() {
    fog.color.copy(mood.horizon);
    const sx = sunDir.x, sz = sunDir.z;
    const sl = Math.hypot(sx, sz);
    if (sl > 1e-4 && sunsetness > 0.001) {
      const facing = Math.max(0, (camFwd.x * sx + camFwd.z * sz) / sl);
      fog.color.lerp(mood.glow, FOG_SUN_TINT * facing * facing * sunsetness);
    }
    fog.near = util.lerp(FOG_NEAR_DAY, FOG_NEAR_NIGHT, nightFactor);
    fog.far = util.lerp(FOG_FAR_DAY, FOG_FAR_NIGHT, nightFactor);
    background.copy(fog.color);
    if (scene.fog !== fog) scene.fog = fog;
    if (scene.background !== background) scene.background = background;
  }

  function updateDome() {
    dome.position.copy(camPos);
    skyUniforms.uGlow.value = (0.4 * util.smoothstep(0, 0.3, sunElev) + 1.15 * sunsetness) * util.smoothstep(-0.32, -0.06, sunElev);
    skyUniforms.uSunVis.value = util.smoothstep(-0.06, 0, sunElev);
    skyUniforms.uSunColor.value.lerpColors(SUN_DISC_LOW, SUN_DISC_HIGH, util.smoothstep(0, 0.3, sunElev));
    skyUniforms.uMoonVis.value = util.smoothstep(-0.04, 0.06, moonElev) * (0.3 + 0.7 * nightFactor);
    moonRight.crossVectors(moonDir, UP).normalize();
    moonUp.crossVectors(moonRight, moonDir);
  }

  function updateStars(t) {
    const opacity = util.smoothstep(0.35, 0.9, nightFactor);
    starOpacity.value = opacity;
    stars.visible = opacity > 0.002;
    sharedTime.value = t;
    sharedPixelRatio.value = renderer.getPixelRatio();
    if (!stars.visible) return;
    stars.position.copy(camPos);
    stars.quaternion.setFromAxisAngle(POLE, -tod * TAU); // rise in the east, wheel round the pole
  }

  function updateClouds(t) {
    const half = CLOUD_SPAN / 2;
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      let dx = c.ox + WIND_X * t - focus.x;
      let dz = c.oz + WIND_Z * t - focus.z;
      dx = dx - Math.floor(dx / CLOUD_SPAN) * CLOUD_SPAN - half;
      dz = dz - Math.floor(dz / CLOUD_SPAN) * CLOUD_SPAN - half;
      const fade = util.smoothstep(half, half - CLOUD_FADE, Math.hypot(dx, dz));
      const s = Math.max(0.001, c.scale * fade);
      tmpPos.set(focus.x + dx, c.y, focus.z + dz);
      tmpScale.set(s, s * c.squash, s);
      tmpMatrix.compose(tmpPos, c.quat, tmpScale);
      c.mesh.setMatrixAt(c.index, tmpMatrix);
    }
    for (let i = 0; i < cloudMeshes.length; i++) cloudMeshes[i].instanceMatrix.needsUpdate = true;
    // Sky-tinted shadows, and a sunset blush underneath.
    const e = cloudMat.emissive;
    const blush = 0.35 * sunsetness * (1 - 0.5 * nightFactor);
    e.copy(mood.mid).multiplyScalar(0.24);
    e.r += mood.glow.r * blush;
    e.g += mood.glow.g * blush;
    e.b += mood.glow.b * blush;
  }

  function updateFireflies(t, jumped) {
    if (jumped) ffRespawnAll = true;
    const opacity = util.smoothstep(0.3, 0.8, nightFactor);
    ffUniforms.uOpacity.value = opacity;
    if (opacity <= 0.002) {
      fireflies.visible = false;
      ffWasVisible = false;
      return;
    }
    fireflies.visible = true;
    if (!ffWasVisible) ffRespawnAll = true;
    ffWasVisible = true;
    ffUniforms.uTime.value = t;
    const halfFov = (camera.fov || 60) * Math.PI / 360;
    ffUniforms.uScale.value = FIREFLY_SIZE * renderer.domElement.height / (2 * Math.tan(halfFov));

    const far2 = (FIREFLY_RADIUS * 1.15) * (FIREFLY_RADIUS * 1.15);
    let budget = FIREFLY_RESPAWNS_PER_FRAME;
    let changed = false;
    for (let i = 0; i < ffActive; i++) {
      if (ffRespawnAll) {
        placeFirefly(i, 0, 0, t);
        changed = true;
        continue;
      }
      const dx = ffPos[i * 3] - focus.x;
      const dz = ffPos[i * 3 + 2] - focus.z;
      const dy = ffPos[i * 3 + 1] - focus.y;
      if ((dx * dx + dz * dz > far2 || dy > 25 || dy < -25) && budget > 0) {
        budget--;
        placeFirefly(i, -dx, -dz, t);
        changed = true;
      }
    }
    ffRespawnAll = false;
    if (changed) {
      ffPosAttr.needsUpdate = true;
      ffBornAttr.needsUpdate = true;
    }
  }

  function updateLantern(t, dt, snap) {
    const p = ctx.player;
    const heading = Number.isFinite(p?.heading) ? p.heading : 0;
    const h = Number(p?.height ?? p?.stats?.height);
    const height = h > 0 ? h : 1.6;
    const fx = -Math.sin(heading), fz = -Math.cos(heading);
    const rx = Math.cos(heading), rz = -Math.sin(heading);
    // Held out at hand height, a touch forward and to the right.
    lanternTarget.set(
      focus.x + rx * 0.55 + fx * 0.35,
      focus.y + height * 0.62,
      focus.z + rz * 0.55 + fz * 0.35,
    );
    if (snap || lantern.position.distanceToSquared(lanternTarget) > 36) lantern.position.copy(lanternTarget);
    else lantern.position.lerp(lanternTarget, 1 - Math.exp(-14 * dt)); // a little sway as you turn
    const on = util.smoothstep(0.2, 0.75, nightFactor);
    const flicker = 1 + 0.06 * Math.sin(t * 11.3) + 0.04 * Math.sin(t * 17.9 + 1.3) + 0.035 * Math.sin(t * 4.7 + 0.4);
    lantern.intensity = LANTERN_INTENSITY * on * flicker;
  }

  function launchShootingStar() {
    const az = Math.random() * TAU;
    const el = 0.55 + Math.random() * 0.5;
    const ce = Math.cos(el), se = Math.sin(el);
    shootStart.set(ce * Math.cos(az), se, ce * Math.sin(az)).multiplyScalar(STAR_RADIUS * 0.96);
    // Mostly sideways along the sky, dipping towards the horizon at a jaunty angle.
    const side = Math.random() < 0.5 ? -1 : 1;
    const b = 0.35 + Math.random() * 0.5;
    const cb = Math.cos(b), sb = Math.sin(b);
    shootDir.set(
      -Math.sin(az) * side * cb + se * Math.cos(az) * sb,
      -ce * sb,
      Math.cos(az) * side * cb + se * Math.sin(az) * sb,
    ).normalize();
    shootAge = 0;
    shooting.visible = true;
    if (!toastedShootingStar && ctx.state?.mode === 'playing' && Math.random() < 0.45) {
      toastedShootingStar = true;
      ctx.hud?.toast?.(util.randomLine(SHOOTING_STAR_LINES), { tone: 'joke' });
    }
  }

  function updateShootingStar(dt) {
    if (shootAge < 0) {
      if (nightFactor < 0.8 || dt <= 0) return;
      shootTimer -= dt;
      if (shootTimer > 0) return;
      shootTimer = 20 + Math.random() * 35;
      launchShootingStar(); // falls through so the trail is laid out before this frame renders
    } else {
      shootAge += dt;
    }
    const k = shootAge / SHOOT_DURATION;
    if (k >= 1 || nightFactor < 0.5) {
      shootAge = -1;
      shooting.visible = false;
      return;
    }
    shootOpacity.value = Math.sin(Math.PI * k);
    const travel = SHOOT_SPEED * shootAge;
    for (let i = 0; i < SHOOT_TRAIL; i++) {
      const along = Math.max(0, travel - i * SHOOT_SPACING);
      shootPos[i * 3] = shootStart.x + shootDir.x * along;
      shootPos[i * 3 + 1] = shootStart.y + shootDir.y * along;
      shootPos[i * 3 + 2] = shootStart.z + shootDir.z * along;
    }
    shootPosAttr.needsUpdate = true;
    shooting.position.copy(camPos);
  }

  function checkTransition(announce) {
    const night = nightFactor > 0.5;
    if (night === nightState) return;
    nightState = night;
    if (!night) toastedShootingStar = false;
    ctx.events?.emit?.(night ? 'sky:night' : 'sky:day', {});
    if (announce && ctx.state?.mode === 'playing') {
      const line = util.randomLine(night ? ctx.content?.sky?.night : ctx.content?.sky?.day);
      if (line) ctx.hud?.toast?.(line, { tone: 'joke' });
    }
  }

  // Recompute everything that depends on the time of day and the player's whereabouts.
  // force: re-aim the light immediately and snap followers; announce: toast transitions.
  function refresh(t, dt, force, announce) {
    readCamera();
    readFocus();
    let jumped = force;
    if (!hadFocus || focus.distanceToSquared(lastFocus) > TELEPORT_DIST2) jumped = true;
    hadFocus = true;
    lastFocus.copy(focus);

    computeCelestial();
    sampleMood();
    updateLights(force);
    followShadow();
    updateFog();
    updateDome();
    updateStars(t);
    updateClouds(t);
    updateFireflies(t, jumped);
    updateLantern(t, dt, jumped);
    updateShootingStar(dt);
    checkTransition(announce);
  }

  // ---------------------------------------------------------------- public API
  function setTimeOfDay(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return;
    tod = n - Math.floor(n);
    refresh(lastT, 0, true, true);
  }

  function update(dt, t) {
    const mode = ctx.state?.mode;
    if (mode === 'paused') return;
    const speed = mode === 'title' ? TITLE_SPEED : (mode === 'playing' || mode === 'victory') ? 1 : 0;
    const len = api.dayLength > 1 ? api.dayLength : DAY_LENGTH;
    const step = Number.isFinite(dt) && dt > 0 ? dt : 0;
    tod += (step * speed) / len;
    tod -= Math.floor(tod);
    lastT = Number.isFinite(t) ? t : lastT + step;
    refresh(lastT, step, false, true);
  }

  function reset(seed) {
    tod = START_TIME;
    scatterClouds(util.rngFor((seed ?? ctx.seed) >>> 0, 'sky'));
    ffRespawnAll = true;
    shootAge = -1;
    shooting.visible = false;
    shootTimer = 14 + Math.random() * 16;
    refresh(lastT, 0, true, false);
  }

  // Every run starts with a fresh morning (the title screen may have idled into the night).
  function start() {
    tod = START_TIME;
    ffRespawnAll = true;
    refresh(lastT, 0, true, false);
  }

  const api = {
    dayLength: DAY_LENGTH,
    sun,
    hemi,
    lantern,
    sunDirection: sunDir,
    moonDirection: moonDir,
    get timeOfDay() { return tod; },
    set timeOfDay(v) { setTimeOfDay(v); },
    get nightFactor() { return nightFactor; },
    isNight: () => nightFactor > 0.5,
    setTimeOfDay,
    update,
    reset,
    start,
  };

  // First look: lit and coloured before the first frame, without announcing anything.
  computeCelestial();
  nightState = nightFactor > 0.5;
  refresh(0, 0, true, false);

  return api;
}

return { init };
})();

// ===== world.js =====
const M_world = (function () {

// Terrain (rolling hills, big hills, meandering rivers, swampy lowlands), biomes (jungle,
// bamboo, sarson fields, mossy ruins, swamp, clearings), lush low-poly vegetation merged into a
// handful of meshes per chunk, the animated river water, chunk streaming, circle colliders,
// clearings, reserved areas and the spawn point. Everything is deterministic from the seed:
// walk away, come back, and Bibi's favourite banana plant is exactly where she left it.

const WATER_LEVEL = 0;

const CELLS = CHUNK / GRID;           // 24 cells per side
const VERTS = CELLS + 1;
const H_MIN = -3;
const H_MAX = 14;
const DRY_MIN = WATER_LEVEL + 0.6;    // flattened areas never sit lower than this

const COLLIDER_REACH = 32;            // others' colliders may sit ~30 m outside their chunk

const WATER_SEGS = 100;

const PLOT = 36;                      // sarson field plots (m); rows flip direction per plot

const PLANT_GAP = 2.0;
const PLOT_PATH = 1.4;                // the little bund path around each plot
const TAU = Math.PI * 2;

const SALT_WARP = 0xb5297a4d;
const SALT_RIVER = 0x1b56c4e9;
const SALT_BIOME = 0x7fb5d329;
const SALT_DETAIL = 0xa3c59ac3;

// Colour palette (sRGB hex; converted to linear once in init).

  // terrain

};

const EMERGENT_TINTS = ['#2c7d3a', '#3a8a34', '#467f2e', '#2f7342'];

// ------------------------------------------------------------------ pure helpers
function sstep(a, b, v) {
  let t = (v - a) / (b - a);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return t * t * (3 - 2 * t);
}
function clampN(v, a, b) { return v < a ? a : v > b ? b : v; }
function ckey(cx, cz) { return (cx + 32768) * 65536 + (cz + 32768); }
function hashf(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, -2048144777);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// The analytic landscape. Pure JS (no Three.js), so it is safe at the top level.
function makeTerrain(util, seed) {
  const nH = util.makeNoise((seed ^ SALT_HILLS) >>> 0);
  const nW = util.makeNoise((seed ^ SALT_WARP) >>> 0);
  const nR = util.makeNoise((seed ^ SALT_RIVER) >>> 0);
  const nB = util.makeNoise((seed ^ SALT_BIOME) >>> 0);
  const nD = util.makeNoise((seed ^ SALT_DETAIL) >>> 0);
  // Side outputs of the most recent raw() call (read them before calling raw() again).
  const S = { big: 0, low: 0, river: 99 };
  // Biome weights from the most recent weights() call: shares (sum to 1) and raw factors.
  const W = { jungle: 1, bamboo: 0, mustard: 0, ruins: 0, swamp: 0, rBamboo: 0, rMustard: 0, rRuins: 0, rSwamp: 0 };

  function raw(x, z) {
    // gentle domain warp so hills and rivers never look grid-born
    const wx = x + 24 * nW.noise2(x * 0.0045, z * 0.0045);
    const wz = z + 24 * nW.noise2(x * 0.0045 + 41.3, z * 0.0045 - 17.9);
    const hills = nH.fbm2(wx * 0.0105, wz * 0.0105, 4);
    const big = sstep(0.18, 0.85, nH.noise2(wx * 0.0031 + 71.1, wz * 0.0031 - 33.3));
    let h = 2.7 + hills * 3.8 + big * 8.5 + 0.3 * nD.noise2(x * 0.085, z * 0.085);
    // swampy lowland basins (never on the big hills)
    const wet = nB.noise2(x * 0.0036 - 90.2, z * 0.0036 + 55.7);
    const low = sstep(0.22, 0.62, wet) * (1 - big);
    h += (0.4 + hills * 0.9 - h) * low * 0.92;
    // meandering rivers: the zero-contour of a low-frequency noise, carved into a channel
    const rv = Math.abs(nR.fbm2(wx * 0.0038, wz * 0.0038, 3));
    const wide = 0.5 + 0.5 * nR.noise2(x * 0.0019 + 13.7, z * 0.0019 - 7.1);
    const width = (0.018 + 0.03 * wide) * (1 - 0.65 * big);
    const s = rv / width;
    if (s < 4.5) {
      const depth = 0.9 + 1.7 * wide;                                   // wide rivers run deeper
      const shore = s < 1 ? -depth * (1 - s * s) : (s - 1) * 0.55;
      const t = sstep(0.7, 4.5, s);
      const carved = shore + (h - shore) * t;
      if (carved < h) h = carved;
    }
    S.big = big; S.low = low; S.river = s;
    return h < H_MIN ? H_MIN : h > H_MAX ? H_MAX : h;
  }

  function weights(x, z, h, low, river) {
    const riverNear = 1 - sstep(1.2, 3.5, river);
    const swamp = Math.min(1, low * 1.1 + riverNear * 0.4) * (1 - sstep(1.2, 2.8, h));
    const ruins = sstep(0.5, 0.62, nB.noise2(x * 0.0047 + 517.2, z * 0.0047 + 402.6));
    const mustard = sstep(0.2, 0.32, nB.fbm2(x * 0.0042 + 211.3, z * 0.0042 - 97.1, 2)) * (1 - sstep(6, 8.5, h));
    const bamboo = sstep(0.22, 0.34, nB.fbm2(x * 0.0058 - 301.9, z * 0.0058 + 188.4, 2));
    W.rSwamp = swamp; W.rRuins = ruins; W.rMustard = mustard; W.rBamboo = bamboo;
    let rem = 1 - swamp;
    W.swamp = swamp;
    W.ruins = ruins * rem; rem -= W.ruins;
    W.mustard = mustard * rem; rem -= W.mustard;
    W.bamboo = bamboo * rem; rem -= W.bamboo;
    W.jungle = rem;
    return W;
  }

  function classify() {
    if (W.rSwamp > 0.5) return B_SWAMP;
    if (W.rRuins > 0.5) return B_RUINS;
    if (W.rMustard > 0.5) return B_MUSTARD;
    if (W.rBamboo > 0.5) return B_BAMBOO;
    return B_JUNGLE;
  }

  const patch = (x, z) => nD.noise2(x * 0.045, z * 0.045);
  const patch2 = (x, z) => nD.noise2(x * 0.17 + 31.1, z * 0.17 - 12.7);
  return { raw, weights, classify, patch, patch2, S, W };
}

// ------------------------------------------------------------------ module
function init(ctx) {
  const THREE = ctx.THREE;
  const util = ctx.util;
  const scene = ctx.scene;

  // ---------------------------------------------------------------- state
  let seed = ctx.seed >>> 0;
  let T = makeTerrain(util, seed);
  const G = { raw: 0, low: 0, river: 99, flat: 0 };   // side outputs of sample()
  const reserves = [];                                // {x, z, r, rim, h, flatten}
  const clearingCache = new Map();                    // chunk key -> [{x, z, r, h}]
  const chunks = new Map();                           // chunk key -> record
  const colliderMap = new Map();                      // chunk key -> [{x, z, r, h, tag}]
  let spawn = { x: 0, z: 0 };
  let generatedSinceReset = 0;
  let lateReserveWarned = false;

  const viewRadius = () => (ctx.quality === 'low' ? 2 : 3);

  // ---------------------------------------------------------------- clearings
  function clearingsOf(cx, cz) {
    const k = ckey(cx, cz);

    list = [];
    const rng = util.rngFor(seed, 'world-clearings', cx, cz);
    const roll = rng();
    const want = roll < 0.28 ? 0 : roll < 0.8 ? 1 : 2;
    const x0 = cx * CHUNK, z0 = cz * CHUNK;
    for (let tries = 0; tries < 10 && list.length < want; tries++) {

      const m = r + CLEARING_MARGIN;
      const x = x0 + m + rng() * (CHUNK - 2 * m);
      const z = z0 + m + rng() * (CHUNK - 2 * m);
      const hc = T.raw(x, z);
      if (hc < 0.8 || hc > 12.5) continue;
      let ok = true, lo = hc, hi = hc;
      for (let a = 0; a < 6 && ok; a++) {
        const ang = a * (TAU / 6);
        const hh = T.raw(x + Math.cos(ang) * r, z + Math.sin(ang) * r);
        if (hh < 0.25) ok = false;
        if (hh < lo) lo = hh;
        if (hh > hi) hi = hh;
      }
      if (!ok || hi - lo > 4) continue;
      for (const q of reserves) if (util.dist2(x, z, q.x, q.z) < (q.r + r + 3) ** 2) { ok = false; break; }
      for (const c of list) if (util.dist2(x, z, c.x, c.z) < (c.r + r + 4) ** 2) { ok = false; break; }
      if (!ok) continue;
      list.push({ x, z, r, h: Math.max(DRY_MIN, hc) });
    }
    clearingCache.set(k, list);
    return list;
  }

  function flattenBy(list, x, z, h, rim) {
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const dx = x - c.x, dz = z - c.z, d2 = dx * dx + dz * dz, R = c.r + (rim || c.rim);
      if (d2 >= R * R) continue;
      const t = 1 - sstep(c.r, R, Math.sqrt(d2));
      if (c.flatten !== false) h += (c.h - h) * t;
      if (t > G.flat) G.flat = t;
    }
    return h;
  }

  // Terrain height including clearings and reservations. Also fills G.
  function sample(x, z) {
    let h = T.raw(x, z);
    G.raw = h; G.low = T.S.low; G.river = T.S.river; G.flat = 0;
    if (reserves.length) h = flattenBy(reserves, x, z, h, 0);
    // A clearing's influence reaches at most CLEARING_MARGIN m past its own chunk, so the
    // neighbouring chunks only matter near the borders (but they are the 3×3 around x, z).
    const cx = Math.floor(x / CHUNK), cz = Math.floor(z / CHUNK);
    const lx = x - cx * CHUNK, lz = z - cz * CHUNK;
    const near = CLEARING_MARGIN + 1;
    const dx0 = lx < near ? -1 : 0, dx1 = lx > CHUNK - near ? 1 : 0;
    const dz0 = lz < near ? -1 : 0, dz1 = lz > CHUNK - near ? 1 : 0;
    for (let dz = dz0; dz <= dz1; dz++) {
      for (let dx = dx0; dx <= dx1; dx++) h = flattenBy(clearingsOf(cx + dx, cz + dz), x, z, h, CLEARING_RIM);
    }
    return h;
  }

  function heightAt(x, z) { return sample(x, z); }

  function biomeIndexAt(x, z) {
    sample(x, z);
    if (G.flat > 0.95) return B_CLEARING;
    T.weights(x, z, G.raw, G.low, G.river);
    return T.classify();
  }

  // ---------------------------------------------------------------- materials
  const windTime = { value: 0 };
  function windify(mat) {
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uWindTime = windTime;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nattribute float sway;\nuniform float uWindTime;')
        .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          vec4 windW = modelMatrix * vec4(transformed, 1.0);
          float ph = uWindTime * 1.6 + windW.x * 0.13 + windW.z * 0.09;
          float gust = 0.6 + 0.4 * sin(uWindTime * 0.31 + windW.x * 0.011 - windW.z * 0.007);
          float a = sway * gust;
          transformed.x += sin(ph) * a * 0.32;
          transformed.z += sin(ph * 0.77 + 1.7) * a * 0.2;
          transformed.y -= abs(sin(ph)) * a * 0.04;
        }`);
    };
    mat.customProgramCacheKey = () => 'turbans-world-wind-1';
    return mat;
  }
  const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  terrainMat.name = 'world-terrain';
  const solidMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  solidMat.name = 'world-solid';
  const leafMat = windify(new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  leafMat.name = 'world-leaf';
  const groundMat = windify(new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  groundMat.name = 'world-ground';
  const BATCH_MATS = [solidMat, leafMat, groundMat];
  const BATCH_SHADOW = [true, true, false];
  const BATCH_NAMES = ['world-solids', 'world-canopy', 'world-undergrowth'];
  const SOLID = 0, LEAF = 1, GROUND = 2;

  // ---------------------------------------------------------------- palette (linear)
  const lin = (hex) => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
  const col = (hex) => new THREE.Color(hex);
  const P3 = {};
  for (const k of Object.keys(PAL)) P3[k] = lin(PAL[k]);
  const C = {};
  for (const k of Object.keys(PAL)) C[k] = col(PAL[k]);
  const canopyTints = CANOPY_TINTS.map(lin);
  const emergentTints = EMERGENT_TINTS.map(lin);
  const grassTints = GRASS_TINTS.map(lin);
  const gulmohar = lin(GULMOHAR);
  const amaltas = lin(AMALTAS);
  const WHITE3 = [1, 1, 1];

  // ---------------------------------------------------------------- template building
  // A "part" accumulates triangles (positions, colours, sway) for one batch; a template is a
  // set of parts. Normals are per face (flat shading), computed when a part is finished.
  const _c = new THREE.Color();
  const _c2 = new THREE.Color();
  const _v = new THREE.Vector3();
  const _up = new THREE.Vector3(0, 1, 0);
  const _qb = new THREE.Quaternion();
  const _mb = new THREE.Matrix4();

  function newPart() { return { p: [], c: [], s: [] }; }

  function pushVert(part, x, y, z, c, s) { part.p.push(x, y, z); part.c.push(c.r, c.g, c.b); part.s.push(s); }

  // A thin leaf triangle; flipped if needed so its front face looks up (nicer lighting).
  function leafTri(part, a, b, c, ca, cb, cc, sa, sb, sc) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const ny = uz * vx - ux * vz;
    if (ny < 0) { const t = b; b = c; c = t; const tc = cb; cb = cc; cc = tc; const ts = sb; sb = sc; sc = ts; }
    pushVert(part, a[0], a[1], a[2], ca, sa);
    pushVert(part, b[0], b[1], b[2], cb, sb);
    pushVert(part, c[0], c[1], c[2], cc, sc);
  }

  // Add a Three.js geometry. color: THREE.Color | fn(x,y,z,nx,ny,nz,out) | null (use the
  // geometry's own colour attribute). sway: number | fn(x,y,z) | null (own attribute).
  function addGeom(part, geom, color, sway) {
    const g = geom.index ? geom.toNonIndexed() : geom;
    const pos = g.attributes.position.array;
    const cA = g.attributes.color ? g.attributes.color.array : null;
    const sA = g.attributes.sway ? g.attributes.sway.array : null;
    for (let i = 0; i < pos.length; i += 9) {
      const ax = pos[i], ay = pos[i + 1], az = pos[i + 2];
      const ux = pos[i + 3] - ax, uy = pos[i + 4] - ay, uz = pos[i + 5] - az;
      const vx = pos[i + 6] - ax, vy = pos[i + 7] - ay, vz = pos[i + 8] - az;
      _v.set(uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx).normalize();
      for (let k = 0; k < 3; k++) {
        const o = i + k * 3;
        const x = pos[o], y = pos[o + 1], z = pos[o + 2];
        if (color == null && cA) _c.setRGB(cA[o], cA[o + 1], cA[o + 2]);
        else if (typeof color === 'function') color(x, y, z, _v.x, _v.y, _v.z, _c);
        else if (color) _c.copy(color);
        else _c.setRGB(1, 1, 1);
        const s = sway == null ? (sA ? sA[o / 3] : 0) : typeof sway === 'function' ? sway(x, y, z) : sway;
        pushVert(part, x, y, z, _c, s);
      }
    }
    if (g !== geom) g.dispose();
    geom.dispose();
  }

  // Paint colour/sway attributes in a geometry's local space (before it is moved into place).
  function paint(geom, colorFn, swayFn) {
    const pos = geom.attributes.position;
    const n = pos.count;
    const cArr = new Float32Array(n * 3), sArr = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      colorFn(x, y, z, _c2);
      cArr[i * 3] = _c2.r; cArr[i * 3 + 1] = _c2.g; cArr[i * 3 + 2] = _c2.b;
      sArr[i] = swayFn ? swayFn(x, y, z) : 0;
    }
    geom.setAttribute('color', new THREE.BufferAttribute(cArr, 3));
    geom.setAttribute('sway', new THREE.BufferAttribute(sArr, 1));
    return geom;
  }

  // Hash-jitter vertices; identical positions move identically, so solids stay watertight.
  function jitter(geom, amt, salt) {
    const a = geom.attributes.position;
    for (let i = 0; i < a.count; i++) {
      const x = a.getX(i), y = a.getY(i), z = a.getZ(i);
      const h = util.hash32(Math.round(x * 512), Math.round(y * 512), Math.round(z * 512), salt);
      a.setXYZ(i,
        x + ((h & 1023) / 1023 - 0.5) * amt,
        y + (((h >>> 10) & 1023) / 1023 - 0.5) * amt,
        z + (((h >>> 20) & 1023) / 1023 - 0.5) * amt);
    }
    return geom;
  }

  function bendGeom(geom, H, bx, bz) {
    const a = geom.attributes.position;
    for (let i = 0; i < a.count; i++) {
      const t = a.getY(i) / H;
      a.setX(i, a.getX(i) + bx * t * t);
      a.setZ(i, a.getZ(i) + bz * t * t);
    }
    return geom;
  }

  // A cylinder from a to b (radius r0 at a, r1 at b), painted along its length with
  // colorFn(t, out) / swayFn(t) where t runs 0 → 1 from a to b.
  function limb(part, a, b, r0, r1, radial, hseg, colorFn, swayFn, open = true) {
    _v.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    const len = _v.length();
    _v.divideScalar(len);
    const g = new THREE.CylinderGeometry(r1, r0, len, radial, hseg, open).translate(0, len / 2, 0);
    paint(g, (x, y, z, out) => colorFn(y / len, out), swayFn ? (x, y) => swayFn(y / len) : null);
    _qb.setFromUnitVectors(_up, _v);
    _mb.makeRotationFromQuaternion(_qb).setPosition(a[0], a[1], a[2]);
    g.applyMatrix4(_mb);
    addGeom(part, g, null, null);
  }

  // A leaf strip: pinnate (serrated, palm/fern) or paddle (banana). It arcs up then droops.
  function frond(part, o) {
    const dx = Math.cos(o.yaw), dz = Math.sin(o.yaw);
    const sx = -dz, sz = dx;
    const pts = [];
    for (let i = 0; i <= o.segs; i++) {
      const t = i / o.segs;
      pts.push([o.x + dx * o.len * t, o.y + o.up * t - o.droop * t * t, o.z + dz * o.len * t, t]);
    }
    const widthAt = (t) => o.width * Math.sin(Math.PI * (0.15 + 0.85 * t));
    const cAt = (t) => new THREE.Color().copy(o.c0).lerp(o.c1, t);
    const sAt = (t) => o.s0 + (o.s1 - o.s0) * t;
    for (let i = 0; i < o.segs; i++) {
      const a = pts[i], b = pts[i + 1];
      const ca = cAt(a[3]), cb = cAt(b[3]);
      for (let side = -1; side <= 1; side += 2) {
        if (o.paddle) {
          const wa = widthAt(a[3]), wb = widthAt(b[3]);
          const la = [a[0] + sx * wa * side, a[1] - o.fold * wa, a[2] + sz * wa * side];
          const lb = [b[0] + sx * wb * side, b[1] - o.fold * wb, b[2] + sz * wb * side];
          const cl = cAt(Math.min(1, b[3] + 0.15));
          leafTri(part, a, b, lb, ca, cb, cl, sAt(a[3]), sAt(b[3]), sAt(b[3]));
          leafTri(part, a, lb, la, ca, cl, cl, sAt(a[3]), sAt(b[3]), sAt(a[3]));
        } else {
          const tm = (a[3] + b[3]) / 2, w = widthAt(tm);
          const m = [(a[0] + b[0]) / 2 + sx * w * side + dx * w * 0.55,
            (a[1] + b[1]) / 2 - o.fold * w,
            (a[2] + b[2]) / 2 + sz * w * side + dz * w * 0.55];
          leafTri(part, a, b, m, ca, cb, cAt(Math.min(1, tm + 0.2)), sAt(a[3]), sAt(b[3]), sAt(tm) + 0.05);
        }
      }
    }
  }

  // A hanging liana: two crossed ribbons that wiggle down, with a few leaves.
  function vine(part, x, yTop, z, len, rng, color) {
    const segs = 4, w = 0.06;
    let px = x, pz = z;
    const leafC = new THREE.Color().copy(color).multiplyScalar(1.15);
    for (let i = 0; i < segs; i++) {
      const y0 = yTop - (len * i) / segs, y1 = yTop - (len * (i + 1)) / segs;
      const nx = px + (rng() - 0.5) * 0.3, nz = pz + (rng() - 0.5) * 0.3;
      const s0 = 0.15 + 0.85 * (i / segs), s1 = 0.15 + 0.85 * ((i + 1) / segs);
      for (let r = 0; r < 2; r++) {
        const ox = r === 0 ? w : 0, oz = r === 0 ? 0 : w;
        const a = [px - ox, y0, pz - oz], b = [px + ox, y0, pz + oz];
        const c = [nx + ox, y1, nz + oz], d = [nx - ox, y1, nz - oz];
        pushVert(part, a[0], a[1], a[2], color, s0); pushVert(part, b[0], b[1], b[2], color, s0); pushVert(part, c[0], c[1], c[2], color, s1);
        pushVert(part, a[0], a[1], a[2], color, s0); pushVert(part, c[0], c[1], c[2], color, s1); pushVert(part, d[0], d[1], d[2], color, s1);
      }
      const la = rng() * TAU, ll = 0.22;
      const base = [nx, y1 + 0.05, nz];
      const tip = [nx + Math.cos(la) * ll, y1 - 0.12, nz + Math.sin(la) * ll];
      const sideL = [nx + Math.cos(la + 0.6) * ll * 0.55, y1 - 0.02, nz + Math.sin(la + 0.6) * ll * 0.55];
      const sideR = [nx + Math.cos(la - 0.6) * ll * 0.55, y1 - 0.02, nz + Math.sin(la - 0.6) * ll * 0.55];
      leafTri(part, base, sideL, tip, leafC, leafC, leafC, s1, s1, s1);
      leafTri(part, base, tip, sideR, leafC, leafC, leafC, s1, s1, s1);
      px = nx; pz = nz;
    }
  }

  function finishPart(part) {
    const n = part.p.length / 3;
    if (!n) return null;
    const pos = new Float32Array(part.p), nor = new Float32Array(n * 3);
    for (let i = 0; i < pos.length; i += 9) {
      const ux = pos[i + 3] - pos[i], uy = pos[i + 4] - pos[i + 1], uz = pos[i + 5] - pos[i + 2];
      const vx = pos[i + 6] - pos[i], vy = pos[i + 7] - pos[i + 1], vz = pos[i + 8] - pos[i + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      nx /= l; ny /= l; nz /= l;
      for (let k = 0; k < 9; k += 3) { nor[i + k] = nx; nor[i + k + 1] = ny; nor[i + k + 2] = nz; }
    }
    return { pos, nor, col: new Float32Array(part.c), sway: new Float32Array(part.s), count: n };
  }

  // parts: [[batchIndex, part, tintable]]
  function template(parts) {
    const out = [];
    for (const [b, part, tintable] of parts) {
      const d = finishPart(part);
      if (d) out.push({ b, d, tintable: !!tintable });
    }
    return out;
  }

  // colour helpers for templates
  const shadeLeaf = (x, y, z, nx, ny, nz, out) => { const k = 0.56 + 0.44 * (ny * 0.5 + 0.5); out.setRGB(k, k, k); };
  const barkColor = (base) => (x, y, z, nx, ny, nz, out) => {
    const k = 0.82 + 0.18 * Math.min(1, y / 3) + (hashf(Math.round(x * 50), Math.round(y * 50), Math.round(z * 50)) - 0.5) * 0.1;
    out.copy(base).multiplyScalar(k);
  };
  const stoneColor = (base, mossAbove) => (x, y, z, nx, ny, nz, out) => {
    if (ny > mossAbove) { out.copy(C.moss).multiplyScalar(0.9 + 0.2 * ny); return; }
    const k = 0.78 + 0.22 * (ny * 0.5 + 0.5);
    out.copy(base).multiplyScalar(k);
  };

  // ---------------------------------------------------------------- templates
  function makeCanopyTree(v) {
    const rng = util.mulberry32(0xc0ffee + v * 977);
    const solid = newPart(), leaf = newPart();
    const H = [6.2, 6.8, 5.6][v];
    const bx = (rng() - 0.5) * 1.1, bz = (rng() - 0.5) * 1.1;
    const trunk = bendGeom(new THREE.CylinderGeometry(0.3, 0.52, H, 6, 3, true).translate(0, H / 2, 0), H, bx, bz);
    addGeom(solid, trunk, barkColor(C.bark), 0);
    addGeom(solid, new THREE.CylinderGeometry(0.5, 0.95, 0.9, 6, 1, true).translate(0, 0.3, 0), barkColor(C.barkDark), 0);
    const layouts = [
      [[0, 1.4, 0, 2.8, 1], [1.9, 0.3, 0.7, 2.0, 0], [-1.6, 0.6, -0.9, 2.1, 0]],
      [[0, 1.2, 0, 2.5, 1], [-1.7, 0.2, 1.1, 2.0, 0], [1.5, 0.8, -1.2, 1.9, 0], [0.4, 2.6, 0.2, 1.6, 0]],
      [[0, 1.1, 0, 2.4, 1], [1.6, -0.1, -0.6, 1.8, 0], [-1.3, 0.2, 0.9, 1.8, 0]],
    ][v];
    const barkFn = (t, out) => out.copy(C.bark).multiplyScalar(0.9 - 0.15 * t);
    for (const [ox, oy, oz, r, detail] of layouts) {
      const cx = bx + ox, cy = H + oy, cz = bz + oz;
      if (ox || oz) limb(solid, [bx * 0.7, H - 1.4, bz * 0.7], [bx + ox * 0.65, cy - r * 0.35, bz + oz * 0.65], 0.16, 0.08, 4, 1, barkFn, null);
      const g = jitter(new THREE.IcosahedronGeometry(r, detail), r * 0.18, 11 + v).scale(1, 0.84, 1).translate(cx, cy, cz);
      addGeom(leaf, g, shadeLeaf, (x, y) => 0.1 + 0.05 * clampN(y - H + 1, 0, 4));
    }
    if (v !== 2) {
      const shade = new THREE.Color(0.8, 0.8, 0.8);
      const n = v === 0 ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const [ox, oy, oz, r] = layouts[1 + (i % (layouts.length - 1))];
        const a = rng() * TAU;
        vine(leaf, bx + ox + Math.cos(a) * r * 0.5, H + oy - r * 0.55, bz + oz + Math.sin(a) * r * 0.5, 2.6 + rng() * 2.2, rng, shade);
      }
    }
    return template([[SOLID, solid, false], [LEAF, leaf, true]]);
  }

  function makeEmergentTree(v) {
    const rng = util.mulberry32(0xe3e7 + v * 131);
    const solid = newPart(), leaf = newPart();
    const H = 12.5 + v;
    const bx = (rng() - 0.5) * 1.6, bz = (rng() - 0.5) * 1.6;
    addGeom(solid, bendGeom(new THREE.CylinderGeometry(0.4, 0.82, H, 7, 4, true).translate(0, H / 2, 0), H, bx, bz), barkColor(C.bark), 0);
    // buttress roots: thin triangular fins
    const finC = new THREE.Color().copy(C.barkDark);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU + rng() * 0.4;
      const ca = Math.cos(a), sa = Math.sin(a), px = -sa * 0.09, pz = ca * 0.09;
      const top = [ca * 0.45, 2.6 + rng() * 0.8, sa * 0.45];
      const inner = [ca * 0.7, -0.1, sa * 0.7];
      const outer = [ca * (2.0 + rng() * 0.6), -0.15, sa * (2.0 + rng() * 0.6)];
      for (const s of [1, -1]) {
        const off = (p) => [p[0] + px * s, p[1], p[2] + pz * s];
        const A = off(top), B = off(inner), D = off(outer);
        if (s > 0) { pushVert(solid, ...A, finC, 0); pushVert(solid, ...D, finC, 0); pushVert(solid, ...B, finC, 0); }
        else { pushVert(solid, ...A, finC, 0); pushVert(solid, ...B, finC, 0); pushVert(solid, ...D, finC, 0); }
      }
      // the sloping top edge of the fin
      const A1 = [top[0] + px, top[1], top[2] + pz], A2 = [top[0] - px, top[1], top[2] - pz];
      const D1 = [outer[0] + px, outer[1], outer[2] + pz], D2 = [outer[0] - px, outer[1], outer[2] - pz];
      pushVert(solid, ...A1, finC, 0); pushVert(solid, ...A2, finC, 0); pushVert(solid, ...D2, finC, 0);
      pushVert(solid, ...A1, finC, 0); pushVert(solid, ...D2, finC, 0); pushVert(solid, ...D1, finC, 0);
    }
    const blobs = [[0, 0.9, 0, 3.6, 1], [2.7, -0.2, 1.3, 2.6, 0], [-2.5, 0.1, -1.4, 2.8, 0], [0.6, 1.6, -2.4, 2.2, 0], [-1.0, -0.4, 2.5, 2.3, 0]];
    const barkFn = (t, out) => out.copy(C.bark).multiplyScalar(0.92 - 0.2 * t);
    for (const [ox, oy, oz, r, detail] of blobs) {
      const cx = bx + ox, cy = H + oy, cz = bz + oz;
      if (ox || oz) limb(solid, [bx * 0.8, H - 2.2, bz * 0.8], [bx + ox * 0.75, cy - 0.4, bz + oz * 0.75], 0.24, 0.1, 5, 1, barkFn, null);
      const g = jitter(new THREE.IcosahedronGeometry(r, detail), r * 0.16, 23 + v).scale(1, 0.46, 1).translate(cx, cy, cz);
      addGeom(leaf, g, shadeLeaf, 0.14);
    }
    const shade = new THREE.Color(0.78, 0.78, 0.78);
    for (let i = 0; i < 5; i++) {
      const [ox, oy, oz, r] = blobs[1 + (i % 4)];
      const a = rng() * TAU;
      vine(leaf, bx + ox + Math.cos(a) * r * 0.55, H + oy - 0.8, bz + oz + Math.sin(a) * r * 0.55, 4.5 + rng() * 3.5, rng, shade);
    }
    return template([[SOLID, solid, false], [LEAF, leaf, true]]);
  }

  function makePalm(v) {
    const rng = util.mulberry32(0x9a1e + v * 53);
    const solid = newPart(), leaf = newPart();
    const H = 7 + v * 0.9, lean = 1.3 + v * 0.6, segs = 7;
    const pt = (t) => [lean * t * t, H * t, 0];
    for (let i = 0; i < segs; i++) {
      const a = pt(i / segs), b = pt((i + 1) / segs);
      const r = 0.27 - 0.07 * (i / segs);
      limb(solid, a, b, r * 0.86, r, 5, 1, (t, out) => out.copy(t > 0.75 ? C.palmRing : C.palmTrunk).multiplyScalar(0.9 + 0.12 * t), null);
    }
    const top = pt(1);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * TAU + 0.4;
      addGeom(solid, jitter(new THREE.OctahedronGeometry(0.2, 0), 0.04, 5).translate(top[0] + Math.cos(a) * 0.22, top[1] - 0.3, top[2] + Math.sin(a) * 0.22), C.coconut, 0);
    }
    addGeom(leaf, jitter(new THREE.IcosahedronGeometry(0.36, 0), 0.08, 7).translate(top[0], top[1] + 0.05, top[2]), C.palmLeaf, 0.05);
    const n = 8 + v;
    for (let i = 0; i < n; i++) {
      frond(leaf, {
        x: top[0], y: top[1] + 0.1, z: top[2], yaw: (i / n) * TAU + rng() * 0.35,
        len: 3.1 + rng() * 0.7, up: 0.9 + rng() * 0.4, droop: 2.6 + rng() * 0.6, width: 0.55, segs: 7, fold: 0.35,
        c0: C.palmLeaf, c1: C.palmTip, s0: 0.08, s1: 0.6,
      });
    }
    return template([[SOLID, solid, false], [LEAF, leaf, false]]);
  }

  function makeBanana(v) {
    const rng = util.mulberry32(0xba7a + v * 71);
    const g = newPart();
    limb(g, [0, 0, 0], [0, 1.55, 0], 0.17, 0.11, 6, 1, (t, out) => out.copy(C.bananaStem).multiplyScalar(0.85 + 0.25 * t), (t) => 0.08 * t);
    const n = 6;
    for (let i = 0; i < n; i++) {

        c0: C.bananaLeaf, c1: C.bananaTip, s0: 0.08, s1: 0.5,

    if (v === 1) {
      limb(g, [0, 1.45, 0], [0.38, 1.05, 0], 0.035, 0.03, 4, 1, (t, out) => out.copy(C.bananaStem), (t) => 0.1 + 0.1 * t);
      const bud = new THREE.ConeGeometry(0.11, 0.34, 6).rotateX(Math.PI).translate(0.38, 0.9, 0);
      addGeom(g, bud, C.bananaBud, 0.2);

    return template([[GROUND, g, false]]);
  }

  function makeBamboo(v) {
    const rng = util.mulberry32(0xba3b00 + v * 37);
    const g = newPart();
    const n = 5 + v * 2;
    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, r = 0.12 + rng() * 0.55;
      const base = [Math.cos(a) * r, -0.1, Math.sin(a) * r];
      const H = 7 + rng() * 3.2, out = 0.6 + rng() * 1.3;
      const top = [base[0] + Math.cos(a) * out, H, base[2] + Math.sin(a) * out];
      limb(g, base, top, 0.1, 0.07, 5, 6,
        (t, o) => o.copy(Math.round(t * 6) % 2 === 0 ? C.bambooNode : C.bamboo).multiplyScalar(0.9 + 0.15 * t),
        (t) => 0.55 * t * t);
      for (const ts of [0.55, 0.72, 0.86, 0.97]) {
        const o = [base[0] + (top[0] - base[0]) * ts, base[1] + (top[1] - base[1]) * ts, base[2] + (top[2] - base[2]) * ts];
        const sw = 0.55 * ts * ts;
        for (let k = 0; k < 3; k++) {
          const la = rng() * TAU, ll = 0.75 + rng() * 0.5, lw = 0.08;
          const dx = Math.cos(la), dz = Math.sin(la);
          const tip = [o[0] + dx * ll, o[1] - 0.25 - rng() * 0.25, o[2] + dz * ll];
          const l = [o[0] - dz * lw + dx * ll * 0.4, o[1] - 0.04, o[2] + dx * lw + dz * ll * 0.4];
          const rr = [o[0] + dz * lw + dx * ll * 0.4, o[1] - 0.04, o[2] - dx * lw + dz * ll * 0.4];
          leafTri(g, o, l, tip, C.bambooLeaf, C.bambooLeaf, C.bambooTip, sw, sw + 0.1, sw + 0.25);
          leafTri(g, o, tip, rr, C.bambooLeaf, C.bambooTip, C.bambooLeaf, sw, sw + 0.25, sw + 0.1);
        }
      }
    }
    return template([[LEAF, g, false]]);
  }

  function makeFern(v) {

  function makeBush(v) {
    const rng = util.mulberry32(0xb05 + v * 29);
    const g = newPart();
    const base = [C.bushA, C.bushB, C.bushC, C.bushA, C.bushB][v];
    const blobs = [[0, 0.62, 0, 0.82], [0.62, 0.45, 0.25, 0.6], [-0.5, 0.5, -0.32, 0.64]];

  function makeFlowers(color, puff) {
    const rng = util.mulberry32(0xf10 + Math.round(color.r * 1000) + (puff ? 7 : 0));
    const g = newPart();
    for (let i = 0; i < 4; i++) {
      const a = rng() * TAU, r = 0.08 + rng() * 0.32;
      const x = Math.cos(a) * r, z = Math.sin(a) * r, h = 0.32 + rng() * 0.3;
      const sa = rng() * TAU, sx = Math.cos(sa) * 0.025, sz = Math.sin(sa) * 0.025;
      leafTri(g, [x - sx, 0, z - sz], [x + sx, 0, z + sz], [x, h, z], C.leafGreen, C.leafGreen, C.leafGreen, 0, 0, 0.18);
      const la = rng() * TAU;
      leafTri(g, [x, 0.02, z], [x + Math.cos(la + 0.4) * 0.16, 0.08, z + Math.sin(la + 0.4) * 0.16],
        [x + Math.cos(la) * 0.24, 0.05, z + Math.sin(la) * 0.24], C.leafGreen, C.leafGreen, C.fernTip, 0, 0.05, 0.08);
      if (puff) {
        addGeom(g, jitter(new THREE.OctahedronGeometry(0.11, 0), 0.03, i).scale(1, 0.8, 1).translate(x, h + 0.04, z),
          (px, py, pz, nx, ny, nz, out) => out.copy(color).multiplyScalar(0.8 + 0.25 * (ny * 0.5 + 0.5)), 0.2);
      } else {
        const c = [x, h + 0.03, z];
        const pr = 0.15, k = 5, rot = rng() * TAU;
        for (let p = 0; p < k; p++) {
          const p0 = rot + (p / k) * TAU - 0.42, p1 = p0 + 0.84;
          leafTri(g, c, [x + Math.cos(p0) * pr, h + 0.1, z + Math.sin(p0) * pr],
            [x + Math.cos(p1) * pr, h + 0.1, z + Math.sin(p1) * pr], color, color, color, 0.2, 0.22, 0.22);
        }
        addGeom(g, new THREE.TetrahedronGeometry(0.035, 0).translate(x, h + 0.08, z), C.pollen, 0.2);
      }
    }
    return template([[GROUND, g, false]]);
  }

  function makeLog() {
    const s = newPart(), g = newPart();
    const logGeo = new THREE.CylinderGeometry(0.4, 0.44, 4.6, 7, 1, false);
    jitter(logGeo, 0.06, 71).rotateZ(Math.PI / 2).translate(0, 0.34, 0);
    addGeom(s, logGeo, (x, y, z, nx, ny, nz, out) => {
      if (Math.abs(nx) > 0.9) out.copy(C.logEnd);
      else if (ny > 0.55) out.copy(C.moss).multiplyScalar(0.95);
      else out.copy(C.log).multiplyScalar(0.8 + 0.2 * (ny * 0.5 + 0.5));

      addGeom(g, new THREE.ConeGeometry(0.09 + i * 0.02, 0.08, 6, 1, true).translate(x, h + 0.03, z), caps[i], 0);
    }
    return template([[SOLID, s, false], [GROUND, g, false]]);
  }

  function makeReeds(v) {
    const rng = util.mulberry32(0x7eed + v * 13);

    for (let i = 0; i < 10; i++) {

  function makeMustard(v) {

  function makeLilies(v) {
    const rng = util.mulberry32(0x111e + v * 7);
    const g = newPart();
    for (let i = 0; i < 4; i++) {
      const a = rng() * TAU, d = i === 0 ? 0 : 0.5 + rng() * 0.6;
      const cx = Math.cos(a) * d, cz = Math.sin(a) * d, r = 0.3 + rng() * 0.22, notch = rng() * TAU;
      const k = 8;
      for (let p = 0; p < k - 1; p++) {
        const a0 = notch + (p / k) * TAU, a1 = notch + ((p + 1) / k) * TAU;
        const shade = p % 2 ? C.lily : C.lilyEdge;
        leafTri(g, [cx, 0.01, cz], [cx + Math.cos(a0) * r, 0, cz + Math.sin(a0) * r], [cx + Math.cos(a1) * r, 0, cz + Math.sin(a1) * r], C.lily, shade, shade, 0, 0, 0);
      }
    }
    if (v === 1) {
      const k = 7;
      for (let ring = 0; ring < 2; ring++) {
        const pr = ring ? 0.2 : 0.14, up = ring ? 0.12 : 0.2, off = ring ? 0 : TAU / k / 2;
        for (let p = 0; p < k; p++) {
          const a0 = off + (p / k) * TAU;

          const l = [Math.cos(a0 - 0.28) * pr * 0.5, 0.06, Math.sin(a0 - 0.28) * pr * 0.5];

          const tip = [Math.cos(a0) * pr, up, Math.sin(a0) * pr];
          leafTri(g, base, l, tip, C.lotus, C.lotus, C.lotusTip, 0, 0, 0);
          leafTri(g, base, tip, rr, C.lotus, C.lotusTip, C.lotus, 0, 0, 0);
        }
      }
      addGeom(g, new THREE.OctahedronGeometry(0.05, 0).scale(1, 0.6, 1).translate(0, 0.08, 0), C.pollen, 0);

  const TPL = {

  // ---------------------------------------------------------------- batching
  // Growable typed-array batches, reused for every chunk; finalize() copies out exactly-sized
  // arrays for the chunk's geometry.
  function makeBatch() {
    return { pos: new Float32Array(30000 * 3), nor: new Float32Array(30000 * 3), col: new Float32Array(30000 * 3), sway: new Float32Array(30000), n: 0 };
  }
  const batches = [makeBatch(), makeBatch(), makeBatch()];
  function grow(b, need) {
    let cap = b.sway.length;
    if (need <= cap) return;
