    // kameez skirt to the knee, mustard torso, open purple cardigan with pockets + buttons
    B.add(r.hips, G.cyl(0.16, 0.17, 0.1, 12), salwar, 0, -0.01, 0);
    B.add(r.hips, G.lathe([[0.168, 0.08], [0.192, -0.1], [0.248, -0.36]], 14), suit);
    B.add(r.torso, G.cap(0.15, 0.16, 12), suit, 0, 0.19, 0, 0, 0, 0, 1, 1, 0.9);
    B.add(r.torso, G.cyl(0.164, 0.188, 0.42, 14, true, Math.PI + 0.32, TAU - 0.64), cardigan, 0, 0.19, 0);
    for (const s of [-1, 1]) {
      B.add(r.torso, G.sph(0.082, 8, 6), cardigan, s * 0.19, 0.39, 0);
      B.add(r.torso, G.box(0.08, 0.065, 0.016), cardiganDark, s * 0.11, 0.06, -0.162, 0, s * -0.45, 0);
    }
    for (let i = 0; i < 3; i++) B.add(r.torso, G.sph(0.014, 6, 4), cardiganDark, -0.058, 0.32 - i * 0.09, -0.17);
    B.add(r.torso, G.cyl(0.055, 0.06, 0.08, 8), skin, 0, 0.47, 0);

    // chunni over the shoulders, a tail down the back and one over the front, gold borders
    B.add(r.torso, G.lathe([[0.09, 0.53], [0.155, 0.47], [0.222, 0.39], [0.252, 0.25]], 16, Math.PI + 0.45, TAU - 0.9), chunni);
    B.add(r.torso, G.box(0.24, 0.42, 0.02), chunni, 0, 0.12, 0.2, -0.12, 0, 0);
    B.add(r.torso, G.box(0.245, 0.026, 0.024), gold, 0, -0.088, 0.225, -0.12, 0, 0);
    B.add(r.torso, G.box(0.1, 0.36, 0.02), chunni, -0.12, 0.2, -0.178, 0.08, 0, 0.05);
    B.add(r.torso, G.box(0.104, 0.026, 0.024), gold, -0.111, 0.022, -0.19, 0.08, 0, 0.05);

    // arms: cardigan sleeves, gold bangles left, kara right
    for (const [arm, fore, hand] of [[r.armL, r.foreL, r.handL], [r.armR, r.foreR, r.handR]]) {
      B.add(arm, G.cap(0.056, 0.2), cardigan, 0, -0.12, 0);
      B.add(fore, G.cap(0.048, 0.18), cardigan, 0, -0.11, 0);
      B.add(hand, G.sph(0.05, 8, 6), skin, 0, -0.02, 0);
    }
    for (let i = 0; i < 2; i++) B.add(r.foreL, G.tor(0.05, 0.008, TAU, 4, 12), gold, 0, -0.19 - i * 0.016, 0, Math.PI / 2, 0, 0);
    B.add(r.foreR, G.tor(0.05, 0.01, TAU, 4, 12), steel, 0, -0.2, 0, Math.PI / 2, 0, 0);

    // walking stick in the right hand (crook handle, rubber tip); kept upright by the animator
    const stickPivot = B.pivot(r.handR, 0, -0.015, -0.01);
    B.add(stickPivot, G.cyl(0.017, 0.015, 0.7, 6), stick, 0, -0.33, 0);
    B.add(stickPivot, G.cyl(0.021, 0.021, 0.04, 6), rubber, 0, -0.67, 0);
    B.add(stickPivot, G.tor(0.04, 0.016, Math.PI, 4, 8), stick, 0, 0.02, -0.04, 0, Math.PI / 2, 0);

    // handbag in the left hand (with a paratha making a break for it)
    const bagPivot = B.pivot(r.handL, 0, -0.01, 0);
    B.add(bagPivot, G.tor(0.05, 0.01, Math.PI, 4, 8), bagDark, 0, -0.055, 0, 0, Math.PI / 2, 0);
    B.add(bagPivot, G.box(0.075, 0.13, 0.19), bag, 0, -0.12, 0);
    B.add(bagPivot, G.box(0.08, 0.05, 0.195), bagDark, 0, -0.07, 0);
    for (const s of [-1, 1]) B.add(bagPivot, G.box(0.01, 0.026, 0.03), gold, s * 0.041, -0.08, 0);
    B.add(bagPivot, G.cyl(0.048, 0.048, 0.008, 10), paratha, 0, -0.04, 0.075, 1.25, 0, 0);

    // head: grey hair under the chunni, round gold glasses, a kind smile, rosy cheeks
    const f = r.face;
    B.add(f, G.sph(0.125, 12, 10), skin);
    B.add(f, G.shell(0.129, 0.5, 12, 6), hair, 0, 0.004, 0.004, 0.37, 0, 0);
    addEyes(B, f, 0.045, 0.0, -0.112, 0.022);
    for (const s of [-1, 1]) {
      B.add(f, G.tor(0.036, 0.0065, TAU, 4, 14), glasses, s * 0.046, 0.0, -0.126);
      B.add(f, G.box(0.007, 0.007, 0.11), glasses, s * 0.083, 0.005, -0.075);
      B.add(f, G.box(0.04, 0.008, 0.01), hair, s * 0.046, 0.05, -0.116, 0, 0, s * -0.12);
      B.add(f, G.sph(0.026, 8, 6), cheek, s * 0.07, -0.032, -0.098, 0, 0, 0, 1, 0.7, 0.5);
    }
    B.add(f, G.box(0.022, 0.007, 0.007), glasses, 0, 0.008, -0.13);
    B.add(f, G.sph(0.022, 8, 6), skin, 0, -0.028, -0.128, 0, 0, 0, 0.9, 1.1, 1);
    B.add(f, G.tor(0.036, 0.009, Math.PI, 4, 10), mouth, 0, -0.052, -0.115, 0, 0, Math.PI);
    B.add(f, G.shell(0.142, 0.62, 14, 8), chunni, 0, 0.008, 0.004, 0.85, 0, 0);
    B.add(f, G.sph(0.07, 8, 6), chunni, 0, -0.01, 0.135);
    r.headTop = B.pivot(f, 0, 0.22, 0);
    r.stickPivot = stickPivot;
    r.bagPivot = bagPivot;

    return {
      rig: r, H: 1.55, stride: 0.48,
      style: { lean: -0.13, armOut: 0.1, foreL: 0.12, foreR: 0.4, bounce: 0.5, sway: 0.035, armSwing: 0.6, legSwing: 0.8, armRBias: 0.22, armRSwing: 0.35, danceBounce: 0.7, faintLift: 0.17 },
    };
  }

  // ------------------------------------------------------------------ build / swap model
  function buildModel(id) {
    const def = ctx.content?.characters?.[id];
    const C = Object.assign({
      turban: '#ff7a00', skin: '#a8714c', shirt: '#f2c230', shorts: '#6b5a3a', backpack: '#d6452b', shoes: '#ffffff', glow: '#5ef0ff',
      beard: '#2a2220', waistcoat: '#c2187a', kurta: '#f6efe2', trousers: '#2b2f4a', shades: '#111111', fannyPack: '#3fbf6f',
      chunni: '#f7f4ee', cardigan: '#7a4a8c', suit: '#e9c46a', glasses: '#c9a227', stick: '#6b4a2a', handbag: '#3a2a20', chappal: '#a0522d',
    }, def?.colors || {});
    const B = makeBuilder();
    const built = id === 'jasmeet' ? buildJasmeet(B, C) : id === 'bibi' ? buildBibi(B, C) : buildBabbu(B, C);
    consolidate(built.rig.root, B);
    built.id = id;
    built.root = built.rig.root;
    built.materials = B.materials;
    return built;
  }

  // ------------------------------------------------------------------ shared effects (built once)
  const fx = new THREE.Group();
  fx.name = 'player-fx';
  ctx.scene.add(fx);
  const dummy = new THREE.Object3D();
  const ZERO_MATRIX = new THREE.Matrix4().makeScale(0, 0, 0);

  // Dizzy stars that circle a fainted head.
  const stars = new THREE.Group();
  {
    const shape = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU + Math.PI / 2;
      const rr = i % 2 ? 0.032 : 0.08;
      if (i === 0) shape.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else shape.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.025, bevelEnabled: false });
    geo.center();
    const mat = new THREE.MeshBasicMaterial({ color: '#ffd447' });
    for (let i = 0; i < 5; i++) {
      const s = new THREE.Mesh(geo, mat);
      const a = (i / 5) * TAU;
      s.position.set(Math.cos(a) * 0.3, Math.sin(i * 2.1) * 0.05, Math.sin(a) * 0.3);
      stars.add(s);
    }
    stars.visible = false;
    fx.add(stars);
  }

  // Turban Tornado swirl: three part-rings in kesri / gold / pink and a ring of wind streaks.
  const swirl = new THREE.Group();
  const swirlMats = [];
  {
    const colors = ['#ff8a1c', '#f6c343', '#ff4f9a'];
    const rings = [[0.8, 0.35, 0.18], [1.08, 0.95, -0.22], [0.86, 1.6, 0.3]];
    rings.forEach(([rad, y, tilt], i) => {
      const mat = new THREE.MeshBasicMaterial({ color: colors[i], transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
      swirlMats.push(mat);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(rad, 0.05, 3, 28, TAU * 0.78), mat);
      ring.position.y = y;
      ring.rotation.set(Math.PI / 2 + tilt, 0, i * 2.1);
      swirl.add(ring);
    });
    const streaks = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      const g = new THREE.BoxGeometry(0.55, 0.035, 0.035);
      dummy.position.set(Math.cos(a) * 1.25, 0.25 + (i % 4) * 0.42, Math.sin(a) * 1.25);
      dummy.rotation.set(0, -a + Math.PI / 2, (i % 2 ? 0.25 : -0.2));
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      g.applyMatrix4(dummy.matrix);
      streaks.push(g);
    }
    const streakGeo = ctx.mergeGeometries(streaks, false);
    for (const g of streaks) g.dispose();
    const streakMat = new THREE.MeshBasicMaterial({ color: '#fff4e2', transparent: true, opacity: 0, depthWrite: false });
    swirlMats.push(streakMat);
    if (streakGeo) swirl.add(new THREE.Mesh(streakGeo, streakMat));
    swirl.visible = false;
    fx.add(swirl);
  }

  // The Chappal of Justice (projectile), Kolhapuri-style with a gold strap.
  const chappalObj = new THREE.Group();
  {
    const col = ctx.content?.characters?.bibi?.colors?.chappal || '#a0522d';
    const sole = new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: 0.7 });
    const strap = new THREE.MeshStandardMaterial({ color: '#e0b03a', flatShading: true, roughness: 0.4, metalness: 0.3 });
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.024, 12), sole);
    s.scale.set(1, 1, 2.05);
    const st = new THREE.Mesh(new THREE.TorusGeometry(0.046, 0.013, 5, 10, Math.PI), strap);
    st.position.set(0, 0.006, -0.02);
    const toe = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.006, 4, 8), strap);
    toe.position.set(0, 0.02, -0.085);
    toe.rotation.x = Math.PI / 2;
    for (const m of [s, st, toe]) { m.castShadow = true; chappalObj.add(m); }
    chappalObj.scale.setScalar(1.8);
    chappalObj.visible = false;
    fx.add(chappalObj);
  }
  const chappal = {
    active: false, phase: 'out', time: 0, targetId: null, hasTarget: false,
    pos: new V3(), vel: new V3(), tgt: new V3(), start: new V3(), dirX: 0, dirZ: -1,
  };

  // Jalebi Rush trail: one InstancedMesh of little syrupy spirals.
  const jalebiMesh = (() => {
    const pts = [];
    for (let i = 0; i <= 44; i++) {
      const k = i / 44;
      const a = k * 2.6 * TAU;
      const rr = 0.015 + 0.08 * k;
      pts.push(new V3(Math.cos(a) * rr, Math.sin(i * 0.9) * 0.005, Math.sin(a) * rr));
    }
    const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 56, 0.017, 5, false);
    const mat = new THREE.MeshStandardMaterial({ color: '#ff9a1f', emissive: '#d9640a', emissiveIntensity: 0.4, roughness: 0.32, flatShading: true });
    const mesh = new THREE.InstancedMesh(geo, mat, JALEBI_MAX);
    mesh.frustumCulled = false;
    mesh.visible = false;
    for (let i = 0; i < JALEBI_MAX; i++) mesh.setMatrixAt(i, ZERO_MATRIX);
    mesh.instanceMatrix.needsUpdate = true;
    fx.add(mesh);
    return mesh;
  })();
  const jal = {
    x: new Float32Array(JALEBI_MAX), y: new Float32Array(JALEBI_MAX), z: new Float32Array(JALEBI_MAX),
    vy: new Float32Array(JALEBI_MAX), floor: new Float32Array(JALEBI_MAX), age: new Float32Array(JALEBI_MAX),
    life: new Float32Array(JALEBI_MAX), rot: new Float32Array(JALEBI_MAX), spin: new Float32Array(JALEBI_MAX),
    tilt: new Float32Array(JALEBI_MAX), next: 0, acc: 0, alive: 0,
  };

  function spawnJalebi() {
    const i = jal.next;
    jal.next = (jal.next + 1) % JALEBI_MAX;
    const bx = Math.sin(heading), bz = Math.cos(heading);        // behind the runner
    const x = position.x + bx * 0.35 + (Math.random() - 0.5) * 0.45;
    const z = position.z + bz * 0.35 + (Math.random() - 0.5) * 0.45;
    jal.x[i] = x; jal.z[i] = z;
    jal.y[i] = position.y + 0.25 + Math.random() * 0.45;
    jal.floor[i] = Math.max(groundAt(x, z), waterLevel()) + 0.05;
    jal.vy[i] = 1 + Math.random() * 1.4;
    jal.age[i] = 0;
    jal.life[i] = 0.9 + Math.random() * 0.4;
    jal.rot[i] = Math.random() * TAU;
    jal.spin[i] = (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 5);
    jal.tilt[i] = (Math.random() - 0.5) * 1.2;
  }

  function updateJalebis(dt, emitting) {
    if (emitting) {
      jal.acc += dt;
      while (jal.acc > 0.045) { jal.acc -= 0.045; spawnJalebi(); }
    } else jal.acc = 0;
    let alive = 0, dirty = false;
    for (let i = 0; i < JALEBI_MAX; i++) {
      if (jal.life[i] <= 0) continue;
      jal.age[i] += dt;
      dirty = true;
      if (jal.age[i] >= jal.life[i]) {
        jal.life[i] = 0;
        jalebiMesh.setMatrixAt(i, ZERO_MATRIX);
        continue;
      }
      alive++;
      jal.vy[i] -= 7 * dt;
      jal.y[i] = Math.max(jal.floor[i], jal.y[i] + jal.vy[i] * dt);
      jal.rot[i] += jal.spin[i] * dt;
      const k = jal.age[i] / jal.life[i];
      const s = Math.min(1, k * 8) * (1 - k * k) * 1.35;
      dummy.position.set(jal.x[i], jal.y[i], jal.z[i]);
      dummy.rotation.set(jal.tilt[i], jal.rot[i], 0);
      dummy.scale.setScalar(Math.max(0.0001, s));
      dummy.updateMatrix();
      jalebiMesh.setMatrixAt(i, dummy.matrix);
    }
    if (dirty) jalebiMesh.instanceMatrix.needsUpdate = true;
    jal.alive = alive;
    jalebiMesh.visible = alive > 0;
  }

  function clearEffects() {
    for (let i = 0; i < JALEBI_MAX; i++) { jal.life[i] = 0; jalebiMesh.setMatrixAt(i, ZERO_MATRIX); }
    jalebiMesh.instanceMatrix.needsUpdate = true;
    jalebiMesh.visible = false;
    jal.acc = 0;
    chappal.active = false;
    chappalObj.visible = false;
    if (model?.rig.footChappal) model.rig.footChappal.visible = true;
    swirl.visible = false;
    stars.visible = false;
  }

  // ------------------------------------------------------------------ Chappal of Justice flight
  function handWorld(out) {
    if (model?.rig.handL) return model.rig.handL.getWorldPosition(out);
    return out.set(position.x, position.y + stats.height * 0.7, position.z);
  }

  function launchChappal() {
    const c = chappal;
    handWorld(c.pos);
    c.active = true;
    c.time = 0;
    const target = ctx.hazards?.nearest?.(position.x, position.z, 22);
    if (target && target.position) {
      c.phase = 'home';
      c.targetId = target.id;
      c.tgt.set(target.position.x, target.position.y + 0.6, target.position.z);
      c.vel.subVectors(c.tgt, c.pos);
      const len = c.vel.length();
      if (len > 1e-3) c.vel.multiplyScalar(16 / len);
      c.vel.y += 3;
    } else {
      c.phase = 'out';
      c.targetId = null;
      c.dirX = -Math.sin(heading);
      c.dirZ = -Math.cos(heading);
      c.start.copy(c.pos);
    }
    chappalObj.position.copy(c.pos);
    chappalObj.visible = true;
    if (model?.rig.footChappal) model.rig.footChappal.visible = false;
    sfx('whoosh', 0.9, 1.1);
  }

  function steerChappal(dt, goal, speed, lambda) {
    const c = chappal;
    _v1.subVectors(goal, c.pos);
    const dist = _v1.length();
    if (dist > 1e-4) _v1.multiplyScalar(speed / dist);
    c.vel.x = U.damp(c.vel.x, _v1.x, lambda, dt);
    c.vel.y = U.damp(c.vel.y, _v1.y, lambda, dt);
    c.vel.z = U.damp(c.vel.z, _v1.z, lambda, dt);
    c.pos.addScaledVector(c.vel, dt);
    return dist;
  }

  function catchChappal() {
    chappal.active = false;
    chappalObj.visible = false;
    if (model?.rig.footChappal) model.rig.footChappal.visible = true;
  }

  function updateChappal(dt) {
    const c = chappal;
    if (!c.active) return;
    c.time += dt;
    const p = c.pos;
    if (c.phase === 'home') {
      const n = ctx.hazards?.nearest?.(p.x, p.z, 30);
      if (n && n.id === c.targetId && n.position) c.tgt.set(n.position.x, n.position.y + 0.6, n.position.z);
      const dist = steerChappal(dt, c.tgt, 24, 7);
      if (dist < 0.9) {
        ctx.hazards?.stun?.(c.targetId, 6);
        sfx('chappal', 1, 1);
        ctx.hud?.float?.('THWACK!', p.clone(), { color: '#ffd447', size: 1.2 });
        c.phase = 'back';
        c.time = 0;
        c.vel.set(-c.vel.x * 0.3, 6, -c.vel.z * 0.3);
      } else if (c.time > 2.4) {
        c.phase = 'back';
        c.time = 0;
      }
    } else if (c.phase === 'out') {
      // 15 m out on a lazy boomerang curve, then home to Bibi's hand
      const u = Math.min(1, c.time / 0.75);
      const e = 1 - (1 - u) * (1 - u);
      const arc = Math.sin(u * Math.PI);
      p.set(
        c.start.x + c.dirX * 15 * e - c.dirZ * arc * 2.2,
        c.start.y + arc * 1.1,
        c.start.z + c.dirZ * 15 * e + c.dirX * arc * 2.2,
      );
      if (u >= 1) {
        c.phase = 'back';
        c.time = 0;
        c.vel.set(0, 0, 0);
        sfx('whoosh', 0.7, 0.9);
      }
    } else {
      handWorld(_v2);
      const dist = steerChappal(dt, _v2, Math.min(26, 10 + c.time * 14), 6);
      if (dist < 0.6 || c.time > 3.5) { catchChappal(); return; }
    }
    const floor = groundAt(p.x, p.z) + 0.3;
    if (p.y < floor) p.y = floor;
    chappalObj.position.copy(p);
    chappalObj.rotation.x += 20 * dt;
    chappalObj.rotation.y += 6 * dt;
  }

  // ------------------------------------------------------------------ abilities
  function abilityName() {
    return charDef()?.ability?.name || FALLBACK_ABILITY[character] || 'Special';
  }
  function abilityCooldown() {
    const c = charDef()?.ability?.cooldown;
    return Number.isFinite(c) ? c : (FALLBACK_COOLDOWN[character] ?? 10);
  }

  function tryAbility(t) {
    if (cooldown > 0 || fainted) return false;
    if (character === 'bibi' && (chappal.active || throwT >= 0)) return false;
    cooldown = abilityCooldown();
    if (character === 'jasmeet') {
      rushUntil = t + RUSH_TIME;
      sfx('powerup', 0.9, 1.3);
    } else if (character === 'babbu') {
      spinT = SPIN_TIME;
      spinElapsed = 0;
      ctx.hazards?.stunAround?.(position.x, position.z, 7, 5);
      if (typeof ctx.collectibles?.pullAround === 'function') ctx.collectibles.pullAround(position.x, position.z, 9);
      else ctx.state.magnetUntil = Math.max(ctx.state.magnetUntil || 0, t + SPIN_TIME);   // contract magnet as a stand-in pull
      sfx('spin', 1, 1);
    } else {
      throwT = 0;
      thrown = false;
    }
    say(U.randomLine(charDef()?.abilityLines), 2.2);
    ctx.events.emit('player:ability', { character, name: abilityName() });
    return true;
  }

  function updateAbilities(dt) {
    if (spinT > 0) {
      spinT = Math.max(0, spinT - dt);
      spinElapsed += dt;
      const env = Math.min(1, spinElapsed / 0.15, spinT / 0.2 + 0.3);
      spinAngle += 21 * env * dt;
    } else if (spinAngle !== 0) {
      // finish the last turn forwards so he ends up facing where he was going
      const goal = Math.ceil(spinAngle / TAU - 1e-6) * TAU;
      spinAngle = U.damp(spinAngle, goal, 9, dt);
      if (goal - spinAngle < 0.004) spinAngle = 0;
    }
    if (throwT >= 0) {
      throwT += dt;
      if (!thrown && throwT >= THROW_RELEASE) { thrown = true; launchChappal(); }
      if (throwT >= THROW_TIME) throwT = -1;
    }
  }

  // ------------------------------------------------------------------ speech
  function headTopWorld() {
    if (model?.rig.headTop) model.rig.headTop.getWorldPosition(_bubble);
    else _bubble.set(position.x, position.y + stats.height + 0.3, position.z);
    _bubble.y += 0.12;
    return _bubble;
  }

  function say(text, seconds = 3) {
    if (!text) return;
    ctx.hud?.bubble?.(text, headTopWorld, seconds);
  }

  // ------------------------------------------------------------------ hits, fainting, respawn
  function knockback(src, hSpeed, up) {
    let dx = Math.sin(heading), dz = Math.cos(heading);    // default: straight backwards
    if (src && Number.isFinite(src.x) && Number.isFinite(src.z)) {
      const ax = position.x - src.x, az = position.z - src.z;
      const len = Math.hypot(ax, az);
      if (len > 1e-3) { dx = ax / len; dz = az / len; }
    }
    velocity.x = dx * hSpeed;
    velocity.z = dz * hSpeed;
    velocity.y = up;
    grounded = false;
    floating = false;
    coyote = 0;
    knockTimer = 0.35;
  }

  function hit({ type = 'hazard', position: src = null, steal = 0 } = {}) {
    const st = ctx.state;
    const t = ctx.time;
    if (st.mode !== 'playing' || fainted || t < invulnUntil) return { applied: false, lost: 0, scattered: 0 };
    if (st.turbans > 0) {
      const lost = Math.min(st.turbans, Math.max(1, Math.ceil(st.turbans * 0.5)));
      st.turbans -= lost;
      st.hits = (st.hits || 0) + 1;
      const scattered = Math.max(0, Math.min(30, lost - Math.max(0, steal || 0)));
      if (scattered > 0) ctx.collectibles?.spawnLoose?.(new V3(position.x, position.y + 0.9, position.z), scattered);
      knockback(src, 8.5, 6.5);
      invulnUntil = t + HIT_INVULN;
      ctx.events.emit('player:hit', { source: type, lost, position: position.clone() });
      say(U.randomLine(charDef()?.hitLines), 2.2);
      return { applied: true, lost, scattered };
    }
    faint(type, src);
    return { applied: true, lost: 0, scattered: 0 };
  }

  function faint(type, src) {
    fainted = true;
    faintTimer = FAINT_TIME;
    ctx.state.faints = (ctx.state.faints || 0) + 1;
    knockback(src, 3.2, 4);
    knockTimer = FAINT_TIME;
    rushUntil = 0;
    spinT = 0;
    if (!thrown) throwT = -1;
    ctx.events.emit('player:faint', { source: type });
    const name = charDef()?.short || 'You';
    ctx.hud?.toast?.(U.fmt(U.randomLine(ctx.content?.faint), { name }), { tone: 'warn' });
  }

  function respawn() {
    fainted = false;
    knockTimer = 0;
    teleport(checkpoint.x, checkpoint.z);
    invulnUntil = ctx.time + RESPAWN_INVULN;
    camResetT = 0.8;
    ctx.events.emit('player:respawn', { x: checkpoint.x, z: checkpoint.z });
  }

  // ------------------------------------------------------------------ physics
  function landed(fallSpeed) {
    anim.squashV += Math.min(fallSpeed, 22) * 0.07;
    if (ctx.state.mode !== 'playing') return;
    sfx('land', U.clamp(fallSpeed / 16, 0.3, 1), character === 'babbu' ? 0.85 : 1);
    ctx.events.emit('player:land', { fallSpeed });
  }

  function simulate(dt, t, tvx, tvz) {
    const wl = waterLevel();
    const steering = tvx !== 0 || tvz !== 0;
    const lambda = (grounded || floating) ? (steering ? 10 : 13) : (steering ? 3 : 0.7);
    velocity.x = U.damp(velocity.x, tvx, lambda, dt);
    velocity.z = U.damp(velocity.z, tvz, lambda, dt);
    if (knockTimer > 0) knockTimer = Math.max(0, knockTimer - dt);

    // vertical: buoyancy spring while swimming, otherwise gravity
    const floatY = wl - stats.height * 0.72;
    if (swimming && position.y < floatY + 0.08 && (velocity.y < 1 || position.y < floatY - 0.05)) {
      floating = true;
      velocity.y += ((floatY + 0.03 * Math.sin(t * 2.4) - position.y) * 38 - velocity.y * 8) * dt;
    } else {
      floating = false;
      velocity.y = Math.max(-40, velocity.y + GRAVITY * dt);
    }

    position.x += velocity.x * dt;
    position.y += velocity.y * dt;
    position.z += velocity.z * dt;
    ctx.world?.collide?.(position, stats.radius);

    const g = groundAt(position.x, position.z);
    const depth = Math.max(0, wl - g);
    swimming = depth > SWIM_DEPTH;
    if (position.y <= g) {
      if (!grounded && airTime > 0.12 && velocity.y < -3) landed(-velocity.y);
      position.y = g;
      if (velocity.y < 0) velocity.y = 0;
      grounded = true;
      floating = false;
    } else if (grounded && !floating && velocity.y <= 0 && position.y - g < 0.45) {
      position.y = g;                    // stick to the ground walking downhill
      velocity.y = 0;
    } else {
      grounded = false;
    }
    airTime = (grounded || floating) ? 0 : airTime + dt;

    const wet = depth > 0.3 && position.y < wl + 0.05;
    if (wet && !inWater && t - lastSplash > 0.5 && ctx.state.mode === 'playing') {
      lastSplash = t;
      sfx('splash', 0.9, 1);
      ctx.events.emit('player:splash', { position: new V3(position.x, wl, position.z) });
    }
    inWater = wet;
  }

  // ------------------------------------------------------------------ controller (playing)
  function applyLook(inp) {
    const lx = inp.look?.dx || 0, ly = inp.look?.dy || 0;
    if (lx || ly) {
      cameraYaw = U.angleWrap(cameraYaw - lx * LOOK_SENS);
      camPitch = U.clamp(camPitch + ly * LOOK_SENS, PITCH_MIN, PITCH_MAX);
      camResetT = 0;
      camTransition = 0;
      lastLookAt = ctx.time;
    }
    if (inp.wheel) camDistTarget = U.clamp(camDistTarget + inp.wheel * 0.55 * Math.max(0.6, camDistTarget / 6), ZOOM_MIN, ZOOM_MAX);
    if (inp.pressed?.('KeyC')) camResetT = 0.6;
  }

  function stepPlaying(dt, t, slow) {
    const inp = ctx.input || {};
    const st = ctx.state;
    if (cooldown > 0) cooldown = Math.max(0, cooldown - dt);
    updateAbilities(dt);
    if (fainted) {
      faintTimer -= dt;
      simulate(dt, t, 0, 0);
      if (faintTimer <= 0) respawn();
      return;
    }

    applyLook(inp);
    if (camResetT > 0) {
      camResetT = Math.max(0, camResetT - dt);
      cameraYaw = U.angleDamp(cameraYaw, heading, camTransition > 0 ? 3.5 : 9, dt);
      camPitch = U.damp(camPitch, PITCH_DEFAULT, 6, dt);
    }

    const mx = inp.move?.x || 0, my = inp.move?.y || 0;
    const mag = Math.min(1, Math.hypot(mx, my));
    const active = mag > 0.01 || inp.jump || inp.ability || inp.sprint || inp.wheel || inp.look?.dx || inp.look?.dy;
    idleTimer = active ? 0 : idleTimer + dt;
    if (idleTimer >= IDLE_LINE_AFTER && t - lastIdleLine >= IDLE_LINE_GAP) {
      lastIdleLine = t;
      say(U.randomLine(charDef()?.idleLines), 3.5);
    }
    if (inp.ability) tryAbility(t);

    // desired velocity, relative to where the camera looks
    const fwdX = -Math.sin(cameraYaw), fwdZ = -Math.cos(cameraYaw);
    const rgtX = Math.cos(cameraYaw), rgtZ = -Math.sin(cameraYaw);
    let dx = rgtX * mx + fwdX * my, dz = rgtZ * mx + fwdZ * my;
    const dl = Math.hypot(dx, dz);
    if (dl > 1e-4) { dx /= dl; dz /= dl; }
    let speed = inp.sprint ? stats.sprint : stats.speed;
    if (t < (st.boostUntil || 0)) speed *= 1.35;
    if (t < (st.chaiUntil || 0)) speed *= 1.15;
    if (t < rushUntil) speed *= 1.6;
    const depth = Math.max(0, waterLevel() - groundAt(position.x, position.z));
    if (swimming) speed *= 0.5;
    else if (depth > WADE_DEPTH) speed *= 0.6;
    speed *= U.clamp(slow, 0, 1) * (1 - 0.55 * sink);
    const control = knockTimer > 0 ? 0 : 1;
    const tvx = dx * speed * mag * control, tvz = dz * speed * mag * control;

    // jump: buffered press + coyote time (also kicks off from the water)
    jumpBuffer = inp.jump ? JUMP_BUFFER : Math.max(0, jumpBuffer - dt);
    coyote = (grounded || floating) ? COYOTE_TIME : Math.max(0, coyote - dt);
    if (jumpBuffer > 0 && coyote > 0 && knockTimer <= 0) {
      let jv = stats.jump * (t < rushUntil ? 1.3 : 1);
      if (floating) jv *= 0.75;
      velocity.y = jv;
      grounded = false;
      floating = false;
      coyote = 0;
      jumpBuffer = 0;
      airTime = 0.001;
      anim.squashV -= 1.4;
      sfx('jump', 0.8, character === 'jasmeet' ? 1.25 : character === 'babbu' ? 0.85 : 1);
      ctx.events.emit('player:jump', {});
    }

    const px = position.x, pz = position.z;
    simulate(dt, t, tvx, tvz);
    const moved = Math.hypot(position.x - px, position.z - pz);
    if (moved < 3) st.distance = (st.distance || 0) + moved;

    // turn the model toward the motion
    if (control) {
      const hs = Math.hypot(velocity.x, velocity.z);
      if (mag > 0.05 && dl > 1e-4) heading = U.angleDamp(heading, Math.atan2(-dx, -dz), t < rushUntil ? 16 : 12, dt);
      else if (hs > 0.6) heading = U.angleDamp(heading, Math.atan2(-velocity.x, -velocity.z), 8, dt);
      // Auto-follow: while you're on the move, the camera swings round behind you, a beat
      // behind your turns. Moving the mouse takes over for a moment; walking straight back
      // toward the camera (S) doesn't spin it round.
      const behind = Math.abs(U.angleWrap(heading - cameraYaw));
      if (mag > 0.05 && hs > 1 && t - lastLookAt > 0.9 && behind < 2.4) {
        const pace = U.clamp(hs / Math.max(1, stats.speed), 0.4, 1.4);
        cameraYaw = U.angleDamp(cameraYaw, heading, 2.4 * pace, dt);
      }
    }
  }

  // title / victory: stand (or dance) in place, turned toward the orbiting camera
  function stepShowcase(dt, t, mode) {
    updateAbilities(dt);
    simulate(dt, t, 0, 0);
    const face = cameraYaw + Math.PI + (mode === 'title' ? 0.55 : 0);
    heading = U.angleDamp(heading, face, mode === 'title' ? 1.6 : 3, dt);
  }

  function updateTurbanSize(dt) {
    if (!model?.turban) return;
    const goal = 1 + Math.min(1.4, Math.max(0, ctx.state.turbans || 0) / 120);
    if (goal > turbanGoal + 1e-6) turbanVel += 0.9;      // pop!
    else if (goal < turbanGoal - 1e-6) turbanVel -= 0.6; // deflate wobble
    turbanGoal = goal;
    turbanVel += ((turbanGoal - turbanScale) * 160 - turbanVel * 13) * dt;
    turbanScale = Math.max(0.7, turbanScale + turbanVel * dt);
    model.turban.scale.setScalar(turbanScale);
  }

  // ------------------------------------------------------------------ procedural animation
  const P = new Float32Array(POSE_N);     // working pose
  const Q = new Float32Array(POSE_N);     // pose being blended in
  const anim = {
    phase: 0, step: 0, move: 0, run: 0, air: 0, swim: 0, dance: 0, armsUp: 0, faint: 0, spin: 0,
    squash: 0, squashV: 0, glow: 0, flash: 0, tap: -1, tapTimer: 2.5,
  };

  function poseIdle(p, t) {
    const st = model.style;
    p.fill(0);
    const br = Math.sin(t * 2.1);
    p[TORSO_X] = st.lean + br * 0.012;
    p[ARM_LZ] = -st.armOut - br * 0.015;
    p[ARM_RZ] = st.armOut + br * 0.015;
    p[ARM_L] = 0.04 * Math.sin(t * 1.3);
    p[ARM_R] = st.armRBias + 0.04 * Math.sin(t * 1.3 + 1);
    p[FORE_L] = st.foreL;
    p[FORE_R] = st.foreR;
    p[LEG_LZ] = -0.03;
    p[LEG_RZ] = 0.03;
    // look around: long slow glances with a little fidget on top
    const glance = U.smoothstep(0.35, 0.85, Math.abs(Math.sin(t * 0.13)));
    p[HEAD_Y] = 0.5 * Math.sin(t * 0.31) * glance + 0.06 * Math.sin(t * 1.7);
    p[HEAD_X] = 0.06 * Math.sin(t * 0.5) - st.lean * 0.6;
    p[BOB] = br * 0.004;
    if (model.id === 'jasmeet') {
      // can't keep still: bouncing on his toes, swinging his arms
      p[BOB] += 0.012 * Math.max(0, Math.sin(t * 4.2));
      p[ARM_L] += 0.22 * Math.sin(t * 2.1);
      p[ARM_R] -= 0.22 * Math.sin(t * 2.1);
      p[TORSO_Y] = 0.1 * Math.sin(t * 1.05);
    } else if (model.id === 'babbu') {
      // every so often he adjusts the aviators, very coolly
      const k = (t % 9) / 1.3;
      if (k < 1) {
        const w = Math.sin(k * Math.PI);
        p[ARM_R] += (2.15 - p[ARM_R]) * w;
        p[ARM_RZ] += (0.05 - p[ARM_RZ]) * w;
        p[FORE_R] += (1.75 - p[FORE_R]) * w;
        p[HEAD_X] -= 0.12 * w;
      }
      p[TORSO_X] += 0.02 * Math.sin(t * 0.7);
    }
  }

  function poseWalk(p) {
    const st = model.style;
    p.fill(0);
    const ph = anim.phase, s = Math.sin(ph), c = Math.cos(ph), run = anim.run;
    const legAmp = (0.42 + 0.38 * run) * st.legSwing;
    p[LEG_L] = s * legAmp;
    p[LEG_R] = -s * legAmp;
    const knee = 0.25 + 0.95 * run;
    p[SHIN_L] = -0.08 - knee * Math.max(0, c);
    p[SHIN_R] = -0.08 - knee * Math.max(0, -c);
    p[LEG_LZ] = -0.03;
    p[LEG_RZ] = 0.03;
    const armAmp = (0.4 + 0.55 * run) * st.armSwing;
    p[ARM_L] = -s * armAmp;
    p[ARM_R] = st.armRBias + s * armAmp * st.armRSwing;
    p[ARM_LZ] = -st.armOut - 0.05;
    p[ARM_RZ] = st.armOut + 0.05;
    p[FORE_L] = st.foreL + 0.2 + 0.9 * run;
    p[FORE_R] = st.foreR + (0.2 + 0.9 * run) * st.armRSwing;
    p[TORSO_X] = st.lean - 0.05 - 0.2 * run;
    p[TORSO_Y] = s * 0.1 * (1 + run);
    p[TORSO_Z] = s * st.sway;
    p[HEAD_X] = 0.1 * run - st.lean * 0.5;
    p[HEAD_Y] = -p[TORSO_Y] * 0.7;
    p[BOB] = (0.5 - 0.5 * Math.cos(2 * ph)) * (0.012 + 0.03 * run) * st.bounce;
  }

  function poseAir(p, t) {
    const st = model.style;
    p.fill(0);
    const up = U.clamp(velocity.y / Math.max(1, stats.jump), -1, 1);
    const rise = Math.max(0, up), fall = Math.max(0, -up);
    const tuck = model.id === 'jasmeet' ? 1.3 : 1;
    p[LEG_L] = (0.55 * rise + 0.25 * fall) * tuck;
    p[SHIN_L] = (-0.9 * rise - 0.3 * fall) * tuck;
    p[LEG_R] = -0.15 * rise - 0.1 * fall;
    p[SHIN_R] = -0.4 * rise - 0.15 * fall;
    p[LEG_LZ] = -0.05;
    p[LEG_RZ] = 0.05 + 0.15 * fall;
    p[ARM_L] = 0.5 * rise + 0.2 * fall;
    p[ARM_R] = -0.2 * rise + 0.2 * fall + st.armRBias;
    p[ARM_LZ] = -(0.45 + 1.4 * fall) - 0.15 * Math.sin(t * 18) * fall;
    p[ARM_RZ] = (0.45 + 1.4 * fall) + 0.15 * Math.sin(t * 18 + 1) * fall;
    p[FORE_L] = 0.5;
    p[FORE_R] = 0.5;
    p[TORSO_X] = st.lean - 0.12 * rise + 0.06 * fall;
    p[HEAD_X] = -0.1 * fall;
  }

  function poseSwim(p, t) {
    p.fill(0);
    const sw = t * 5.5;
    p[BODY_X] = -0.75;
    p[HEAD_X] = 0.65;
    p[ARM_L] = 1.7 + 0.8 * Math.sin(sw);
    p[ARM_R] = 1.7 + 0.8 * Math.sin(sw + Math.PI);
    p[ARM_LZ] = -0.35;
    p[ARM_RZ] = 0.35;
    p[FORE_L] = 0.5 + 0.4 * Math.max(0, Math.cos(sw));
    p[FORE_R] = 0.5 + 0.4 * Math.max(0, -Math.cos(sw));
    p[LEG_L] = 0.35 * Math.sin(t * 8);
    p[LEG_R] = -0.35 * Math.sin(t * 8);
    p[SHIN_L] = -0.3;
    p[SHIN_R] = -0.3;
    p[BOB] = 0.2 + 0.015 * Math.sin(t * 3);
  }

  // Bhangra: arms up, shoulders bouncing (moddhe), hopping on alternate legs.
  function poseDance(p, t) {
    const st = model.style;
    p.fill(0);
    const b = t * BEAT_HZ * TAU;
    const hop = Math.max(0, Math.sin(b));
    const liftL = Math.max(0, Math.sin(b * 0.5)), liftR = Math.max(0, -Math.sin(b * 0.5));
    p[LEG_L] = liftL;
    p[SHIN_L] = -1.5 * liftL - 0.1;
    p[LEG_R] = liftR;
    p[SHIN_R] = -1.5 * liftR - 0.1;
    p[LEG_LZ] = -0.08;
    p[LEG_RZ] = 0.08;
    p[ARM_L] = 0.15;
    p[ARM_R] = 0.15;
    p[ARM_LZ] = -2.65 - 0.18 * Math.sin(b);
    p[ARM_RZ] = 2.65 + 0.18 * Math.sin(b + 0.6);
    p[FORE_L] = 0.35 + 0.25 * hop;
    p[FORE_R] = 0.35 + 0.25 * hop;
    p[SHOULDER] = 0.022 * Math.max(0, Math.sin(b * 2));
    p[TORSO_X] = 0.06 + st.lean * 0.5;
    p[TORSO_Y] = 0.22 * Math.sin(b * 0.5);
    p[TORSO_Z] = 0.06 * Math.sin(b);
    p[HEAD_X] = -0.05;
    p[HEAD_Y] = 0.18 * Math.sin(b * 0.5);
    p[HEAD_Z] = -0.08 * Math.sin(b);
    p[BOB] = 0.035 * hop * st.danceBounce;
  }

  function poseSpin(p) {
    p[ARM_L] = 0; p[ARM_R] = 0; p[ARM_LY] = 0; p[ARM_RY] = 0;
    p[ARM_LZ] = -1.45; p[ARM_RZ] = 1.45;
    p[FORE_L] = 0.1; p[FORE_R] = 0.1;
    p[SHOULDER] = 0;
  }

  // Over-the-head chappal throw with the handbag arm: wind up behind the head, then fling.
  function poseThrow(p, tt) {
    p[ARM_LY] = 0;
    if (tt < THROW_RELEASE) {
      const k = easeInOut(tt / THROW_RELEASE);
      p[ARM_L] = 0.3 + (3.5 - 0.3) * k;
      p[FORE_L] = 0.2 + 1.2 * k;
      p[ARM_LZ] = -0.25;
      p[TORSO_Y] = -0.35 * k;
    } else {
      const k = Math.min(1, (tt - THROW_RELEASE) / 0.12);
      p[ARM_L] = 3.5 + (1.25 - 3.5) * k;
      p[FORE_L] = 1.4 - 1.3 * k;
      p[ARM_LZ] = -0.2;
      p[TORSO_Y] = -0.35 + 0.65 * k;
    }
  }

  function poseFaint(p, t) {
    p.fill(0);
    p[BODY_X] = 1.42 + 0.03 * Math.sin(t * 2);
    p[ARM_L] = 0.2;
    p[ARM_R] = 0.2;
    p[ARM_LZ] = -1.25;
    p[ARM_RZ] = 1.25;
    p[FORE_L] = 0.3;
    p[FORE_R] = 0.3;
    p[LEG_L] = 0.25;
    p[LEG_R] = 0.05;
    p[SHIN_L] = -0.3;
    p[LEG_LZ] = -0.12;
    p[LEG_RZ] = 0.12;
    p[HEAD_X] = -0.2;
    p[HEAD_Y] = 0.35 * Math.sin(t * 3);
    p[BOB] = model.style.faintLift / model.H;   // lie on top of the backpack / kurta, not in the mud
  }

  function animate(dt, t, mode) {
    const m = model, r = m.rig, H = m.H;
    const hs = Math.hypot(velocity.x, velocity.z);
    const walkRef = Math.max(1, stats.speed);
    const moveT = fainted ? 0 : U.clamp(hs / (walkRef * 0.45), 0, 1);
    const runT = U.clamp((hs - walkRef) / Math.max(0.5, stats.sprint - walkRef), 0, 1);
    const boosted = mode === 'playing' && t < (ctx.state.boostUntil || 0);
    anim.move = U.damp(anim.move, moveT, 10, dt);
    anim.run = U.damp(anim.run, runT, 6, dt);
    anim.air = U.damp(anim.air, (!grounded && !floating && airTime > 0.08 && !fainted) ? 1 : 0, 12, dt);
    anim.swim = U.damp(anim.swim, floating && !fainted ? 1 : 0, 5, dt);
    anim.dance = U.damp(anim.dance, !fainted && (mode === 'victory' || (boosted && moveT < 0.3 && grounded)) ? 1 : 0, 6, dt);
    anim.armsUp = U.damp(anim.armsUp, boosted && moveT >= 0.3 && !floating && !fainted ? 1 : 0, 8, dt);
    anim.faint = U.damp(anim.faint, fainted ? 1 : 0, fainted ? 6 : 4, dt);
    anim.spin = U.damp(anim.spin, spinT > 0 ? 1 : 0, 16, dt);
    anim.phase += (hs / m.stride) * Math.PI * dt;

    // footsteps: one per half cycle while grounded and actually walking
    const step = Math.floor(anim.phase / Math.PI);
    if (step !== anim.step) {
      anim.step = step;
      if (grounded && hs > 1.2 && mode === 'playing') {
        anim.flash = 1;
        sfx('step', 0.16 + 0.22 * anim.run, (character === 'jasmeet' ? 1.25 : character === 'babbu' ? 0.85 : 1) * (0.94 + Math.random() * 0.12));
      }
    }

    // blend the layers
    poseIdle(P, t);
    if (anim.move > 0.001) { poseWalk(Q); lerpPose(P, Q, anim.move); }
    if (anim.swim > 0.001) { poseSwim(Q, t); lerpPose(P, Q, anim.swim); }
    if (anim.air > 0.001) { poseAir(Q, t); lerpPose(P, Q, anim.air * (1 - anim.swim)); }
    if (anim.dance > 0.001 || anim.armsUp > 0.001) {
      poseDance(Q, t);
      lerpPose(P, Q, anim.dance);
      lerpChannels(P, Q, anim.armsUp, ARM_CHANNELS);
    }
    if (anim.spin > 0.001) { poseSpin(Q); lerpChannels(P, Q, anim.spin, ARM_CHANNELS); }
    if (throwT >= 0) {
      poseThrow(Q, throwT);
      lerpChannels(P, Q, Math.min(1, throwT / 0.06, (THROW_TIME - throwT) / 0.12), THROW_CHANNELS);
    }

    // Bibi taps her stick now and then while standing about
    let tapLift = 0;
    if (m.id === 'bibi') {
      if (anim.tap < 0 && anim.move < 0.15 && grounded && anim.dance < 0.1 && throwT < 0 && !fainted) {
        anim.tapTimer -= dt;
        if (anim.tapTimer <= 0) { anim.tap = 0; anim.tapTimer = 2.4 + Math.random() * 2.2; }
      }
      if (anim.tap >= 0) {
        anim.tap += dt / 0.32;
        if (anim.tap >= 1) {
          anim.tap = -1;
          if (mode === 'playing') sfx('step', 0.12, 1.9);
        } else tapLift = Math.sin(anim.tap * Math.PI);
      }
      P[FORE_R] += 0.28 * tapLift;
    }

    if (anim.faint > 0.001) { poseFaint(Q, t); lerpPose(P, Q, anim.faint); }

    // apply to the rig
    r.legL.rotation.set(P[LEG_L], 0, P[LEG_LZ]);
    r.legR.rotation.set(P[LEG_R], 0, P[LEG_RZ]);
    r.shinL.rotation.x = P[SHIN_L];
    r.shinR.rotation.x = P[SHIN_R];
    const flat = 0.6 * (1 - anim.air * 0.5);
    r.footL.rotation.x = -(P[LEG_L] + P[SHIN_L]) * flat;
    r.footR.rotation.x = -(P[LEG_R] + P[SHIN_R]) * flat;
    r.armL.rotation.set(P[ARM_L], P[ARM_LY], P[ARM_LZ]);
    r.armR.rotation.set(P[ARM_R], P[ARM_RY], P[ARM_RZ]);
    r.armL.position.y = r.shoulderY + P[SHOULDER] * H;
    r.armR.position.y = r.shoulderY + P[SHOULDER] * H;
    r.foreL.rotation.x = P[FORE_L];
    r.foreR.rotation.x = P[FORE_R];
    r.torso.rotation.set(P[TORSO_X], P[TORSO_Y], P[TORSO_Z]);
    r.head.rotation.set(P[HEAD_X], P[HEAD_Y], P[HEAD_Z]);

    // landing squash / jump stretch (spring), sink into quicksand, faint topple, tornado spin
    anim.squashV += (-anim.squash * 170 - anim.squashV * 14) * dt;
    anim.squash = U.clamp(anim.squash + anim.squashV * dt, -0.25, 0.35);
    const sq = anim.squash;
    r.body.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
    r.body.position.y = P[BOB] * H - sink * H * 0.5;
    r.body.rotation.x = P[BODY_X];
    r.body.rotation.y = spinAngle;

    // props: Bibi's stick stays upright and plants as she walks; the handbag hangs
    if (r.stickPivot) {
      const keep = U.clamp(1 - anim.dance - anim.faint - anim.spin, 0, 1);
      const plant = anim.move * 0.18 * Math.sin(anim.phase) + 0.2 * tapLift;
      r.stickPivot.rotation.x = (-(P[TORSO_X] + P[ARM_R] + P[FORE_R]) + plant) * keep;
    }
    if (r.bagPivot) {
      const keep = U.clamp(1 - anim.dance * 0.7 - anim.faint, 0, 1);
      r.bagPivot.rotation.x = -(P[TORSO_X] + P[ARM_L] + P[FORE_L]) * 0.9 * keep + 0.08 * Math.sin(anim.phase);
    }

    // Jasmeet's trainers light up when he runs (and flash on every step)
    if (m.glow) {
      const running = (grounded && hs > stats.speed * 0.8) || (mode === 'playing' && t < rushUntil);
      anim.glow = U.damp(anim.glow, running ? 1 : 0, 8, dt);
      anim.flash = Math.max(0, anim.flash - dt * 6);
      m.glow.emissiveIntensity = 0.1 + anim.glow * (1.5 + 0.9 * anim.flash);
    }
  }

  function updateSwirl(dt) {
    const on = spinT > 0;
    if (!on && !swirl.visible) return;
    swirl.visible = on;
    if (!on) return;
    const op = Math.min(1, spinElapsed / 0.12, spinT / 0.25);
    swirl.position.copy(position);
    swirl.rotation.y += 13 * dt;
    const pulse = 1 + 0.08 * Math.sin(spinElapsed * 30);
    swirl.scale.set(pulse, 1, pulse);
    for (let i = 0; i < swirlMats.length; i++) swirlMats[i].opacity = op * (i === swirlMats.length - 1 ? 0.5 : 0.62);
  }

  function updateStars(dt) {
    stars.visible = fainted && anim.faint > 0.5 && !!model;
    if (!stars.visible) return;
    model.rig.face.getWorldPosition(_v1);
    stars.position.set(_v1.x, _v1.y + 0.3, _v1.z);
    stars.rotation.y += 4 * dt;
    const kids = stars.children;
    for (let i = 0; i < kids.length; i++) kids[i].rotation.y += 7 * dt;
  }

  // ------------------------------------------------------------------ third-person camera
  function eyeHeight() {
    return stats.height * 0.8 + (turbanScale - 1) * 0.25;
  }

  function updateCamera(dt, mode) {
    const cam = ctx.camera;
    if (!cam) return;
    const H = stats.height;
    if (camTransition > 0) camTransition = Math.max(0, camTransition - dt);
    const easing = camTransition > 0;
    let distGoal;
    let offsetGoal = 0;
    let offsetYGoal = 0;
    if (mode === 'title' || mode === 'victory') {
      // slow showcase orbit; on the title screen the hero sits in the left third (UI is right)
      const title = mode === 'title';
      cameraYaw = U.angleWrap(cameraYaw + (title ? 0.08 : 0.22) * dt);
      distGoal = title ? 4.1 + H * 0.85 : 4.6 + H;
      camPitch = U.damp(camPitch, title ? 0.06 : 0.22, 2.5, dt);
      if (title) {
        const aspect = cam.aspect || 1.6;
        const tanHalfH = Math.tan((cam.fov * Math.PI) / 360) * aspect;
        offsetGoal = 0.36 * distGoal * tanHalfH * U.smoothstep(0.85, 1.25, aspect);
        const portrait = U.smoothstep(1, 0.7, aspect);
        distGoal *= 1 + 0.3 * portrait;
        offsetYGoal = portrait * 0.48 * distGoal * Math.tan((cam.fov * Math.PI) / 360);
      }
      _goal.set(position.x, position.y + H * (title ? 0.6 : 0.55), position.z);
    } else {
      distGoal = camDistTarget;
      if (easing) camPitch = U.damp(camPitch, PITCH_DEFAULT, 3, dt);
      // slight look-ahead in the direction of travel
      _goal.set(position.x + velocity.x * 0.12, position.y + eyeHeight(), position.z + velocity.z * 0.12);
    }

    camDist = U.damp(camDist, distGoal, easing ? 2.5 : 8, dt);
    frameOffset = U.damp(frameOffset, offsetGoal, 2.5, dt);
    frameOffsetY = U.damp(frameOffsetY, offsetYGoal, 2.5, dt);
    const followXZ = easing ? 4 : 12;
    _follow.x = U.damp(_follow.x, _goal.x, followXZ, dt);
    _follow.z = U.damp(_follow.z, _goal.z, followXZ, dt);
    _follow.y = U.damp(_follow.y, _goal.y, easing ? 3 : 7, dt);

    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    _cam.set(
      _follow.x + Math.sin(cameraYaw) * camDist * cp,
      _follow.y + sp * camDist,
      _follow.z + Math.cos(cameraYaw) * camDist * cp,
    );

    // pull the boom in when a tall world collider (trunk, bamboo clump, ruin pillar, Ark wall) sits
    // between the player and the lens; vegetation meshes are merged per chunk, so they can't be faded.
    // Snap in, ease back out. Low colliders (logs, rocks, drums) are looked over.
    let boomGoal = 1;
    const ex = _cam.x - _follow.x, ey = _cam.y - _follow.y, ez = _cam.z - _follow.z;
    const L2 = ex * ex + ez * ez;
    if (mode === 'playing' && L2 > 1e-4 && typeof ctx.world?.queryColliders === 'function') {
      const L = Math.sqrt(L2);
      const cols = ctx.world.queryColliders(_follow.x + ex * 0.5, _follow.z + ez * 0.5, L * 0.5 + 0.5) || [];
      for (let i = 0; i < cols.length; i++) {
        const c = cols[i];
        if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.z)) continue;
        const R = (Number.isFinite(c.r) ? c.r : 0.5) + 0.35;
        const fx = _follow.x - c.x, fz = _follow.z - c.z;
        const cc = fx * fx + fz * fz - R * R;
        if (cc <= 0) continue; // player already hugging / inside it: nothing sensible to do
        const b = fx * ex + fz * ez, disc = b * b - L2 * cc;
        if (disc < 0) continue;
        const t = (-b - Math.sqrt(disc)) / L2;
        if (!(t > 0 && t < boomGoal)) continue;
        if (Number.isFinite(c.h) && _follow.y + ey * t > groundAt(c.x, c.z) + c.h) continue; // boom passes over it
        boomGoal = t;
      }
      boomGoal = Math.max(boomGoal, Math.min(1, 1.4 / Math.max(1e-3, Math.hypot(L, ey))));
    }
    camBoom = boomGoal < camBoom ? boomGoal : U.damp(camBoom, boomGoal, 3, dt);
    if (camBoom < 0.999) _cam.set(_follow.x + ex * camBoom, _follow.y + ey * camBoom, _follow.z + ez * camBoom);

    // keep the whole boom above the terrain (and the lens out of the river)
    const wl = waterLevel();
    let lift = 0;
    for (let i = 1; i <= 4; i++) {
      const s = i / 4;
      const sx = _follow.x + (_cam.x - _follow.x) * s;
      const sy = _follow.y + (_cam.y - _follow.y) * s;
      const sz = _follow.z + (_cam.z - _follow.z) * s;
      let need = groundAt(sx, sz) + 0.6;
      if (i === 4) need = Math.max(need, wl + 0.35);
      const l = (need - sy) / s;
      if (l > lift) lift = l;
    }
    camLift = lift > camLift ? lift : U.damp(camLift, lift, 2.5, dt);
    _cam.y += camLift;
    const floor = groundAt(_cam.x, _cam.z) + 0.6;
    if (_cam.y < floor) _cam.y = floor;

    cam.position.copy(_cam);
    _look.set(_follow.x + Math.cos(cameraYaw) * frameOffset, _follow.y - frameOffsetY, _follow.z - Math.sin(cameraYaw) * frameOffset);
    cam.lookAt(_look);
  }

  // ------------------------------------------------------------------ lifecycle + public API
  function setCharacter(id) {
    const chars = ctx.content?.characters;
    let valid = id;
    if (chars) { if (!chars[valid]) valid = chars.babbu ? 'babbu' : Object.keys(chars)[0]; }
    else if (!FALLBACK_ABILITY[valid]) valid = 'babbu';
    if (valid === character && model) return;
    clearEffects();
    disposeModel(model);
    character = valid;
    stats = Object.assign({}, FALLBACK_STATS, chars?.[valid]?.stats || {});
    model = buildModel(valid);
    object.add(model.root);
    turbanScale = turbanGoal = 1 + Math.min(1.4, Math.max(0, ctx.state.turbans || 0) / 120);
    turbanVel = 0;
    if (model.turban) model.turban.scale.setScalar(turbanScale);
    camDistTarget = U.clamp(stats.camDist || FALLBACK_STATS.camDist, ZOOM_MIN, ZOOM_MAX);
    cooldown = 0; rushUntil = 0; spinT = 0; spinAngle = 0; throwT = -1; thrown = false;
    anim.tap = -1; anim.squash = 0; anim.squashV = 0; anim.glow = 0;
    if (ctx.state.mode !== 'playing') camDist = U.clamp(camDist, ZOOM_MIN, ZOOM_MAX);
  }

  function teleport(x, z) {
    const g = groundAt(x, z);
    const wl = waterLevel();
    const deep = wl - g > SWIM_DEPTH;
    position.set(x, deep ? wl - stats.height * 0.72 : g, z);
    velocity.set(0, 0, 0);
    grounded = !deep;
    floating = deep;
    swimming = deep;
    inWater = wl - g > 0.3;
    airTime = 0; coyote = 0; jumpBuffer = 0; knockTimer = 0;
    pendingSink = 0; sink = 0;
    _follow.set(x, position.y + eyeHeight(), z);
    camLift = 0;
    camBoom = 1;
    object.position.copy(position);
  }

  function setCheckpoint(x, z) {
    checkpoint.x = x;
    checkpoint.z = z;
  }

  function resetRun() {
    velocity.set(0, 0, 0);
    fainted = false; faintTimer = 0; knockTimer = 0; invulnUntil = 0;
    cooldown = 0; rushUntil = 0; spinT = 0; spinElapsed = 0; spinAngle = 0; throwT = -1; thrown = false;
    idleTimer = 0; lastIdleLine = -1e9;
    pendingSlow = 1; pendingSink = 0; sink = 0;
    jumpBuffer = 0; coyote = 0; airTime = 0; lastSplash = -10;
    anim.faint = 0; anim.squash = 0; anim.squashV = 0; anim.tap = -1; anim.dance = 0; anim.armsUp = 0; anim.spin = 0;
    clearEffects();
    object.visible = true;
  }

  function start() {
    resetRun();
    camDistTarget = U.clamp(stats.camDist || FALLBACK_STATS.camDist, ZOOM_MIN, ZOOM_MAX);
    camResetT = 0;
    turbanScale = turbanGoal = 1 + Math.min(1.4, Math.max(0, ctx.state.turbans || 0) / 120);
    turbanVel = 0;
    if (model?.turban) model.turban.scale.setScalar(turbanScale);
  }

  function update(dt, t) {
    const mode = ctx.state.mode;
    if (mode === 'paused') return;
    if (!model) setCharacter(ctx.state.character || 'babbu');
    if (!model) return;

    // per-frame requests from hazards, consumed here
    const slow = pendingSlow;
    pendingSlow = 1;
    const sinkReq = U.clamp(pendingSink, 0, 1);
    pendingSink = 0;
    sink = U.damp(sink, sinkReq, sinkReq > sink ? 8 : 2.5, dt);
    if (sink < 0.002) sink = 0;

    if (mode === 'playing') stepPlaying(dt, t, slow);
    else stepShowcase(dt, t, mode);

    updateTurbanSize(dt);
    object.position.copy(position);

function fmtTime(sec) {

  const pad = (n) => (n < 10 ? '0' : '') + n;
  return hh > 0 ? `${hh}:${pad(mm)}:${pad(ss)}` : `${mm}:${pad(ss)}`;
}

}

  letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }

/* pause / help / victory */

@keyframes th-hover { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-6px) rotate(4deg); } }
.th-vtitle { margin: 0; font: 400 clamp(36px, 7vw, 60px)/1 var(--font-display); color: var(--gold);

.th-vshout { margin: 0; font: 400 clamp(17px, 3vw, 22px)/1.2 var(--font-display); color: var(--kesri); }

.th-vquote { margin: 0; padding: 10px 14px; border-radius: 12px; background: rgba(255, 244, 226, 0.06); font: 600 14.5px/1.4 var(--font-ui); color: var(--ink-dim); }
.th-vquote b { color: var(--gold); }
.th-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.th-confetti i { position: absolute; top: 0; width: 9px; height: 14px; border-radius: 2px; background: var(--c); opacity: 0.95;
  animation: th-fall var(--d) linear var(--dl) infinite; }
.th-confetti i.dia { width: 11px; height: 11px; border-radius: 1px; }
@keyframes th-fall { from { transform: translate3d(0, -12vh, 0) rotate(0deg); } to { transform: translate3d(var(--dx), 112vh, 0) rotate(var(--r)); } }

  .th-spark, .th-rumal, .th-faint { animation: none !important; }

  .th-cmore { transition: none; }
}

// =================================================================================== init
function init(ctx) {
  const THREE = ctx.THREE;
  const util = ctx.util;

  const state = ctx.state;
  const hudLayer = ctx.dom.hud;
  const overlay = ctx.dom.overlay;
  const doc = document;
  const clamp = util.clamp;
  const isTouch = !!ctx.isTouch;

  // ------------------------------------------------------------------ housekeeping
  doc.getElementById(STYLE_ID)?.remove();
  for (const old of doc.querySelectorAll('[data-th-hud]')) old.remove();
  const styleEl = doc.createElement('style');
  styleEl.id = STYLE_ID;
  styleEl.textContent = CSS;
  doc.head.appendChild(styleEl);

  let reduced = false;
  try {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    reduced = mq.matches;
    mq.addEventListener?.('change', (e) => { reduced = e.matches; });
  } catch (e) { /* older browsers: assume motion is fine */ }

  const warned = new Set();
  function run(part, fn, a, b) {
    try { fn(a, b); } catch (e) {
      if (!warned.has(part)) { warned.add(part); console.warn('[turbans hud]', part, e); }
    }
  }
  function store(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, value);
    } catch (e) { /* storage blocked: fine */ }
    return null;
  }

  // ------------------------------------------------------------------ DOM helpers
  function h(tag, cls, text) {
    const e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function setText(e, s) { if (e._t !== s) { e._t = s; e.textContent = s; } }
  function setHTML(e, s) { if (e._h !== s) { e._h = s; e.innerHTML = s; } }
  function setVar(e, name, v) {
    const key = '_v' + name;
    if (e[key] !== v) { e[key] = v; e.style.setProperty(name, v); }
  }
  function anim(e, frames, opts) {
    if (!e || typeof e.animate !== 'function') return null;
    try { return e.animate(frames, opts); } catch (err) { return null; }
  }
  function button(cls, label, html, onClick) {
    const b = h('button', cls);
    b.type = 'button';
    if (label) { b.setAttribute('aria-label', label); b.title = label; }
    if (html) b.innerHTML = html;
    if (onClick) b.addEventListener('click', (e) => { blurIfPointer(e, b); onClick(e); });
    return b;
  }
  function textButton(cls, text, onClick) {
    const b = h('button', cls, text);
    b.type = 'button';
    b.addEventListener('click', (e) => { blurIfPointer(e, b); onClick(e); });
    return b;
  }
  // A mouse-clicked button keeps focus; Space (jump) would then click it again mid-game.
  function blurIfPointer(e, b) { if (e && e.detail > 0 && typeof b.blur === 'function') b.blur(); }
  function keyList(rows) {
    const dl = h('dl', 'th-keys');
    for (const row of rows) {
      if (!row) continue;
      const dt = h('dt');
      dt.appendChild(h('span', 'th-kbd', row[0]));
      dl.append(dt, h('dd', null, row[1]));
    }
    return dl;
  }

  // ------------------------------------------------------------------ content helpers
  const characters = () => C.characters || {};
  const charOrder = (Array.isArray(C.characterOrder) && C.characterOrder.length) ? C.characterOrder : Object.keys(characters());
  const charData = (id) => characters()[id] || characters()[charOrder[0]] || null;
  const accentOf = (id) => ACCENTS[id] || 'var(--gold)';
  const controlsRows = () => (Array.isArray(C.controls) ? C.controls : []);

  // ------------------------------------------------------------------ shared scratch
  const _v = new THREE.Vector3();
  const _fp = new THREE.Vector3();
  const _pp = { x: 0, z: 0 };
  const EMPTY = [];

  let uiTime = 0;
  let vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function playerXZ() {
    let p = null;
    try { p = ctx.player?.position; } catch (e) { p = null; }
    if (p && Number.isFinite(p.x) && Number.isFinite(p.z)) { _pp.x = p.x; _pp.z = p.z; } else { _pp.x = ctx.camera.position.x; _pp.z = ctx.camera.position.z; }
    return _pp;
  }

  // ================================================================== HUD skeleton
  const hudRoot = h('div', 'th-hud');
  hudRoot.dataset.thHud = '1';
  if (isTouch) hudRoot.classList.add('th-is-touch');

  const worldLayer = h('div', 'th-layer th-world');

  hudRoot.append(worldLayer, wrap);

  // ---- top-left: counter, combo, power-ups, checkpoint chip
  const tl = h('div', 'th-tl');
  const counter = h('div', 'th-panel th-strip th-counter');
  const counterIcon = h('span');
  counterIcon.innerHTML = turbanSVG('#ff8a1c');
  const counterText = h('div');
  const countEl = h('div', 'th-count', '0');
  const totalEl = h('div', 'th-total', 'total 0');
  counterText.append(countEl, totalEl);
  counter.append(counterIcon, counterText);
  counter.setAttribute('aria-label', 'Turbans');

  const combo = h('div', 'th-panel th-combo');
  const comboRow = h('div', 'th-combo-row');
  const comboX = h('span', 'th-combo-x', '×0');
  comboRow.append(comboX, h('span', 'th-combo-label', 'streak'));
  const comboNext = h('div', 'th-combo-next');
  const comboBar = h('div', 'th-combo-bar');
  const comboFill = h('div', 'th-combo-fill');
  comboBar.appendChild(comboFill);
  combo.append(comboRow, comboBar, comboNext);

  const pus = h('div', 'th-pus');
  const puEls = POWERUPS.map((p) => {
    const chip = h('div', `th-pu th-pu-${p.type}`);
    const icon = h('span');
    icon.innerHTML = p.type === 'magnet' ? ICON.magnet : p.type === 'bhangra' ? ICON.dhol : ICON.chai;
    const label = h('span', null, p.label);
    const sec = h('span', 'th-pu-sec', '');
    const bar = h('span', 'th-pu-bar');
    chip.append(icon, label, sec, bar);
    pus.appendChild(chip);
    return { def: p, chip, sec, bar, max: p.dur, lastSec: -1, on: false };
  });

  const cpChip = h('div', 'th-cp');
  cpChip.hidden = true;

  cpChip.append(cpText, cpName);
  let cpUntil = 0;

  tl.append(counter, combo, pus, cpChip);

  // ---- top-right: buttons + minimap + compass

  const btns = h('div', 'th-btns');

  const musicBtn = button('th-ibtn', 'Music and ambience', ICON.musicOn, () => {

    if (a && typeof a.setMusic === 'function') a.setMusic(a.music === false);
  });
  const boothBtn = button('th-ibtn', 'Voice Booth (V)', ICON.mic, () => ctx.openBooth?.());
  const mapBtn = button('th-ibtn', 'Big map (M)', ICON.map, () => setBigMap(!bigOpen));
  btns.append(timeEl, pauseBtn, muteBtn, musicBtn, boothBtn, mapBtn);

  const mapCol = h('div', 'th-mapcol');
  const miniWrap = h('div', 'th-mini');
  const miniCanvas = h('canvas');
  miniCanvas.width = miniCanvas.height = Math.round(180 * dpr);
  miniCanvas.setAttribute('aria-label', 'Minimap, north is up');
  miniCanvas.setAttribute('role', 'img');
  miniWrap.append(miniCanvas, h('span', 'th-mini-n', 'N'));

  const compass = h('div', 'th-panel th-compass');
  const dial = h('div', 'th-dial');
  const CHARGE_LEN = 2 * Math.PI * 38;
  let ticks = '';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    const r0 = i % 3 === 0 ? 34 : 37, r1 = 42;
    ticks += `<line class="th-dial-tick" x1="${(50 + Math.sin(a) * r0).toFixed(2)}" y1="${(50 - Math.cos(a) * r0).toFixed(2)}" x2="${(50 + Math.sin(a) * r1).toFixed(2)}" y2="${(50 - Math.cos(a) * r1).toFixed(2)}"/>`;
  }
  dial.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">'
    + '<circle class="th-dial-bg" cx="50" cy="50" r="47"/>'
    + '<circle class="th-dial-track" cx="50" cy="50" r="38"/>'
    + `<circle class="th-dial-charge" cx="50" cy="50" r="38" transform="rotate(-90 50 50)" stroke-dasharray="${CHARGE_LEN.toFixed(2)}" stroke-dashoffset="${CHARGE_LEN.toFixed(2)}"/>`
    + ticks
    + '<path class="th-dial-mark" d="M50 -1l6 9h-12z"/>'
    + '</svg>'
    + '<svg class="th-needle" viewBox="0 0 100 100" aria-hidden="true">'
    + '<path class="th-needle-n" d="M50 14L59 50H41z"/><path class="th-needle-s" d="M41 50h18L50 84z"/><circle class="th-needle-hub" cx="50" cy="50" r="5.5"/>'
    + '</svg>';
  const chargeEl = dial.querySelector('.th-dial-charge');
  const needleEl = dial.querySelector('.th-needle');
  const ctext = h('div', 'th-ctext');
  const cStage = h('div', 'th-cstage', STAGE_LABELS[0]);
  const cDist = h('div', 'th-cdist', '');
  const pips = h('div', 'th-pips');
  const pipEls = [0, 1, 2].map(() => { const p = h('span', 'th-pip'); pips.appendChild(p); return p; });
  ctext.append(cStage, cDist, pips);

  const vignette = h('div', 'th-vignette');

  // ---- big map

  bigCanvas.setAttribute('aria-label', 'Big map, north is up');
  const legend = h('div', 'th-legend');
  const legendItems = [
    ['#ff8a1c', 'You'], ['#fff6e6', 'Turbans'], ['#ffd447', 'Golden turbans'], ['#ff4b3e', 'Trouble'],
    ['#fff4e2', 'Dhaba (chai)'], ['#ff4f9a', 'Dhol tractor'], ['#f6c343', 'The Lost Ark'],
  ];
  for (const [c, label] of legendItems) {

  hudRoot.append(bannerEl, vignette, faintEl, bigEl);

  // ================================================================== touch controls
  const touchRoot = h('div', 'th-touch');
  touchRoot.hidden = true;
  const lookZone = h('div', 'th-look');
  const stickZone = h('div', 'th-zone');
  const stick = h('div', 'th-stick');

  const tAbRing = h('span', 'th-ring');
  const tAbAv = h('span', 'th-av-in');
  const tAbNum = h('span', 'th-cdnum', '');
  tAb.append(tAbRing, tAbAv, tAbNum);
  tbtns.append(tAb, tRun, tJump);
  touchRoot.append(lookZone, stickZone, tbtns);
  hudRoot.insertBefore(touchRoot, worldLayer);

  const tstate = { lookId: null, lx: 0, ly: 0, stickId: null, cx: 0, cy: 0, zx: 0, zy: 0, runId: null, stickRun: false };
  function tin() { return ctx.input?.touch || null; }
  function resetTouch() {
    const t = tin();
    if (t) { t.moveX = 0; t.moveY = 0; t.sprint = false; }
    tstate.lookId = null; tstate.stickId = null; tstate.runId = null; tstate.stickRun = false;
    stick.classList.remove('active');
    stick.style.left = ''; stick.style.top = '';
    knob.style.transform = '';
    tRun.classList.remove('down'); tJump.classList.remove('down'); tAb.classList.remove('down');
  }
  function capture(el, id) { try { el.setPointerCapture(id); } catch (e) { /* not capturable */ } }

  lookZone.addEventListener('pointerdown', (e) => {
    if (tstate.lookId !== null) return;
    tstate.lookId = e.pointerId; tstate.lx = e.clientX; tstate.ly = e.clientY;
    capture(lookZone, e.pointerId);
    e.preventDefault();
  });
  lookZone.addEventListener('pointermove', (e) => {
    if (e.pointerId !== tstate.lookId) return;
    const t = tin();
    if (t) {
      t.lookDX = (t.lookDX || 0) + (e.clientX - tstate.lx) * LOOK_GAIN;
      t.lookDY = (t.lookDY || 0) + (e.clientY - tstate.ly) * LOOK_GAIN;
    }
    tstate.lx = e.clientX; tstate.ly = e.clientY;
  });
  const endLook = (e) => { if (e.pointerId === tstate.lookId) tstate.lookId = null; };
  lookZone.addEventListener('pointerup', endLook);
  lookZone.addEventListener('pointercancel', endLook);
  lookZone.addEventListener('lostpointercapture', endLook);

  function stickMove(clientX, clientY) {
    let dx = clientX - (tstate.zx + tstate.cx), dy = clientY - (tstate.zy + tstate.cy);
    const len = Math.hypot(dx, dy);
    if (len > STICK_R) { dx *= STICK_R / len; dy *= STICK_R / len; }
    knob.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    let mx = dx / STICK_R, my = -dy / STICK_R;
    const m = Math.hypot(mx, my);
    if (m < 0.12) { mx = 0; my = 0; } else { const k = (m - 0.12) / 0.88 / m; mx *= k; my *= k; }
    // Full deflection runs too, so the right thumb stays free for jump and look.
    tstate.stickRun = m > 0.92;
    const t = tin();
    if (t) { t.moveX = mx; t.moveY = my; t.sprint = tstate.stickRun || tstate.runId !== null; }
  }
  stickZone.addEventListener('pointerdown', (e) => {

    tstate.stickId = e.pointerId;

    tstate.zx = r.left; tstate.zy = r.top;
    tstate.cx = clamp(e.clientX - r.left, 70, Math.max(70, r.width - 70));
    tstate.cy = clamp(e.clientY - r.top, 70, Math.max(70, r.height - 70));
    stick.style.left = `${tstate.cx}px`; stick.style.top = `${tstate.cy}px`;
    stick.classList.add('active');
    capture(stickZone, e.pointerId);
    stickMove(e.clientX, e.clientY);
    e.preventDefault();
  });
  stickZone.addEventListener('pointermove', (e) => { if (e.pointerId === tstate.stickId) stickMove(e.clientX, e.clientY); });
  const endStick = (e) => {
    if (e.pointerId !== tstate.stickId) return;
    tstate.stickId = null;
    tstate.stickRun = false;
    const t = tin();

    stick.classList.remove('active');

  // ================================================================== toasts

  const toastQ = [];

  let nextToastAt = 0;

  function toast(text, opts) {
    if (text === undefined || text === null || text === '') return;
    if (state.mode === 'title') return; // the title screen stays clean
    const o = opts || {};
    const msg = String(text);
    const tone = TONES.has(o.tone) ? o.tone : 'info';
    const duration = clamp(Number(o.duration) || 2.8, 0.8, 15);
    for (const s of toastShown) {
      if (!s.leaving && s.text === msg) { s.until = Math.max(s.until, uiTime + duration); return; }
    }
    for (const q of toastQ) if (q.text === msg) return;
    toastQ.push({ text: msg, tone, duration });
    while (toastQ.length > TOAST_QUEUE_MAX) toastQ.shift();
  }

  function updateToasts() {
    let live = 0;
    for (let i = toastShown.length - 1; i >= 0; i--) {
      const s = toastShown[i];
      if (!s.leaving && toastQ.length >= 3) s.until = Math.min(s.until, s.t0 + 1.6);
      if (!s.leaving && uiTime >= s.until) { s.leaving = true; s.goneAt = uiTime + 0.32; s.el.classList.add('out'); }
      if (s.leaving && uiTime >= s.goneAt) { s.el.remove(); toastShown.splice(i, 1); continue; }
      if (!s.leaving) live++;
    }
    if (live < TOAST_VISIBLE && toastQ.length && uiTime >= nextToastAt) {
      const q = toastQ.shift();
      const el = h('div', `th-panel th-toast th-tone-${q.tone}`);
      el.append(h('span', 'th-tdot'), h('span', null, q.text));
      toastWrap.appendChild(el);

      toastShown.push({ el, text: q.text, t0: uiTime, until: uiTime + q.duration, leaving: false, goneAt: 0 });
      nextToastAt = uiTime + 0.35;
    }
  }

  function clearToasts() {
    toastQ.length = 0;
    for (const s of toastShown) s.el.remove();
    toastShown.length = 0;

  let floatSerial = 0;

  function float(text, worldPos, opts) {
    if (text === undefined || text === null || !worldPos) return;
    const o = opts || {};
    let f = null, oldest = null;
    for (const it of floats) {
      if (!it.active) { f = it; break; }
      if (!oldest || it.born < oldest.born) oldest = it;
    }
    if (!f) f = oldest;
    const size = clamp(Number(o.size) || 1, 0.4, 3);
    f.active = true;
    f.born = ++floatSerial;
    f.t0 = uiTime;
    f.dur = clamp(Number(o.duration) || 1.1, 0.2, 6);
    f.rise = Number.isFinite(o.rise) ? o.rise : 1.2;
    f.x = Number(worldPos.x) || 0;
    f.y = Number(worldPos.y) || 0;
    f.z = Number(worldPos.z) || 0;
    f.jx = Number(o.jitter) || 0;
    const el = f.el;
    el.textContent = String(text);
    el.style.color = typeof o.color === 'string' ? o.color : '#fff6e6';
    el.style.fontSize = `${(22 * size).toFixed(1)}px`;
    el.style.opacity = '0';
  }

  function updateFloats() {
    if (floatSerial === 0) return;
    const cam = ctx.camera;
    for (const f of floats) {
      if (!f.active) continue;
      const el = f.el;
      const k = (uiTime - f.t0) / f.dur;
      if (k >= 1) { f.active = false; el.style.opacity = '0'; el.style.transform = 'translate3d(-9999px,0,0)'; continue; }
      const ease = 1 - (1 - k) * (1 - k);
      _v.set(f.x, f.y + f.rise * (reduced ? ease * 0.5 : ease), f.z).project(cam);
      if (_v.z > 1 || _v.z < -1) { el.style.opacity = '0'; continue; }
      const sx = (_v.x * 0.5 + 0.5) * vw + f.jx;
      const sy = (-_v.y * 0.5 + 0.5) * vh;
      let pop = 1;
      if (!reduced) pop = k < 0.12 ? 0.5 + (k / 0.12) * 0.72 : k < 0.24 ? 1.22 - ((k - 0.12) / 0.12) * 0.22 : 1;
      const op = k < 0.08 ? k / 0.08 : k > 0.62 ? 1 - (k - 0.62) / 0.38 : 1;
      el.style.opacity = op.toFixed(3);
      el.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0) translate(-50%,-50%) scale(${pop.toFixed(3)})`;
    }
  }
