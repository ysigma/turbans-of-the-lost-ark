    while (cap < need) cap *= 2;
    const np = new Float32Array(cap * 3); np.set(b.pos.subarray(0, b.n * 3)); b.pos = np;
    const nn = new Float32Array(cap * 3); nn.set(b.nor.subarray(0, b.n * 3)); b.nor = nn;
    const nc = new Float32Array(cap * 3); nc.set(b.col.subarray(0, b.n * 3)); b.col = nc;
    const ns = new Float32Array(cap); ns.set(b.sway.subarray(0, b.n)); b.sway = ns;
  }
  function batchAdd(b, d, m, r, tr, tg, tb) {
    grow(b, b.n + d.count);
    const P = d.pos, N = d.nor, Cc = d.col, Sw = d.sway;
    const bp = b.pos, bn = b.nor, bc = b.col, bs = b.sway;
    let o = b.n * 3;
    for (let i = 0, j = 0; i < d.count; i++, j += 3, o += 3) {
      const x = P[j], y = P[j + 1], z = P[j + 2];
      bp[o] = m[0] * x + m[4] * y + m[8] * z + m[12];
      bp[o + 1] = m[1] * x + m[5] * y + m[9] * z + m[13];
      bp[o + 2] = m[2] * x + m[6] * y + m[10] * z + m[14];
      const nx = N[j], ny = N[j + 1], nz = N[j + 2];
      bn[o] = r[0] * nx + r[4] * ny + r[8] * nz;
      bn[o + 1] = r[1] * nx + r[5] * ny + r[9] * nz;
      bn[o + 2] = r[2] * nx + r[6] * ny + r[10] * nz;
      bc[o] = Cc[j] * tr; bc[o + 1] = Cc[j + 1] * tg; bc[o + 2] = Cc[j + 2] * tb;
      bs[b.n + i] = Sw[i];
    }
    b.n += d.count;
  }
  function batchGeometry(b) {
    if (!b.n) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(b.pos.slice(0, b.n * 3), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(b.nor.slice(0, b.n * 3), 3));
    g.setAttribute('color', new THREE.BufferAttribute(b.col.slice(0, b.n * 3), 3));
    g.setAttribute('sway', new THREE.BufferAttribute(b.sway.slice(0, b.n), 1));
    g.computeBoundingSphere();
    g.computeBoundingBox();
    return g;
  }

  const _e = new THREE.Euler();
  const _q = new THREE.Quaternion();
  const _m = new THREE.Matrix4();
  const _mr = new THREE.Matrix4();
  const _p = new THREE.Vector3();
  const _s = new THREE.Vector3();
  // Stamp a template into the chunk batches. tint applies to tintable parts (tree leaves,
  // grass); bright is a brightness jitter for everything.
  function place(tpl, x, y, z, yaw, scale, tint, bright, leanX = 0, leanZ = 0) {
    _e.set(leanX, yaw, leanZ, 'YXZ');
    _q.setFromEuler(_e);
    _m.compose(_p.set(x, y, z), _q, _s.set(scale, scale, scale));
    _mr.makeRotationFromQuaternion(_q);
    const m = _m.elements, r = _mr.elements;
    for (let i = 0; i < tpl.length; i++) {
      const part = tpl[i];
      const t = part.tintable && tint ? tint : WHITE3;
      batchAdd(batches[part.b], part.d, m, r, t[0] * bright, t[1] * bright, t[2] * bright);
    }
  }

  // ---------------------------------------------------------------- terrain mesh
  const hs = new Float32Array(VERTS * VERTS);
  const vc = new Float32Array(VERTS * VERTS * 3);
  const tally = new Int32Array(BIOMES.length);
  const acc = [0, 0, 0];
  const shore = [0, 0, 0];

  function mixW(A, B, t, w) {
    if (w <= 0) return;
    acc[0] += (A[0] + (B[0] - A[0]) * t) * w;
    acc[1] += (A[1] + (B[1] - A[1]) * t) * w;
    acc[2] += (A[2] + (B[2] - A[2]) * t) * w;
  }
  function toward(B, t) {
    if (t <= 0) return;
    acc[0] += (B[0] - acc[0]) * t; acc[1] += (B[1] - acc[1]) * t; acc[2] += (B[2] - acc[2]) * t;
  }

  // Ground colour for one terrain vertex (uses G from sample() at the same point).
  function groundColor(x, z, h) {
    const W = T.weights(x, z, G.raw, G.low, G.river);
    const p1 = T.patch(x, z), q1 = 0.5 + 0.5 * p1;
    acc[0] = acc[1] = acc[2] = 0;
    mixW(P3.jungle, P3.jungle2, q1, W.jungle);
    mixW(P3.bambooFloor, P3.litter, q1, W.bamboo);
    mixW(P3.mustardG, P3.mustardY, sstep(-0.35, 0.45, p1), W.mustard);
    mixW(P3.ruin, P3.ruinGrey, q1, W.ruins);
    mixW(P3.swamp, P3.swampMud, q1, W.swamp);
    const p2 = T.patch2(x, z);
    toward(P3.grass, sstep(0.3, 0.8, p2) * 0.5 * (W.jungle + W.ruins + W.bamboo));
    toward(P3.hill, sstep(7, 13, h) * 0.45);
    toward(P3.clearing, G.flat * 0.6);
    if (h < 0.55) {
      const sw = W.swamp;
      for (let i = 0; i < 3; i++) shore[i] = P3.sand[i] + (P3.mud[i] - P3.sand[i]) * sw;
      toward(shore, 1 - sstep(0.1, 0.55, h));
    }
    if (h < 0.1) {
      toward(P3.wetSand, sstep(0.1, -0.2, h));
      toward(P3.bed, sstep(-0.2, -1.0, h));
      toward(P3.deep, sstep(-1.0, -2.4, h));
    }
    if (G.flat > 0.95) return B_CLEARING;
    return T.classify();
  }

  function buildTerrain(cx, cz) {
    const x0 = cx * CHUNK, z0 = cz * CHUNK;
    tally.fill(0);
    for (let j = 0; j < VERTS; j++) {
      for (let i = 0; i < VERTS; i++) {
        const k = j * VERTS + i;
        const x = x0 + i * GRID, z = z0 + j * GRID;
        const h = sample(x, z);
        hs[k] = h;
        const b = groundColor(x, z, h);
        if (i < CELLS && j < CELLS) tally[b]++;
        vc[k * 3] = acc[0]; vc[k * 3 + 1] = acc[1]; vc[k * 3 + 2] = acc[2];
      }
    }
    const triCount = CELLS * CELLS * 2;
    const pos = new Float32Array(triCount * 9), nor = new Float32Array(triCount * 9), colr = new Float32Array(triCount * 9);
    let o = 0;
    const tri = (ka, ia, ja, kb, ib, jb, kc, ic, jc, salt) => {
      const ax = x0 + ia * GRID, az = z0 + ja * GRID, ay = hs[ka];
      const bx = x0 + ib * GRID, bz = z0 + jb * GRID, by = hs[kb];
      const qx = x0 + ic * GRID, qz = z0 + jc * GRID, qy = hs[kc];
      const ux = bx - ax, uy = by - ay, uz = bz - az, vx = qx - ax, vy = qy - ay, vz = qz - az;
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      nx /= l; ny /= l; nz /= l;
      let r = (vc[ka * 3] + vc[kb * 3] + vc[kc * 3]) / 3;
      let g = (vc[ka * 3 + 1] + vc[kb * 3 + 1] + vc[kc * 3 + 1]) / 3;
      let b = (vc[ka * 3 + 2] + vc[kb * 3 + 2] + vc[kc * 3 + 2]) / 3;
      const avgH = (ay + by + qy) / 3;
      if (avgH > 0.3 && ny < 0.93) {
        const t = sstep(0.93, 0.68, ny) * 0.75;
        r += (P3.earth[0] - r) * t; g += (P3.earth[1] - g) * t; b += (P3.earth[2] - b) * t;
      }
      const f = 0.94 + 0.12 * hashf(cx * CELLS + ia, cz * CELLS + ja, salt);
      r *= f; g *= f; b *= f;
      pos[o] = ax; pos[o + 1] = ay; pos[o + 2] = az;
      pos[o + 3] = bx; pos[o + 4] = by; pos[o + 5] = bz;
      pos[o + 6] = qx; pos[o + 7] = qy; pos[o + 8] = qz;
      for (let v = 0; v < 9; v += 3) {
        nor[o + v] = nx; nor[o + v + 1] = ny; nor[o + v + 2] = nz;
        colr[o + v] = r; colr[o + v + 1] = g; colr[o + v + 2] = b;
      }
      o += 9;
    };
    for (let j = 0; j < CELLS; j++) {
      for (let i = 0; i < CELLS; i++) {
        const k00 = j * VERTS + i, k10 = k00 + 1, k01 = k00 + VERTS, k11 = k01 + 1;
        if ((i + j) & 1) {
          tri(k00, i, j, k01, i, j + 1, k11, i + 1, j + 1, 1);
          tri(k00, i, j, k11, i + 1, j + 1, k10, i + 1, j, 2);
        } else {
          tri(k00, i, j, k01, i, j + 1, k10, i + 1, j, 1);
          tri(k10, i + 1, j, k01, i, j + 1, k11, i + 1, j + 1, 2);
        }
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colr, 3));
    geo.computeBoundingSphere();
    geo.computeBoundingBox();
    const mesh = new THREE.Mesh(geo, terrainMat);
    mesh.name = 'world-terrain';
    mesh.receiveShadow = true;
    mesh.matrixAutoUpdate = false;
    mesh.userData.worldOwned = true;
    return mesh;
  }

  // ---------------------------------------------------------------- vegetation
  const PR = { h: 0, biome: B_JUNGLE, river: 99, flat: 0, wMustard: 0 };
  // Height, biome (dithered by jx/jz so biome edges feather) and water info at a point.
  function probe(x, z, jx, jz) {
    PR.h = sample(x, z);
    PR.river = G.river;
    PR.flat = G.flat;
    if (jx || jz) {
      const bx = x + jx, bz = z + jz;
      const hb = T.raw(bx, bz);
      T.weights(bx, bz, hb, T.S.low, T.S.river);
    } else {
      T.weights(x, z, G.raw, G.low, G.river);
    }
    PR.biome = T.classify();
    PR.wMustard = T.W.rMustard;
    return PR;
  }

  function slopeY(x, z) {
    const e = 0.8;
    const dx = heightAt(x - e, z) - heightAt(x + e, z), dz = heightAt(x, z - e) - heightAt(x, z + e);
    return (2 * e) / Math.hypot(dx, 2 * e, dz);
  }

  function inZone(zones, x, z, pad) {
    for (let i = 0; i < zones.length; i++) {
      const q = zones[i], R = q.r + pad;
      const dx = x - q.x, dz = z - q.z;
      if (dx * dx + dz * dz < R * R) return true;
    }
    return false;
  }
  function hitsCollider(list, x, z, r) {
    for (let i = 0; i < list.length; i++) {
      const c = list[i], R = c.r + r;
      const dx = x - c.x, dz = z - c.z;
      if (dx * dx + dz * dz < R * R) return true;
    }
    return false;
  }

  function populate(cx, cz, own, zones, mustardHere) {
    const x0 = cx * CHUNK, z0 = cz * CHUNK;
    const decor = ctx.quality === 'low' ? 0.6 : 1;
    for (const b of batches) b.n = 0;

    // A. trees, palms and bamboo: the colliders. Independent of quality, always identical.
    let rng = util.rngFor(seed, 'world', cx, cz, 'trees');
    for (let gz = 0; gz < 8; gz++) {
      for (let gx = 0; gx < 8; gx++) {
        const x = x0 + gx * 6 + 0.5 + rng() * 5, z = z0 + gz * 6 + 0.5 + rng() * 5;
        const roll = rng(), jx = (rng() - 0.5) * 8, jz = (rng() - 0.5) * 8;
        if (inZone(zones, x, z, 1.6)) continue;
        probe(x, z, jx, jz);
        if (PR.h < 0.35) continue;
        const b = PR.biome, riverside = PR.river < 2.6 && PR.h < 2.4;
        let kind = null;
        if (b === B_JUNGLE) kind = roll < 0.4 ? 'canopy' : roll < 0.46 ? 'emergent' : roll < (riverside ? 0.7 : 0.53) ? 'palm' : null;
        else if (b === B_BAMBOO) kind = roll < 0.36 ? 'bamboo' : roll < 0.41 ? 'canopy' : null;
        else if (b === B_MUSTARD) kind = roll < 0.03 ? 'canopy' : roll < (riverside ? 0.15 : 0.05) ? 'palm' : null;
        else if (b === B_RUINS) kind = roll < 0.16 ? 'canopy' : roll < 0.21 ? 'emergent' : roll < 0.24 ? 'palm' : null;
        else if (b === B_SWAMP) kind = roll < 0.16 ? 'palm' : roll < 0.24 ? 'canopy' : null;
        if (!kind) continue;
        const ny = slopeY(x, z);
        if (ny < 0.72 || (kind === 'emergent' && ny < 0.82)) continue;
        const s = rng(), yaw = rng() * TAU, v = rng(), lx = (rng() - 0.5) * 0.08, lz = (rng() - 0.5) * 0.08;
        const sink = 0.25 + (1 - ny) * 2.5;
        if (kind === 'canopy') {
          const sc = 0.8 + 0.45 * s;
          if (hitsCollider(own, x, z, 0.62 * sc + 1.2)) continue;
          let tint, idx = Math.floor(v * 3) % 3;
          if (b === B_MUSTARD && v < 0.5) { tint = amaltas; idx = 2; }
          else if (v > 0.97) { tint = gulmohar; idx = 2; }
          else tint = canopyTints[Math.floor(rng() * canopyTints.length)];
          place(TPL.canopy[idx], x, PR.h - sink, z, yaw, sc, tint, 0.92 + 0.16 * s, lx, lz);
          own.push({ x, z, r: 0.62 * sc, h: 6 * sc, tag: 'tree' });
        } else if (kind === 'emergent') {
          const sc = 0.9 + 0.28 * s;
          if (hitsCollider(own, x, z, 0.95 * sc + 2)) continue;
          place(TPL.emergent[Math.floor(v * 2) % 2], x, PR.h - sink - 0.1, z, yaw, sc, emergentTints[Math.floor(rng() * emergentTints.length)], 0.92 + 0.14 * s, lx * 0.5, lz * 0.5);
          own.push({ x, z, r: 0.95 * sc, h: 12 * sc, tag: 'tree' });
        } else if (kind === 'palm') {
          const sc = 0.85 + 0.35 * s;
          if (hitsCollider(own, x, z, 0.36 * sc + 1)) continue;
          place(TPL.palm[Math.floor(v * 3) % 3], x, PR.h - sink * 0.6, z, yaw, sc, null, 0.9 + 0.2 * s);
          own.push({ x, z, r: 0.36 * sc, h: 7 * sc, tag: 'palm' });
        } else {
          const sc = 0.85 + 0.3 * s;
          if (hitsCollider(own, x, z, sc + 0.8)) continue;
          place(TPL.bamboo[Math.floor(v * 2) % 2], x, PR.h - sink * 0.5, z, yaw, sc, null, 0.9 + 0.2 * s);
          own.push({ x, z, r: 1.0 * sc, h: 8 * sc, tag: 'bamboo' });
        }
      }
    }

    // B. understory: bananas, ferns, bushes, flowers, rocks, ruin stones, logs, reeds, lilies.
    rng = util.rngFor(seed, 'world', cx, cz, 'under');
    for (let gz = 0; gz < 16; gz++) {
      for (let gx = 0; gx < 16; gx++) {
        const x = x0 + gx * 3 + 0.3 + rng() * 2.4, z = z0 + gz * 3 + 0.3 + rng() * 2.4;
        const roll = rng(), jx = (rng() - 0.5) * 6, jz = (rng() - 0.5) * 6;
        if (inZone(zones, x, z, 0.4)) continue;
        probe(x, z, jx, jz);
        const h = PR.h, b = PR.biome;
        const s = rng(), yaw = rng() * TAU, v = rng();
        if (h < 0.05) {
          // in the water: lily pads and lotuses on calm, shallow water; reeds in the shallows
          const depth = WATER_LEVEL - h;
          const calm = b === B_SWAMP ? 1 : 0.22;
          if (depth > 0.12 && depth < 1.7 && roll < 0.42 * calm) {
            place(TPL.lilies[v < 0.3 ? 1 : 0], x, WATER_LEVEL + 0.07, z, yaw, 0.8 + 0.5 * s, null, 0.9 + 0.2 * s);
          } else if (depth < 0.4 && roll > 1 - (b === B_SWAMP ? 0.35 : 0.16)) {
            place(TPL.reeds[Math.floor(v * 2) % 2], x, h, z, yaw, 0.8 + 0.4 * s, null, 0.9 + 0.2 * s);
          }
          continue;
        }
        if (h < 0.7 && b !== B_MUSTARD && roll < (b === B_SWAMP ? 0.4 : 0.2)) {
          place(TPL.reeds[Math.floor(v * 2) % 2], x, h, z, yaw, 0.8 + 0.4 * s, null, 0.9 + 0.2 * s);
          continue;
        }
        let kind = null;
        if (b === B_JUNGLE) kind = pickKind(roll, JUNGLE_UNDER);
        else if (b === B_BAMBOO) kind = pickKind(roll, BAMBOO_UNDER);
        else if (b === B_MUSTARD) kind = pickKind(roll, MUSTARD_UNDER);
        else if (b === B_RUINS) kind = pickKind(roll, RUINS_UNDER);
        else if (b === B_SWAMP) kind = h < 1.2 ? pickKind(roll, SWAMP_LOW_UNDER) : pickKind(roll, SWAMP_UNDER);
        if (!kind) continue;
        const keepOut = kind === 'fern' || kind === 'flowers' || kind === 'mushrooms' || kind === 'reeds' ? 0.3 : 0.8;
        if (hitsCollider(own, x, z, keepOut)) continue;
        const bright = 0.88 + 0.24 * s;
        switch (kind) {
          case 'fern': place(TPL.fern[Math.floor(v * 3) % 3], x, h - 0.05, z, yaw, 0.8 + 0.6 * s, null, bright); break;
          case 'bush': place(TPL.bush[Math.floor(v * 5) % 5], x, h - 0.12, z, yaw, 0.75 + 0.6 * s, null, bright); break;
          case 'banana': place(TPL.banana[Math.floor(v * 2) % 2], x, h - 0.08, z, yaw, 0.85 + 0.4 * s, null, bright); break;
          case 'flowers': place(TPL.flowers[Math.floor(v * 6) % 6], x, h - 0.03, z, yaw, 0.9 + 0.5 * s, null, bright); break;
          case 'mushrooms': place(TPL.mushrooms[Math.floor(v * 3) % 3], x, h - 0.03, z, yaw, 0.9 + 0.6 * s, null, bright); break;
          case 'reeds': place(TPL.reeds[Math.floor(v * 2) % 2], x, h, z, yaw, 0.8 + 0.4 * s, null, bright); break;
          case 'rock': {
            const sc = 0.4 + 1.2 * s * s;
            if (inZone(zones, x, z, sc)) break;
            place(TPL.rock[Math.floor(v * 3) % 3], x, h - 0.12 * sc, z, yaw, sc, null, bright);
            if (sc >= 0.7) own.push({ x, z, r: 0.85 * sc, h: 0.7 * sc, tag: 'rock' });
            break;
          }
          case 'stone': {
            const sc = 0.8 + 0.5 * s;
            if (inZone(zones, x, z, 0.85 * sc)) break;
            place(TPL.ruinBlock[Math.floor(v * 2) % 2], x, h - 0.08, z, yaw, sc, null, bright);
            own.push({ x, z, r: 0.7 * sc, h: (v < 0.5 ? 0.7 : 1.2) * sc, tag: 'stone' });
            break;
          }
          case 'pillar': {
            if (hitsCollider(own, x, z, 2) || inZone(zones, x, z, 2.4)) break;
            const sc = 0.9 + 0.3 * s, c = Math.cos(yaw), sn = Math.sin(yaw);
            place(TPL.pillar, x, h - 0.1, z, yaw, sc, null, bright);
            own.push({ x, z, r: 0.62 * sc, h: 2.1 * sc, tag: 'pillar' });
            // the toppled drum lying beside it (template offset (1.3, 0.5), rotated by yaw)
            own.push({ x: x + (c * 1.3 + sn * 0.5) * sc, z: z + (-sn * 1.3 + c * 0.5) * sc, r: 0.5 * sc, h: 0.85 * sc, tag: 'stone' });
            break;
          }
          case 'log': {
            const sc = 0.85 + 0.3 * s, c = Math.cos(yaw), sn = Math.sin(yaw);
            let blocked = false;
            for (let k = -1; k <= 1 && !blocked; k++) blocked = hitsCollider(own, x + c * 1.7 * k * sc, z - sn * 1.7 * k * sc, 0.9) || inZone(zones, x + c * 2.3 * k * sc, z - sn * 2.3 * k * sc, 0.7);
            if (blocked || slopeY(x, z) < 0.9) break;
            place(TPL.log, x, h - 0.12, z, yaw, sc, null, bright);
            for (let k = -1; k <= 1; k++) own.push({ x: x + c * 1.6 * k * sc, z: z - sn * 1.6 * k * sc, r: 0.5 * sc, h: 0.75 * sc, tag: 'log' });
            break;
          }
          default: break;
        }
      }
    }

    // C. grass tufts everywhere dry (decor: thinned on low quality).
    rng = util.rngFor(seed, 'world', cx, cz, 'grass');
    const GRASS_ODDS = [0.45, 0.32, 0.14, 0.5, 0.38];
    for (let gz = 0; gz < 20; gz++) {
      for (let gx = 0; gx < 20; gx++) {
        const x = x0 + gx * 2.4 + rng() * 2.4, z = z0 + gz * 2.4 + rng() * 2.4;
        const roll = rng(), s = rng(), yaw = rng() * TAU;
        if (inZone(zones, x, z, 0.3)) continue;
        probe(x, z, 0, 0);
        if (PR.h < 0.15 || roll > GRASS_ODDS[PR.biome] * decor) continue;
        if (hitsCollider(own, x, z, 0.1)) continue;
        const t = grassTints[PR.biome];
        place(TPL.grass[s < 0.5 ? 0 : 1], x, PR.h - 0.06, z, yaw, 0.8 + 0.6 * s, t, 0.9 + 0.2 * roll);
      }
    }

    // D. sarson da khet: neat rows of mustard, plot by plot, with little paths between plots.
    if (mustardHere) {
      rng = util.rngFor(seed, 'world', cx, cz, 'mustard');
      const px0 = Math.floor(x0 / PLOT), px1 = Math.floor((x0 + CHUNK - 1e-6) / PLOT);
      const pz0 = Math.floor(z0 / PLOT), pz1 = Math.floor((z0 + CHUNK - 1e-6) / PLOT);
      for (let pz = pz0; pz <= pz1; pz++) {
        for (let px = px0; px <= px1; px++) {
          const alongX = (util.hash32(seed, 'plot', px, pz) & 1) === 0;
          const ox = px * PLOT + PLOT_PATH, oz = pz * PLOT + PLOT_PATH, span = PLOT - 2 * PLOT_PATH;
          const rows = Math.floor(span / ROW_GAP), per = Math.floor(span / PLANT_GAP);
          for (let rI = 0; rI <= rows; rI++) {
            for (let pI = 0; pI <= per; pI++) {
              const across = rI * ROW_GAP, along = pI * PLANT_GAP;
              const x = ox + (alongX ? along : across), z = oz + (alongX ? across : along);
              if (x < x0 || x >= x0 + CHUNK || z < z0 || z >= z0 + CHUNK) continue;
              const jit = (rng() - 0.5) * 0.5, keep = rng(), s = rng(), yaw = rng() * TAU;
              const fx = x + (alongX ? jit : 0), fz = z + (alongX ? 0 : jit);
              if (keep > 0.9 * decor + 0.05) continue;
              if (inZone(zones, fx, fz, 0.4)) continue;
              probe(fx, fz, 0, 0);
              if (PR.h < 0.45 || PR.biome !== B_MUSTARD || PR.wMustard < 0.62 + (keep - 0.5) * 0.3) continue;
              if (hitsCollider(own, fx, fz, 0.4)) continue;
              place(TPL.mustard[s < 0.5 ? 0 : 1], fx, PR.h - 0.05, fz, yaw, 0.85 + 0.35 * s, null, 0.92 + 0.16 * keep);
            }
          }
        }
      }
    }

    // E. a ring of marigolds (genda phool) round each clearing, like a welcome garland.
    rng = util.rngFor(seed, 'world', cx, cz, 'garland');
    for (const c of clearingsOf(cx, cz)) {
      const n = 12 + Math.floor(rng() * 8);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + rng() * 0.3, d = c.r + 0.7 + rng() * 1.4, s = rng();
        const x = c.x + Math.cos(a) * d, z = c.z + Math.sin(a) * d;
        if (inZone(zones, x, z, 0.25)) continue;
        const h = heightAt(x, z);
        if (h < 0.2 || hitsCollider(own, x, z, 0.3)) continue;
        place(TPL.marigolds[i % 2], x, h - 0.03, z, rng() * TAU, 0.9 + 0.4 * s, null, 0.95 + 0.1 * s);
      }
    }
  }

  // [kind, cumulative-probability] tables for the understory
  const JUNGLE_UNDER = cumulative([['fern', 0.2], ['bush', 0.13], ['banana', 0.07], ['flowers', 0.07], ['rock', 0.035], ['mushrooms', 0.03], ['log', 0.012]]);
  const BAMBOO_UNDER = cumulative([['fern', 0.13], ['bush', 0.06], ['flowers', 0.03], ['rock', 0.03], ['mushrooms', 0.015]]);
  const MUSTARD_UNDER = cumulative([['bush', 0.015], ['flowers', 0.03], ['rock', 0.01]]);
  const RUINS_UNDER = cumulative([['stone', 0.1], ['pillar', 0.018], ['fern', 0.14], ['bush', 0.08], ['rock', 0.05], ['flowers', 0.05]]);
  const SWAMP_UNDER = cumulative([['fern', 0.1], ['bush', 0.05], ['banana', 0.04], ['mushrooms', 0.03], ['reeds', 0.12]]);
  const SWAMP_LOW_UNDER = cumulative([['reeds', 0.38], ['fern', 0.07], ['mushrooms', 0.02], ['bush', 0.03]]);
  function cumulative(list) {
    let acc2 = 0;
    return list.map(([k, p]) => { acc2 += p; return [k, acc2]; });
  }
  function pickKind(roll, table) {
    for (let i = 0; i < table.length; i++) if (roll < table[i][1]) return table[i][0];
    return null;
  }

  // ---------------------------------------------------------------- chunks
  function zonesFor(cx, cz) {
    const zones = [];
    const x0 = cx * CHUNK, z0 = cz * CHUNK;
    for (const q of reserves) {
      const nx = clampN(q.x, x0, x0 + CHUNK), nz = clampN(q.z, z0, z0 + CHUNK);
      if (util.dist2(q.x, q.z, nx, nz) < (q.r + 4) ** 2) zones.push(q);
    }
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) for (const c of clearingsOf(cx + dx, cz + dz)) zones.push(c);
    return zones;
  }

  function generateChunk(cx, cz) {
    const key = ckey(cx, cz);
    const existing = chunks.get(key);
    if (existing) return existing;
    generatedSinceReset++;
    const x0 = cx * CHUNK, z0 = cz * CHUNK;
    const group = new THREE.Group();
    group.name = `chunk ${cx},${cz}`;
    group.userData = { cx, cz, worldChunk: true };

    const terrain = buildTerrain(cx, cz);
    let best = B_JUNGLE;
    for (let b = 0; b < tally.length; b++) if (tally[b] > tally[best]) best = b;
    const mustardHere = tally[B_MUSTARD] > 0;
    group.add(terrain);
    const meshes = [terrain];

    const own = [];
    const zones = zonesFor(cx, cz);
    populate(cx, cz, own, zones, mustardHere);
    for (let i = 0; i < batches.length; i++) {
      const geo = batchGeometry(batches[i]);
      if (!geo) continue;
      const mesh = new THREE.Mesh(geo, BATCH_MATS[i]);
      mesh.name = BATCH_NAMES[i];
      mesh.castShadow = BATCH_SHADOW[i];
      mesh.receiveShadow = true;
      mesh.matrixAutoUpdate = false;
      mesh.userData.worldOwned = true;
      group.add(mesh);
      meshes.push(mesh);
    }
    scene.add(group);

    // Colliders go in before chunk:load so listeners can avoid them. Keep anything others
    // registered for this chunk ahead of time.
    const pending = colliderMap.get(key);
    if (pending) for (const c of pending) own.push(c);
    colliderMap.set(key, own);

    const clearings = clearingsOf(cx, cz).map((c) => ({ x: c.x, z: c.z, r: c.r, h: c.h }));
    const rec = { cx, cz, key, group, meshes, clearings, biome: BIOMES[best] };
    chunks.set(key, rec);
    ctx.events.emit('chunk:load', { cx, cz, x0, z0, size: CHUNK, group, clearings: clearings.map((c) => ({ ...c })), biome: rec.biome });
    return rec;
  }

  function disposeForeign(obj, mine) {
    obj.traverse((o) => {
      if (o === obj || mine.has(o) || (o.userData && o.userData.shared)) return;
      if (o.geometry && !o.isSprite && !(o.geometry.userData && o.geometry.userData.shared)) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      for (const m of mats) {
        if (m.userData && m.userData.shared) continue;
        if (m.map && typeof m.map.dispose === 'function') m.map.dispose();
        m.dispose();
      }
      if (o.isInstancedMesh && typeof o.dispose === 'function') o.dispose();
    });
  }

  function unloadChunk(key) {
    const rec = chunks.get(key);
    if (!rec) return;
    chunks.delete(key);
    ctx.events.emit('chunk:unload', { cx: rec.cx, cz: rec.cz });
    scene.remove(rec.group);
    const mine = new Set(rec.meshes);
    for (const m of rec.meshes) m.geometry.dispose();
    disposeForeign(rec.group, mine);
    rec.group.clear();
    colliderMap.delete(key);
    // Clearings are cheap to recompute (deterministic), so keep the cache from growing forever.
    if (clearingCache.size > 4096) for (const k of [...clearingCache.keys()]) if (!chunks.has(k)) clearingCache.delete(k);
  }

  // A reservation arriving after chunks exist still shapes the ground: rebuild the terrain of
  // any loaded chunk it touches, and forget cached clearings of chunks not yet generated.
  function applyLateReserve(q) {
    if (!lateReserveWarned) {
      lateReserveWarned = true;
      console.warn('[turbans] world.reserveArea called after chunks were generated; terrain is patched but existing vegetation stays.');
    }
    for (const k of [...clearingCache.keys()]) if (!chunks.has(k)) clearingCache.delete(k);
    const reach = q.r + q.rim;
    for (const rec of chunks.values()) {
      const x0 = rec.cx * CHUNK, z0 = rec.cz * CHUNK;
      const nx = clampN(q.x, x0, x0 + CHUNK), nz = clampN(q.z, z0, z0 + CHUNK);
      if (util.dist2(q.x, q.z, nx, nz) >= reach * reach) continue;
      const old = rec.meshes[0];
      const mesh = buildTerrain(rec.cx, rec.cz);
      rec.group.remove(old);
      old.geometry.dispose();
      rec.group.add(mesh);
      rec.meshes[0] = mesh;
    }
  }

  // ---------------------------------------------------------------- water
  const waterTime = { value: 0 };
  const waterGeo = new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, WATER_SEGS, WATER_SEGS).rotateX(-Math.PI / 2);
  const waterMat = new THREE.MeshPhongMaterial({
    color: 0x3aa39b, specular: 0x9fd6cc, shininess: 70, transparent: true, opacity: 0.76,
    flatShading: true, side: THREE.DoubleSide, depthWrite: false,
  });
  waterMat.name = 'world-water';
  waterMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = waterTime;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;\nvarying float vWave;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 waterW = modelMatrix * vec4(transformed, 1.0);
        float wv = sin(waterW.x * 0.23 + uTime * 1.25) * 0.04
                 + sin(waterW.z * 0.19 - uTime * 1.05 + 1.7) * 0.04
                 + sin((waterW.x - waterW.z) * 0.41 + uTime * 2.1) * 0.02;
        transformed.y += wv;
        vWave = wv;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vWave;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb = mix(diffuseColor.rgb * 0.88, vec3(0.62, 0.88, 0.82), smoothstep(-0.02, 0.09, vWave) * 0.4);`);
  };
  waterMat.customProgramCacheKey = () => 'turbans-world-water-1';
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.name = 'world-water';
  water.receiveShadow = true;
  water.frustumCulled = false;
  water.renderOrder = 1;
  water.position.y = WATER_LEVEL;
  scene.add(water);

  // ---------------------------------------------------------------- spawn
  function spawnOk(x, z) {
    const h = sample(x, z);
    if (h < 1.0 || h > 9) return false;
    T.weights(x, z, G.raw, G.low, G.river);
    if (T.classify() === B_SWAMP) return false;
    let lo = h, hi = h;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      for (const r of [5, SPAWN_RESERVE]) {
        const hh = T.raw(x + Math.cos(a) * r, z + Math.sin(a) * r);
        if (hh < 0.7) return false;
        if (hh < lo) lo = hh;
        if (hh > hi) hi = hh;
      }
    }
    return hi - lo < 3;
  }
  function findSpawn() {
    const STEP = 6;
    for (let ring = 0; ring <= 90; ring++) {
      for (let i = -ring; i <= ring; i++) {
        for (let j = -ring; j <= ring; j++) {
          if (Math.max(Math.abs(i), Math.abs(j)) !== ring) continue;
          if (spawnOk(i * STEP, j * STEP)) return { x: i * STEP, z: j * STEP };
        }
      }
    }
    return { x: 0, z: 0 };
  }

  // ---------------------------------------------------------------- streaming focus
  const focus = { x: 0, z: 0 };
  function updateFocus() {
    const p = ctx.player?.position;
    if (p && Number.isFinite(p.x) && Number.isFinite(p.z)) { focus.x = p.x; focus.z = p.z; return; }
    const c = ctx.camera?.position;
    if (c && Number.isFinite(c.x)) { focus.x = c.x; focus.z = c.z; }
  }
  const unloadKeys = [];

  // ---------------------------------------------------------------- public API
  function reserveArea(x, z, r, opts = {}) {
    if (!Number.isFinite(x) || !Number.isFinite(z) || !(r > 0)) return;
    const flatten = opts.flatten !== false;
    const height = Number.isFinite(opts.height) ? opts.height : Math.max(DRY_MIN, T.raw(x, z));
    const q = { x, z, r, rim: clampN(r * 0.3, CLEARING_RIM, 10), h: height, flatten };
    reserves.push(q);
    if (generatedSinceReset === 0) clearingCache.clear();
    else applyLateReserve(q);
  }

  function reset(newSeed) {
    for (const k of [...chunks.keys()]) unloadChunk(k);
    chunks.clear();
    colliderMap.clear();
    clearingCache.clear();
    reserves.length = 0;
    seed = (newSeed ?? ctx.seed) >>> 0;
    T = makeTerrain(util, seed);
    generatedSinceReset = 0;
    lateReserveWarned = false;
    spawn = findSpawn();
    reserveArea(spawn.x, spawn.z, SPAWN_RESERVE);
  }

  function forceLoadAround(x, z, radius = 1) {
    const ccx = Math.floor(x / CHUNK), ccz = Math.floor(z / CHUNK);
    const list = [];
    for (let dz = -radius; dz <= radius; dz++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const cx = ccx + dx, cz = ccz + dz;
        if (chunks.has(ckey(cx, cz))) continue;
        list.push([cx, cz, util.dist2(x, z, (cx + 0.5) * CHUNK, (cz + 0.5) * CHUNK)]);
      }
    }
    list.sort((a, b) => a[2] - b[2]);
    for (const [cx, cz] of list) generateChunk(cx, cz);
  }

  function update(dt, t) {
    windTime.value = t;
    waterTime.value = t;
    updateFocus();
    water.position.set(Math.round(focus.x / WATER_STEP) * WATER_STEP, WATER_LEVEL, Math.round(focus.z / WATER_STEP) * WATER_STEP);

    const R = viewRadius();
    const ccx = Math.floor(focus.x / CHUNK), ccz = Math.floor(focus.z / CHUNK);
    unloadKeys.length = 0;
    for (const rec of chunks.values()) {
      if (Math.max(Math.abs(rec.cx - ccx), Math.abs(rec.cz - ccz)) > R + 1) unloadKeys.push(rec.key);
    }
    for (let i = 0; i < unloadKeys.length; i++) unloadChunk(unloadKeys[i]);

    // one chunk per frame, nearest first
    let bx = 0, bz = 0, bestD = Infinity;
    for (let dz = -R; dz <= R; dz++) {
      for (let dx = -R; dx <= R; dx++) {
        const cx = ccx + dx, cz = ccz + dz;
        if (chunks.has(ckey(cx, cz))) continue;
        const d = util.dist2(focus.x, focus.z, (cx + 0.5) * CHUNK, (cz + 0.5) * CHUNK);
        if (d < bestD) { bestD = d; bx = cx; bz = cz; }
      }
    }
    if (bestD < Infinity) generateChunk(bx, bz);
  }

  function collide(pos, radius = 0.4) {
    if (!pos) return false;
    let hit = false;
    const reach = COLLIDER_REACH + radius;
    const cx0 = Math.floor((pos.x - reach) / CHUNK), cx1 = Math.floor((pos.x + reach) / CHUNK);
    const cz0 = Math.floor((pos.z - reach) / CHUNK), cz1 = Math.floor((pos.z + reach) / CHUNK);
    for (let cz = cz0; cz <= cz1; cz++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const list = colliderMap.get(ckey(cx, cz));
        if (!list) continue;
        for (let i = 0; i < list.length; i++) {
          const c = list[i];
          const minD = c.r + radius;
          const dx = pos.x - c.x, dz = pos.z - c.z, d2 = dx * dx + dz * dz;
          if (d2 >= minD * minD) continue;
          if (Number.isFinite(c.h) && Number.isFinite(pos.y) && pos.y > heightAt(c.x, c.z) + c.h) continue;
          const d = Math.sqrt(d2);
          if (d < 1e-5) pos.x = c.x + minD;
          else { const k = minD / d; pos.x = c.x + dx * k; pos.z = c.z + dz * k; }
          hit = true;
        }
      }
    }
    return hit;
  }

  function queryColliders(x, z, r = 0) {
    const out = [];
    const reach = COLLIDER_REACH + r;
    const cx0 = Math.floor((x - reach) / CHUNK), cx1 = Math.floor((x + reach) / CHUNK);
    const cz0 = Math.floor((z - reach) / CHUNK), cz1 = Math.floor((z + reach) / CHUNK);
    for (let cz = cz0; cz <= cz1; cz++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const list = colliderMap.get(ckey(cx, cz));
        if (!list) continue;
        for (let i = 0; i < list.length; i++) {
          const c = list[i], R = c.r + r;
          if (util.dist2(x, z, c.x, c.z) < R * R) out.push(c);
        }
      }
    }
    return out;
  }

  function addColliders(cx, cz, list) {
    if (!Array.isArray(list) || !Number.isFinite(cx) || !Number.isFinite(cz)) return;
    const key = ckey(cx, cz);
    let dest = colliderMap.get(key);
    if (!dest) { dest = []; colliderMap.set(key, dest); }
    for (const c of list) {
      if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.z)) continue;
      dest.push({ x: c.x, z: c.z, r: Number.isFinite(c.r) ? c.r : 0.5, h: Number.isFinite(c.h) ? c.h : Infinity, tag: c.tag || 'solid' });
    }
  }

  function normalAt(x, z, out) {
    const n = out || new THREE.Vector3();
    const e = 0.6;
    return n.set(heightAt(x - e, z) - heightAt(x + e, z), 2 * e, heightAt(x, z - e) - heightAt(x, z + e)).normalize();
  }

  function getClearings(cx, cz) {
    return clearingsOf(cx, cz).map((c) => ({ x: c.x, z: c.z, r: c.r, h: c.h }));
  }

  return {
    CHUNK,
    WATER_LEVEL,
    get VIEW_RADIUS() { return viewRadius(); },
    heightAt,
    normalAt,
    waterDepthAt: (x, z) => Math.max(0, WATER_LEVEL - heightAt(x, z)),
    surfaceAt: (x, z) => Math.max(WATER_LEVEL, heightAt(x, z)),
    biomeAt: (x, z) => BIOMES[biomeIndexAt(x, z)],
    reserveArea,
    getSpawnPoint: () => ({ x: spawn.x, z: spawn.z }),
    forceLoadAround,
    update,
    reset,
    collide,
    queryColliders,
    addColliders,
    chunkAt: (x, z) => ({ cx: Math.floor(x / CHUNK), cz: Math.floor(z / CHUNK) }),
    isLoaded: (cx, cz) => chunks.has(ckey(cx, cz)),
    getClearings,
    water,
  };
}

return { init };
})();

// ===== quest.js =====
const M_quest = (function () {
"use strict";
// quest.js — the Diamond Rumal, the Lost Ark, the turban-charged compass and victory.
//
// Every jungle hides one Lost Ark: a colossal stone boat, half swallowed by the earth and
// thoroughly adopted by the jungle, 800–1100 m from spawn. In its courtyard, on a lotus
// pedestal, floats the Diamond Rumal. Turbans charge the compass that leads there; at full
// charge a golden beam rises over the Ark so you can see it from half the jungle away.
// Touch the rumal and the whole pind celebrates.
//
// API (CONTRACT.md §7.4): arkPosition, compass, isRevealed(), update(dt, t), plus the
// reset(seed) / start() lifecycle hooks. Emits quest:stage and quest:victory; listens to
// chunk:load / chunk:unload for the Ark's chunk.

const TAU = Math.PI * 2;

// ------------------------------------------------------------------ quest tuning
const STAGE_AT = [40, 120, 250];                  // totalCollected for compass stages 1..3
const WOBBLE_AT_STAGE = [0, Math.PI / 3, Math.PI / 10, 0];   // ±60°, ±18°, exact
const ARK_MIN_DIST = 800;
const ARK_MAX_DIST = 1100;
const ARK_RESERVE_R = 28;
const ARK_MIN_GROUND = 1.5;
const SITE_TRIES = 220;
const TOUCH_R = 2.25;                            // reach the rumal (XZ) to win
const ARRIVE_R = 40;
const NEAR_R = 110;                              // "you hear distant dhol..."
const RING_COUNT = 10;
const RING_R = 3.4;
const TURBAN_HOVER = 1.1;

// ------------------------------------------------------------------ Ark shape (local space)
// +X runs to the prow, +Z is the side with the breach (turned to face the spawn), y = 0 is
// the flattened ground. The hull sinks to KEEL_Y; the courtyard floor is the ground itself.
const HULL_L = 15;            // half length of the outer hull at the gunwale
const HULL_W = 6.6;           // half beam
const KEEL_L = 13.2;
const KEEL_W = 4.0;
const KEEL_Y = -3;
const INNER_L = 11.6;         // courtyard lens (the bow and stern are solid decks)
const INNER_W = 5.3;
const INNER_FLOOR = -0.3;
const BREACH = 4.4;           // half width of the opening in the +Z wall
const RUMAL_Y = 3.05;         // rumal centre above the courtyard floor
const RUMAL_SIZE = 1.5;
const CLOTH_SEG = 14;
const VICTORY_LIFT = 1.9;

// ------------------------------------------------------------------ beam
const BEAM_HEIGHT = 300;
const BEAM_PROXY = 420;       // farther than this, draw a scaled stand-in (same on screen)

// ------------------------------------------------------------------ particles
const SPARKLE_COUNT = 90;
const CONFETTI_COUNT = 320;
const CONFETTI_FLOOR = 0.14;

// ------------------------------------------------------------------ small pure helpers
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(a, b, v) { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function lens(x, L, W) { const q = 1 - (x / L) * (x / L); return q > 0 ? W * Math.pow(q, 0.6) : 0; }

// Gunwale height: sweeps up toward prow and stern, crumbles down to a low sill around the
// breach, and has a couple of weathered notches on the far side.
function gunwaleHeight(s, side) {
  const x = s * HULL_L;
  let h = 3.0 + 2.6 * s * s;
  if (side > 0) {
    const f = sstep(BREACH, BREACH + 3.6, Math.abs(x));
    const crumble = Math.sin(x * 2.7 + 1.3) * 0.35 * f * (1 - f) * 4;
    h = 0.55 + (h - 0.55) * f + crumble;
  } else if (side < 0) {
    h -= 0.95 * Math.exp(-(((x - 2.5) / 1.3) ** 2)) + 0.7 * Math.exp(-(((x + 6.5) / 1.0) ** 2));
  }
  return h;
}

function hullVertex(s, side) {
  const h = gunwaleHeight(s, side);
  const sd = side === 0 ? 1 : side;
  const ox = s * HULL_L, kx = s * KEEL_L, ix = s * INNER_L;
  const iz = sd * lens(ix, INNER_L, INNER_W);
  return {
    s, side, h,
    ot: [ox, h, sd * lens(ox, HULL_L, HULL_W)],      // outer top
    kl: [kx, KEEL_Y, sd * lens(kx, KEEL_L, KEEL_W)], // keel line (buried)
    it: [ix, h, iz],                                 // inner top
    fl: [ix, INNER_FLOOR, iz],                       // inner foot
  };
}

// One closed loop around the hull: starboard (+Z) stern→prow, then port (−Z) back again.
// Samples bunch up at the pointed ends and land exactly on the breach edges.
function hullLoop() {
  const N = 30;
  const raw = [];
  for (let i = 0; i <= N; i++) raw.push(Math.sin(Math.PI / 2 * (-1 + 2 * i / N)));
  for (let e = 0; e < 4; e++) { const s = (BREACH + e * 1.1) / HULL_L; raw.push(s, -s); }
  raw.sort((a, b) => a - b);
  const S = raw.filter((s, i) => i === 0 || s - raw[i - 1] > 1e-4);
  const loop = [];
  for (const s of S) loop.push(hullVertex(s, Math.abs(s) > 1 - 1e-9 ? 0 : 1));
  for (let i = S.length - 2; i >= 1; i--) loop.push(hullVertex(S[i], -1));
  return loop;
}

function outerAt(v, f) {
  return [lerp(v.kl[0], v.ot[0], f), lerp(KEEL_Y, v.h, f), lerp(v.kl[2], v.ot[2], f)];
}

function outwardOf(v) {
  const x = v.ot[0] / (HULL_L * HULL_L), z = v.ot[2] / (HULL_W * HULL_W);
  const l = Math.hypot(x, z) || 1;
  return [x / l, 0, z / l];
}

function diamondPath(g, x, y, r) {
  g.beginPath();
  g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y);
  g.closePath();
}

// ------------------------------------------------------------------ shaders
const BEAM_VERT = /* glsl */`
varying vec2 vUv;
varying float vFacing;
void main() {
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vec3 n = normalize(normalMatrix * normal);
  vFacing = abs(dot(n, normalize(-mv.xyz)));
  gl_Position = projectionMatrix * mv;
}`;

const BEAM_FRAG = /* glsl */`
uniform vec3 uColor;
uniform float uTime;
uniform float uOpacity;
varying vec2 vUv;
varying float vFacing;
void main() {
  float h = vUv.y;
  float fade = pow(1.0 - h, 1.7) * smoothstep(0.0, 0.02, h);
  float bands = 0.8 + 0.2 * sin(h * 160.0 - uTime * 2.6);
  float pulse = 0.82 + 0.18 * sin(uTime * 1.6);
  float a = pow(vFacing, 1.5) * fade * bands * pulse * uOpacity;
  if (a < 0.002) discard;
  gl_FragColor = vec4(uColor, a);
  #include <colorspace_fragment>
}`;

const SPARKLE_VERT = /* glsl */`
uniform float uTime;
uniform float uScale;
uniform float uBurst;
attribute float aPhase;
attribute float aSpeed;
attribute vec3 aColor;
varying vec3 vColor;
varying float vAlpha;
void main() {
  float cyc = fract(uTime * aSpeed * 0.18 + aPhase);
  float sw = aPhase * 6.2831853;
  vec3 p = position * (1.0 + uBurst * 1.6);
  p.y += (cyc - 0.5) * (1.6 + uBurst * 2.5);
  p.x += sin(uTime * 0.9 + sw) * 0.25;
  p.z += cos(uTime * 0.8 + sw) * 0.25;
  float tw = pow(0.5 + 0.5 * sin(uTime * (3.0 + aSpeed * 4.0) + sw * 3.0), 3.0);
  vAlpha = tw * smoothstep(0.0, 0.15, cyc) * (1.0 - smoothstep(0.75, 1.0, cyc));
  vColor = aColor;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = (0.1 + 0.14 * tw) * (1.0 + uBurst) * uScale / max(0.1, -mv.z);
  gl_Position = projectionMatrix * mv;
}`;

const SPARKLE_FRAG = /* glsl */`
uniform float uOpacity;
varying vec3 vColor;
varying float vAlpha;
void main() {
  vec2 c = gl_PointCoord - 0.5;
  float core = exp(-dot(c, c) * 40.0);
  float star = exp(-abs(c.x) * 28.0) * exp(-abs(c.y) * 5.0) + exp(-abs(c.y) * 28.0) * exp(-abs(c.x) * 5.0);
  float a = (core + star * 0.6) * vAlpha * uOpacity;
  if (a < 0.01) discard;
  gl_FragColor = vec4(vColor, a);
  #include <colorspace_fragment>
}`;

const CONFETTI_VERT = /* glsl */`
uniform float uTime;
uniform float uScale;
attribute float aSize;
attribute float aPhase;
attribute vec3 aColor;
varying vec3 vColor;
varying float vFlip;
void main() {
  vColor = aColor;
  vFlip = abs(sin(uTime * (4.0 + aPhase * 5.0) + aPhase * 30.0));
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = aSize * 0.16 * uScale / max(0.1, -mv.z);
  gl_Position = projectionMatrix * mv;
}`;

const CONFETTI_FRAG = /* glsl */`
varying vec3 vColor;
varying float vFlip;
void main() {
  vec2 c = gl_PointCoord - 0.5;
  if (abs(c.x) > 0.5 * max(vFlip, 0.18) || abs(c.y) > 0.32) discard;
  gl_FragColor = vec4(vColor * (0.72 + 0.28 * vFlip), 1.0);
  #include <colorspace_fragment>
}`;

// ------------------------------------------------------------------ textures
// White silk with a gold zari border and a phulkari "bagh" diamond in the middle.
function makeSilkTexture(THREE) {
  if (typeof document === 'undefined') return null;
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  if (!g) return null;

  const silk = g.createLinearGradient(0, 0, S, S);
  silk.addColorStop(0, '#fffdf8');
  silk.addColorStop(0.5, '#f2ece1');
  silk.addColorStop(1, '#fffaf1');
  g.fillStyle = silk;
  g.fillRect(0, 0, S, S);

  // sheen
  g.globalAlpha = 0.07;
  g.strokeStyle = '#ffffff';
  g.lineWidth = 2;
  for (let i = -S; i < S; i += 9) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + S, S); g.stroke(); }
  g.globalAlpha = 1;

  // faint phulkari lattice in pale gold thread
  g.strokeStyle = 'rgba(214, 170, 70, 0.2)';
  g.lineWidth = 1;
  for (let i = -S; i < 2 * S; i += 24) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i - S, S); g.stroke();
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i + S, S); g.stroke();
  }

  // the bagh: nested diamonds
  const c = S / 2;
  diamondPath(g, c, c, 64); g.lineWidth = 3; g.strokeStyle = '#e2ad35'; g.stroke();
  diamondPath(g, c, c, 50); g.fillStyle = 'rgba(255, 138, 28, 0.16)'; g.fill();
  diamondPath(g, c, c, 34); g.fillStyle = '#f0c04a'; g.fill();
  diamondPath(g, c, c, 20); g.fillStyle = '#ff8a1c'; g.fill();
  diamondPath(g, c, c, 9); g.fillStyle = '#ff4f9a'; g.fill();
  g.fillStyle = '#e2ad35';
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { diamondPath(g, c + dx * 46, c + dy * 46, 8); g.fill(); }
  // corner rosettes
  for (const [x, y] of [[54, 54], [S - 54, 54], [54, S - 54], [S - 54, S - 54]]) {
    diamondPath(g, x, y, 11); g.fillStyle = '#e8b53e'; g.fill();
    diamondPath(g, x, y, 5); g.fillStyle = '#ff4f9a'; g.fill();
  }

  // zari border
  const b = 26;
  const zari = g.createLinearGradient(0, 0, 0, b);
  zari.addColorStop(0, '#b98213');
  zari.addColorStop(0.5, '#f6cf55');
  zari.addColorStop(1, '#c48d1a');
  g.fillStyle = zari;
  g.fillRect(0, 0, S, b); g.fillRect(0, S - b, S, b);
  g.fillRect(0, 0, b, S); g.fillRect(S - b, 0, b, S);
  g.fillStyle = '#fff1b8';
  for (let t = b / 2; t < S; t += 16) {
    diamondPath(g, t, b / 2, 5); g.fill();
    diamondPath(g, t, S - b / 2, 5); g.fill();
    diamondPath(g, b / 2, t, 5); g.fill();
    diamondPath(g, S - b / 2, t, 5); g.fill();
  }
  g.strokeStyle = '#8f6410';
  g.lineWidth = 2;
  g.strokeRect(3, 3, S - 6, S - 6);
  g.strokeRect(b - 1, b - 1, S - 2 * b + 2, S - 2 * b + 2);
  // scalloped inner edge
  g.fillStyle = '#e8b53e';
  for (let t = b + 6; t < S - b; t += 12) {
    for (const [x, y] of [[t, b], [t, S - b], [b, t], [S - b, t]]) { g.beginPath(); g.arc(x, y, 4, 0, TAU); g.fill(); }
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeGlowTexture(THREE) {
  if (typeof document === 'undefined') return null;
  const S = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  if (!g) return null;
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0, 'rgba(255, 248, 225, 1)');
  grd.addColorStop(0.35, 'rgba(255, 226, 150, 0.45)');
  grd.addColorStop(1, 'rgba(255, 210, 120, 0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ------------------------------------------------------------------ stone builder
// Collects flat-shaded, vertex-coloured triangles into one big non-indexed geometry, so the
// whole Ark (hull, decks, pillars, pedestal, vines, moss) is a single draw call.
function createStoneBuilder(THREE, rng) {
  const pos = [];
  const col = [];

  function emit(a, b, c, color, k) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nx * nx + ny * ny + nz * nz < 1e-10) return;
    pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
    const r = color.r * k, g = color.g * k, bl = color.b * k;
    col.push(r, g, bl, r, g, bl, r, g, bl);
  }

  function shade(paint, cx, cy, cz, nx, ny, nz) {
    return typeof paint === 'function' ? paint(cx, cy, cz, nx, ny, nz) : paint;
  }

  // Quad p0..p3 in perimeter order; `hint` says which way it should face.
  function quad(p0, p1, p2, p3, paint, hint, jitter = 0.07) {
    const q = [p0, p1, p2, p3];
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < 4; i++) {
      const u = q[i], v = q[(i + 1) & 3];
      nx += (u[1] - v[1]) * (u[2] + v[2]);
      ny += (u[2] - v[2]) * (u[0] + v[0]);
      nz += (u[0] - v[0]) * (u[1] + v[1]);
    }
    const flip = nx * hint[0] + ny * hint[1] + nz * hint[2] < 0;
    const len = Math.hypot(nx, ny, nz) || 1;
    const sg = flip ? -1 : 1;
    const color = shade(paint,
      (p0[0] + p1[0] + p2[0] + p3[0]) / 4, (p0[1] + p1[1] + p2[1] + p3[1]) / 4, (p0[2] + p1[2] + p2[2] + p3[2]) / 4,
      sg * nx / len, sg * ny / len, sg * nz / len);
    const k = 1 + (rng() - 0.5) * 2 * jitter;
    const b = flip ? p3 : p1, d = flip ? p1 : p3;
    emit(p0, b, p2, color, k);
    emit(p0, p2, d, color, k);
  }

  const ta = [0, 0, 0], tb = [0, 0, 0], tc = [0, 0, 0];
  // Bake a primitive (consumed and disposed) with matrix `m`; one colour per face.
  function geo(g, m, paint, jitter = 0.08) {
    const gg = g.index ? g.toNonIndexed() : g;
    if (gg !== g) g.dispose();
    if (m) gg.applyMatrix4(m);
    const p = gg.attributes.position.array;
    for (let i = 0; i + 8 < p.length; i += 9) {
      ta[0] = p[i]; ta[1] = p[i + 1]; ta[2] = p[i + 2];
      tb[0] = p[i + 3]; tb[1] = p[i + 4]; tb[2] = p[i + 5];
      tc[0] = p[i + 6]; tc[1] = p[i + 7]; tc[2] = p[i + 8];
      const ux = tb[0] - ta[0], uy = tb[1] - ta[1], uz = tb[2] - ta[2];
      const vx = tc[0] - ta[0], vy = tc[1] - ta[1], vz = tc[2] - ta[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      const color = shade(paint, (ta[0] + tb[0] + tc[0]) / 3, (ta[1] + tb[1] + tc[1]) / 3, (ta[2] + tb[2] + tc[2]) / 3, nx, ny, nz);
      emit(ta, tb, tc, color, 1 + (rng() - 0.5) * 2 * jitter);
    }
    gg.dispose();
  }

  function build() {
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    out.computeVertexNormals();
    out.computeBoundingSphere();
    return out;
  }

  return { quad, geo, build };
}

function arkPalette(THREE) {
  const c = (h) => new THREE.Color(h);
  const sand = c('#c9a477');
  const faded = (h, k = 0.32) => c(h).lerp(sand, k);
  return {
    sandA: sand, sandB: c('#b48c60'), sandC: c('#dcc095'), sandDark: c('#8a6a4a'), wet: c('#6e5a44'),
    trim: c('#e6c993'), broken: c('#e3cfa6'), earth: c('#5f6a34'),
    moss: [c('#5d8b39'), c('#4b7a2f'), c('#79a346'), c('#6a9a3c')],
    vine: c('#3d7230'),
    leaf: [c('#4f9a3c'), c('#3f8a35'), c('#68ad45'), c('#2f7a3a')],
    paint: [faded('#e8a33a'), faded('#e0792b'), faded('#d4558c'), faded('#2f8f55')],
    gold: faded('#e8b53e', 0.18),
    floor: [c('#c4a67e'), c('#ad8f68'), c('#d2b88f'), c('#b99a70')],
  };
}

// ------------------------------------------------------------------ the Lost Ark
// Built once, the same Ark in every jungle (only its site and heading change), and reused
// every time its chunk streams back in.
function buildArkAssets(THREE, util) {
  const rng = util.mulberry32(0xa4c5eed1);
  const rand = (a, b) => a + (b - a) * rng();
  const pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];
  const P = arkPalette(THREE);
  const B = createStoneBuilder(THREE, rng);
  const colliders = [];

  const _m = new THREE.Matrix4(), _frame = new THREE.Matrix4(), _out = new THREE.Matrix4();
  const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
  const _mid = new THREE.Vector3();
  const UP = new THREE.Vector3(0, 1, 0);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  function T(x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    _e.set(rx, ry, rz);
    _q.setFromEuler(_e);
    _p.set(x, y, z);
    _s.set(sx, sy, sz);
    return _m.compose(_p, _q, _s);
  }
  const onFrame = (local) => _out.multiplyMatrices(_frame, local);
  const withMoss = (base, chance) => () => (rng() < chance ? pick(P.moss) : base);
  const mossOnTop = (base, chance) => (cx, cy, cz, nx, ny) => (ny > 0.5 && rng() < chance ? pick(P.moss) : base);

  function strut(a, b, w, d, paint, jitter = 0.08) {
    _p.subVectors(b, a);
    const len = _p.length();
    if (len < 1e-4) return;
    _p.divideScalar(len);
    _q.setFromUnitVectors(UP, _p);
    _mid.addVectors(a, b).multiplyScalar(0.5);
    _s.set(1, 1, 1);
    _m.compose(_mid, _q, _s);
    B.geo(new THREE.BoxGeometry(w, len * 1.08, d), _m, paint, jitter);
  }

  function leaf(x, y, z, size = 1) {
    B.geo(new THREE.OctahedronGeometry(1, 0), T(x, y, z, rand(-0.6, 0.6), rand(0, TAU), rand(-0.5, 0.5), 0.17 * size, 0.05 * size, 0.11 * size), pick(P.leaf), 0.1);
  }

  // Sets _frame to the outer hull surface at (s, side, height fraction f): x along the hull,
  // y up the face, z out of the wall.
  function wallFrame(s, side, f) {
    const v = hullVertex(s, side);
    const o = outerAt(v, f);
    const a = outerAt(hullVertex(s - 0.01, side), f), b = outerAt(hullVertex(s + 0.01, side), f);
    const t = V(b[0] - a[0], b[1] - a[1], b[2] - a[2]).normalize();
    const u = V(v.ot[0] - v.kl[0], v.ot[1] - v.kl[1], v.ot[2] - v.kl[2]);
    u.addScaledVector(t, -u.dot(t)).normalize();
    const n = V(0, 0, 0).crossVectors(t, u).normalize();
    const ow = outwardOf(v);
    if (n.x * ow[0] + n.z * ow[2] < 0) { t.negate(); n.negate(); }
    _frame.makeBasis(t, u, n).setPosition(o[0], o[1], o[2]);
    return v;
  }

  // ---------------------------------------------------------------- hull
  const loop = hullLoop();
  const nL = loop.length;
  const ROWS = [0, 0.4, 0.58, 0.72, 0.86, 0.94, 1];
  const rowPaint = [
    P.wet, withMoss(P.sandB, 0.45), withMoss(P.sandA, 0.05),
    withMoss(P.sandB, 0.06), withMoss(P.sandA, 0.06), withMoss(P.trim, 0.1),
  ];
  const isOpen = (a, b) => a.side === 1 && b.side === 1 && Math.abs((a.s + b.s) * 0.5 * HULL_L) < BREACH;

  function rail(a, b, f, w) {
    const oa = outwardOf(a), ob = outwardOf(b);
    const pa = outerAt(a, f), pb = outerAt(b, f);
    strut(V(pa[0] + oa[0] * 0.1, pa[1], pa[2] + oa[2] * 0.1), V(pb[0] + ob[0] * 0.1, pb[1], pb[2] + ob[2] * 0.1), w, w,
      withMoss(f >= 1 ? P.trim : P.sandC, 0.12), 0.05);
  }

  function breachEnd(v) {
    const fFloor = (INNER_FLOOR - KEEL_Y) / (v.h - KEEL_Y);
    B.quad(v.ot, v.it, v.fl, outerAt(v, fFloor), P.broken, [-Math.sign(v.s), 0, 0]);
  }

  function groundMid(v) {
    const f0 = -KEEL_Y / (v.h - KEEL_Y);
    const ox = lerp(v.kl[0], v.ot[0], f0), oz = lerp(v.kl[2], v.ot[2], f0);
    return { x: (ox + v.it[0]) / 2, z: (oz + v.it[2]) / 2, r: Math.hypot(ox - v.it[0], oz - v.it[2]) / 2 + 0.3 };
  }

  for (let i = 0; i < nL; i++) {
    const a = loop[i], b = loop[(i + 1) % nL];
    if (isOpen(a, b)) continue;
    const prevOpen = isOpen(loop[(i - 1 + nL) % nL], a);
    const nextOpen = isOpen(b, loop[(i + 2) % nL]);
    const oa = outwardOf(a), ob = outwardOf(b);
    const out = [oa[0] + ob[0], 0, oa[2] + ob[2]];
    const inn = [-out[0], 0, -out[2]];

    for (let r = 0; r < ROWS.length - 1; r++) {
      B.quad(outerAt(a, ROWS[r]), outerAt(b, ROWS[r]), outerAt(b, ROWS[r + 1]), outerAt(a, ROWS[r + 1]), rowPaint[r], out);
    }
    B.quad(a.ot, b.ot, b.it, a.it, withMoss(P.sandC, 0.55), [0, 1, 0]);
    B.quad(a.it, b.it, b.fl, a.fl, withMoss(P.sandDark, 0.08), inn);
    if (Math.min(a.h, b.h) > 1.6) {
      rail(a, b, 0.72, 0.24);
      rail(a, b, 1, 0.3);
    }
    if (prevOpen) breachEnd(a);
    if (nextOpen) breachEnd(b);

    // colliders down the middle of the wall at ground level; low broken walls can be hopped
    const ga = groundMid(a), gb = groundMid(b);
    const low = Math.min(a.h, b.h);
    const n = Math.max(1, Math.ceil(Math.hypot(gb.x - ga.x, gb.z - ga.z) / 0.9));
    for (let j = 0; j < n + (nextOpen ? 1 : 0); j++) {
      const t = j / n;
      const c = { x: lerp(ga.x, gb.x, t), z: lerp(ga.z, gb.z, t), r: lerp(ga.r, gb.r, t), tag: 'ark' };
      if (low < 1.3) c.h = low;
      colliders.push(c);
    }
  }
  for (const sg of [-1, 1]) {
    colliders.push({ x: sg * 12.4, z: 0, r: 1.3, tag: 'ark' }, { x: sg * 13.8, z: 0, r: 1.0, tag: 'ark' });
  }

  // ---------------------------------------------------------------- prow and stern posts
  function post(sign, pts, w0, w1) {
    const curve = new THREE.CatmullRomCurve3(pts.map(([x, y, z]) => V(x * sign, y, z)));
    const N = 16;
    let prev = curve.getPoint(0);
    for (let i = 1; i <= N; i++) {
      const p = curve.getPoint(i / N);
      const w = lerp(w0, w1, i / N);
      strut(prev, p, w, w * 0.85, i % 5 === 2 ? P.gold : withMoss(P.sandA, 0.08));
      prev = p;
    }
    const end = curve.getPoint(1);
    B.geo(new THREE.OctahedronGeometry(1, 0), T(end.x, end.y + 0.3, end.z, 0, 0, 0, 0.3, 0.5, 0.3), P.gold);
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * TAU;
      B.geo(new THREE.OctahedronGeometry(1, 0), T(end.x + Math.cos(a) * 0.26, end.y + 0.14, end.z + Math.sin(a) * 0.26, 0, -a, -0.8, 0.12, 0.3, 0.07), P.paint[2]);
    }
    // carved phulkari diamonds on both faces
    const mid = curve.getPoint(0.38), tan = curve.getTangent(0.38);
    const wMid = lerp(w0, w1, 0.38) * 0.85;
    const ang = Math.atan2(tan.y, tan.x) + Math.PI / 4;
    for (const zs of [-1, 1]) {
      B.geo(new THREE.BoxGeometry(0.6, 0.6, 0.1), T(mid.x, mid.y, zs * (wMid / 2 + 0.03), 0, 0, ang), P.paint[0]);
      B.geo(new THREE.BoxGeometry(0.28, 0.28, 0.1), T(mid.x, mid.y, zs * (wMid / 2 + 0.08), 0, 0, ang), P.paint[2]);
    }
  }
  post(1, [[14.0, 3.6, 0], [15.5, 5.9, 0], [16.5, 8.4, 0], [16.2, 10.5, 0], [15.1, 11.3, 0], [14.2, 10.8, 0]], 1.5, 0.5);
  post(-1, [[14.0, 3.6, 0], [15.1, 5.5, 0], [15.6, 7.4, 0], [15.2, 8.7, 0], [14.5, 9.0, 0], [14.1, 8.6, 0]], 1.3, 0.45);

  // ---------------------------------------------------------------- carved motifs
  function lotusBoss(sc, proud) {
    B.geo(new THREE.CylinderGeometry(1.12 * sc, 1.12 * sc, proud, 12), onFrame(T(0, 0, proud / 2 - 0.02, Math.PI / 2, 0, 0)), P.sandC, 0.04);
    for (let k = 0; k < 8; k++) {
      const a = (k + 0.5) / 8 * TAU;
      B.geo(new THREE.OctahedronGeometry(1, 0), onFrame(T(Math.cos(a) * 0.86 * sc, Math.sin(a) * 0.86 * sc, proud, 0, 0, a - Math.PI / 2, 0.14 * sc, 0.3 * sc, 0.07)), P.paint[2]);
    }
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU;
      B.geo(new THREE.OctahedronGeometry(1, 0), onFrame(T(Math.cos(a) * 0.55 * sc, Math.sin(a) * 0.55 * sc, proud + 0.03, 0, 0, a - Math.PI / 2, 0.17 * sc, 0.36 * sc, 0.08)), P.paint[1]);
    }
    B.geo(new THREE.CylinderGeometry(0.3 * sc, 0.36 * sc, 0.14, 10), onFrame(T(0, 0, proud + 0.05, Math.PI / 2, 0, 0)), P.gold);
  }
  for (const side of [-1, 1]) {
    for (const s of [-0.75, 0.75]) { wallFrame(s, side, 0.79); lotusBoss(0.8, 0.3); }
    let ci = side > 0 ? 1 : 0;
    for (const x of [-8.8, -6.6, -4.4, -2.2, 0, 2.2, 4.4, 6.6, 8.8]) {
      if (hullVertex(x / HULL_L, side).h < 2.9) continue;
      wallFrame(x / HULL_L, side, 0.79);
      B.geo(new THREE.BoxGeometry(0.5, 0.5, 0.14), onFrame(T(0, 0, 0.05, 0, 0, Math.PI / 4)), P.paint[ci % 4], 0.05);
      B.geo(new THREE.BoxGeometry(0.24, 0.24, 0.1), onFrame(T(0, 0, 0.12, 0, 0, Math.PI / 4)), P.paint[(ci + 2) % 4], 0.05);
      ci++;
    }
  }

  // ---------------------------------------------------------------- courtyard, threshold, path
  for (let x = -10.8; x <= 10.8; x += 1.5) {
    for (let z = -5.2; z <= 5.21; z += 1.5) {
      const jx = x + rand(-0.06, 0.06), jz = z + rand(-0.06, 0.06);
      if (Math.abs(jz) + 0.75 > lens(jx, INNER_L, INNER_W)) continue;
      if (jx * jx + jz * jz < 1.9 * 1.9) continue;
      if (rng() < 0.1) continue; // grass pushing through
      B.geo(new THREE.BoxGeometry(1.38, 0.16, 1.38), T(jx, 0.04, jz, rand(-0.025, 0.025), rand(-0.06, 0.06), rand(-0.025, 0.025)),
        mossOnTop(pick(P.floor), 0.18), 0.06);
    }
  }
  for (let x = -3.6; x <= 3.61; x += 1.5) {
    B.geo(new THREE.BoxGeometry(1.4, 0.16, 1.5), T(x + rand(-0.05, 0.05), 0.04, 5.9, 0, rand(-0.05, 0.05), 0), mossOnTop(pick(P.floor), 0.1), 0.06);
  }
  for (let row = 0; row < 4; row++) {
    const z = 7.4 + row * 1.5;
    for (const x of [-1.5, 0, 1.5]) {
      if (rng() < 0.08 + row * 0.12) continue;
      const tilt = row > 1 ? 0.06 : 0.02;
      B.geo(new THREE.BoxGeometry(1.36, 0.15, 1.36), T(x + rand(-0.1, 0.1), 0.03, z + rand(-0.1, 0.1), rand(-tilt, tilt), rand(-0.15, 0.15), rand(-tilt, tilt)),
        mossOnTop(pick(P.floor), 0.15 + row * 0.1), 0.07);
    }
  }
  for (const sx of [-1, 1]) {  // broken kerbs of the old gangway
    strut(V(sx * 2.45, 0.12, 6.7), V(sx * 2.5, 0.12, 8.9), 0.42, 0.34, withMoss(P.sandB, 0.25));
    strut(V(sx * 2.55, 0.1, 9.4), V(sx * 2.7, 0.06, 11.2), 0.42, 0.3, withMoss(P.sandB, 0.35));
  }
  for (const e of [-1, 1]) {   // rubble where the wall gave way
    for (let k = 0; k < 6; k++) {
      const sz = rand(0.35, 0.85);
      B.geo(new THREE.BoxGeometry(sz, sz * rand(0.55, 1), sz * rand(0.7, 1.1)),
        T(e * (BREACH + rand(-0.5, 1.3)), sz * 0.28, rand(5.2, 8.4), rand(-0.4, 0.4), rand(0, TAU), rand(-0.4, 0.4)),
        withMoss(pick([P.sandA, P.sandB, P.broken]), 0.2));
    }
  }

  // ---------------------------------------------------------------- mast-like pillars
  function brokenColumn(r, h, cut) {
    const g = new THREE.CylinderGeometry(r * 0.94, r, h, 8, 4);
    g.translate(0, h / 2, 0);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      if (p.getY(i) > h - 1e-3) {
        const x = p.getX(i), z = p.getZ(i);
        p.setY(i, h - cut * (0.5 + 0.5 * x / r) - 0.18 * Math.sin(Math.atan2(z, x) * 3 + 1));
      }
    }
    return g;
  }
  function vineHelix(cx, cz, r, y0, y1, turns) {
    const N = Math.ceil((y1 - y0) / 0.38);
    let prev = null;
    for (let k = 0; k <= N; k++) {
      const a = k / N * turns * TAU;
      const p = V(cx + Math.cos(a) * r, lerp(y0, y1, k / N), cz + Math.sin(a) * r);
      if (prev) strut(prev, p, 0.09, 0.09, P.vine, 0.1);
      if (k % 2 === 1) leaf(p.x + Math.cos(a) * 0.12, p.y, p.z + Math.sin(a) * 0.12);
      prev = p;
    }
  }
  function hangingVine(x, y, z, segs, swayAxis) {
    let prev = V(x, y, z);
    const ph = rand(0, TAU);
    for (let k = 1; k <= segs; k++) {
      const sw = Math.sin(k * 1.1 + ph) * 0.12;
      const p = V(x + swayAxis[0] * sw, y - k * 0.5, z + swayAxis[2] * sw);
      strut(prev, p, 0.08, 0.08, P.vine, 0.1);
      if (rng() < 0.7) leaf(p.x + rand(-0.12, 0.12), p.y, p.z + rand(-0.12, 0.12));
      prev = p;
    }
    leaf(prev.x, prev.y - 0.1, prev.z, 1.4);
  }

  // Pillar A: tall, ringed, with a drooping broken yard
  B.geo(new THREE.CylinderGeometry(1.05, 1.15, 0.5, 8), T(-8, 0.25, 0), withMoss(P.sandB, 0.3));
  B.geo(brokenColumn(0.7, 8.6, 1.1), T(-8, 0.4, 0), withMoss(P.sandA, 0.06));
  for (const y of [2.6, 5.2, 7.3]) B.geo(new THREE.CylinderGeometry(0.83, 0.83, 0.22, 8), T(-8, y, 0), P.trim, 0.05);
  B.geo(new THREE.BoxGeometry(0.36, 0.36, 6.0), T(-8, 7.0, 0.6, 0.16, 0, 0), withMoss(P.sandB, 0.15));
  for (let k = 0; k < 3; k++) {
    const a = k / 3 * TAU + 0.4;
    B.geo(new THREE.BoxGeometry(0.34, 0.34, 0.06), T(-8 + Math.cos(a) * 0.71, 3.9, Math.sin(a) * 0.71, 0, Math.PI / 2 - a, Math.PI / 4), P.paint[k + 1]);
  }
  vineHelix(-8, 0, 0.78, 0.6, 7.6, 2.2);
  hangingVine(-8, 7.0 - 0.16 * 3.0, 3.3, 7, [1, 0, 0]);
  hangingVine(-8, 7.0 - 0.16 * 1.6, 2.1, 5, [1, 0, 0]);
  hangingVine(-8, 7.0 + 0.16 * 2.3, -2.1, 8, [1, 0, 0]);
  colliders.push({ x: -8, z: 0, r: 1.1, tag: 'ark' });

  // Pillar B: snapped short; its top lies on the deck
  B.geo(new THREE.CylinderGeometry(1.0, 1.1, 0.5, 8), T(8.3, 0.25, 0.2), withMoss(P.sandB, 0.3));
  B.geo(brokenColumn(0.66, 4.8, 1.6), T(8.3, 0.4, 0.2), withMoss(P.sandA, 0.06));
  B.geo(new THREE.CylinderGeometry(0.79, 0.79, 0.22, 8), T(8.3, 2.4, 0.2), P.trim, 0.05);
  vineHelix(8.3, 0.2, 0.74, 0.6, 3.8, 1.4);
  colliders.push({ x: 8.3, z: 0.2, r: 1.1, tag: 'ark' });

  const drumYaw = 0.35;
  B.geo(new THREE.CylinderGeometry(0.62, 0.62, 3.0, 8), T(5.6, 0.6, -2.4, 0, drumYaw, Math.PI / 2), withMoss(P.sandA, 0.35));
  B.geo(new THREE.CylinderGeometry(0.75, 0.75, 0.22, 8), T(5.6 + Math.cos(drumYaw) * 0.6, 0.6, -2.4 - Math.sin(drumYaw) * 0.6, 0, drumYaw, Math.PI / 2), P.trim, 0.05);
  for (const d of [-1.05, 0, 1.05]) {
    colliders.push({ x: 5.6 + Math.cos(drumYaw) * d, z: -2.4 - Math.sin(drumYaw) * d, r: 0.7, h: 1.25, tag: 'ark' });
  }

  // ---------------------------------------------------------------- the lotus pedestal
  B.geo(new THREE.CylinderGeometry(1.5, 1.6, 0.3, 12), T(0, 0.15, 0), mossOnTop(P.sandC, 0.25), 0.05);
  B.geo(new THREE.CylinderGeometry(1.1, 1.18, 0.3, 12), T(0, 0.45, 0), P.sandC, 0.05);
  B.geo(new THREE.CylinderGeometry(0.55, 0.65, 0.85, 8), T(0, 1.02, 0), P.sandA, 0.05);
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + Math.PI / 4;
    B.geo(new THREE.BoxGeometry(0.3, 0.3, 0.06), T(Math.cos(a) * 0.61, 1.0, Math.sin(a) * 0.61, 0, Math.PI / 2 - a, Math.PI / 4), P.paint[k % 2 ? 2 : 0]);
  }
  for (let k = 0; k < 10; k++) {
    const a = k / 10 * TAU;
    B.geo(new THREE.OctahedronGeometry(1, 0), T(Math.cos(a) * 0.55, 1.52, Math.sin(a) * 0.55, 0, -a, -0.75, 0.18, 0.36, 0.09), P.paint[k % 2 ? 2 : 1], 0.05);
  }
  for (let k = 0; k < 8; k++) {
    const a = (k + 0.5) / 8 * TAU;
    B.geo(new THREE.OctahedronGeometry(1, 0), T(Math.cos(a) * 0.32, 1.6, Math.sin(a) * 0.32, 0, -a, -0.35, 0.15, 0.22, 0.08), P.gold, 0.05);
  }
  B.geo(new THREE.CylinderGeometry(0.62, 0.45, 0.14, 10), T(0, 1.6, 0), P.gold, 0.04);
  colliders.push({ x: 0, z: 0, r: 1.55, tag: 'ark' });

  // ---------------------------------------------------------------- the jungle moves in
  for (let i = 0; i < nL; i++) {
    const v = loop[i];
    if (v.side === 0) continue;
    const ow = outwardOf(v);
    const nearBreach = v.side > 0 && Math.abs(v.s * HULL_L) < BREACH + 3;
    // vines over the gunwale and down the outside
    if (!nearBreach && v.h > 2.2 && rng() < 0.42) {
      const top = V(v.ot[0] + ow[0] * 0.14, v.h + 0.06, v.ot[2] + ow[2] * 0.14);
      strut(V(v.it[0], v.h + 0.06, v.it[2]), top, 0.1, 0.1, P.vine, 0.1);
      let prev = top;
      const ph = rand(0, TAU);
      const segs = 3 + Math.floor(rng() * 5);
      for (let k = 1; k <= segs; k++) {
        const y = v.h - k * 0.55;
        if (y < 0.3) break;
        const o = outerAt(v, (y - KEEL_Y) / (v.h - KEEL_Y));
        const sw = Math.sin(k * 1.3 + ph) * 0.14;
        const p = V(o[0] + ow[0] * 0.14 - ow[2] * sw, y, o[2] + ow[2] * 0.14 + ow[0] * sw);
        strut(prev, p, 0.09, 0.09, P.vine, 0.1);
        if (rng() < 0.7) leaf(p.x + ow[0] * 0.08, p.y, p.z + ow[2] * 0.08);
        prev = p;
      }
    }
    // a few vines down the courtyard side
    if (!nearBreach && v.h > 2.2 && rng() < 0.14) {
      hangingVine(v.it[0] - ow[0] * 0.12, v.h, v.it[2] - ow[2] * 0.12, 3 + Math.floor(rng() * 3), [-ow[2], 0, ow[0]]);
    }
    // moss cushions along the gunwale
    if (rng() < 0.3) {
      B.geo(new THREE.IcosahedronGeometry(0.45, 0), T((v.ot[0] + v.it[0]) / 2, v.h + 0.06, (v.ot[2] + v.it[2]) / 2, 0, rand(0, TAU), 0, 1.4, 0.45, 1.0), pick(P.moss), 0.1);
    }
    // earth banked against the half-buried hull
    if (!nearBreach && i % 2 === 0) {
      const g = outerAt(v, -KEEL_Y / (v.h - KEEL_Y));
      B.geo(new THREE.IcosahedronGeometry(1, 1), T(g[0] + ow[0] * 0.5, -0.05, g[2] + ow[2] * 0.5, 0, Math.atan2(-ow[2], ow[0]), 0, 1.0, 0.32, 1.9),
        () => (rng() < 0.6 ? pick(P.moss) : P.earth), 0.1);
    }
  }
  function fern(x, y, z, size = 1) {
    const n = 3 + Math.floor(rng() * 3);
    for (let k = 0; k < n; k++) {
      const a = k / n * TAU + rand(0, 1);
      B.geo(new THREE.ConeGeometry(0.16 * size, 1.1 * size, 4), T(x + Math.cos(a) * 0.2 * size, y + 0.45 * size, z + Math.sin(a) * 0.2 * size, Math.sin(a) * 0.55, 0, -Math.cos(a) * 0.55), pick(P.leaf), 0.12);
    }
  }
  for (const sg of [-1, 1]) {
    fern(sg * 13.1, 5.45, 0.7, 0.9);
    fern(sg * 12.4, 5.4, -0.8, 0.8);
  }
  // a cheeky sapling has made the stern deck its home
  B.geo(new THREE.CylinderGeometry(0.1, 0.17, 1.9, 5), T(-12.6, 5.5 + 0.95, 0.5, 0.08, 0, 0.1), P.sandDark, 0.1);
  B.geo(new THREE.IcosahedronGeometry(0.95, 0), T(-12.75, 7.5, 0.6, 0, 0.4, 0, 1, 0.8, 1), pick(P.leaf), 0.12);
  B.geo(new THREE.IcosahedronGeometry(0.6, 0), T(-12.2, 7.1, 1.1, 0, 1.1, 0), pick(P.leaf), 0.12);
  for (let k = 0; k < 9; k++) {
    const a = rand(0, TAU);
    const x = Math.cos(a) * (HULL_L + 1.2), z = Math.sin(a) * (HULL_W + 1.0);
    if (z > 5 && Math.abs(x) < BREACH + 3) continue;
    fern(x, 0, z, rand(0.8, 1.2));
  }
  for (const [x, z] of [[-3.8, -3.6], [3.2, -4.0], [-9.7, 2.9], [10.2, -1.6], [-5.4, 3.9]]) fern(x, 0.1, z, 0.7);

  // ---------------------------------------------------------------- assemble
  const root = new THREE.Group();
  root.name = 'lost-ark';
  const stone = new THREE.Mesh(B.build(), new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  stone.name = 'lost-ark-stone';
  stone.castShadow = true;
  stone.receiveShadow = true;
  root.add(stone);

  // The Diamond Rumal: tilted back a touch and turned 45° so it floats as a diamond.
  const rumalPivot = new THREE.Group();
  rumalPivot.position.set(0, RUMAL_Y, 0);
  root.add(rumalPivot);
  const clothFrame = new THREE.Group();
  clothFrame.rotation.set(-0.3, 0, Math.PI / 4);
  rumalPivot.add(clothFrame);

  const clothGeo = new THREE.PlaneGeometry(RUMAL_SIZE, RUMAL_SIZE, CLOTH_SEG, CLOTH_SEG);
  clothGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);
  clothGeo.attributes.normal.setUsage(THREE.DynamicDrawUsage);
  const nV = clothGeo.attributes.position.count;
  const clothU = new Float32Array(nV), clothV = new Float32Array(nV);
  for (let i = 0; i < nV; i++) {
    clothU[i] = clothGeo.attributes.position.getX(i) / RUMAL_SIZE;
    clothV[i] = clothGeo.attributes.position.getY(i) / RUMAL_SIZE;
  }
  clothGeo.computeBoundingSphere();
  clothGeo.boundingSphere.radius += 0.5;
  const silk = makeSilkTexture(THREE);
  const cloth = new THREE.Mesh(clothGeo, new THREE.MeshStandardMaterial({
    color: 0xffffff, map: silk, emissive: 0xfff2d6, emissiveMap: silk, emissiveIntensity: 0.42,
    roughness: 0.38, metalness: 0.08, side: THREE.DoubleSide,
  }));
  cloth.name = 'diamond-rumal';
  cloth.castShadow = true;
  clothFrame.add(cloth);

  // diamond studs: [u, v, size, phase]
  const studDefs = [];
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) studDefs.push([sx * 0.4, sy * 0.4, 1.35]);
  for (const k of [-0.2, 0, 0.2]) studDefs.push([k, 0.4, 1], [k, -0.4, 1], [0.4, k, 1], [-0.4, k, 1]);
  studDefs.push([0, 0, 1.75]);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) studDefs.push([dx * 0.17, dy * 0.17, 1.0]);
  for (const [dx, dy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) studDefs.push([dx * 0.12, dy * 0.12, 0.8]);
  for (let i = 0; i < studDefs.length; i++) studDefs[i].push(rand(0, TAU));
  const studMat = new THREE.MeshStandardMaterial({
    color: 0xeaf6ff, emissive: 0xbfe6ff, emissiveIntensity: 1.6, metalness: 0.25, roughness: 0.08, flatShading: true,
  });
  const studs = new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.055, 0), studMat, studDefs.length);
  studs.name = 'diamond-rumal-studs';
  studs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  studs.frustumCulled = false;
  clothFrame.add(studs);

  const glowTex = makeGlowTexture(THREE);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffe9b0, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.set(4.2, 4.2, 1);
  rumalPivot.add(glow);

  // shared by the sparkle and confetti shaders
  const pointUniforms = { uTime: { value: 0 }, uScale: { value: 600 } };

  const spPos = new Float32Array(SPARKLE_COUNT * 3);
  const spPhase = new Float32Array(SPARKLE_COUNT);
  const spSpeed = new Float32Array(SPARKLE_COUNT);
  const spColor = new Float32Array(SPARKLE_COUNT * 3);
  const sparkleTints = [new THREE.Color('#ffffff'), new THREE.Color('#fff0b8'), new THREE.Color('#ffd0e6'), new THREE.Color('#cfeaff')];
  for (let i = 0; i < SPARKLE_COUNT; i++) {
    const a = rand(0, TAU), r = Math.sqrt(rng()) * 1.6;
    spPos[i * 3] = Math.cos(a) * r;
    spPos[i * 3 + 1] = rand(-1.1, 1.1);
    spPos[i * 3 + 2] = Math.sin(a) * r;
    spPhase[i] = rng();
    spSpeed[i] = rand(0.6, 1.4);
    const tint = pick(sparkleTints);
    spColor[i * 3] = tint.r; spColor[i * 3 + 1] = tint.g; spColor[i * 3 + 2] = tint.b;
  }
  const spGeo = new THREE.BufferGeometry();
  spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
  spGeo.setAttribute('aPhase', new THREE.BufferAttribute(spPhase, 1));
  spGeo.setAttribute('aSpeed', new THREE.BufferAttribute(spSpeed, 1));
  spGeo.setAttribute('aColor', new THREE.BufferAttribute(spColor, 3));
  const sparkleUniforms = { uTime: pointUniforms.uTime, uScale: pointUniforms.uScale, uBurst: { value: 0 }, uOpacity: { value: 1 } };
  const sparkles = new THREE.Points(spGeo, new THREE.ShaderMaterial({
    name: 'rumal-sparkles', uniforms: sparkleUniforms, vertexShader: SPARKLE_VERT, fragmentShader: SPARKLE_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, toneMapped: false,
  }));
  sparkles.name = 'rumal-sparkles';
  sparkles.frustumCulled = false;
  sparkles.position.set(0, RUMAL_Y, 0);
  root.add(sparkles);

  // confetti pool (victory)
  const cfPos = new Float32Array(CONFETTI_COUNT * 3);
  const cfVel = new Float32Array(CONFETTI_COUNT * 3);
  const cfLife = new Float32Array(CONFETTI_COUNT);
  const cfSize = new Float32Array(CONFETTI_COUNT);
  const cfPhase = new Float32Array(CONFETTI_COUNT);
  const cfColor = new Float32Array(CONFETTI_COUNT * 3);
  const confettiTints = ['#ff8a1c', '#ff4f9a', '#f6c343', '#2f8f55', '#1f4fd1', '#fff4e2', '#c2187a'].map((h) => new THREE.Color(h));
  for (let i = 0; i < CONFETTI_COUNT; i++) {
    cfPos[i * 3 + 1] = -1e4;
    cfPhase[i] = rng();
    const tint = pick(confettiTints);
    cfColor[i * 3] = tint.r; cfColor[i * 3 + 1] = tint.g; cfColor[i * 3 + 2] = tint.b;
  }
  const cfGeo = new THREE.BufferGeometry();
  const cfPosAttr = new THREE.BufferAttribute(cfPos, 3).setUsage(THREE.DynamicDrawUsage);
  const cfSizeAttr = new THREE.BufferAttribute(cfSize, 1).setUsage(THREE.DynamicDrawUsage);
  cfGeo.setAttribute('position', cfPosAttr);
  cfGeo.setAttribute('aSize', cfSizeAttr);
  cfGeo.setAttribute('aPhase', new THREE.BufferAttribute(cfPhase, 1));
  cfGeo.setAttribute('aColor', new THREE.BufferAttribute(cfColor, 3));
  const confettiPoints = new THREE.Points(cfGeo, new THREE.ShaderMaterial({
    name: 'rumal-confetti', uniforms: pointUniforms, vertexShader: CONFETTI_VERT, fragmentShader: CONFETTI_FRAG,
    fog: false, toneMapped: false,
  }));
  confettiPoints.name = 'rumal-confetti';
  confettiPoints.frustumCulled = false;
  confettiPoints.visible = false;
  root.add(confettiPoints);

  return {
    root, rumalPivot, clothGeo, clothU, clothV, clothZ: new Float32Array(nV),
    studs, studDefs, studMat, glow, sparkles, sparkleUniforms, pointUniforms, colliders,
    confetti: { points: confettiPoints, pos: cfPos, vel: cfVel, life: cfLife, size: cfSize, phase: cfPhase, posAttr: cfPosAttr, sizeAttr: cfSizeAttr, alive: 0 },
  };
}

// Silk ripple in the cloth's own plane (u, v in −0.5..0.5); returns the offset along its normal.
function clothWave(u, v, t, amp) {
  const r2 = u * u + v * v;
  const edge = Math.min(1, r2 * 4);
  return amp * (edge * (0.075 * Math.sin(u * 9.0 + t * 2.3) + 0.055 * Math.sin(v * 7.5 - t * 1.9 + 1.3))
    + 0.035 * Math.sin((u + v) * 5.0 + t * 1.4)) - 0.08 * r2;
}

// ------------------------------------------------------------------ module
function init(ctx) {
  const THREE = ctx.THREE;
  const util = ctx.util;

  const arkPosition = { x: 0, z: 0 };
  const compass = { stage: 0, charge: 0, angle: 0, wobble: 0, distance: null, text: '' };

  let arkYaw = 0;
  let arkGround = 0;
  let arkCos = 1, arkSin = 0;
  let arkChunk = { cx: 0, cz: 0 };
  let assets = null;
  let arkBuilt = false;

  let beam = null;
  let beamFade = 0;

  let needle = 0;
  let wobbleAmp = 0;
  let announced = 0;
  let arrived = false;
  let heardNear = false;
  let ringSpawned = false;
  let rumalTaken = false;
  let lift = 0;
  let rumalSpin = 0;
  let nextFountain = 0;

  const wobbleNoise = util.makeNoise(util.hash32('quest', 'compass-wobble'));

  // Always in the scene (dark until the Ark streams in) so the light count never changes and
  // no material has to recompile when the Ark appears.
  const light = new THREE.PointLight(0xffefc4, 0, 24, 2);
  light.name = 'quest-rumal-light';
  light.castShadow = false;
  ctx.scene.add(light);

  // per-frame scratch
  const _v = new THREE.Vector3();
  const _pv = new THREE.Vector3();
  const _sv = new THREE.Vector3();
  const _qv = new THREE.Quaternion();
  const _mv = new THREE.Matrix4();
  const Z_AXIS = new THREE.Vector3(0, 0, 1);

  const content = () => ctx.content || {};

  function heightAt(x, z) {
    const h = ctx.world?.heightAt?.(x, z);
    return typeof h === 'number' && Number.isFinite(h) ? h : 0;
  }
  function biomeAt(x, z) {
    return ctx.world?.biomeAt?.(x, z) || 'jungle';
  }
  function toWorldX(lx, lz) { return arkPosition.x + lx * arkCos + lz * arkSin; }
  function toWorldZ(lx, lz) { return arkPosition.z - lx * arkSin + lz * arkCos; }

  function explorerPos() {
    const p = ctx.player?.position;
    if (p && Number.isFinite(p.x) && Number.isFinite(p.z)) return p;
    return ctx.camera.position;
  }

  // ---------------------------------------------------------------- choosing the site
  function chooseSite(seed) {
    const rng = util.rngFor(seed, 'quest');
    const sp = ctx.world?.getSpawnPoint?.() || { x: 0, z: 0 };
    const sx = Number.isFinite(sp.x) ? sp.x : 0, sz = Number.isFinite(sp.z) ? sp.z : 0;
    let ang = rng() * TAU;
    let dist = ARK_MIN_DIST + rng() * (ARK_MAX_DIST - ARK_MIN_DIST);
    let chosen = null, firstDry = null, best = null, bestScore = -Infinity;
    for (let i = 0; i < SITE_TRIES && !chosen; i++) {
      const x = sx + Math.sin(ang) * dist, z = sz + Math.cos(ang) * dist;
      const h = heightAt(x, z);
      const swamp = biomeAt(x, z) === 'swamp';
      if (h >= ARK_MIN_GROUND && !swamp) {
        let dryRing = 0;
        for (let k = 0; k < 8; k++) {
          const a = k / 8 * TAU;
          if (heightAt(x + Math.cos(a) * 18, z + Math.sin(a) * 18) >= 0.5) dryRing++;
        }
        if (dryRing >= 7) chosen = { x, z };
        else if (!firstDry) firstDry = { x, z };
      }
      const score = h - (swamp ? 10 : 0);
      if (score > bestScore) { bestScore = score; best = { x, z }; }
      // creep around the circle and wander in and out until the ground is right
      ang += (rng() - 0.5) * 0.3 + 0.045;
      dist = clamp(dist + (rng() - 0.5) * 90, ARK_MIN_DIST, ARK_MAX_DIST);
    }
    const site = chosen || firstDry || best || { x: sx, z: sz - ARK_MIN_DIST };
    arkPosition.x = site.x;
    arkPosition.z = site.z;
    // turn the breach (local +Z) to face the way explorers arrive
    arkYaw = Math.atan2(sx - site.x, sz - site.z) + (rng() - 0.5) * 0.5;
    arkCos = Math.cos(arkYaw);
    arkSin = Math.sin(arkYaw);
    const size = ctx.world?.CHUNK || 48;
    const ch = ctx.world?.chunkAt?.(site.x, site.z);
    arkChunk = ch && Number.isFinite(ch.cx) && Number.isFinite(ch.cz)
      ? { cx: ch.cx, cz: ch.cz }
      : { cx: Math.floor(site.x / size), cz: Math.floor(site.z / size) };
  }

  // ---------------------------------------------------------------- Ark in / out of the world
  function buildArk() {
    if (arkBuilt) return;
    if (!assets) assets = buildArkAssets(THREE, util);
    arkGround = heightAt(arkPosition.x, arkPosition.z);
    const root = assets.root;
    root.position.set(arkPosition.x, arkGround, arkPosition.z);
    root.rotation.set(0, arkYaw, 0);
    root.updateMatrixWorld(true);
    ctx.scene.add(root);
    arkBuilt = true;
    clearConfetti();
    if (typeof ctx.world?.addColliders === 'function') {
      const list = assets.colliders.map((c) => {
        const out = { x: toWorldX(c.x, c.z), z: toWorldZ(c.x, c.z), r: c.r, tag: c.tag };
        if (c.h !== undefined) out.h = c.h;
        return out;
      });
      ctx.world.addColliders(arkChunk.cx, arkChunk.cz, list);
    }
  }

  function removeArk() {
    light.intensity = 0;
    if (!arkBuilt) return;
    arkBuilt = false;
    clearConfetti();
    ctx.scene.remove(assets.root);
  }

  // A missed chunk:load (or a world without chunk events) still gets its Ark.
  function ensureArk() {
    if (arkBuilt) return;
    const w = ctx.world;
    if (typeof w?.isLoaded === 'function') {
      if (w.isLoaded(arkChunk.cx, arkChunk.cz)) buildArk();
    } else {
      const p = explorerPos();
