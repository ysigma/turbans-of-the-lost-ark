    return { mesh, m: mesh.instanceMatrix.array, c: withColor ? mesh.instanceColor.array : null, n: 0, cap };
  }

  const nearBatch = makeBatch(geos.hi[K_NORMAL], mats[K_NORMAL], 1536, true, 'turbans-near');
  const farBatch = makeBatch(geos.lo, mats[K_NORMAL], CAP + LOOSE_CAP, true, 'turbans-far');
  const specialBatch = [null,
    makeBatch(geos.hi[K_PINK], mats[K_PINK], SPECIAL_CAP, false, 'turbans-pink'),
    makeBatch(geos.hi[K_KESRI], mats[K_KESRI], SPECIAL_CAP, false, 'turbans-kesri'),
    makeBatch(geos.hi[K_GOLDEN], mats[K_GOLDEN], SPECIAL_CAP, false, 'turbans-golden'),
  ];
  const allBatches = [nearBatch, farBatch, specialBatch[1], specialBatch[2], specialBatch[3]];

  // Writes T·Ry(spin)·Rx(tilt)·S about the turban's centre, straight into the instance buffer.
  function pushInstance(batch, x, y, z, spin, tilt, s, r, g, b) {
    if (batch.n >= batch.cap) return false;
    const i = batch.n++;
    const o = i * 16, m = batch.m;
    const ca = Math.cos(spin), sa = Math.sin(spin), cb = Math.cos(tilt), sb = Math.sin(tilt);
    m[o] = ca * s; m[o + 1] = 0; m[o + 2] = -sa * s; m[o + 3] = 0;
    m[o + 4] = sa * sb * s; m[o + 5] = cb * s; m[o + 6] = ca * sb * s; m[o + 7] = 0;
    m[o + 8] = sa * cb * s; m[o + 9] = -sb * s; m[o + 10] = ca * cb * s; m[o + 11] = 0;
    const k = HALF_H * s;
    m[o + 12] = x - k * sa * sb; m[o + 13] = y - k * cb; m[o + 14] = z - k * ca * sb; m[o + 15] = 1;
    if (batch.c) { const c = i * 3; batch.c[c] = r; batch.c[c + 1] = g; batch.c[c + 2] = b; }
    return true;
  }

  function flushBatch(batch) {
    const mesh = batch.mesh;
    mesh.count = batch.n;
    if (batch.n > 0) {
      mesh.instanceMatrix.clearUpdateRanges();
      mesh.instanceMatrix.addUpdateRange(0, batch.n * 16);
      mesh.instanceMatrix.needsUpdate = true;
      if (batch.c) {
        mesh.instanceColor.clearUpdateRanges();
        mesh.instanceColor.addUpdateRange(0, batch.n * 3);
        mesh.instanceColor.needsUpdate = true;
      }
    }
  }

  // ================================================================ points (sparkles + halos)
  const scaleUniform = { value: 800 };
  const fadeUniform = { value: new THREE.Vector2(95, 165) };

  function makePoints(cap, star, name) {
    const geo = new THREE.BufferGeometry();
    const pos = new THREE.BufferAttribute(new Float32Array(cap * 3), 3);
    const col = new THREE.BufferAttribute(new Float32Array(cap * 3), 3);
    const size = new THREE.BufferAttribute(new Float32Array(cap), 1);
    const alpha = new THREE.BufferAttribute(new Float32Array(cap), 1);
    for (const a of [pos, col, size, alpha]) a.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', pos);
    geo.setAttribute('aColor', col);
    geo.setAttribute('aSize', size);
    geo.setAttribute('aAlpha', alpha);
    geo.setDrawRange(0, 0);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uScale: scaleUniform, uFade: fadeUniform },
      defines: star ? { STAR: 1 } : {},
      vertexShader: POINTS_VERT,
      fragmentShader: POINTS_FRAG,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const pts = new THREE.Points(geo, mat);
    pts.name = name;
    pts.frustumCulled = false;
    pts.renderOrder = 2;
    ctx.scene.add(pts);
    return { pts, geo, pos: pos.array, col: col.array, size: size.array, alpha: alpha.array, attrs: [pos, col, size, alpha], n: 0, cap };
  }

  function flushPoints(P) {
    P.geo.setDrawRange(0, P.n);
    if (P.n === 0) return;
    const widths = [3, 3, 1, 1];
    for (let a = 0; a < 4; a++) {
      const attr = P.attrs[a];
      attr.clearUpdateRanges();
      attr.addUpdateRange(0, P.n * widths[a]);
      attr.needsUpdate = true;
    }
  }

  const halos = makePoints(HALO_CAP, false, 'turban-halos');
  const sparks = makePoints(PARTICLE_CAP, true, 'turban-sparkles');

  function pushHalo(x, y, z, size, r, g, b, a) {
    if (halos.n >= halos.cap) return;
    const i = halos.n++;
    halos.pos[i * 3] = x; halos.pos[i * 3 + 1] = y; halos.pos[i * 3 + 2] = z;
    halos.col[i * 3] = r; halos.col[i * 3 + 1] = g; halos.col[i * 3 + 2] = b;
    halos.size[i] = size; halos.alpha[i] = a;
  }

  // Particle simulation state (structure of arrays, swap-remove compaction)
  const PA = {
    x: new Float32Array(PARTICLE_CAP), y: new Float32Array(PARTICLE_CAP), z: new Float32Array(PARTICLE_CAP),
    vx: new Float32Array(PARTICLE_CAP), vy: new Float32Array(PARTICLE_CAP), vz: new Float32Array(PARTICLE_CAP),
    age: new Float32Array(PARTICLE_CAP), life: new Float32Array(PARTICLE_CAP), size: new Float32Array(PARTICLE_CAP),
    r: new Float32Array(PARTICLE_CAP), g: new Float32Array(PARTICLE_CAP), b: new Float32Array(PARTICLE_CAP),
    grav: new Float32Array(PARTICLE_CAP), drag: new Float32Array(PARTICLE_CAP), tw: new Float32Array(PARTICLE_CAP),
    n: 0,
  };
  const PA_FIELDS = ['x', 'y', 'z', 'vx', 'vy', 'vz', 'age', 'life', 'size', 'r', 'g', 'b', 'grav', 'drag', 'tw'];

  function spark(x, y, z, vx, vy, vz, life, size, r, g, b, grav, drag) {
    if (PA.n >= PARTICLE_CAP) return;
    const i = PA.n++;
    PA.x[i] = x; PA.y[i] = y; PA.z[i] = z; PA.vx[i] = vx; PA.vy[i] = vy; PA.vz[i] = vz;
    PA.age[i] = 0; PA.life[i] = life; PA.size[i] = size;
    PA.r[i] = r; PA.g[i] = g; PA.b[i] = b; PA.grav[i] = grav; PA.drag[i] = drag;
    PA.tw[i] = Math.random() * TAU;
  }

  function killSpark(i) {
    const last = --PA.n;
    if (i !== last) for (let f = 0; f < PA_FIELDS.length; f++) { const arr = PA[PA_FIELDS[f]]; arr[i] = arr[last]; }
  }

  function stepSparks(dt) {
    for (let i = PA.n - 1; i >= 0; i--) {
      PA.age[i] += dt;
      if (PA.age[i] >= PA.life[i]) { killSpark(i); continue; }
      const k = Math.exp(-PA.drag[i] * dt);
      PA.vx[i] *= k; PA.vz[i] *= k; PA.vy[i] = PA.vy[i] * k - PA.grav[i] * dt;
      PA.x[i] += PA.vx[i] * dt; PA.y[i] += PA.vy[i] * dt; PA.z[i] += PA.vz[i] * dt;
    }
    const n = PA.n;
    for (let i = 0; i < n; i++) {
      const u = PA.age[i] / PA.life[i];
      sparks.pos[i * 3] = PA.x[i]; sparks.pos[i * 3 + 1] = PA.y[i]; sparks.pos[i * 3 + 2] = PA.z[i];
      sparks.col[i * 3] = PA.r[i]; sparks.col[i * 3 + 1] = PA.g[i]; sparks.col[i * 3 + 2] = PA.b[i];
      sparks.size[i] = PA.size[i] * (1 - 0.55 * u);
      sparks.alpha[i] = (1 - u * u) * (0.7 + 0.3 * Math.sin(PA.age[i] * 32 + PA.tw[i]));
    }
    sparks.n = n;
  }

  // ================================================================ colours
  let palette = null;       // [{r,g,b}] linear, from content.turbanColors
  let kindRGB = null;       // per kind sparkle colour, from content.kindColors
  const CREAM = new THREE.Color('#fff4e2');

  function getPalette() {
    if (palette) return palette;
    const hexes = (ctx.content && Array.isArray(ctx.content.turbanColors) && ctx.content.turbanColors.length)
      ? ctx.content.turbanColors
      : ['#1f4fd1', '#14213d', '#7a1f2b', '#1d1d1f', '#f4f1ea', '#ff8a1c', '#f2c230', '#1f6f3f', '#ff4f9a'];
    palette = hexes.map((h) => new THREE.Color(h));
    return palette;
  }

  function getKindRGB() {
    if (kindRGB) return kindRGB;
    const kc = (ctx.content && ctx.content.kindColors) || {};
    const fallback = { normal: '#fff6e6', pink: '#ff6fb0', kesri: '#ff9a2e', golden: '#ffd447' };
    kindRGB = KIND_NAMES.map((k) => new THREE.Color(kc[k] || fallback[k]));
    return kindRGB;
  }

  // ================================================================ world helpers
  function groundAt(x, z) {
    const w = ctx.world;
    const h = w && typeof w.heightAt === 'function' ? w.heightAt(x, z) : 0;
    return Number.isFinite(h) ? h : 0;
  }
  function waterLevel() { const wl = ctx.world && ctx.world.WATER_LEVEL; return typeof wl === 'number' ? wl : 0; }
  function surfaceAt(x, z) { return Math.max(groundAt(x, z), waterLevel()); }
  function waterDepth(x, z) {
    const w = ctx.world;
    if (w && typeof w.waterDepthAt === 'function') { const d = w.waterDepthAt(x, z); if (Number.isFinite(d)) return d; }
    return Math.max(0, waterLevel() - groundAt(x, z));
  }

  let spawnCache = null, spawnSeed = -1;
  function spawnPoint() {
    if (spawnCache && spawnSeed === ctx.seed) return spawnCache;
    const s = ctx.world?.getSpawnPoint?.();
    spawnCache = s && Number.isFinite(s.x) ? { x: s.x, z: s.z } : { x: 0, z: 0 };
    spawnSeed = ctx.seed;
    return spawnCache;
  }

  // ================================================================ placed-turban pool
  const P = {
    bx: new Float32Array(CAP), by: new Float32Array(CAP), bz: new Float32Array(CAP), // home (centre)
    x: new Float32Array(CAP), y: new Float32Array(CAP), z: new Float32Array(CAP),    // in flight
    phase: new Float32Array(CAP), kind: new Uint8Array(CAP), state: new Uint8Array(CAP),
    r: new Float32Array(CAP), g: new Float32Array(CAP), b: new Float32Array(CAP),
    v: new Float32Array(CAP), sw: new Float32Array(CAP), ft: new Float32Array(CAP),
    id: new Array(CAP).fill(''),
    free: new Int32Array(CAP), freeTop: 0,
    active: new Int32Array(CAP), activePos: new Int32Array(CAP), activeN: 0,
  };
  function resetPlacedPool() {
    P.freeTop = 0;
    for (let i = CAP - 1; i >= 0; i--) { P.free[P.freeTop++] = i; P.state[i] = FREE; P.id[i] = ''; }
    P.activeN = 0;
  }
  function allocPlaced() {
    if (P.freeTop === 0) return -1;
    const i = P.free[--P.freeTop];
    P.activePos[i] = P.activeN;
    P.active[P.activeN++] = i;
    return i;
  }
  function freePlaced(i) {
    if (P.state[i] === FREE) return;
    P.state[i] = FREE;
    P.id[i] = '';
    const pos = P.activePos[i], last = P.active[--P.activeN];
    P.active[pos] = last;
    P.activePos[last] = pos;
    P.free[P.freeTop++] = i;
  }

  // ================================================================ loose-turban pool
  const L = {
    x: new Float32Array(LOOSE_CAP), y: new Float32Array(LOOSE_CAP), z: new Float32Array(LOOSE_CAP),
    vx: new Float32Array(LOOSE_CAP), vy: new Float32Array(LOOSE_CAP), vz: new Float32Array(LOOSE_CAP),
    born: new Float32Array(LOOSE_CAP), life: new Float32Array(LOOSE_CAP), collectAt: new Float32Array(LOOSE_CAP),
    restY: new Float32Array(LOOSE_CAP), phase: new Float32Array(LOOSE_CAP),
    hx: new Float32Array(LOOSE_CAP), hz: new Float32Array(LOOSE_CAP), // home of permanent ones
    kind: new Uint8Array(LOOSE_CAP), state: new Uint8Array(LOOSE_CAP), bounce: new Uint8Array(LOOSE_CAP), perm: new Uint8Array(LOOSE_CAP),
    r: new Float32Array(LOOSE_CAP), g: new Float32Array(LOOSE_CAP), b: new Float32Array(LOOSE_CAP),
    v: new Float32Array(LOOSE_CAP), sw: new Float32Array(LOOSE_CAP), ft: new Float32Array(LOOSE_CAP),
    key: new Array(LOOSE_CAP).fill(''),
    free: new Int32Array(LOOSE_CAP), freeTop: 0,
    active: new Int32Array(LOOSE_CAP), activePos: new Int32Array(LOOSE_CAP), activeN: 0,
  };
  const permKeys = new Set();       // permanent loose turbans present now
  const permCollected = new Set();  // permanent loose turbans collected this run

  function resetLoosePool() {
    L.freeTop = 0;
    for (let i = LOOSE_CAP - 1; i >= 0; i--) { L.free[L.freeTop++] = i; L.state[i] = FREE; L.key[i] = ''; }
    L.activeN = 0;
    permKeys.clear();
  }
  function allocLoose() {
    if (L.freeTop === 0) {
      // full: recycle the oldest temporary turban
      let oldest = -1, oldestBorn = Infinity;
      for (let a = 0; a < L.activeN; a++) {
        const i = L.active[a];
        if (!L.perm[i] && L.born[i] < oldestBorn) { oldestBorn = L.born[i]; oldest = i; }
      }
      if (oldest < 0) return -1;
      freeLoose(oldest);
    }
    const i = L.free[--L.freeTop];
    L.activePos[i] = L.activeN;
    L.active[L.activeN++] = i;
    return i;
  }
  function freeLoose(i) {
    if (L.state[i] === FREE) return;
    L.state[i] = FREE;
    if (L.key[i]) { permKeys.delete(L.key[i]); L.key[i] = ''; }
    const pos = L.activePos[i], last = L.active[--L.activeN];
    L.active[pos] = last;
    L.activePos[last] = pos;
    L.free[L.freeTop++] = i;
  }

  // ================================================================ run state
  const chunks = new Map();        // key → {cx, cz, slots:[]}
  const collectedIds = new Set();  // `${cx},${cz},${i}` collected this run
  let lastPickupT = -Infinity;

  resetPlacedPool();
  resetLoosePool();

  // ================================================================ placement
  const gen = {
    x0: 0, z0: 0, size: 48, n: 0,
    x: new Float32Array(CAND_CAP), z: new Float32Array(CAND_CAP), h: new Float32Array(CAND_CAP),
    phase: new Float32Array(CAND_CAP), color: new Uint8Array(CAND_CAP), prize: new Uint8Array(CAND_CAP),
    kind: new Uint8Array(CAND_CAP),
    // current pattern
    k: 0, phaseBase: 0, phaseStep: 0, scheme: 0, c0: 0, c1: 0,
  };
  const prizeScratch = [];

  function beginPattern(rng, phaseMode) {
    const U = ctx.util;
    const pal = getPalette();
    gen.k = 0;
    gen.phaseBase = rng() * TAU;
    gen.phaseStep = phaseMode === 'shared' ? 0 : 0.55;
    gen.scheme = U.randInt(rng, 0, 2);          // 0 solid, 1 two-tone, 2 rainbow
    gen.c0 = U.randInt(rng, 0, pal.length - 1);
    gen.c1 = (gen.c0 + U.randInt(rng, 1, pal.length - 1)) % pal.length;
  }

  function addCand(x, z, h, prize) {
    const k = gen.k++;
    if (gen.n >= CAND_CAP) return false;
    if (x < gen.x0 - 0.5 || x >= gen.x0 + gen.size + 0.5 || z < gen.z0 - 0.5 || z >= gen.z0 + gen.size + 0.5) return false;
    if (waterDepth(x, z) > 0.4) return false;
    for (let j = 0; j < gen.n; j++) {
      const dx = gen.x[j] - x, dz = gen.z[j] - z, dh = gen.h[j] - h;
      if (dx * dx + dz * dz < 0.4356 && Math.abs(dh) < 0.48) return false;
    }
    const pal = getPalette();
    const i = gen.n++;
    gen.x[i] = x; gen.z[i] = z; gen.h[i] = h;
    gen.phase[i] = (gen.phaseBase + k * gen.phaseStep) % TAU;
    gen.color[i] = gen.scheme === 0 ? gen.c0 : gen.scheme === 1 ? (k % 2 ? gen.c1 : gen.c0) : (gen.c0 + k) % pal.length;
    gen.prize[i] = prize ? 1 : 0;
    gen.kind[i] = K_NORMAL;
    return true;
  }

  function insidePoint(rng, margin) {
    const U = ctx.util;
    return [gen.x0 + U.rand(rng, margin, gen.size - margin), gen.z0 + U.rand(rng, margin, gen.size - margin)];
  }

  // heading (sin, cos convention) from a point roughly toward the chunk centre, so lines stay inside
  function inwardHeading(rng, x, z) {
    const mx = gen.x0 + gen.size / 2, mz = gen.z0 + gen.size / 2;
    return Math.atan2(mx - x, mz - z) + ctx.util.rand(rng, -0.9, 0.9);
  }

  function patTrail(rng) {
    const U = ctx.util;
    beginPattern(rng, 'wave');
    const n = U.randInt(rng, 6, 12), sp = U.rand(rng, 1.9, 2.4), bend = U.rand(rng, -0.14, 0.14);
    let [x, z] = insidePoint(rng, 5);
    let a = inwardHeading(rng, x, z);
    for (let i = 0; i < n; i++) {
      addCand(x, z, HOVER, i === n - 1 && n >= 10);
      x += Math.sin(a) * sp; z += Math.cos(a) * sp; a += bend;
    }
  }

  function patArc(rng, rocks) {
    const U = ctx.util;
    beginPattern(rng, 'wave');
    const rock = rocks.length ? U.pick(rng, rocks) : null;
    const useRock = U.chance(rng, 0.85) && rock;
    let ox, oz, oh = 0, or = 0;
    if (useRock) { ox = rock.x; oz = rock.z; oh = rock.h || 0; or = rock.r || 0.6; } else { [ox, oz] = insidePoint(rng, 7); }
    const n = U.chance(rng, 0.5) ? 7 : 9;
    const span = U.rand(rng, 7, 9) + or * 2;
    const a = U.rand(rng, 0, TAU), dx = Math.sin(a), dz = Math.cos(a);
    const peak = Math.max(2.5, oh + 1.3);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), s = (u - 0.5) * span;
      addCand(ox + dx * s, oz + dz * s, HOVER + (peak - HOVER) * Math.sin(Math.PI * u), i === (n - 1) / 2);
    }
  }

  function patCircle(rng, centre, around) {
    const U = ctx.util;
    beginPattern(rng, 'wave');
    let cx, cz, rad;
    if (centre && around === 'tree') { cx = centre.x; cz = centre.z; rad = (centre.r || 0.5) + U.rand(rng, 1.9, 2.5); }
    else if (centre) { cx = centre.x; cz = centre.z; rad = U.clamp((centre.r || 6) - 1.5, 3, 5.5); }
    else { [cx, cz] = insidePoint(rng, 7); rad = U.rand(rng, 3, 4); }
    const a0 = U.rand(rng, 0, TAU), wave = U.chance(rng, 0.5);
    for (let i = 0; i < 8; i++) {
      const a = a0 + (i / 8) * TAU;
      addCand(cx + Math.sin(a) * rad, cz + Math.cos(a) * rad, HOVER + (wave && i % 2 ? 0.45 : 0), false);
    }
    if (around !== 'tree') addCand(cx, cz, 1.7, true); // a prize in the middle of the ring
  }

  function patZigzag(rng) {
    const U = ctx.util;
    beginPattern(rng, 'wave');
    const n = U.randInt(rng, 8, 12), step = 1.7, amp = U.rand(rng, 1.2, 1.8);
    const [x0, z0] = insidePoint(rng, 6);
    const a = inwardHeading(rng, x0, z0);
    const fx = Math.sin(a), fz = Math.cos(a), lx = Math.cos(a), lz = -Math.sin(a);
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? amp : -amp;
      addCand(x0 + fx * step * i + lx * side, z0 + fz * step * i + lz * side, HOVER, false);
    }
  }

  function patStack(rng, rocks) {
    const U = ctx.util;
    beginPattern(rng, 'shared');
    let x, z;
    const rock = rocks.length ? U.pick(rng, rocks) : null;
    const a = U.rand(rng, 0, TAU);
    if (rock && U.chance(rng, 0.5)) { const d = (rock.r || 0.6) + 1.3; x = rock.x + Math.sin(a) * d; z = rock.z + Math.cos(a) * d; }
    else [x, z] = insidePoint(rng, 4);
    const n = U.randInt(rng, 3, 4);
    for (let k = 0; k < n; k++) addCand(x, z, HOVER + k * 0.6, k === 2);
  }

  function patSpiral(rng) {
    const U = ctx.util;
    beginPattern(rng, 'wave');
    const n = U.randInt(rng, 10, 14), dir = U.chance(rng, 0.5) ? 1 : -1, a0 = U.rand(rng, 0, TAU);
    const [cx, cz] = insidePoint(rng, 8);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), r = 1.5 + 3 * u, a = a0 + i * 0.62 * dir;
      addCand(cx + Math.sin(a) * r, cz + Math.cos(a) * r, HOVER + 1.3 * u, i === n - 1);
    }
  }

  const ANCHOR_TAGS = /^(tree|palm|bamboo|rock|stone|pillar|log)$/;
  const ARK_KEEP_OUT = 18; // m; the hull reaches ~15 m from its centre

  // Ark centre as fixed by quest.reset (runs before any chunk loads), or null.
  function arkCentre() {
    let a = null;
    try { a = ctx.quest?.arkPosition; if (typeof a === 'function') a = a(); } catch (e) { a = null; }
    return a && Number.isFinite(a.x) && Number.isFinite(a.z) ? a : null;
  }

  function findAnchors(x0, z0, size) {
    const rocks = [], trees = [];
    let list = null;
    try { list = ctx.world?.queryColliders?.(x0 + size / 2, z0 + size / 2, size * 0.75); } catch (e) { list = null; }
    if (Array.isArray(list)) {
      for (const c of list) {
        if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.z)) continue;
        // Only the world's own vegetation/rocks: they are generated with the chunk itself, so the
        // anchor set (and with it how much rng the patterns consume) never depends on load order.
        // Quest/landmark colliders (Ark hull, dhaba...) can be filed under a neighbour's key.
        if (!ANCHOR_TAGS.test(c.tag || '')) continue;
        if (c.x < x0 + 3 || c.x > x0 + size - 3 || c.z < z0 + 3 || c.z > z0 + size - 3) continue;
        const r = Number.isFinite(c.r) ? c.r : 0.5;
        if (typeof c.h === 'number' && c.h > 0.25 && c.h <= 2.2 && r <= 2.4) rocks.push(c);
        else if ((typeof c.h !== 'number' || c.h > 4) && r >= 0.25 && r <= 2.2) trees.push(c);
      }
    }
    const byPos = (a, b) => (a.x - b.x) || (a.z - b.z);
    rocks.sort(byPos);
    trees.sort(byPos);
    return { rocks, trees };
  }

  function blockedByCollider(x, z, hAbove) {
    let cols = null;
    try { cols = ctx.world?.queryColliders?.(x, z, 1.2); } catch (e) { cols = null; }
    if (!Array.isArray(cols) || !cols.length) return false;
    for (const c of cols) {
      if (!c || !Number.isFinite(c.x)) continue;
      const rr = (Number.isFinite(c.r) ? c.r : 0.5) + 0.45;
      const dx = x - c.x, dz = z - c.z;
      if (dx * dx + dz * dz < rr * rr) {
        if (typeof c.h === 'number' && c.h > 0 && hAbove - HALF_H > c.h + 0.25) continue; // floats over the log
        return true;
      }
    }
    return false;
  }

  function choosePattern(rng, biome) {
    const w = PATTERN_WEIGHTS[biome] || PATTERN_WEIGHTS.jungle;
    let total = 0;
    for (let i = 0; i < w.length; i++) total += w[i];
    let r = rng() * total;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
    return 0;
  }

  function placeChunk(rec, e) {
    const U = ctx.util;
    const rng = U.rngFor(ctx.seed, 'collectibles', rec.cx, rec.cz);
    const size = Number.isFinite(e.size) ? e.size : (ctx.world?.CHUNK || 48);
    gen.size = size;
    gen.x0 = Number.isFinite(e.x0) ? e.x0 : rec.cx * size;
    gen.z0 = Number.isFinite(e.z0) ? e.z0 : rec.cz * size;
    gen.n = 0;
    const { rocks, trees } = findAnchors(gen.x0, gen.z0, size);
    const clearings = Array.isArray(e.clearings) ? e.clearings : [];
    const biome = e.biome || ctx.world?.biomeAt?.(gen.x0 + size / 2, gen.z0 + size / 2) || 'jungle';
    const target = U.randInt(rng, 40, 70);

    // Clearings are made for turban circles.
    for (let c = 0; c < clearings.length && c < 2; c++) {
      const cl = clearings[c];
      if (cl && Number.isFinite(cl.x) && U.chance(rng, 0.75)) patCircle(rng, cl, 'clearing');
    }
    for (let attempts = 0; gen.n < target && attempts < 24; attempts++) {
      switch (choosePattern(rng, biome)) {
        case 0: patTrail(rng); break;
        case 1: patArc(rng, rocks); break;
        case 2: {
          const tree = trees.length ? U.pick(rng, trees) : null;
          if (tree && U.chance(rng, 0.75)) patCircle(rng, tree, 'tree'); else patCircle(rng, null, 'open');
          break;
        }
        case 3: patZigzag(rng); break;
        case 4: patStack(rng, rocks); break;
        default: patSpiral(rng); break;
      }
    }

    // Specials go on prize spots (arc peaks, stack tops, ring centres, spiral tips).
    const sp = spawnPoint();
    const dc = Math.hypot(gen.x0 + size / 2 - sp.x, gen.z0 + size / 2 - sp.z);
    const far = 1 - 0.5 * smooth01(250, 700, dc);
    const wantGolden = rng() < 0.2 * far, wantKesri = rng() < 1 / 3, wantPink = rng() < 0.5;
    prizeScratch.length = 0;
    for (let i = 0; i < gen.n; i++) if (gen.prize[i]) prizeScratch.push(i);
    U.shuffle(rng, prizeScratch);
    const assign = (kind) => {
      if (!gen.n) return;
      let idx = prizeScratch.length ? prizeScratch.pop() : -1;
      for (let tries = 0; idx < 0 && tries < 6; tries++) {
        const j = U.randInt(rng, 0, gen.n - 1);
        if (gen.kind[j] === K_NORMAL) idx = j;
      }
      if (idx >= 0) gen.kind[idx] = kind;
    };
    if (wantGolden) assign(K_GOLDEN);
    if (wantKesri) assign(K_KESRI);
    if (wantPink) assign(K_PINK);

    // Materialise. Ids are candidate indices, fixed before the collider test (which can depend
    // on what neighbouring chunks registered), so a collected id always means the same turban.
    // The Ark's colliders only exist once its own chunk has loaded, so keep its footprint clear
    // by position instead (the quest's golden ring is spawned separately via spawnLoose).
    const pal = getPalette();
    const ark = arkCentre();
    for (let i = 0; i < gen.n; i++) {
      const id = `${rec.cx},${rec.cz},${i}`;
      if (collectedIds.has(id)) continue;
      const x = gen.x[i], z = gen.z[i], h = gen.h[i];
      if (ark && U.dist2(x, z, ark.x, ark.z) < ARK_KEEP_OUT * ARK_KEEP_OUT) continue;
      if (blockedByCollider(x, z, h)) continue;
      const s = allocPlaced();
      if (s < 0) break;
      const kind = gen.kind[i];
      const y = surfaceAt(x, z) + h;
      P.bx[s] = x; P.by[s] = y; P.bz[s] = z;
      P.x[s] = x; P.y[s] = y; P.z[s] = z;
      P.phase[s] = gen.phase[i];
      P.kind[s] = kind;
      P.state[s] = IDLE;
      const col = pal[gen.color[i] % pal.length];
      P.r[s] = col.r; P.g[s] = col.g; P.b[s] = col.b;
      P.id[s] = id;
      rec.slots.push(s);
    }
  }

  function unloadChunk(key) {
    const rec = chunks.get(key);
    if (!rec) return;
    for (const s of rec.slots) freePlaced(s);
    chunks.delete(key);
  }

  function onChunkLoad(e) {
    if (!e || !Number.isFinite(e.cx) || !Number.isFinite(e.cz)) return;
    const key = `${e.cx},${e.cz}`;
    if (chunks.has(key)) unloadChunk(key);
    const rec = { cx: e.cx, cz: e.cz, slots: [] };
    chunks.set(key, rec);
    placeChunk(rec, e);
  }

  function onChunkUnload(e) {
    if (!e) return;
    unloadChunk(`${e.cx},${e.cz}`);
  }

  // ================================================================ sparkle bursts
  function burstAt(x, y, z, k, r, g, b) {
    const KC = getKindRGB()[k];
    const golden = k === K_GOLDEN, special = k !== K_NORMAL;
    const n = golden ? 34 : special ? 20 : 10;
    // brighten dark cloth so additive sparkles still read
    const br = r * 0.45 + CREAM.r * 0.55, bg = g * 0.45 + CREAM.g * 0.55, bb = b * 0.45 + CREAM.b * 0.55;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, up = Math.random() * 0.9 + 0.1;
      const sp = golden ? 3.5 + Math.random() * 3.5 : 2 + Math.random() * 2.5;
      const hz = Math.sqrt(1 - up * up) * sp;
      const useKind = special ? i % 3 !== 0 : i % 2 === 0;
      spark(x, y, z, Math.cos(a) * hz, up * sp, Math.sin(a) * hz,
        (golden ? 0.7 : 0.45) + Math.random() * (golden ? 0.7 : 0.45),
        (golden ? 0.22 : 0.16) + Math.random() * (golden ? 0.22 : 0.16),
        useKind ? KC.r : br, useKind ? KC.g : bg, useKind ? KC.b : bb, 3, 2.4);
    }
    if (special) {
      const ring = golden ? 22 : 14;
      for (let i = 0; i < ring; i++) {
        const a = (i / ring) * TAU, sp = golden ? 6 : 4.5;
        spark(x, y, z, Math.cos(a) * sp, 0.2, Math.sin(a) * sp, 0.5, golden ? 0.3 : 0.22, KC.r, KC.g, KC.b, 0, 3.2);
      }
    }
    spark(x, y, z, 0, 0.4, 0, golden ? 0.32 : 0.22, golden ? 3.4 : special ? 2.2 : 1.5, KC.r, KC.g, KC.b, 0, 0);
    if (golden) spark(x, y, z, 0, 0.6, 0, 0.5, 2.2, CREAM.r, CREAM.g, CREAM.b, 0, 0);
  }

  // ================================================================ collecting + combo
  function endCombo() {
    const st = ctx.state;
    if (st && st.combo > 0) {
      const count = st.combo;
      st.combo = 0;
      ctx.events.emit('combo:end', { count });
    }
  }

  function collect(k, x, y, z, loose, r, g, b, t) {
    const st = ctx.state;
    const kind = KIND_NAMES[k], value = KIND_VALUE[k];
    st.turbans = (st.turbans || 0) + value;
    st.totalCollected = (st.totalCollected || 0) + value;
    st.pickups = (st.pickups || 0) + 1;
    st.combo = (st.combo > 0 && t - lastPickupT <= COMBO_WINDOW) ? st.combo + 1 : 1;
    lastPickupT = t;
    if (st.combo > (st.bestCombo || 0)) st.bestCombo = st.combo;

    burstAt(x, y, z, k, r, g, b);
    ctx.events.emit('turban:collect', { kind, value, position: new THREE.Vector3(x, y, z), combo: st.combo, loose: !!loose });

    const milestones = ctx.content?.comboMilestones;
    if (Array.isArray(milestones)) {
      for (const m of milestones) if (m && m.count === st.combo) { ctx.events.emit('combo:milestone', { ...m }); break; }
    }

    if (k === K_KESRI) {
      st.magnetUntil = Math.max(st.magnetUntil || 0, t + MAGNET_TIME);
      ctx.events.emit('powerup', { type: 'magnet', duration: MAGNET_TIME });
    } else if (k === K_PINK) {
      st.boostUntil = Math.max(st.boostUntil || 0, t + BHANGRA_TIME);
      ctx.events.emit('powerup', { type: 'bhangra', duration: BHANGRA_TIME });
    }
  }

  // ================================================================ per-frame player snapshot
  const pl = { ok: false, x: 0, y: 0, z: 0, h: 1.6, chestY: 0, reach2: 1.7, mag2: 9, magR: 3 };

  function snapPlayer(t) {
    const p = ctx.player;
    const pos = p && p.position;
    if (!pos || !Number.isFinite(pos.x)) { pl.ok = false; return; }
    const stats = p.stats || {};
    const radius = Number.isFinite(p.radius) ? p.radius : Number.isFinite(stats.radius) ? stats.radius : 0.4;
    const height = Number.isFinite(p.height) ? p.height : Number.isFinite(stats.height) ? stats.height : 1.6;
    const base = Number.isFinite(stats.magnet) ? stats.magnet : 2.5;
    const st = ctx.state;
    pl.ok = true;
    pl.x = pos.x; pl.y = pos.y; pl.z = pos.z; pl.h = height;
    pl.chestY = pos.y + height * 0.6;
    const reach = radius + 0.9;
    pl.reach2 = reach * reach;
    pl.magR = Math.max(base, t < (st.magnetUntil || 0) ? MAGNET_RADIUS : 0);
    pl.mag2 = pl.magR * pl.magR;
  }

  // within grabbing distance: horizontal reach, and vertically between shins and just over the head
  function touching(x, y, z) {
    const dx = x - pl.x, dz = z - pl.z;
    if (dx * dx + dz * dz > pl.reach2) return false;
    return y >= pl.y - 0.4 && y <= pl.y + pl.h + 0.5;
  }
  function inMagnet(x, y, z) {
    const dx = x - pl.x, dy = y - pl.chestY, dz = z - pl.z;
    return dx * dx + dy * dy + dz * dz < pl.mag2;
  }

  // Accelerating, slightly swirling flight into the player's chest. Returns true on arrival.
  function stepFly(S, i, dt) {
    const dx = pl.x - S.x[i], dy = pl.chestY - S.y[i], dz = pl.z - S.z[i];
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    S.ft[i] += dt;
    if (d < 0.5 || S.ft[i] > FLY_MAX_TIME) return true;
    const v = S.v[i] + (FLY_ACCEL + 30 / (d + 0.5)) * dt;
    S.v[i] = v;
    const step = Math.min(d, v * dt) / d;
    const swirl = S.sw[i] * Math.min(1, d / 5) * v * 0.55 * dt / d;
    S.x[i] += dx * step - dz * swirl;
    S.z[i] += dz * step + dx * swirl;
    S.y[i] += dy * step + Math.min(1, d / 4) * 1.2 * dt;
    return d - v * dt < 0.5;
  }

  // ================================================================ spawnLoose
  function spawnLoose(position, count = 1, opts = {}) {
    const o = opts || {};
    const spread = Number.isFinite(o.spread) ? o.spread : 5;
    const life = o.life === Infinity ? Infinity : (Number.isFinite(o.life) ? o.life : 8);
    const k = kindIndex(o.kind || 'normal');
    const bounce = o.bounce !== false;
    const n = Math.max(0, Math.min(60, Math.floor(Number.isFinite(count) ? count : 1)));
    if (!position || !n) return 0;
    const px = Number(position.x) || 0, pz = Number(position.z) || 0;
    const t = ctx.time || 0;
    const permanent = !bounce && life === Infinity;
    const pal = getPalette();
    const ringJitter = Math.random() * TAU;
    let made = 0;
    for (let j = 0; j < n; j++) {
      let x = px, z = pz;
      if (!bounce && n > 1) { const a = (j / n) * TAU; x += Math.sin(a) * spread; z += Math.cos(a) * spread; }
      let key = '';
      if (permanent) {
        key = `${KIND_NAMES[k]}:${Math.round(x * 2)},${Math.round(z * 2)}`;
        if (permKeys.has(key) || permCollected.has(key)) continue; // never duplicate or re-spawn
      }
      const i = allocLoose();
      if (i < 0) break;
      const ground = surfaceAt(x, z);
      L.kind[i] = k;
      L.perm[i] = permanent ? 1 : 0;
      L.bounce[i] = bounce ? 1 : 0;
      L.born[i] = t;
      L.life[i] = life;
      L.phase[i] = Math.random() * TAU;
      L.v[i] = 0; L.ft[i] = 0; L.sw[i] = j % 2 ? 1 : -1;
      L.key[i] = key;
      if (key) permKeys.add(key);
      if (k === K_NORMAL) { const c = pal[(Math.random() * pal.length) | 0]; L.r[i] = c.r; L.g[i] = c.g; L.b[i] = c.b; }
      else { L.r[i] = 1; L.g[i] = 1; L.b[i] = 1; }
      if (bounce) {
        // Sonic-style: rings of up to 16 bursting outward, outer rings slower
        const ring = (j / 16) | 0, inRing = Math.min(16, n - ring * 16);
        const a = ((j % 16) / inRing) * TAU + ringJitter + ring * 0.2 + (Math.random() - 0.5) * 0.25;
        const hs = spread * Math.max(0.45, 1.25 - 0.35 * ring) * (0.85 + Math.random() * 0.3);
        const py = Number.isFinite(position.y) ? position.y : ground;
        L.x[i] = x; L.z[i] = z; L.y[i] = Math.max(py, ground) + 1.0;
        L.vx[i] = Math.sin(a) * hs; L.vz[i] = Math.cos(a) * hs; L.vy[i] = 6.5 + Math.random() * 2.5;
        L.state[i] = AIR;
        L.collectAt[i] = t + LOOSE_GRACE;
        L.restY[i] = ground + REST_HOVER;
      } else {
        const py = Number.isFinite(position.y) ? position.y : -Infinity;
        const y = py > ground + 0.4 ? py : ground + HOVER;
        L.x[i] = x; L.y[i] = y; L.z[i] = z;
        L.hx[i] = x; L.hz[i] = z;
        L.vx[i] = 0; L.vy[i] = 0; L.vz[i] = 0;
        L.state[i] = REST;
        L.restY[i] = y;
        L.collectAt[i] = t;
      }
      made++;
    }
    return made;
  }

  // ================================================================ pullAround (Turban Tornado)
  function pullAround(x, z, r) {
    if (ctx.state?.mode !== 'playing' || !Number.isFinite(x) || !Number.isFinite(z)) return 0;
    const r2 = (Number.isFinite(r) ? r : 9) ** 2;
    const t = ctx.time || 0;
    let count = 0;
    for (let a = 0; a < P.activeN; a++) {
      const i = P.active[a];
      if (P.state[i] !== IDLE) continue;
      const dx = P.bx[i] - x, dz = P.bz[i] - z;
      if (dx * dx + dz * dz > r2) continue;
      P.state[i] = FLYING;
      P.x[i] = P.bx[i]; P.y[i] = P.by[i]; P.z[i] = P.bz[i];
      P.v[i] = FLY_START * 2; P.ft[i] = 0; P.sw[i] = 1; // the tornado swirls them all one way
      count++;
    }
    for (let a = 0; a < L.activeN; a++) {
      const i = L.active[a];
      if (L.state[i] === FLYING) continue;
      const dx = L.x[i] - x, dz = L.z[i] - z;
      if (dx * dx + dz * dz > r2) continue;
      L.state[i] = FLYING;
      L.collectAt[i] = t;
      L.v[i] = FLY_START * 2; L.ft[i] = 0; L.sw[i] = 1;
      count++;
    }
    return count;
  }

  // ================================================================ nearby (minimap)
  const NEAR_MAX = 60;
  const nearOut = [];
  const nearPool = Array.from({ length: NEAR_MAX }, () => ({ x: 0, z: 0, kind: 'normal' }));
  const candD = new Float32Array(CAP + LOOSE_CAP);
  const candX = new Float32Array(CAP + LOOSE_CAP);
  const candZ = new Float32Array(CAP + LOOSE_CAP);
  const candK = new Uint8Array(CAP + LOOSE_CAP);
  const order = [];
  const byDist = (a, b) => candD[a] - candD[b];

  function nearby(x, z, r) {
    nearOut.length = 0;
    if (!Number.isFinite(x) || !Number.isFinite(z)) return nearOut;
    const r2 = (Number.isFinite(r) ? r : 60) ** 2;
    let n = 0;
    for (let a = 0; a < P.activeN; a++) {
      const i = P.active[a], st = P.state[i];
      if (st !== IDLE && st !== FLYING) continue;
      const px = st === FLYING ? P.x[i] : P.bx[i], pz = st === FLYING ? P.z[i] : P.bz[i];
      const dx = px - x, dz = pz - z, d2 = dx * dx + dz * dz;
      if (d2 > r2) continue;
      candD[n] = d2; candX[n] = px; candZ[n] = pz; candK[n] = P.kind[i]; n++;
    }
    for (let a = 0; a < L.activeN; a++) {
      const i = L.active[a];
      const dx = L.x[i] - x, dz = L.z[i] - z, d2 = dx * dx + dz * dz;
      if (d2 > r2) continue;
      candD[n] = d2; candX[n] = L.x[i]; candZ[n] = L.z[i]; candK[n] = L.kind[i]; n++;
    }
    order.length = n;
    for (let i = 0; i < n; i++) order[i] = i;
    if (n > 1) order.sort(byDist);
    const m = Math.min(NEAR_MAX, n);
    for (let j = 0; j < m; j++) {
      const c = order[j], o = nearPool[j];
      o.x = candX[c]; o.z = candZ[c]; o.kind = KIND_NAMES[candK[c]];
      nearOut.push(o);
    }
    return nearOut;
  }

  // ================================================================ makeTurbanMesh
  function makeTurbanMesh(kind = 'normal', color) {
    const k = kindIndex(kind);
    let mat = mats[k];
    if (k === K_NORMAL) {
      const c = new THREE.Color(color !== undefined && color !== null ? color : getPalette()[0]);
      const hex = c.getHexString();
      mat = colorMats.get(hex);
      if (!mat) {
        mat = withGlow(lambert({ color: c }), glow[K_NORMAL]);
        colorMats.set(hex, mat);
      }
    }
    const mesh = new THREE.Mesh(geos.hi[k], mat);
    mesh.name = `turban-${KIND_NAMES[k]}`;
    mesh.castShadow = true;
    mesh.userData.sharedTurbanResources = true; // geometry/material are shared: don't dispose them
    return mesh;
  }

  // ================================================================ update
  const frustum = new THREE.Frustum();
  const projScreen = new THREE.Matrix4();
  const bufSize = new THREE.Vector2();
  const tmpV = new THREE.Vector3();
  let camX = 0, camY = 0, camZ = 0;

  function visible(x, y, z, rad) {
    const planes = frustum.planes;
    for (let p = 0; p < 6; p++) {
      const pl6 = planes[p];
      if (pl6.normal.x * x + pl6.normal.y * y + pl6.normal.z * z + pl6.constant < -rad) return false;
    }
    return true;
  }

  function update(dt, t) {
    const st = ctx.state;
    if (!st) return;
    const mode = st.mode;
    const playing = mode === 'playing';
    const low = ctx.quality === 'low';
    const NEAR2 = (low ? 28 : 45) ** 2;
    const CULL2 = (low ? 120 : 150) ** 2;
    const night = Number.isFinite(ctx.sky?.nightFactor) ? ctx.util.clamp(ctx.sky.nightFactor, 0, 1) : 0;

    // camera & glow
    const cam = ctx.camera;
    cam.updateMatrixWorld(); // also refreshes matrixWorldInverse
    projScreen.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
    frustum.setFromProjectionMatrix(projScreen);
    camX = cam.matrixWorld.elements[12]; camY = cam.matrixWorld.elements[13]; camZ = cam.matrixWorld.elements[14];
    ctx.renderer.getDrawingBufferSize(bufSize);
    scaleUniform.value = bufSize.y / (2 * Math.tan((cam.fov * Math.PI) / 360));

    const pulse = Math.sin(t * 4.5);
    glow[K_NORMAL].value = 0.03 + 0.55 * night;
    glow[K_PINK].value = 0.08 + 0.5 * night;
    glow[K_KESRI].value = 0.12 + 0.5 * night;
    glow[K_GOLDEN].value = 0.15 + 0.4 * night;
    mats[K_KESRI].emissiveIntensity = 0.3 + 0.12 * pulse;
    mats[K_GOLDEN].emissiveIntensity = 0.45 + 0.2 * Math.sin(t * 5.5);

    // combo lapse, power-ups
    if (st.combo > 0 && t - lastPickupT > COMBO_WINDOW) endCombo();
    snapPlayer(t);
    const canPick = playing && pl.ok;
    if (canPick && t < (st.boostUntil || 0)) ctx.audio?.requestDhol?.(0.7);

    for (const b of allBatches) b.n = 0;
    halos.n = 0;
    const KC = getKindRGB();
    const nightHalo = !low && night > 0.05;
    const scanR2 = (Math.max(pl.magR, 2) + 1.5) ** 2;

    // ---------------------------------------------------- placed turbans
    for (let a = 0; a < P.activeN; a++) {
      const i = P.active[a];
      const state = P.state[i];
      if (state === COLLECTED) continue;
      const k = P.kind[i], s = KIND_SCALE[k], ph = P.phase[i];
      let x, y, z, spin;
      if (state === FLYING) {
        if (canPick && stepFly(P, i, dt)) {
          P.state[i] = COLLECTED; collectedIds.add(P.id[i]);
          collect(k, P.x[i], P.y[i], P.z[i], false, P.r[i], P.g[i], P.b[i], t);
          continue;
        }
        x = P.x[i]; y = P.y[i]; z = P.z[i]; spin = t * SPIN * 3 + ph;
      } else {
        x = P.bx[i]; z = P.bz[i];
        y = P.by[i] + BOB * Math.sin(t * BOB_RATE + ph);
        spin = t * SPIN + ph;
        if (canPick) {
          const dx = x - pl.x, dz = z - pl.z;
          if (dx * dx + dz * dz < scanR2) {
            if (touching(x, y, z)) {
              P.state[i] = COLLECTED; collectedIds.add(P.id[i]);
              collect(k, x, y, z, false, P.r[i], P.g[i], P.b[i], t);
              continue;
            }

  }

    clearAll();
    palette = null; kindRGB = null; // re-read content in case it changed

  function start() {

    collectedIds.clear();
    permCollected.clear();
    lastPickupT = -Infinity;

    }
    PA.n = 0;
  }

  // ================================================================ events
  ctx.events.on('chunk:load', onChunkLoad);
  ctx.events.on('chunk:unload', onChunkUnload);
  ctx.events.on('player:hit', () => endCombo());       // a knock breaks the streak
  ctx.events.on('player:faint', () => endCombo());

  return {
    KINDS,
    makeTurbanMesh,
    spawnLoose,
    nearby,
    pullAround,
    burst(position, kind = 'normal') {
      if (!position) return;
      const k = kindIndex(kind), c = k === K_NORMAL ? CREAM : getKindRGB()[k];

    get activeCount() { return P.activeN + L.activeN; },
    reset,
    start,
    update,

      const s = new THREE.Mesh(starGeo, matStar);
      const a = (i / 3) * TAU;
      s.position.set(Math.cos(a) * 0.24, 0, Math.sin(a) * 0.24);
      rig.add(s);
    }
    return rig;
  }
  function releaseStars(rig) {
    if (!rig) return;

  }

  // ------------------------------------------------------------------ stolen-turban stacks (pooled)
  // Borrowed from collectibles' builder when it exists, normalised to sit on a langur's head.
  const turbanPool = [];
  let fbTurbanGeo = null;
  const fbTurbanMats = new Map();
  function fallbackTurban(color) {
    if (!fbTurbanGeo) {
      const torus = new THREE.TorusGeometry(0.15, 0.075, 6, 14).rotateX(Math.PI / 2).translate(0, 0.075, 0);
      const ring = torus.toNonIndexed();
      torus.dispose();
      const dome = new THREE.IcosahedronGeometry(0.14, 1).scale(1, 0.6, 1).translate(0, 0.12, 0);
      ring.deleteAttribute('uv');
      dome.deleteAttribute('uv');
      fbTurbanGeo = ctx.mergeGeometries([ring, dome], false) || dome;
      if (fbTurbanGeo !== ring) ring.dispose();
      if (fbTurbanGeo !== dome) dome.dispose();
    }
    let mat = fbTurbanMats.get(color);
    if (!mat) { mat = new THREE.MeshLambertMaterial({ color, flatShading: true }); fbTurbanMats.set(color, mat); }
    return new THREE.Mesh(fbTurbanGeo, mat);
  }
  function acquireTurban() {
    const pooled = turbanPool.pop();
    if (pooled) return pooled;
    const colors = ctx.content?.turbanColors;
    const color = colors && colors.length ? colors[Math.floor(Math.random() * colors.length)] : '#1f4fd1';
    let mesh = null;
    try { mesh = ctx.collectibles?.makeTurbanMesh?.('normal', color) || null; } catch (e) { mesh = null; }
    if (!mesh || !mesh.isObject3D) mesh = fallbackTurban(color);
    const inner = new THREE.Group();
    inner.add(mesh);
    const holder = new THREE.Group();
    holder.add(inner);
    holder.updateMatrixWorld(true);
    _box.setFromObject(holder);
    if (_box.isEmpty()) { holder.userData.stackH = 0.16; return holder; }
    _box.getSize(_size);
    _box.getCenter(_center);
    const k = 0.34 / (Math.max(_size.x, _size.z) || 0.4);
    inner.position.set(-_center.x, -_box.min.y, -_center.z);
    holder.scale.setScalar(k);
    holder.userData.stackH = _size.y * k;
    return holder;
  }
  function giveStack(m, n) {
    releaseStack(m);
    let y = 0;
    for (let i = 0; i < n; i++) {
      const tb = acquireTurban();
      tb.position.set(0, y, 0);
      tb.position.x = (i % 2 ? 1 : -1) * 0.03;
      tb.rotation.set(0, i * 0.9, (i % 2 ? 1 : -1) * 0.1);
      y += (tb.userData.stackH || 0.16) * 0.82;
      m.stack.add(tb);
    }
    if (m.strap) m.strap.visible = n > 0;
    m.carry = n;
  }
  function releaseStack(m) {
    const kids = m.stack.children;
    while (kids.length) {
      const c = kids[kids.length - 1];
      m.stack.remove(c);
      turbanPool.push(c);
    }
    if (m.strap) m.strap.visible = false;
    m.carry = 0;
  }

  // ------------------------------------------------------------------ mosquito + quicksand shared bits

  // ------------------------------------------------------------------ the Rishta Aunty (one, global)

  function buildAunty() {

      prim(new THREE.ConeGeometry(0.026, 0.06, 5), GOLD, 0.122, 0.05, 0, 1, 1, 1, Math.PI),

    ]);
    const dupG = merge([
      prim(new THREE.PlaneGeometry(0.44, 1.1, 1, 5), DUP, 0, -0.55, 0),

    const armParts = (withBag) => {
      const parts = [
        prim(Cyl(0.068, 0.058, 0.32), KAMEEZ, 0, -0.16, 0),

        prim(Torus(0.058, 0.014), GOLD, 0, -0.5, 0, 1, 1, 1, Math.PI / 2),

    armR.position.set(0.25, 1.34, 0);

    dupatta.position.set(0, 1.44, 0.13);

    folder.position.set(0.33, 1.97, -0.3);
