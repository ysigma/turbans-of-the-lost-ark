  function setAuntyFade(f, force = false) {
    if (!aunty.mats || (!force && Math.abs(f - aunty.fade) < 0.004)) return;
    aunty.fade = f;
    const transparent = f < 0.999;
    for (const m of aunty.mats) {
      m.opacity = f;
      if (m.transparent !== transparent) { m.transparent = transparent; m.needsUpdate = true; }
    }
  }

  // ------------------------------------------------------------------ per-chunk placement
  function onChunkLoad(ev) {
    if (!ev || !Number.isFinite(ev.cx) || !Number.isFinite(ev.cz)) return;
    const key = `${ev.cx},${ev.cz}`;
    if (chunks.has(key)) onChunkUnload(ev);
    const size = ev.size ?? ctx.world?.CHUNK ?? 48;
    const x0 = ev.x0 ?? ev.cx * size;
    const z0 = ev.z0 ?? ev.cz * size;
    const biome = ev.biome ?? biomeAt(x0 + size / 2, z0 + size / 2);
    // One seeded stream per chunk, split into independent sub-streams so each hazard type
    // always regenerates identically regardless of what the others consumed.
    const rng = U.rngFor(ctx.seed, 'hazards', ev.cx, ev.cz);
    const seedMonkeys = (rng() * 4294967296) >>> 0;
    const seedSwarms = (rng() * 4294967296) >>> 0;
    const seedPit = (rng() * 4294967296) >>> 0;
    const rec = { key, monkeys: [], swarms: [], pits: [] };
    chunks.set(key, rec);
    placeMonkeys(rec, U.mulberry32(seedMonkeys), x0, z0, size, biome);
    placeSwarms(rec, U.mulberry32(seedSwarms), x0, z0, size, biome);
    placePit(rec, U.mulberry32(seedPit), ev, biome);
  }

  function onChunkUnload(ev) {
    if (!ev) return;
    const key = `${ev.cx},${ev.cz}`;
    const rec = chunks.get(key);
    if (!rec) return;
    chunks.delete(key);
    disposeRecord(rec);
    compact(monkeys, rec);
    compact(swarms, rec);
    compact(pits, rec);
  }
  function compact(list, rec) {
    let w = 0;
    for (let i = 0; i < list.length; i++) if (list[i].rec !== rec) list[w++] = list[i];
    list.length = w;
  }
  function disposeRecord(rec) {
    for (const m of rec.monkeys) {
      releaseStack(m);
      releaseStars(m.stars);
      m.stars = null;
      m.group.removeFromParent();
      all.delete(m.id);
    }
    for (const s of rec.swarms) {
      s.points.removeFromParent();
      s.geo.dispose();
      s.mat.dispose();
      all.delete(s.id);
    }
    for (const p of rec.pits) {
      p.mesh.removeFromParent();
      p.mesh.geometry.dispose();
      p.reeds.removeFromParent();
      p.reeds.geometry.dispose();
      p.bub.removeFromParent();
      p.bub.dispose();
      all.delete(p.id);
    }
  }

  function findPerches(x0, z0, size) {
    const list = ctx.world?.queryColliders?.(x0 + size / 2, z0 + size / 2, size * 0.75) || [];
    const rocks = [], trees = [], other = [];
    for (const c of list) {
      if (!c || !(c.x >= x0 && c.x < x0 + size && c.z >= z0 && c.z < z0 + size)) continue;
      const tag = String(c.tag || '');
      if (ROCK_TAG.test(tag)) rocks.push(c);
      else if (TREE_TAG.test(tag)) trees.push(c);
      else if (!tag && (c.r || 0) <= 2.5) other.push(c);
    }
    const byPos = (a, b) => (a.x - b.x) || (a.z - b.z);
    rocks.sort(byPos);
    trees.sort(byPos);
    other.sort(byPos);
    return { rocks, trees: trees.length ? trees : other };
  }

  function okMonkeySpot(x, z, rec, perched) {
    if (!Number.isFinite(x) || !Number.isFinite(z)) return false;
    if (waterAt(x, z) > 0.02) return false;
    if (U.dist2(x, z, spawn.x, spawn.z) < (SAFE_RADIUS + 3) ** 2) return false;
    const ark = arkPos();
    if (ark && U.dist2(x, z, ark.x, ark.z) < 34 * 34) return false;
    for (const o of rec.monkeys) if (U.dist2(x, z, o.home.x, o.home.z) < 16) return false;
    if (!perched && blockedBySolids(x, z, 0.35)) return false;
    return true;
  }

  // Langurs: 0–2 per jungle/ruins chunk, on rocks or at the foot of trees.
  function placeMonkeys(rec, rng, x0, z0, size, biome) {
    if (biome !== 'jungle' && biome !== 'ruins') return;
    const roll = rng();
    const count = roll < 0.3 ? 0 : roll < (biome === 'ruins' ? 0.62 : 0.78) ? 1 : 2;
    if (!count) return;
    const { rocks, trees } = findPerches(x0, z0, size);
    for (let i = 0; i < count; i++) {
      for (let attempt = 0; attempt < 8; attempt++) {
        const how = rng(), which = rng(), ang = rng() * TAU, fx = rng(), fz = rng();
        let x, z, y, perched = false;
        if (rocks.length && how < 0.5) {
          const c = rocks[Math.floor(which * rocks.length)];
          if (c.h > 0.35 && c.h < 2.6) {
            x = c.x; z = c.z; y = groundAt(x, z) + c.h; perched = true;
          } else {
            x = c.x + Math.cos(ang) * ((c.r || 0.5) + 0.6);
            z = c.z + Math.sin(ang) * ((c.r || 0.5) + 0.6);
            y = groundAt(x, z);
          }
        } else if (trees.length && how < 0.9) {
          const c = trees[Math.floor(which * trees.length)];
          x = c.x + Math.cos(ang) * ((c.r || 0.4) + 0.7);
          z = c.z + Math.sin(ang) * ((c.r || 0.4) + 0.7);
          y = groundAt(x, z);
        } else {
          x = x0 + 3 + fx * (size - 6);
          z = z0 + 3 + fz * (size - 6);
          y = groundAt(x, z);
        }
        if (!okMonkeySpot(x, z, rec, perched)) continue;
        addMonkey(rec, x, y, z, perched, rng);
        break;
      }
    }
  }

  function addMonkey(rec, x, y, z, perched, rng) {
    const scale = 0.9 + rng() * 0.22;
    const parts = buildMonkeyRig(scale);
    const m = {
      id: nextId++, type: 'monkey', rec, ...parts, scale, perched,
      home: new THREE.Vector3(x, y, z), homeYaw: rng() * TAU,
      pos: new THREE.Vector3(x, y, z), from: new THREE.Vector3(),
      aim: new THREE.Vector3(), head: new THREE.Vector3(),
      vy: 0, grounded: true, landT: 0, supportY: y, yaw: 0, shrink: 1,
      state: 'idle', timer: 0, chaseT: 0, cooldown: 0, carry: 0, stars: null,
      phase: rng() * 10, action: Math.floor(rng() * 3), actionT: 1 + rng() * 3, headGet: null,
    };
    m.headGet = () => m.head;
    placeMonkeyAtHome(m);
    rec.monkeys.push(m);
    monkeys.push(m);
    all.set(m.id, m);
  }

  function placeMonkeyAtHome(m) {
    m.pos.copy(m.home);
    m.vy = 0;
    m.grounded = true;
    m.supportY = m.home.y;
    m.landT = 0;
    m.yaw = m.homeYaw;
    m.shrink = 1;
    m.state = 'idle';
    m.timer = 0;
    m.group.scale.setScalar(m.scale);
    m.group.position.copy(m.pos);
    m.group.rotation.y = m.yaw;
    m.group.visible = true;
    updateMonkeyAnchors(m);
  }

  // Mosquito swarms: near water or in swamp. Slot 0 is out day and night; slot 1 only comes
  // out after dark, which doubles the chance at night while staying deterministic per chunk.
  function placeSwarms(rec, rng, x0, z0, size, biome) {
    let wet = 0;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (waterAt(x0 + (i + 0.5) * size / 3, z0 + (j + 0.5) * size / 3) > 0) wet++;
      }
    }
    const swamp = biome === 'swamp';
    const p = swamp ? 0.55 : wet > 0 ? 0.32 : 0;
    if (p === 0) return;
    for (let slot = 0; slot < 2; slot++) {
      const roll = rng();
      let bx = 0, bz = 0, found = false;
      for (let k = 0; k < 10; k++) {
        const x = x0 + 3 + rng() * (size - 6);
        const z = z0 + 3 + rng() * (size - 6);
        if (found) continue;
        const h = groundAt(x, z);
        const shore = h > -0.8 && h < 1.4;
        if (!(shore || (swamp && h < 3))) continue;
        if (U.dist2(x, z, spawn.x, spawn.z) < (SAFE_RADIUS + 5) ** 2) continue;
        let crowded = false;
        for (const o of rec.swarms) if (U.dist2(x, z, o.home.x, o.home.z) < 100) crowded = true;
        if (crowded) continue;
        bx = x; bz = z; found = true;
      }
      if (found && roll < p) addSwarm(rec, bx, bz, slot === 1, rng);
    }
  }

  function addSwarm(rec, x, z, nightOnly, rng) {
    const n = SWARM.points;
    const arr = new Float32Array(n * 3);
    const geo = new THREE.BufferGeometry();
    const attr = new THREE.BufferAttribute(arr, 3);
    attr.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', attr);
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 8);
    const mat = new THREE.PointsMaterial({
      color: SWARM_DAY, size: 0.16, sizeAttenuation: true, map: getDotTexture(),
      transparent: true, opacity: 0, depthWrite: false, alphaTest: 0.05,
    });
    const points = new THREE.Points(geo, mat);
    points.visible = false;
    root.add(points);
    const base = new Float32Array(n * 3);
    const ph = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, u = rng() * 2 - 1, rr = Math.cbrt(rng()) * 0.95, s = Math.sqrt(1 - u * u);
      base[i * 3] = Math.cos(a) * s * rr;
      base[i * 3 + 1] = u * rr * 0.7;
      base[i * 3 + 2] = Math.sin(a) * s * rr;
      ph[i] = rng() * TAU;
    }
    const y = Math.max(groundAt(x, z), waterLevel()) + 1.3 + rng() * 0.6;
    const s = {
      id: nextId++, type: 'mosquito', rec, points, geo, mat, arr, base, ph, nightOnly,
      home: new THREE.Vector3(x, y, z), pos: new THREE.Vector3(x, y, z), aim: null,
      state: 'idle', timer: 0, chaseT: 0, cooldown: 0, awayFor: 0, fade: 0, spread: 1,
      buzzT: rng() * SWARM.buzzEvery, bibiT: 0, phase: rng() * 10, headGet: null,
    };
    s.aim = s.pos;
    s.headGet = () => s.pos;
    rec.swarms.push(s);
    swarms.push(s);
    all.set(s.id, s);
  }

  // Quicksand: 0–1 per swamp/clearing chunk, inside one of the world's clearings.
  function placePit(rec, rng, ev, biome) {
    const clearings = Array.isArray(ev.clearings) ? ev.clearings : [];
    const roll = rng(), pick = rng(), rr = rng(), ang = rng() * TAU, off = rng();
    if (!clearings.length) return;
    const c = clearings[Math.floor(pick * clearings.length)];
    if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.z)) return;
    const local = biomeAt(c.x, c.z);
    const swampy = biome === 'swamp' || local === 'swamp';
    const open = biome === 'clearing' || local === 'clearing';
    const p = swampy ? 0.65 : open ? 0.5 : 0;
    if (roll >= p) return;
    const cr = Number.isFinite(c.r) ? c.r : 6;
    const r = U.clamp(U.lerp(SAND.minR, SAND.maxR, rr), SAND.minR, Math.max(SAND.minR, cr - 1.2));
    const slack = Math.max(0, cr - r - 1) * off;
    const x = c.x + Math.cos(ang) * slack;
    const z = c.z + Math.sin(ang) * slack;
    if (U.dist2(x, z, spawn.x, spawn.z) < (SAFE_RADIUS + 8 + r) ** 2) return;
    if (waterAt(x, z) > 0) return;
    if (blockedBySolids(x, z, r + 0.4)) return;
    const marks = ctx.landmarks?.list?.(x, z, r + 3);
    if (marks && marks.length) return;
    const ark = arkPos();
    if (ark && U.dist2(x, z, ark.x, ark.z) < 45 * 45) return;
    addPit(rec, x, z, r, rng);
  }

  function addPit(rec, x, z, r, rng) {
    // Glossy mud disc that hugs the terrain: centre fan + concentric rings, wobbly edge.
    const RINGS = 5, SEG = 28;
    const nV = 1 + RINGS * SEG;
    const pos = new Float32Array(nV * 3);
    const col = new Float32Array(nV * 3);
    const cIn = new THREE.Color('#4a2f1a'), cOut = new THREE.Color('#8f6a3e'), tint = new THREE.Color();
    const edge = new Float32Array(SEG);
    for (let s = 0; s < SEG; s++) edge[s] = 1 + (rng() - 0.5) * 0.16;
    pos[1] = groundAt(x, z) + 0.06;
    col[0] = cIn.r; col[1] = cIn.g; col[2] = cIn.b;
    let vi = 1;
    for (let k = 1; k <= RINGS; k++) {
      const f = k / RINGS;
      for (let s = 0; s < SEG; s++) {
        const a = (s / SEG) * TAU;
        const rad = r * f * (1 + (edge[s] - 1) * f);
        const px = Math.cos(a) * rad, pz = Math.sin(a) * rad;
        pos[vi * 3] = px;
        pos[vi * 3 + 1] = groundAt(x + px, z + pz) + 0.06;
        pos[vi * 3 + 2] = pz;
        tint.copy(cIn).lerp(cOut, f * f);
        const speck = (rng() - 0.5) * 0.05;
        col[vi * 3] = tint.r + speck; col[vi * 3 + 1] = tint.g + speck; col[vi * 3 + 2] = tint.b + speck;
        vi++;
      }
    }
    const idx = [];
    for (let s = 0; s < SEG; s++) idx.push(0, 1 + ((s + 1) % SEG), 1 + s);
    for (let k = 2; k <= RINGS; k++) {
      const inner = 1 + (k - 2) * SEG, outer = 1 + (k - 1) * SEG;
      for (let s = 0; s < SEG; s++) {
        const s1 = (s + 1) % SEG;
        idx.push(inner + s, outer + s1, outer + s, inner + s, inner + s1, outer + s1);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, matSand);
    mesh.position.set(x, 0, z);
    mesh.receiveShadow = true;
    root.add(mesh);

    // A few reed clumps and cattails around the rim (one merged mesh).
    const reedParts = [];
    const clumps = 5 + Math.floor(rng() * 4);
    for (let i = 0; i < clumps; i++) {
      const a = rng() * TAU, d = r * (0.92 + rng() * 0.25);
      const bx = Math.cos(a) * d, bz = Math.sin(a) * d;
      const gy = groundAt(x + bx, z + bz);
      const blades = 2 + Math.floor(rng() * 3);
      for (let b = 0; b < blades; b++) {
        const h = 0.8 + rng() * 0.9;
        const ox = bx + (rng() - 0.5) * 0.3, oz = bz + (rng() - 0.5) * 0.3;
        const lx = (rng() - 0.5) * 0.35, lz = (rng() - 0.5) * 0.35;
        const green = rng() < 0.5 ? '#5d8c3a' : '#7da046';
        reedParts.push(prim(new THREE.ConeGeometry(0.03, h, 4).translate(0, h / 2, 0), green, ox, gy, oz, 1, 1, 1, lx, 0, lz));
        if (b === 0 && rng() < 0.6) {
          reedParts.push(prim(Cyl(0.045, 0.045, 0.22, 5).translate(0, h * 0.82, 0), '#6b4226', ox, gy, oz, 1, 1, 1, lx, 0, lz));
        }
      }
    }
    const reeds = new THREE.Mesh(merge(reedParts), matPaint);
    reeds.position.set(x, 0, z);
    root.add(reeds);

    const bub = new THREE.InstancedMesh(bubbleGeo, matBubble, SAND.bubbles);
    bub.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    bub.frustumCulled = false;
    bub.position.set(x, 0, z);
    root.add(bub);

    const pit = {
      id: nextId++, type: 'quicksand', rec, x, z, r, mesh, reeds, bub,
      bd: new Float32Array(SAND.bubbles * 6), toasted: false,
      pos: new THREE.Vector3(x, groundAt(x, z), z), aim: null,
    };
    pit.aim = pit.pos;
    for (let i = 0; i < SAND.bubbles; i++) respawnBubble(pit, i, -rng() * 2);
    animateBubbles(pit, 0);
    rec.pits.push(pit);
    pits.push(pit);
    all.set(pit.id, pit);
  }

  // ------------------------------------------------------------------ monkeys
  function updateMonkeyAnchors(m) {
    const s = m.scale * m.shrink;
    m.head.set(m.pos.x, m.pos.y + (m.rig.position.y + 1.3 + m.carry * 0.14) * s, m.pos.z);
    m.aim.set(m.pos.x, m.pos.y + (m.rig.position.y + 0.85) * s, m.pos.z);
  }

  function touching(m) {
    if (!P.ok) return false;
    const reach = P.r + MONKEY.reach * m.scale;
    return U.dist2(m.pos.x, m.pos.z, P.x, P.z) < reach * reach && Math.abs(P.y - m.pos.y) < 1.5;
  }

  function wantsToChase(m, d2) {
    return P.ok && m.cooldown <= 0 && d2 < MONKEY.notice * MONKEY.notice &&
      Math.abs(P.y - m.pos.y) < 5 && canEngage(m.pos.x, m.pos.z);
  }

  function startTell(m) {
    m.state = 'tell';
    m.timer = MONKEY.tell;
    bubble('Ook!', m.headGet, 1.1);
    sfx('monkey', m.pos, 0.9);
    emitHazard('hazard:spawn', m);
  }

  function goHome(m, cooldown) {
    releaseStars(m.stars);
    m.stars = null;
    m.state = 'return';
    m.timer = 14;
    m.landT = Math.max(m.landT, 0.2);
    m.cooldown = Math.max(m.cooldown, cooldown);
  }

  function startLeap(m) {
    if (m.carry > 0) bubble(pickLine(ctx.content?.monkey?.taunt), m.headGet, 2.2);
    sfx('monkey', m.pos, 0.7);
    m.state = 'leap';
    m.timer = 1.0;
    m.vy = 13;
    m.grounded = false;
  }

  // Monkey hops in arcs toward (tx, tz). Grounded between hops for a beat; avoids deep water.
  function hop(m, tx, tz, speed, hopVy, dt, solid) {
    const dx = tx - m.pos.x, dz = tz - m.pos.z;
    const d = Math.sqrt(dx * dx + dz * dz);
    if (d > 0.05) m.yaw = U.angleDamp(m.yaw, yawTo(dx, dz), 12, dt);
    if (m.grounded) {
      m.landT -= dt;
      m.pos.y = m.supportY;
      if (m.landT <= 0 && d > 0.25) { m.vy = hopVy; m.grounded = false; }
    }
    if (!m.grounded) {
      if (d > 0.05) {
        const step = Math.min(d, speed * dt);
        const nx = m.pos.x + (dx / d) * step, nz = m.pos.z + (dz / d) * step;
        if (waterAt(nx, nz) < 0.45) { m.pos.x = nx; m.pos.z = nz; }
      }
      if (solid) collide(m.pos, 0.3 * m.scale);
      fall(m, dt);
    }
  }
  function fall(m, dt) {
    if (m.grounded) return;
    m.vy += GRAVITY * dt;
    m.pos.y += m.vy * dt;
    const g = groundAt(m.pos.x, m.pos.z);
    if (m.vy < 0 && m.pos.y <= g) {
      m.pos.y = g;
      m.vy = 0;
      m.grounded = true;
      m.landT = 0.08;
      m.supportY = g;
    }
  }

  function monkeyContact(m) {
    const res = hitPlayer('monkey', m.pos, MONKEY.steal);
    if (!res.applied) return;
    const stolen = Math.max(0, Math.min(MONKEY.steal, Math.floor(res.lost || 0)));
    if (stolen > 0) {
      giveStack(m, stolen);
      toast(U.fmt(pickLine(ctx.content?.monkey?.stole), { count: stolen }), 'warn');
      bubble(pickLine(ctx.content?.monkey?.taunt), m.headGet, 2.6);
      sfx('monkey', m.pos, 1);
      m.state = 'flee';
      m.timer = MONKEY.fleeTime;
      m.landT = 0.15;
    } else {
      // Nothing to steal: the monkey is unimpressed and goes back to its rock.
      bubble(pickLine(ctx.content?.monkey?.taunt), m.headGet, 2.4);
      goHome(m, MONKEY.cooldown + 2);
    }
  }

  function dropLoot(m) {
    if (m.carry <= 0) return 0;
    const n = m.carry;
    _v.set(m.pos.x, m.pos.y + 0.9 * m.scale, m.pos.z);
    ctx.collectibles?.spawnLoose?.(_v.clone(), n, { spread: 3.5 });
    toast(pickLine(ctx.content?.monkey?.dropped), 'win');
    releaseStack(m);
    return n;
  }

  function stunMonkey(m, seconds) {
    if (m.state === 'gone' || m.state === 'leap') return false;
    dropLoot(m);
    m.state = 'stunned';
    m.timer = Math.max(0.5, seconds);
    // Knocked off a hop or a ledge: tumble to the ground (its own perch is fine to sit on).
    if (m.pos.y > groundAt(m.pos.x, m.pos.z) + 0.05 && m.pos.distanceToSquared(m.home) > 0.01) {
      m.grounded = false;
      m.vy = Math.min(m.vy, 0);
    }
    if (!m.stars) {
      m.stars = acquireStars();
      m.stars.position.set(0, 0.42, 0);
      m.headMesh.add(m.stars);
    }
    return true;
  }

  function stepMonkey(m, dt, t, live) {
    if (m.cooldown > 0) m.cooldown -= dt;
    const dx = P.x - m.pos.x, dz = P.z - m.pos.z;
    const d2 = dx * dx + dz * dz;
    switch (m.state) {
      case 'idle': {
        m.actionT -= dt;
        if (m.actionT <= 0) {
          m.action = (m.action + 1 + Math.floor(Math.random() * 2)) % 3;
          m.actionT = 2 + Math.random() * 3.5;
        }
        if (live && wantsToChase(m, d2)) startTell(m);
        break;
      }
      case 'tell': {
        m.yaw = U.angleDamp(m.yaw, yawTo(dx, dz), 10, dt);
        if (!live) { goHome(m, 0); break; }
        m.timer -= dt;
        if (m.timer <= 0) { m.state = 'chase'; m.chaseT = 0; m.landT = 0; }
        break;
      }
      case 'chase': {
        if (!live || !P.ok) { goHome(m, MONKEY.cooldown); break; }
        m.chaseT += dt;
        hop(m, P.x, P.z, MONKEY.hopSpeed, MONKEY.hopVy, dt, true);
        if (touching(m)) { monkeyContact(m); break; }
        if (m.chaseT > MONKEY.chaseTime || d2 > MONKEY.giveUp * MONKEY.giveUp) goHome(m, MONKEY.cooldown);
        break;
      }
      case 'flee': {
        if (!live) { startLeap(m); break; }
        m.timer -= dt;
        // Run away from the player with a cheeky wobble, steering around water.
        let yaw = yawTo(dx, dz) + Math.PI + Math.sin(t * 1.1 + m.phase) * 0.5;
        for (let k = 0; k < 6; k++) {
          if (waterAt(m.pos.x - Math.sin(yaw) * 3, m.pos.z - Math.cos(yaw) * 3) < 0.3) break;
          yaw += (k % 2 ? -1 : 1) * 0.7 * (k + 1);
        }
        hop(m, m.pos.x - Math.sin(yaw) * 3, m.pos.z - Math.cos(yaw) * 3, MONKEY.fleeSpeed, MONKEY.hopVy, dt, true);
        if (m.timer < MONKEY.fleeTime - MONKEY.fleeGrace && touching(m)) {
          dropLoot(m);
          stunMonkey(m, 2.2);
          m.cooldown = 14;
          break;
        }
        if (m.timer <= 0) startLeap(m);
        break;
      }
      case 'leap': {
        // Straight up into the canopy, shrinking out of sight. The loot goes with it.
        m.timer -= dt;
        m.vy = Math.max(m.vy - 6 * dt, 4);
        m.pos.y += m.vy * dt;
        m.shrink = U.clamp(m.timer / 0.6, 0, 1);
        if (m.timer <= 0) {
          releaseStack(m);
          m.state = 'gone';
          m.timer = MONKEY.respawn;
        }
        break;
      }
      case 'gone': {
        m.timer -= dt;
        if (m.timer <= 0 && (!P.ok || U.dist2(m.home.x, m.home.z, P.x, P.z) > 900)) placeMonkeyAtHome(m);
        break;
      }
      case 'stunned': {
        fall(m, dt);
        m.timer -= dt;
        if (m.timer <= 0) goHome(m, MONKEY.cooldown + 3);
        break;
      }
      case 'return': {
        const hx = m.home.x - m.pos.x, hz = m.home.z - m.pos.z;
        const h2 = hx * hx + hz * hz;
        if (h2 < 1.0 && m.grounded) { m.state = 'settle'; m.timer = 0.4; m.from.copy(m.pos); break; }
        if (live && wantsToChase(m, d2)) { startTell(m); break; }
        m.timer -= dt;
        if (m.timer <= 0) {
          // Lost its way round a tree: pop it back home while nobody is watching.
          if (!P.ok || d2 > 625) { placeMonkeyAtHome(m); break; }
          m.timer = 4;
        }
        hop(m, m.home.x, m.home.z, MONKEY.returnSpeed, 4.4, dt, h2 > 4);
        break;
      }
      case 'settle': {
        // Last little hop back onto the perch.
        m.timer -= dt;
        const k = 1 - Math.max(0, m.timer) / 0.4;
        m.pos.lerpVectors(m.from, m.home, k);
        m.pos.y += Math.sin(k * Math.PI) * 0.45;
        m.yaw = U.angleDamp(m.yaw, m.homeYaw, 6, dt);
        if (m.timer <= 0) {
          m.pos.copy(m.home);
          m.grounded = true;
          m.vy = 0;
          m.supportY = m.home.y;
          m.state = 'idle';
        }
        break;
      }
    }
    m.group.position.copy(m.pos);
    m.group.rotation.y = m.yaw;
  }

  function poseMonkey(m, dt, t) {
    let rigY = 0, legs = 0, aLx = 0.3, aLz = 0, aRx = 0.3, aRz = 0, hx = 0, hy = 0, hz = 0;
    const st = m.state;
    if (st === 'idle') {
      // Sitting: hands on knees, then looking around / scratching / inspecting a hand.
      rigY = -0.32 + Math.sin(t * 1.6 + m.phase) * 0.01;
      legs = 1.4; aLx = 0.55; aRx = 0.55; aLz = 0.15; aRz = -0.15;
      if (m.action === 0) {
        hy = Math.sin(t * 0.8 + m.phase) * 0.9;
        hx = Math.sin(t * 0.37 + m.phase) * 0.12;
      } else if (m.action === 1) {
        aRx = 2.8; aRz = -0.5 + Math.sin(t * 13 + m.phase) * 0.14; hz = 0.22; hy = -0.2;
      } else {
        aLx = 1.6; aLz = 0.1; aRx = 0.9; hx = 0.25 + Math.sin(t * 2) * 0.05; hy = 0.15;
      }
    } else if (st === 'tell') {
      // Stands up, arms in the air: "Ook!"
      rigY = 0.02 + Math.abs(Math.sin(t * 14)) * 0.06;
      aLx = 2.9; aRx = 2.9;
      aLz = -0.35 - Math.sin(t * 16) * 0.2; aRz = 0.35 + Math.sin(t * 16) * 0.2;
      hx = -0.35;
    } else if (st === 'chase' || st === 'return' || st === 'settle' || st === 'flee') {
      if (m.grounded && st !== 'settle') { rigY = -0.1; legs = 0.5; } else { rigY = 0; legs = -0.55; }
      if (st === 'flee') { aLx = 2.95; aRx = 2.95; aLz = 0.28; aRz = -0.28; hx = -0.1; }
      else { aLx = aRx = m.grounded ? 0.4 : 1.3; hx = m.grounded ? 0.12 : -0.15; }
    } else if (st === 'stunned') {
      rigY = -0.32; legs = 1.45; aLx = 0.15; aRx = 0.15; aLz = -0.5; aRz = 0.5;
      hz = Math.sin(t * 3.2) * 0.35; hx = 0.25;
      if (m.stars) {
        m.stars.rotation.y = t * 5;
        m.stars.position.y = 0.42 + Math.sin(t * 4) * 0.03;
      }
    } else if (st === 'leap') {
      aLx = 3.0; aRx = 3.0; legs = -0.2;
    }
    const a = 1 - Math.exp(-14 * dt);
    m.rig.position.y += (rigY - m.rig.position.y) * a;
    m.legs.rotation.x += (legs - m.legs.rotation.x) * a;
    m.armL.rotation.x += (aLx - m.armL.rotation.x) * a;
    m.armL.rotation.z += (aLz - m.armL.rotation.z) * a;
    m.armR.rotation.x += (aRx - m.armR.rotation.x) * a;
    m.armR.rotation.z += (aRz - m.armR.rotation.z) * a;
    const hr = m.headMesh.rotation;
    hr.x += (hx - hr.x) * a;
    hr.y += (hy - hr.y) * a;
    hr.z += (hz - hr.z) * a;
    const s = m.scale * m.shrink;
    if (m.group.scale.x !== s) m.group.scale.setScalar(s);
  }

  function updateMonkeys(dt, t, live) {
    const cull2 = MONKEY.cull * MONKEY.cull;
    for (let i = 0; i < monkeys.length; i++) {
      const m = monkeys[i];
      stepMonkey(m, dt, t, live);
      const near = !P.ok || U.dist2(m.pos.x, m.pos.z, P.x, P.z) < cull2;
      m.group.visible = near && m.state !== 'gone';
      if (m.group.visible) poseMonkey(m, dt, t);
      updateMonkeyAnchors(m);
    }
  }

  // ------------------------------------------------------------------ mosquito swarms
  function moveSwarm(s, tx, ty, tz, speed, dt) {
    const dx = tx - s.pos.x, dy = ty - s.pos.y, dz = tz - s.pos.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d > 1e-4) {
      const step = Math.min(d, speed * dt);
      s.pos.x += (dx / d) * step;
      s.pos.y += (dy / d) * step;
      s.pos.z += (dz / d) * step;
    }
    const floor = Math.max(groundAt(s.pos.x, s.pos.z), waterLevel()) + 0.5;
    if (s.pos.y < floor) s.pos.y = floor;
  }

  function swarmGiveUp(s, cooldown) {
    s.state = 'return';
    s.cooldown = Math.max(s.cooldown, cooldown);
  }

  function stunSwarm(s, seconds) {
    if (s.state === 'scatter' || s.state === 'away' || s.fade < 0.3) return false;
    s.state = 'scatter';
    s.timer = 1.2;
    s.awayFor = Math.max(0, seconds || 0) + SWARM.respawn;
    return true;
  }

  function stepSwarm(s, dt, t, live, night, isBibi) {
    if (s.cooldown > 0) s.cooldown -= dt;
    const present = !s.nightOnly || night;
    const dx = P.x - s.pos.x, dz = P.z - s.pos.z;
    const d2 = dx * dx + dz * dz;
    switch (s.state) {
      case 'idle': {
        // Lazy figure-of-eight over the water's edge.
        const w = t * 0.45 + s.phase;
        moveSwarm(s, s.home.x + Math.sin(w) * 1.8, s.home.y + Math.sin(w * 2.3) * 0.35, s.home.z + Math.sin(w * 2) * 1.2, 2.2, dt);
        if (live && present && P.ok && s.fade > 0.7 && s.cooldown <= 0 &&
            d2 < SWARM.notice * SWARM.notice && canEngage(s.pos.x, s.pos.z)) {
          s.state = 'tell';
          s.timer = SWARM.tell;
          s.bibiT = 0;
          bubble('Bzzz!', s.headGet, 1);
          sfx('buzz', s.pos, 1);
          s.buzzT = SWARM.buzzEvery;
          emitHazard('hazard:spawn', s);
          if (ctx.time - mosquitoToastAt > 30) {
            mosquitoToastAt = ctx.time;
            toast(pickLine(ctx.content?.mosquito), 'joke');
          }
        }
        break;
      }
      case 'tell': {
        // Tighten up and rise to head height: the tell before the drift.
        s.spread = U.damp(s.spread, 0.7, 6, dt);
        s.pos.y = U.damp(s.pos.y, P.y + P.h * 0.75, 2, dt);
        if (!live) { swarmGiveUp(s, 0); break; }
        s.timer -= dt;
        if (s.timer <= 0) { s.state = 'chase'; s.chaseT = 0; }
        break;
      }
      case 'chase': {
        if (!live || !P.ok || !present) { swarmGiveUp(s, SWARM.cooldown); break; }
        s.chaseT += dt;
        s.spread = U.damp(s.spread, 0.8, 4, dt);
        const ty = P.y + P.h * 0.72;
        if (isBibi) {
          // Vicks aura: hover at a respectful distance, recoil if inside 3 m, never touch.
          const d = Math.sqrt(d2) || 0.001;
          const tooClose = d < SWARM.bibiMin + 0.3;
          moveSwarm(s, P.x - (dx / d) * SWARM.bibiRing, ty + 0.4, P.z - (dz / d) * SWARM.bibiRing, tooClose ? 9 : SWARM.speed, dt);
          const ex = s.pos.x - P.x, ez = s.pos.z - P.z;
          const e = Math.sqrt(ex * ex + ez * ez);
          if (e < SWARM.bibiMin) {
            const k = e > 0.001 ? SWARM.bibiMin / e : 1;
            s.pos.x = P.x + (e > 0.001 ? ex * k : SWARM.bibiMin);
            s.pos.z = P.z + (e > 0.001 ? ez * k : 0);
          }
          s.bibiT += dt;
          if (!vicksToasted && d < SWARM.bibiRing + 1.5) {
            vicksToasted = true;
            toast("The mosquitoes smell Bibi's Vicks and back right off.", 'joke');
          }
          if (s.bibiT > SWARM.bibiPatience) swarmGiveUp(s, SWARM.cooldown + 6);
          break;
        }
        moveSwarm(s, P.x, ty, P.z, SWARM.speed, dt);
        const ex = P.x - s.pos.x, ey = ty - s.pos.y, ez = P.z - s.pos.z;
        const reach = SWARM.reach + P.r;
        if (ex * ex + ey * ey + ez * ez < reach * reach) {
          const res = hitPlayer('mosquito', s.pos, 0);
          if (res.applied) { swarmGiveUp(s, SWARM.cooldown); break; }
        }
        if (s.chaseT > SWARM.chaseTime || d2 > (SWARM.notice + 10) ** 2) swarmGiveUp(s, SWARM.cooldown + 2);
        break;
      }
      case 'return': {
        moveSwarm(s, s.home.x, s.home.y, s.home.z, 3, dt);
        s.spread = U.damp(s.spread, 1, 2, dt);
        if (s.pos.distanceToSquared(s.home) < 1) s.state = 'idle';
        break;
      }
      case 'scatter': {
        s.timer -= dt;
        s.spread += dt * 6;
        if (s.timer <= 0) { s.state = 'away'; s.timer = s.awayFor; }
        break;
      }
      case 'away': {
        s.timer -= dt;
        if (s.timer <= 0) {
          s.pos.copy(s.home);
          s.spread = 0.2;
          s.cooldown = 4;
          s.state = 'idle';
        }
        break;
      }
    }
    const gone = s.state === 'scatter' || s.state === 'away' || !present;
    s.fade = U.damp(s.fade, gone ? 0 : 1, s.state === 'scatter' ? 3 : 1.5, dt);
    if (s.state === 'idle' && s.spread !== 1) s.spread = U.damp(s.spread, 1, 1.5, dt);

    // The whine: every ~1.5 s while within earshot.
    if (P.ok && !gone && s.fade > 0.4) {
      s.buzzT -= dt;
      if (s.buzzT <= 0 && d2 < SWARM.buzzRange * SWARM.buzzRange) {
        s.buzzT = SWARM.buzzEvery * (0.85 + Math.random() * 0.3);
        sfx('buzz', s.pos, 0.25 + 0.75 * (1 - Math.sqrt(d2) / SWARM.buzzRange));
      }
    }
  }

  function drawSwarm(s, t, nf) {
    const arr = s.arr, base = s.base, ph = s.ph, n = SWARM.points;
    const sp = s.spread * (1 + Math.sin(t * 2.1 + s.phase) * 0.12);
    const agit = s.state === 'chase' || s.state === 'tell' ? 1.6 : 1;
    for (let i = 0; i < n; i++) {
      const p = ph[i], j = i * 3;
      arr[j] = base[j] * sp + Math.sin(t * 19 * agit + p) * 0.09;
      arr[j + 1] = base[j + 1] * sp + Math.sin(t * 23 * agit + p * 1.7) * 0.08;
      arr[j + 2] = base[j + 2] * sp + Math.cos(t * 17 * agit + p * 2.3) * 0.09;
    }
    s.geo.attributes.position.needsUpdate = true;
    s.points.position.copy(s.pos);
    s.points.rotation.y = t * 0.9 + s.phase;
    s.mat.opacity = s.fade * 0.92;
    s.mat.color.copy(SWARM_DAY).lerp(SWARM_NIGHT, nf * 0.8);
  }

  function updateSwarms(dt, t, live) {
    const night = isNight();
    const nfRaw = ctx.sky?.nightFactor;
    const nf = U.clamp(Number.isFinite(nfRaw) ? nfRaw : (night ? 1 : 0), 0, 1);
    const isBibi = ctx.state.character === 'bibi';
    const cull2 = SWARM.cull * SWARM.cull;
    for (let i = 0; i < swarms.length; i++) {
      const s = swarms[i];
      stepSwarm(s, dt, t, live, night, isBibi);
      const shown = s.fade > 0.02 && (!P.ok || U.dist2(s.pos.x, s.pos.z, P.x, P.z) < cull2);
      s.points.visible = shown;
      if (shown) drawSwarm(s, t, nf);
    }
  }

  // ------------------------------------------------------------------ quicksand
  function respawnBubble(p, i, age) {
    const j = i * 6;
    const a = Math.random() * TAU, rr = Math.sqrt(Math.random()) * p.r * 0.82;
    const lx = Math.cos(a) * rr, lz = Math.sin(a) * rr;
    p.bd[j] = lx;
    p.bd[j + 1] = lz;
    p.bd[j + 2] = groundAt(p.x + lx, p.z + lz) + 0.04;
    p.bd[j + 3] = age;
    p.bd[j + 4] = 1.2 + Math.random() * 1.6;
    p.bd[j + 5] = 0.06 + Math.random() * 0.1;
  }

  // Slow mud bubbles: swell, wobble, pop, reappear somewhere else.
  function animateBubbles(p, dt) {
    const bd = p.bd;
    for (let i = 0; i < SAND.bubbles; i++) {
      const j = i * 6;
      bd[j + 3] += dt;
      const age = bd[j + 3], dur = bd[j + 4], size = bd[j + 5];
      let s = 0;
      if (age > 0) {
        const k = age / dur;
        if (k >= 1) respawnBubble(p, i, -Math.random() * 1.5);
        else s = k < 0.82 ? size * (k / 0.82) : size * (1 + ((k - 0.82) / 0.18) * 0.5);
      }
      _dummy.position.set(bd[j], bd[j + 2] + s * 0.35, bd[j + 1]);
      _dummy.scale.setScalar(Math.max(s, 1e-4));
      _dummy.updateMatrix();
      p.bub.setMatrixAt(i, _dummy.matrix);
    }
    p.bub.instanceMatrix.needsUpdate = true;
  }

  // Sank all the way: lose turbans, get spat out at the rim.
  function spitOut(p) {
    sinkDepth = 0;
    hitPlayer('quicksand', p.pos, 0);
    const pl = ctx.player;
    const pos = pl && pl.position;
    if (!pos) return;
    let ax = pos.x - p.x, az = pos.z - p.z;
    if (ax * ax + az * az < 1e-4) {
      const hd = Number.isFinite(pl.heading) ? pl.heading : 0;
      ax = -Math.sin(hd);
      az = -Math.cos(hd);
    }
    const base = Math.atan2(az, ax);
    for (let k = 0; k < 8; k++) {
      const a = base + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (Math.PI / 4);
      const nx = p.x + Math.cos(a) * (p.r + 0.9), nz = p.z + Math.sin(a) * (p.r + 0.9);
      if (waterAt(nx, nz) < 0.4 && !blockedBySolids(nx, nz, P.r + 0.1)) {
        pos.x = nx;
        pos.z = nz;
        pos.y = Math.max(pos.y, groundAt(nx, nz));
        return;
      }
    }
    if (typeof pl.teleport === 'function') pl.teleport(p.x + p.r + 0.9, p.z);
  }

  function updatePits(dt, t, live) {
    const cull2 = SAND.cull * SAND.cull;
    let inside = null;
    for (let i = 0; i < pits.length; i++) {
      const p = pits[i];
      const d2 = P.ok ? U.dist2(p.x, p.z, P.x, P.z) : 0;
      const near = !P.ok || d2 < cull2;
      p.bub.visible = near;
      if (near) animateBubbles(p, dt);
      if (live && P.ok && !inside && d2 < p.r * p.r) inside = p;
    }
    if (!P.ok) return;
    const pl = ctx.player;
    const onGround = pl.grounded !== false && P.y < groundAt(P.x, P.z) + 0.4;
    if (inside && onGround) {
      if (!inside.toasted) {
        inside.toasted = true;
        toast(pickLine(ctx.content?.quicksand), 'joke');
        sfx('splash', inside.pos, 0.5);
      }
      sinkDepth = Math.min(1, sinkDepth + SAND.sinkRate * dt);
      pl.applySlow?.(SAND.slow);
      if (sinkDepth >= 1) spitOut(inside);
    } else if (!inside) {
      sinkDepth = Math.max(0, sinkDepth - SAND.recover * dt);
    }
    // Mid-jump over the pit: depth holds, so jumping buys time but doesn't cheat it.
    if (sinkDepth > 0) pl.setSink?.(sinkDepth);
  }

  // ------------------------------------------------------------------ the Rishta Aunty
  function auntyLines() {
    const a = ctx.content?.aunty || {};
    const own = a[ctx.state.character];
    return Math.random() < 0.5 && own && own.length ? own : a.any;
  }
  function auntyShout() {
    bubble(pickLine(auntyLines()), aunty.headGet, 3);
    sfx('aunty', aunty.pos, 0.8);
  }
  function updateAuntyAnchors() {
    aunty.head.set(aunty.pos.x, aunty.pos.y + 2.35, aunty.pos.z);
    aunty.aim.set(aunty.pos.x, aunty.pos.y + 1.2, aunty.pos.z);
  }

  // ~35 m behind the player on dry, open, loaded ground.
  function spawnAunty() {
    const pl = ctx.player;
    const yaw = Number.isFinite(pl?.heading) ? pl.heading : (Number.isFinite(pl?.cameraYaw) ? pl.cameraYaw : 0);
    const offsets = [0, 0.35, -0.35, 0.7, -0.7, 1.05, -1.05, 1.4, -1.4];
    for (let i = 0; i < offsets.length; i++) {
      const a = yaw + offsets[i];
      const x = P.x + Math.sin(a) * AUNTY.distance;
      const z = P.z + Math.cos(a) * AUNTY.distance;
      if (waterAt(x, z) > 0.05 || blockedBySolids(x, z, 0.8)) continue;
      const ck = ctx.world?.chunkAt?.(x, z);
      if (ck && typeof ctx.world.isLoaded === 'function' && !ctx.world.isLoaded(ck.cx, ck.cz)) continue;
      const rig = buildAunty();
      aunty.id = nextId++;
      aunty.active = true;
      all.set(aunty.id, aunty);
      aunty.pos.set(x, groundAt(x, z), z);
      aunty.yaw = yawTo(P.x - x, P.z - z);
      aunty.speed = 0;
      aunty.chaseT = 0;
      aunty.shoutT = 0;
      rig.group.visible = true;
      rig.group.position.copy(aunty.pos);
      rig.group.rotation.y = aunty.yaw;
      setAuntyFade(1, true);
      updateAuntyAnchors();
      sfx('aunty', aunty.pos, 1);
      emitHazard('hazard:spawn', aunty);
      if (ctx.state.character === 'bibi') {
        // She sees who it is, freezes, and remembers an urgent appointment elsewhere.
        aunty.state = 'fear';
        aunty.timer = 1.4;
        bubble(pickLine(ctx.content?.aunty?.bibi), aunty.headGet, 3);
      } else {
        aunty.state = 'tell';
        aunty.timer = AUNTY.tell;
        bubble('Oye! BETAAA!', aunty.headGet, 1.4);
        toast('A Rishta Aunty is coming, biodata in hand! RUN!', 'warn');
      }
      return true;
    }
    return false;
  }

  function auntyLeave(line) {
    if (line) bubble(line, aunty.headGet, 3);
    aunty.state = 'leave';
    aunty.timer = AUNTY.leaveTime;
  }
  function auntyFlee(line, seconds) {
    if (line) bubble(line, aunty.headGet, 3);
    aunty.state = 'flee';
    aunty.timer = Math.max(AUNTY.fleeTime, seconds || 0);
  }
  function auntyOff() {
    if (aunty.rig) aunty.rig.group.visible = false;
    if (aunty.active) all.delete(aunty.id);
    aunty.active = false;
    aunty.state = 'off';
    auntyNextAt = ctx.state.timePlayed + U.lerp(AUNTY.gapMin, AUNTY.gapMax, Math.random());
  }
  function stunAunty(seconds) {
    if (!aunty.active || aunty.state === 'leave' || aunty.state === 'flee') return false;
    const a = ctx.content?.aunty || {};
    auntyFlee(pickLine(ctx.state.character === 'bibi' ? a.bibi : a.giveUp), seconds);
    return true;
  }

  function updateAunty(dt, t, live) {
    if (!aunty.active) {
      const tp = ctx.state.timePlayed;
      if (live && P.ok && tp >= auntyNextAt && tp >= auntyRetryAt && !spawnAunty()) auntyRetryAt = tp + AUNTY.retry;
      return;
    }
    const dx = P.x - aunty.pos.x, dz = P.z - aunty.pos.z;
    const d = Math.sqrt(dx * dx + dz * dz);
    const face = yawTo(dx, dz);
    let speed = 0, moveYaw = face;
    switch (aunty.state) {
      case 'tell': {
        if (!live) { auntyLeave(null); break; }
        aunty.timer -= dt;
        if (aunty.timer <= 0) { aunty.state = 'chase'; aunty.chaseT = 0; aunty.shoutT = 0.4; }
        break;
      }
      case 'chase': {
        if (!live || !P.ok) { auntyLeave(pickLine(ctx.content?.aunty?.giveUp)); break; }
        aunty.chaseT += dt;
        aunty.shoutT -= dt;
        if (aunty.shoutT <= 0) { aunty.shoutT = AUNTY.shoutEvery * (0.85 + Math.random() * 0.3); auntyShout(); }
        speed = AUNTY.speed;
        if (d < AUNTY.reach + P.r && Math.abs(P.y - aunty.pos.y) < 1.6) {
          const res = hitPlayer('aunty', aunty.pos, 0);
          // A faint inside hit() already sent her packing via calm(); don't double up.
          if (aunty.state !== 'chase') break;
          if (res.applied) {
            const lost = Math.max(0, Math.floor(res.lost || 0));
            if (lost > 0) {
              toast(U.fmt(pickLine(ctx.content?.aunty?.caught), { lost }), 'warn');
              auntyLeave('Shagun accepted! Bless you, beta!');
            } else {
              auntyLeave(pickLine(ctx.content?.aunty?.giveUp));
            }
            break;
          }
        }
        if (aunty.chaseT > AUNTY.chaseTime) auntyLeave(pickLine(ctx.content?.aunty?.giveUp));
        else if (d > 90) auntyLeave(null);
        break;
      }
      case 'fear': {
        aunty.timer -= dt;
        if (aunty.timer <= 0) auntyFlee(null, AUNTY.fleeTime);
        break;
      }
      case 'flee': {
        speed = AUNTY.fleeSpeed;
        moveYaw = face + Math.PI;
        aunty.timer -= dt;
        if (aunty.timer <= 0) auntyOff();
        break;
      }
      case 'leave': {
        speed = 2.6;
        moveYaw = face + Math.PI + 0.5;
        aunty.timer -= dt;
        if (aunty.timer <= 0) auntyOff();
        break;
      }
    }
    if (!aunty.active) return;

    if (speed > 0) {
      const sp = waterAt(aunty.pos.x, aunty.pos.z) > 0.35 ? speed * 0.6 : speed;
      aunty.pos.x -= Math.sin(moveYaw) * sp * dt;
      aunty.pos.z -= Math.cos(moveYaw) * sp * dt;
      collide(aunty.pos, 0.4);
    }
    aunty.pos.y = groundAt(aunty.pos.x, aunty.pos.z);
    aunty.yaw = U.angleDamp(aunty.yaw, speed > 0 ? moveYaw : face, 10, dt);
    aunty.speed = U.damp(aunty.speed, speed, 8, dt);
    const fading = aunty.state === 'leave' || aunty.state === 'flee';
    setAuntyFade(fading && aunty.timer < 1.6 ? Math.max(0, aunty.timer / 1.6) : 1);
    poseAunty(dt, t);
    updateAuntyAnchors();
  }

  function poseAunty(dt, t) {
    const r = aunty.rig;
    const run = U.clamp(aunty.speed / AUNTY.speed, 0, 1.2);
    aunty.phase += dt * (4 + aunty.speed * 1.6);
    const ph = aunty.phase;
    r.group.position.copy(aunty.pos);
    r.group.rotation.y = aunty.yaw;
    // The waddle: hips roll, she bobs, the dupatta streams out behind.
    r.body.rotation.z = Math.sin(ph) * 0.13 * run;
    r.body.position.y = Math.abs(Math.sin(ph)) * 0.07 * run;
    r.body.position.x = aunty.state === 'fear' ? Math.sin(t * 70) * 0.025 : 0;
    r.legL.rotation.x = Math.sin(ph) * 0.75 * run;
    r.legR.rotation.x = -Math.sin(ph) * 0.75 * run;
    const wave = Math.sin(t * 9) * 0.1;
    if (aunty.state === 'fear') {
      r.armL.rotation.set(2.6, 0, -0.35);
      r.head.rotation.set(-0.2, 0, Math.sin(t * 30) * 0.05);
    } else {
      r.armL.rotation.set(0.15 - Math.sin(ph) * 0.5 * run, 0, -0.28);
      r.head.rotation.set(0.05 * run, aunty.state === 'tell' ? Math.sin(t * 6) * 0.3 : 0, -r.body.rotation.z * 0.5);
    }
    r.armR.rotation.set(2.7 + wave, 0, 0.2);
    r.folder.position.y = 1.97 + wave * 0.35;
    r.folder.rotation.z = Math.sin(t * 9) * 0.08;
    r.dupatta.rotation.x = -0.35 - run * 0.55 + Math.sin(t * 11) * 0.08 * (0.3 + run);
  }

  // ================================================================== the bosses
  // Bikraam Singh (afro, aviators, striped polo, unlimited chappals) and Papaji (mustard
  // turban, magnificent beard, checked shirt, a bag of homework). Each waits at a post near
  // spawn, plays the player's recorded "spotted" clip when he first sees you, then chases,
  // throwing things and playing the other voice notes at random. Both give up eventually,
  // vanish, and come hunting again later. Before the first run they star in a two-part intro.
  const BOSS_DEF = {
    bikraam: {
      speed: 7.3, spot: 30, lose: 75, chaseTime: 45, reach: 0.8, proj: 'slipper',
      throwGap: [1.9, 3.3], windup: 0.42, throwMin: 5, throwMax: 24,
      spotClip: 'bikraam_spot', tauntClip: 'bikraam_taunt', tauntGap: [1.2, 4], focusClip: 'bikraam_focus',
      dist: [52, 66], angleOff: 0, respawn: [70, 120], tagY: 2.45, focusY: 1.45, label: 'BIKRAAM SINGH',
    },
    papaji: {
      speed: 6.9, spot: 30, lose: 75, chaseTime: 40, reach: 0.8, proj: 'book',
      throwGap: [2.4, 3.8], windup: 0.5, throwMin: 5, throwMax: 22,
      spotClip: 'papaji_line', tauntClip: 'papaji_line', tauntGap: [7, 12], focusClip: 'papaji_focus',
      dist: [78, 96], angleOff: Math.PI * 0.82, respawn: [80, 130], tagY: 2.55, focusY: 1.5, label: 'PAPAJI',
    },
  };
  const BOSS_IDS = ['bikraam', 'papaji'];
  const bosses = {};
  let bossLine = null;            // only one boss talks at a time
  let bossLineOwner = null;

  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  }
  function scaleUV(geo, su, sv) {
    const uv = geo.attributes.uv;
    if (!uv) return geo;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
    uv.needsUpdate = true;
    return geo;
  }
  function nameTag(text, sub) {
    const draw = (g, w, h) => {
      g.clearRect(0, 0, w, h);
      g.textAlign = 'center';
      g.lineJoin = 'round';
      g.font = '800 64px "Baloo Paaji 2", "Trebuchet MS", sans-serif';
      g.lineWidth = 12; g.strokeStyle = 'rgba(30,10,6,0.92)'; g.strokeText(text, w / 2, 78);
      g.fillStyle = '#ffd447'; g.fillText(text, w / 2, 78);
      if (sub) {
        g.font = '700 34px "Baloo Paaji 2", "Trebuchet MS", sans-serif';
        g.lineWidth = 8; g.strokeText(sub, w / 2, 128);
        g.fillStyle = '#fff4e2'; g.fillText(sub, w / 2, 128);
      }
    };
    const tex = canvasTex(512, 160, draw);
    try {
      document.fonts?.load?.('800 64px "Baloo Paaji 2"').then(() => { draw(tex.image.getContext('2d'), 512, 160); tex.needsUpdate = true; }).catch(() => {});
    } catch (e) { /* fallback font is fine */ }
    const mat = new THREE.SpriteMaterial({ map: tex, depthWrite: false, transparent: true });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(1.9, 0.6, 1);
    sp.renderOrder = 5;
    return sp;
  }

  // ---- projectiles: Bikraam's hawai chappals and Papaji's homework
  let slipperGeo = null, bookGeo = null;
  function getSlipperGeo() {
    if (slipperGeo) return slipperGeo;
    slipperGeo = merge([
      prim(Box(0.1, 0.022, 0.26), '#f1efe8', 0, 0, 0),
      prim(Box(0.104, 0.012, 0.264), '#1f5fbf', 0, -0.016, 0),
      prim(Box(0.014, 0.03, 0.12), '#1f5fbf', -0.028, 0.02, -0.02, 1, 1, 1, 0, 0.45, 0),
      prim(Box(0.014, 0.03, 0.12), '#1f5fbf', 0.028, 0.02, -0.02, 1, 1, 1, 0, -0.45, 0),
    ]);
    return slipperGeo;
  }
  function getBookGeo() {
    if (bookGeo) return bookGeo;
    bookGeo = merge([
      prim(Box(0.2, 0.032, 0.27), '#2b4fa8', 0, 0, 0),
      prim(Box(0.188, 0.026, 0.258), '#fbf8f0', 0.008, 0.001, 0),
      prim(Box(0.06, 0.004, 0.08), '#f2c230', 0, 0.018, -0.05),
    ]);
    return bookGeo;
  }
  const projPool = { slipper: [], book: [] };
  const projs = [];
  function acquireProj(kind) {
    const m = projPool[kind].pop() || new THREE.Mesh(kind === 'book' ? getBookGeo() : getSlipperGeo(), matPaint);
    m.castShadow = true;
    m.visible = true;
    m.scale.setScalar(1);
    root.add(m);
    return m;
  }
  function releaseProj(p) {
    root.remove(p.mesh);
    projPool[p.kind].push(p.mesh);
  }
  function clearProjs() { while (projs.length) releaseProj(projs.pop()); }

  function throwAt(b) {
    const def = BOSS_DEF[b.id];
    const yaw = b.yaw;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const sx = b.pos.x + fx * 0.3 + rx * 0.35, sz = b.pos.z + fz * 0.3 + rz * 0.35, sy = b.pos.y + 1.75;
    const vel = ctx.player?.velocity;
    const speed = def.proj === 'book' ? 13 : 15.5;
    let tx = P.x, tz = P.z;
    const T0 = Math.sqrt(U.dist2(sx, sz, tx, tz)) / speed;
    if (vel && Number.isFinite(vel.x)) { tx += vel.x * T0 * 0.85; tz += vel.z * T0 * 0.85; }
    const dx = tx - sx, dz = tz - sz;
    const dist = Math.max(0.5, Math.sqrt(dx * dx + dz * dz));
    const T = dist / speed;
    const ty = P.y + (P.h || 1.6) * 0.55;
    const g = -18;
    const p = {
      kind: def.proj, owner: b, mesh: acquireProj(def.proj), landed: false, life: 0,
      pos: new THREE.Vector3(sx, sy, sz),
      vel: new THREE.Vector3(dx / T, (ty - sy - 0.5 * g * T * T) / T, dz / T),
      spinX: 9 + Math.random() * 6, spinY: (Math.random() - 0.5) * 8, g,
    };
    p.mesh.position.copy(p.pos);
    p.mesh.rotation.set(0, yaw, 0);
    projs.push(p);
    if (b.rig.prop) b.rig.prop.visible = false;
    sfx('whoosh', p.pos, 0.6);
  }
  function updateProjs(dt) {
    const live = ctx.state.mode === 'playing';
    const cy = P.y + (P.h || 1.6) * 0.55;
    for (let i = projs.length - 1; i >= 0; i--) {
      const p = projs[i];
      if (p.landed) {
        p.life -= dt;
        if (p.life < 0.4) p.mesh.scale.setScalar(Math.max(0.01, p.life / 0.4));
        if (p.life <= 0) { releaseProj(p); projs.splice(i, 1); }
        continue;
      }
      p.vel.y += p.g * dt;
      p.pos.addScaledVector(p.vel, dt);
      p.mesh.position.copy(p.pos);
      p.mesh.rotation.x += p.spinX * dt;
      p.mesh.rotation.y += p.spinY * dt;
      if (live && P.ok) {
        const dx = p.pos.x - P.x, dy = p.pos.y - cy, dz = p.pos.z - P.z;
        if (dx * dx + dy * dy * 0.5 + dz * dz < 0.62) {
          const res = hitPlayer(p.owner.id, p.pos, 0);
          if (res.applied) {
            const lost = Math.max(0, Math.floor(res.lost || 0));
            const lines = ctx.content?.bosses?.[p.owner.id]?.hit;
            if (lost > 0 && lines) toast(U.fmt(pickLine(lines), { lost }), 'warn');
            sfx(p.kind === 'book' ? 'hit' : 'chappal', p.pos, 1);
            bossGloat(p.owner);
          }
          p.vel.multiplyScalar(-0.25);
          p.vel.y = 3;
        }
      }
      const gy = groundAt(p.pos.x, p.pos.z);
      if (p.pos.y <= gy + 0.03 || p.life < -6) {
        p.pos.y = Math.max(gy, waterLevel()) + 0.03;
        p.mesh.position.copy(p.pos);
        p.mesh.rotation.set(0, Math.random() * TAU, 0);
        p.landed = true;
        p.life = 2.6;
      } else {
        p.life -= dt;
      }
    }
  }

  function makeBoss(id) {
    const b = {
      id, type: id, def: BOSS_DEF[id], state: 'off', timer: 0, chaseT: 0, throwT: 0, windT: 0, phase: 0,
      pos: new THREE.Vector3(), aim: new THREE.Vector3(), headPos: new THREE.Vector3(),
      post: { x: 0, z: 0, ok: false }, yaw: 0, speed: 0, hitCool: 0, tauntAt: 0, lastTake: -1,
      spottedOnce: false, rig: null, lookYaw: 0, jump: 0,
    };
    b.rig = id === 'bikraam' ? buildBikraam() : buildPapaji();
    b.headGet = () => b.headPos;
    return b;
  }
  for (const id of BOSS_IDS) bosses[id] = makeBoss(id);

  function bossAudio() { return ctx.audio; }
  function bossSay(b, clip, force) {
    const au = bossAudio();
    if (!au?.playLine) return false;
    if (bossLine && bossLine.playing && !force) return false;
    if (bossLine && bossLine.playing) bossLine.stop(0.3);
    const h = au.playLine(clip, { avoid: b.lastTake, duck: 0.65 });
    if (!h) return false;
    b.lastTake = h.index;
    bossLine = h;
    bossLineOwner = b;
    return true;
  }
  function bossQuiet(b, fade = 0.5) {
    if (bossLine && bossLineOwner === b && bossLine.playing) bossLine.stop(fade);
  }

  // Posts: reserved, flattened clearings on dry land so the intro camera has room to orbit.
  function choosePosts(seed) {
    const rng = U.rngFor(seed, 'bosses');
    const base = rng() * TAU;
    for (const id of BOSS_IDS) {
      const b = bosses[id];
      const def = b.def;
      b.post.ok = false;
      for (let k = 0; k < 40 && !b.post.ok; k++) {
        const a = base + def.angleOff + (k % 2 ? 1 : -1) * Math.floor((k + 1) / 2) * 0.22;
        const d = U.lerp(def.dist[0], def.dist[1], rng());
        const x = spawn.x - Math.sin(a) * d, z = spawn.z - Math.cos(a) * d;
        if (groundAt(x, z) < 1 || biomeAt(x, z) === 'swamp' || waterAt(x, z) > 0) continue;
        b.post.x = x; b.post.z = z; b.post.ok = true;
      }
      if (b.post.ok) {
        try { ctx.world?.reserveArea?.(b.post.x, b.post.z, 9, { flatten: true }); } catch (e) { /* optional */ }
      }
    }
  }
  function toPost(b) {
    clearStars(b);
    b.state = b.post.ok ? 'post' : 'off';
    b.pos.set(b.post.x, groundAt(b.post.x, b.post.z), b.post.z);
    b.yaw = yawTo(spawn.x - b.post.x, spawn.z - b.post.z);
    b.speed = 0; b.chaseT = 0; b.hitCool = 0; b.windT = 0; b.jump = 0;
    b.rig.group.visible = b.post.ok;
    if (b.rig.prop) b.rig.prop.visible = true;
    all.set(b.id, b);
  }
  function clearStars(b) {
    if (b.rig.stars) { b.rig.head.remove(b.rig.stars); releaseStars(b.rig.stars); b.rig.stars = null; }
  }
  function startChase(b) {
    b.state = 'spot';
    b.timer = 0.9;
    b.jump = 0;
    const lines = ctx.content?.bosses?.[b.id]?.spotted;
    toast(pickLine(lines), 'warn');
    bossSay(b, b.def.spotClip, true);   // the "first sees you" clip always gets the floor
    emitHazard('hazard:spawn', b);
  }
  function bossGiveUp(b, line) {
    if (line) toast(line, 'joke');
    b.state = 'tired';
    b.timer = 3;
    b.windT = 0;
    if (b.rig.prop) b.rig.prop.visible = true;
  }
  function bossGloat(b) {
    if (b.state !== 'chase') return;
    b.state = 'gloat';
    b.timer = 1.6;
    b.windT = 0;
    b.hitCool = Math.max(b.hitCool, 2.6);
    if (b.rig.prop) b.rig.prop.visible = true;
  }
  function stunBoss(b, seconds) {
    if (!['post', 'hunt', 'spot', 'chase', 'gloat'].includes(b.state)) return false;
    clearStars(b);
    b.rig.stars = acquireStars();
    b.rig.stars.position.set(0, 0.62, 0);
    b.rig.head.add(b.rig.stars);
    b.state = 'stunned';
    b.timer = seconds;
    b.windT = 0;
    const s = ctx.content?.bosses?.[b.id]?.stunned;
    if (s) toast(s, 'joke');
    return true;
  }
  function respawnHunt(b) {
    if (!P.ok) return false;
    const pl = ctx.player;
    const yaw = Number.isFinite(pl?.heading) ? pl.heading : 0;
    for (const off of [0, 0.5, -0.5, 1, -1, 1.5, -1.5]) {
      const a = yaw + off;
      const x = P.x + Math.sin(a) * 42, z = P.z + Math.cos(a) * 42;
      if (waterAt(x, z) > 0.05 || blockedBySolids(x, z, 0.8)) continue;
      const ck = ctx.world?.chunkAt?.(x, z);
      if (ck && typeof ctx.world.isLoaded === 'function' && !ctx.world.isLoaded(ck.cx, ck.cz)) continue;
      b.pos.set(x, groundAt(x, z), z);
      b.yaw = yawTo(P.x - x, P.z - z);
      b.state = 'hunt';
      b.chaseT = 0;
      b.rig.group.visible = true;
      if (b.rig.prop) b.rig.prop.visible = true;
      return true;
    }
    return false;
  }

  function stepBoss(b, dt, t, live) {
    const def = b.def;
    if (b.state === 'off') return;
    const dx = P.x - b.pos.x, dz = P.z - b.pos.z;
    const d = Math.sqrt(dx * dx + dz * dz);
    const face = yawTo(dx, dz);
    let speed = 0, moveYaw = face;
    if (b.hitCool > 0) b.hitCool -= dt;
    switch (b.state) {
      case 'post':
      case 'hunt': {
        if (b.state === 'hunt' && live) speed = d > 8 ? 2.4 : 0;
        if (live && P.ok && d < def.spot && canEngage(b.pos.x, b.pos.z)) startChase(b);
        break;
      }
      case 'spot': {
        b.timer -= dt;
        b.jump = Math.sin(Math.min(1, (0.9 - b.timer) / 0.5) * Math.PI) * 0.35;
        if (!live) { b.state = 'post'; break; }
        if (b.timer <= 0) { b.state = 'chase'; b.chaseT = 0; b.throwT = U.lerp(def.throwGap[0], def.throwGap[1], Math.random()) * 0.6; b.tauntAt = 0; b.jump = 0; }
        break;
      }
      case 'chase': {
        if (!live || !P.ok) { bossGiveUp(b, null); break; }
        b.chaseT += dt;
        speed = waterAt(b.pos.x, b.pos.z) > 0.35 ? def.speed * 0.6 : def.speed;
        if (b.windT > 0) {
          speed *= 0.35;
          b.windT -= dt;
          if (b.windT <= 0) { throwAt(b); b.throwT = U.lerp(def.throwGap[0], def.throwGap[1], Math.random()); }
        } else {
          b.throwT -= dt;
          if (b.throwT <= 0 && d > def.throwMin && d < def.throwMax && projs.length < 8) b.windT = def.windup;
          else if (b.throwT <= 0) b.throwT = 0.4;
          if (b.windT <= 0 && b.rig.prop && !b.rig.prop.visible && b.throwT < def.throwGap[0] - 0.6) b.rig.prop.visible = true;
        }
        if (d < def.reach + P.r && b.hitCool <= 0 && Math.abs(P.y - b.pos.y) < 1.6) {
          const res = hitPlayer(b.id, b.pos, 0);
          b.hitCool = 2.5;
          if (res.applied) {
            const lost = Math.max(0, Math.floor(res.lost || 0));
            const lines = ctx.content?.bosses?.[b.id]?.hit;
            if (lost > 0 && lines) toast(U.fmt(pickLine(lines), { lost }), 'warn');
            bossGloat(b);
            break;
          }
        }
        // the other voice notes, at random, whenever nobody else is talking
        if (!(bossLine && bossLine.playing)) {
          if (!b.tauntAt) b.tauntAt = t + U.lerp(def.tauntGap[0], def.tauntGap[1], Math.random());
          else if (t >= b.tauntAt) { if (bossSay(b, def.tauntClip, false)) b.tauntAt = 0; else b.tauntAt = t + 1; }
        }
        if (b.chaseT > def.chaseTime || d > def.lose) bossGiveUp(b, pickLine(ctx.content?.bosses?.[b.id]?.giveUp));
        break;
      }
      case 'gloat': {
        // a little victory dance after landing one: your window to get away
        b.timer -= dt;
        if (!live) { bossGiveUp(b, null); break; }
        if (b.timer <= 0) { b.state = 'chase'; b.throwT = Math.max(b.throwT, 1.2); }
        break;
      }
      case 'stunned': {
        b.timer -= dt;
        if (b.timer <= 0) {
          clearStars(b);
          if (live && d < 40) { b.state = 'chase'; b.throwT = 1.2; } else bossGiveUp(b, null);
        }
        break;
      }
      case 'tired': {
        b.timer -= dt;
        if (b.timer <= 0) { b.state = 'leave'; b.timer = 4; }
        break;
      }
      case 'leave': {
        speed = 2.6;
        moveYaw = face + Math.PI + 0.4;
        b.timer -= dt;
        if (b.timer <= 0) {
          b.state = 'away';
          b.timer = U.lerp(def.respawn[0], def.respawn[1], Math.random());
          b.rig.group.visible = false;
        }
        break;
      }
      case 'away': {
        if (live) { b.timer -= dt; if (b.timer <= 0 && !respawnHunt(b)) b.timer = 5; }
        break;
      }
    }
    if (b.state === 'away' || b.state === 'off') return;
    if (speed > 0) {
      b.pos.x -= Math.sin(moveYaw) * speed * dt;
      b.pos.z -= Math.cos(moveYaw) * speed * dt;
      collide(b.pos, 0.45);
    }
    b.pos.y = groundAt(b.pos.x, b.pos.z);
    const faceYaw = ((b.state === 'post' && (!live || d > 45))) ? b.yaw : (speed > 0 ? moveYaw : (b.state === 'stunned' ? b.yaw : face));
    if (b.state !== 'pose') b.yaw = U.angleDamp(b.yaw, faceYaw, 8, dt);
    b.speed = U.damp(b.speed, speed, 8, dt);
  }

  function poseBoss(b, dt, t) {
    const r = b.rig;
    if (!r.group.visible) return;
    const def = b.def;
    const run = U.clamp(b.speed / def.speed, 0, 1.3);
    b.phase += dt * (3 + b.speed * 1.55);
    const ph = b.phase;
    r.group.position.copy(b.pos);
    r.group.rotation.y = b.yaw;
    const st = b.state;
    r.body.position.set(0, Math.abs(Math.sin(ph)) * 0.08 * run + b.jump, 0);
    r.body.rotation.set(-0.14 * run, 0, Math.sin(ph) * 0.05 * run);
    r.legL.rotation.set(Math.sin(ph) * 0.85 * run, 0, 0);
    r.legR.rotation.set(-Math.sin(ph) * 0.85 * run, 0, 0);
    r.armL.rotation.set(-Math.sin(ph) * 0.75 * run, 0, -0.12);
    r.armR.rotation.set(Math.sin(ph) * 0.75 * run, 0, 0.12);
    r.belly.scale.y = 0.95 + Math.sin(ph * 2) * 0.05 * run;
    let headYaw = 0, headPitch = 0;
    if (st === 'post' || st === 'hunt' || st === 'pose') {
      const br = Math.sin(t * 1.8);
      r.body.position.y += br * 0.01;
      headYaw = Math.sin(t * 0.55 + (b.id === 'papaji' ? 2 : 0)) * 0.55;
      if (st === 'pose') headYaw = U.clamp(b.lookYaw, -1.1, 1.1);
      if (b.id === 'bikraam') {
        // tosses a chappal in his hand, waiting
        const toss = Math.max(0, Math.sin(t * 3.4));
        r.armR.rotation.set(0.55 + toss * 0.45, 0, 0.15);
        if (r.prop) r.prop.position.y = -0.66 - toss * 0.12;
        r.armL.rotation.set(0.1, 0, -0.3);
      } else {
        // wags a finger and holds up the homework
        r.armL.rotation.set(2.2 + Math.sin(t * 7) * 0.12, 0, -0.25 + Math.sin(t * 7) * 0.18);
        r.armR.rotation.set(0.9, 0, 0.2);
      }
    } else if (st === 'gloat') {
      const hop = Math.abs(Math.sin(t * 10));
      r.body.position.y += hop * 0.07;
      r.armL.rotation.set(2.8 + hop * 0.2, 0, -0.4);
      r.armR.rotation.set(2.8 + hop * 0.2, 0, 0.4);
      headPitch = -0.25;
    } else if (st === 'spot') {
      r.armL.rotation.set(2.6, 0, -0.5);
      r.armR.rotation.set(2.6, 0, 0.5);
      headPitch = -0.15;
    } else if (st === 'stunned') {
      r.body.rotation.z = Math.sin(t * 5) * 0.12;
      r.body.rotation.x = 0.05;
      headYaw = Math.sin(t * 4) * 0.3;
      r.armL.rotation.set(0.2, 0, -0.6); r.armR.rotation.set(0.2, 0, 0.6);
      if (r.stars) r.stars.rotation.y += dt * 4;
    } else if (st === 'tired' || st === 'leave') {
      const pant = Math.sin(t * 9) * 0.02;
      if (st === 'tired') {
        r.body.rotation.x = -0.55;
        r.body.position.y = -0.05 + pant;
        r.armL.rotation.set(-0.35, 0, 0.1); r.armR.rotation.set(-0.35, 0, -0.1);
        headPitch = 0.3;
      }
    }
    if (st === 'chase' && b.windT > 0) {
      const k = 1 - b.windT / def.windup;
      r.armR.rotation.set(-2.5 * Math.sin(k * Math.PI * 0.5), 0, 0.2);
    }
    r.head.rotation.set(headPitch, headYaw, 0);
    r.tag.visible = st !== 'tired' && st !== 'leave';
    b.aim.set(b.pos.x, b.pos.y + 1.2, b.pos.z);
    b.headPos.set(b.pos.x, b.pos.y + def.tagY + 0.25, b.pos.z);
  }

  function updateBosses(dt, t, live) {
    for (const id of BOSS_IDS) {
      const b = bosses[id];
      if (cut.active) { poseBoss(b, dt, t); continue; }
      stepBoss(b, dt, t, live);
      poseBoss(b, dt, t);
    }
    updateProjs(dt);
  }

  // ---- the intro: orbit Bikraam to his focus music, then swing over to Papaji for his
  const cut = { active: false, seg: 0, t: 0, segT: 0, len: 0, clip: null, fly: 0, angle: 0, from: new THREE.Vector3(), look: new THREE.Vector3(), fromLook: new THREE.Vector3() };
  const _camGoal = new THREE.Vector3();
  const _lookGoal = new THREE.Vector3();
  function cutBoss() { return bosses[BOSS_IDS[cut.seg]]; }
  function beginIntro() {
    if (!BOSS_IDS.every((id) => bosses[id].post.ok)) return false;
    for (const id of BOSS_IDS) { toPost(bosses[id]); bosses[id].state = 'pose'; }
    clearProjs();
    cut.active = true;
    cut.t = 0;
    startSeg(0);
    ctx.events.emit('cutscene:start', { bosses: BOSS_IDS.slice() });
    return true;
  }
  function startSeg(i) {
    cut.seg = i;
    cut.segT = 0;
    cut.len = 0;
    if (cut.clip) cut.clip.stop(0.5);
    cut.clip = null;
    const b = cutBoss();
    cut.fly = i > 0 ? 1.8 : 0;
    cut.from.copy(ctx.camera.position);
    cut.fromLook.copy(cut.look);
    cut.angle = b.yaw - 0.35;
    const info = ctx.content?.bosses?.[b.id] || {};
    ctx.events.emit('cutscene:focus', { id: b.id, index: i, count: BOSS_IDS.length, name: info.name || b.def.label, eyebrow: info.eyebrow || '', tagline: info.tagline || '' });
  }
  function updateCutscene(dt) {
    cut.t += dt;
    cut.segT += dt;
    const b = cutBoss();
    const def = b.def;
    const playing = cut.segT >= cut.fly;
    if (playing && !cut.clip && !cut.len) {
      const h = bossAudio()?.playLine?.(def.focusClip, { duck: 1 });
      if (h) { cut.clip = h; cut.len = cut.segT + h.duration + 0.4; }
      else if (cut.segT > cut.fly + 1.5) cut.len = cut.segT + 5;   // no clip (muted or missing)
    }
    if (bossAudio()?.muted && !cut.len && playing) cut.len = cut.segT + 5;
    // camera orbit
    cut.angle += dt * 0.42;
    const prog = cut.len ? U.clamp((cut.segT - cut.fly) / Math.max(1, cut.len - cut.fly), 0, 1) : 0;
    const R = 4.7 - prog * 1.1;
    _camGoal.set(b.pos.x - Math.sin(cut.angle) * R, 0, b.pos.z - Math.cos(cut.angle) * R);
    _camGoal.y = Math.max(b.pos.y + def.focusY + 0.15 + Math.sin(cut.t * 0.6) * 0.15, groundAt(_camGoal.x, _camGoal.z) + 0.7);
    _lookGoal.set(b.pos.x, b.pos.y + def.focusY - 0.05, b.pos.z);
    const cam = ctx.camera;
    if (cut.fly > 0 && cut.segT < cut.fly) {
      const k = U.smoothstep(0, 1, cut.segT / cut.fly);
      cam.position.lerpVectors(cut.from, _camGoal, k);
      cam.position.y += Math.sin(k * Math.PI) * 6;           // swoop up and over the canopy
      cut.look.lerpVectors(cut.fromLook, _lookGoal, k);
    } else {
      cam.position.copy(_camGoal);
      cut.look.copy(_lookGoal);
    }
    cam.lookAt(cut.look);
    // the star of the segment watches the camera
    for (const id of BOSS_IDS) {
      const o = bosses[id];
      const toCam = yawTo(cam.position.x - o.pos.x, cam.position.z - o.pos.z);
      if (o === b) o.yaw = U.angleDamp(o.yaw, toCam, 1.4, dt);   // turns, a beat behind the camera
      const want = U.angleWrap(toCam - o.yaw);
      o.lookYaw = U.angleDamp(o.lookYaw, o === b ? want : 0, 4, dt);
    }
    const inp = ctx.input;
    if (cut.t > 0.6 && inp && (inp.pressed('Space') || inp.pressed('Enter') || inp.pressed('Escape') || inp.pressed('NumpadEnter'))) { skipIntro(); return; }
    if (cut.len && cut.segT >= cut.len) {
      if (cut.seg + 1 < BOSS_IDS.length) startSeg(cut.seg + 1);
      else endIntro();
    }
  }
  function skipIntro() {
    if (!cut.active) return;
    if (cut.clip) cut.clip.stop(0.3);
    endIntro();
  }
  function endIntro() {
    if (!cut.active) return;
    cut.active = false;
    if (cut.clip && cut.clip.playing) cut.clip.stop(0.8);
    cut.clip = null;
    for (const id of BOSS_IDS) { const b = bosses[id]; b.lookYaw = 0; toPost(b); }
    if (ctx.state.mode === 'cutscene') ctx.setMode('playing');
    ctx.events.emit('cutscene:end', {});
  }
  function calmBosses(full) {
    for (const id of BOSS_IDS) {
      const b = bosses[id];
      if (b.state === 'spot' || b.state === 'chase' || b.state === 'stunned' || b.state === 'gloat') {
        clearStars(b);
        bossGiveUp(b, full ? null : pickLine(ctx.content?.bosses?.[b.id]?.giveUp));
      }
    }
    if (bossLine && bossLine.playing) bossLine.stop(full ? 0.6 : 1.2);
  }
  function resetBosses() {
    if (bossLine && bossLine.playing) bossLine.stop(0.3);
    bossLine = null;
    clearProjs();
    if (cut.active) { cut.active = false; if (cut.clip) cut.clip.stop(0.3); cut.clip = null; }
    for (const id of BOSS_IDS) { const b = bosses[id]; b.lastTake = -1; toPost(b); }
  }

  // ------------------------------------------------------------------ calming down
  // full = victory/title: chases end, fleeing monkeys bolt for the canopy, the aunty departs.
  // not full = the player fainted or respawned: chasers back off and give them a breather.
  function calm(full) {
    for (let i = 0; i < monkeys.length; i++) {
      const m = monkeys[i];
      if (m.state === 'tell' || m.state === 'chase') goHome(m, MONKEY.cooldown);
      else if (full && m.state === 'flee') startLeap(m);
    }
    for (let i = 0; i < swarms.length; i++) {
      const s = swarms[i];
      if (s.state === 'tell' || s.state === 'chase') swarmGiveUp(s, SWARM.cooldown);
    }
    if (aunty.active && (aunty.state === 'tell' || aunty.state === 'chase')) {
      auntyLeave(pickLine(ctx.content?.aunty?.giveUp));
    }
    calmBosses(full);
  }

  // Per-run reset: everyone home, no loot on heads, timers and the aunty schedule cleared.
  function resetActivity() {
    for (let i = 0; i < monkeys.length; i++) {
      const m = monkeys[i];
      releaseStack(m);
      releaseStars(m.stars);
      m.stars = null;
      m.cooldown = 0;
      m.chaseT = 0;
      placeMonkeyAtHome(m);
    }
    for (let i = 0; i < swarms.length; i++) {
      const s = swarms[i];
      s.pos.copy(s.home);
      s.state = 'idle';
      s.cooldown = 0;
      s.chaseT = 0;
      s.bibiT = 0;
      s.spread = 1;
      s.buzzT = Math.random() * SWARM.buzzEvery;
    }
    for (let i = 0; i < pits.length; i++) pits[i].toasted = false;
    sinkDepth = 0;
    if (aunty.active) auntyOff();
    auntyNextAt = AUNTY.firstAt;
    auntyRetryAt = 0;
    mosquitoToastAt = -999;
    vicksToasted = false;
    resetBosses();
  }

  // New world: drop everything seed-dependent.
  function reset() {
    for (const rec of chunks.values()) disposeRecord(rec);
    chunks.clear();
    monkeys.length = 0;
    swarms.length = 0;
    pits.length = 0;
    all.clear();
    if (aunty.active || aunty.state !== 'off') auntyOff();
    auntyNextAt = AUNTY.firstAt;
    auntyRetryAt = 0;
    sinkDepth = 0;
    const sp = ctx.world?.getSpawnPoint?.();
    if (sp && Number.isFinite(sp.x) && Number.isFinite(sp.z)) { spawn.x = sp.x; spawn.z = sp.z; }
    choosePosts(ctx.seed);
    resetBosses();
  }

  function update(dt, t) {
    readPlayer();
    const live = ctx.state.mode === 'playing';
    updateMonkeys(dt, t, live);
    updateSwarms(dt, t, live);
    updatePits(dt, t, live);
    updateAunty(dt, t, live);
    if (cut.active) {
      if (ctx.state.mode === 'cutscene') updateCutscene(dt);
      else if (ctx.state.mode !== 'paused') endIntro();
    }
    updateBosses(dt, t, live);
  }

  // ------------------------------------------------------------------ events
  ctx.events.on('chunk:load', onChunkLoad);
  ctx.events.on('chunk:unload', onChunkUnload);
  ctx.events.on('world:ready', (e) => {
    if (e && e.spawn && Number.isFinite(e.spawn.x)) { spawn.x = e.spawn.x; spawn.z = e.spawn.z; }
  });
  ctx.events.on('mode', (e) => {
    if (!e) return;
    if (e.mode === 'victory') calm(true);
    else if (e.mode === 'title') resetActivity();
  });
  ctx.events.on('player:faint', () => calm(false));
  ctx.events.on('player:respawn', () => calm(false));

  // ------------------------------------------------------------------ public API
  function stunHazard(h, seconds) {
    let ok = false;
    if (h.type === 'monkey') ok = stunMonkey(h, seconds);
    else if (h.type === 'mosquito') ok = stunSwarm(h, seconds);
    else if (h.type === 'aunty') ok = stunAunty(seconds);
    else if (BOSS_DEF[h.type]) ok = stunBoss(h, seconds);
    if (ok) emitHazard('hazard:stunned', h);
    return ok;
  }
  function targetable(h) {
    if (h.type === 'monkey') return h.state !== 'gone' && h.state !== 'leap';
    if (h.type === 'mosquito') return h.fade > 0.5 && h.state !== 'scatter' && h.state !== 'away';
    if (h.type === 'aunty') return h.active && h.state !== 'leave' && h.state !== 'flee';
    if (BOSS_DEF[h.type]) return h.rig.group.visible && (h.state === 'post' || h.state === 'hunt' || h.state === 'spot' || h.state === 'chase' || h.state === 'gloat');
    return false;
  }
  function threatening(h) {
    if (h.type === 'monkey') return h.state === 'chase' || h.state === 'tell' || h.carry > 0;
    if (h.type === 'mosquito') return h.state === 'chase' || h.state === 'tell';
    if (BOSS_DEF[h.type]) return h.state === 'spot' || h.state === 'chase' || h.state === 'gloat';
    return h.type === 'aunty';
  }

  return {
    beginIntro,
    skipIntro,
    get introActive() { return cut.active; },
    // True while Bikraam, Papaji or the rishta aunty is after you (drives the chase music).
    get chasing() {
      if (ctx.state.mode !== 'playing' && ctx.state.mode !== 'paused') return false;
      for (const id of BOSS_IDS) {
        const st = bosses[id].state;
        if (st === 'spot' || st === 'chase' || st === 'gloat' || st === 'stunned') return true;
      }
      return aunty.active && (aunty.state === 'tell' || aunty.state === 'chase');
    },
    // Minimap feed: [{type:'monkey'|'mosquito'|'quicksand'|'aunty', x, z, id}]
    list(a, b, c) {
      const q = norm(a, b, c);
      const qx = q.x, qz = q.z;
      const rr = Number.isFinite(q.r) ? q.r : 60;
      const r2 = rr * rr;
      const out = [];
      for (let i = 0; i < monkeys.length; i++) {
        const m = monkeys[i];
        if (m.state !== 'gone' && U.dist2(m.pos.x, m.pos.z, qx, qz) <= r2) out.push({ type: 'monkey', x: m.pos.x, z: m.pos.z, id: m.id });
      }
      for (let i = 0; i < swarms.length; i++) {
        const s = swarms[i];
        if (s.fade > 0.3 && s.state !== 'away' && U.dist2(s.pos.x, s.pos.z, qx, qz) <= r2) out.push({ type: 'mosquito', x: s.pos.x, z: s.pos.z, id: s.id });
      }
      for (let i = 0; i < pits.length; i++) {
        const p = pits[i];
        if (U.dist2(p.x, p.z, qx, qz) <= (rr + p.r) * (rr + p.r)) out.push({ type: 'quicksand', x: p.x, z: p.z, id: p.id, r: p.r });
      }
      if (aunty.active && U.dist2(aunty.pos.x, aunty.pos.z, qx, qz) <= r2) out.push({ type: 'aunty', x: aunty.pos.x, z: aunty.pos.z, id: aunty.id });
      for (const id of BOSS_IDS) {
        const b = bosses[id];
        if (b.rig.group.visible && b.state !== 'away' && U.dist2(b.pos.x, b.pos.z, qx, qz) <= r2) out.push({ type: id, x: b.pos.x, z: b.pos.z, id, boss: true });
      }
      return out;
    },

    // For Bibi's chappal: nearest stunnable hazard, preferring ones that are actually after you.
    // `position` is the hazard's live aim point (it keeps moving; good for homing).
    nearest(a, b, c) {
      const q = norm(a, b, c);
      const qx = q.x, qz = q.z;
      const maxR = Number.isFinite(q.r) ? q.r : 22;
      const max2 = maxR * maxR;
      let best = null, bestScore = Infinity;
      for (const h of all.values()) {
        if (!targetable(h)) continue;
        const d2 = U.dist2(h.aim.x, h.aim.z, qx, qz);
        if (d2 > max2) continue;
        const score = threatening(h) ? d2 * 0.4 : d2;
        if (score < bestScore) { bestScore = score; best = h; }
      }
      return best ? { id: best.id, type: best.type, position: best.aim } : null;
    },

    stun(id, seconds = 4) {
      const h = all.get(id);
      return h ? stunHazard(h, seconds) : false;
    },

    // Babbu's Turban Tornado: stuns everything stunnable within r. Returns how many.
    stunAround(a, b, c, d) {
      const q = norm(a, b, c, d);
      const qx = q.x, qz = q.z;
      const r = Number.isFinite(q.r) ? q.r : 7;
      const seconds = Number.isFinite(q.s) ? q.s : 5;
      const r2 = r * r;
      let count = 0;
      for (const h of [...all.values()]) {
        if (h.type === 'quicksand' || !targetable(h)) continue;
        if (U.dist2(h.aim.x, h.aim.z, qx, qz) <= r2 && stunHazard(h, seconds)) count++;
      }
      return count;
    },

    // 0 outside any pit; 0.25 at the rim rising to 1 in the middle.
    quicksandAt(a, b) {
      let x = a, z = b;
      if (a && typeof a === 'object') { x = a.x; z = a.z; }
      let best = 0;
      for (let i = 0; i < pits.length; i++) {
        const p = pits[i];
        const d2 = U.dist2(x, z, p.x, p.z), r2 = p.r * p.r;
        if (d2 < r2) {
          const v = 0.25 + 0.75 * (1 - d2 / r2);
          if (v > best) best = v;
        }
      }
      return best;
    },

    reset,
    start: resetActivity,
    update,
  };
}

return { init };
})();

  if (w <= 0.0001) return;
  if (w >= 0.9999) { out.set(src); return; }
  for (let i = 0; i < POSE_N; i++) out[i] += (src[i] - out[i]) * w;
}

function lerpChannels(out, src, w, channels) {
  if (w <= 0.0001) return;

  for (let i = 0; i < channels.length; i++) {
    const c = channels[i];
    out[c] += (src[c] - out[c]) * k;
  }
}

        }

      add(parent, geom, material, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {

      pivot(parent, x = 0, y = 0, z = 0) {

  // into one vertex-coloured mesh per finish class (matte / gloss / metal × single / double
  // sided). A ~120-part character renders in roughly 25 draw calls (+ the same for shadows).
  function finishClass(m) {
    if (m.emissive && m.emissiveIntensity > 0 && (m.emissive.r + m.emissive.g + m.emissive.b) > 0) return null;
    const kind = m.metalness >= 0.2 ? 'metal' : m.roughness < 0.5 ? 'gloss' : 'matte';
    return `${kind}|${m.side}`;
  }

  function classMaterial(B, key) {
    const [kind, side] = key.split('|');
    return B.mat(`class:${key}`, '#ffffff', {
      vertexColors: true,
      side: Number(side),
      roughness: kind === 'metal' ? 0.3 : kind === 'gloss' ? 0.4 : 0.85,
      metalness: kind === 'metal' ? 0.35 : 0,

  function bakedGeometry(mesh, color) {
    mesh.updateMatrix();
    const g = mesh.geometry.clone().applyMatrix4(mesh.matrix);
    if (color) {

      const arr = new Float32Array(n * 3);

      if (!k.isMesh || k.userData.keep) continue;
      const cls = finishClass(k.material);
      const key = cls ? `class:${cls}` : k.material.uuid;
      let b = buckets.get(key);
      if (!b) buckets.set(key, (b = { cls, material: k.material, meshes: [] }));
      b.meshes.push(k);
    }
    for (const b of buckets.values()) {
      if (!b.cls && b.meshes.length < 2) continue;
      const geoms = b.meshes.map((m) => bakedGeometry(m, b.cls ? m.material.color : null));
      const merged = ctx.mergeGeometries(geoms, false);
      for (const g of geoms) g.dispose();
      if (!merged) continue;
      for (const m of b.meshes) { group.remove(m); m.geometry.dispose(); }
      const mesh = new THREE.Mesh(merged, b.cls ? classMaterial(B, b.cls) : b.material);
      mesh.castShadow = true;
      group.add(mesh);
    }

  // ------------------------------------------------------------------ Bibi (1.55 m)
  function buildBibi(B, C) {
    const d = { hipY: 0.7, hipW: 0.085, thigh: 0.33, shin: 0.32, shoulderX: 0.205, shoulderY: 0.41, upperArm: 0.24, foreArm: 0.22, neckY: 0.49, headUp: 0.125 };

    // baggy salwar legs, cuffs, chappals (the right one leaves when justice is served)

      B.add(holder, G.box(0.09, 0.018, 0.2), chappal, 0, -0.041, -0.035);
      B.add(holder, G.box(0.095, 0.02, 0.03), gold, 0, -0.012, -0.07);
      if (side > 0) r.footChappal = holder;
