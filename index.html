/* Layout: one full-bleed WebGL canvas; HUD and menus float above it on two layers.
   Look: phulkari embroidery (silk-floss diamonds in gold, kesri and pink on hand-spun khaddar)
   for every panel, set against a sunlit low-poly jungle. Single committed dark-UI look. */
:root {
  --khaddar: #2a1512;        /* hand-spun cloth: panel ground */
  --khaddar-2: #43221a;      /* raised panel / hover */
  --kesri: #ff8a1c;          /* saffron accent */
  --gold: #f6c343;           /* phulkari silk floss */
  --pink: #ff4f9a;           /* wedding pink */
  --leaf: #2f8f55;           /* jungle green */
  --ink: #fff4e2;            /* text on cloth */
  --ink-dim: #e3c9a6;        /* secondary text */
  --danger: #ff5a4f;
  --panel: rgba(42, 21, 18, 0.9);
  --panel-soft: rgba(42, 21, 18, 0.62);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --font-display: 'Rozha One', 'Georgia', 'Times New Roman', serif;
  --font-ui: 'Baloo Paaji 2', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --phulkari: repeating-conic-gradient(from 45deg at 50% 50%, rgba(246,195,67,0.22) 0 25%, transparent 0 50%) 0 0 / 14px 14px;
  --phulkari-strip: linear-gradient(90deg, var(--gold) 0 12%, var(--kesri) 12% 24%, var(--pink) 24% 36%, var(--gold) 36% 48%, var(--kesri) 48% 60%, var(--pink) 60% 72%, var(--gold) 72% 84%, var(--kesri) 84% 100%);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #0f2a1b;
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#game { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0f2a1b; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
#overlay > * { pointer-events: auto; }
#boot {
  position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
  background: #0f2a1b; color: var(--gold); font-family: var(--font-display); font-size: 28px; letter-spacing: 0.02em;
}
#err {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 9; max-width: min(520px, calc(100% - 24px)); background: rgba(60, 10, 10, 0.92); color: #ffe3dd;
  border: 1px solid #ff8a80; border-radius: 8px; padding: 8px 10px; font: 12px/1.4 ui-monospace, Menlo, monospace;
}
#err .err-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; margin-bottom: 4px; }
#err .err-close { background: none; border: 0; color: inherit; font-size: 16px; cursor: pointer; }
#err .err-lines { max-height: 140px; overflow: auto; }
#nogl { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--khaddar); }
button, input, select { font-family: var(--font-ui); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>

"use strict";
// audio.js — every sound in the jungle.
// Voice clips (your recordings > bundled game clips > the browser's own voice), synthesised SFX,
// a day/night jungle soundscape, the procedural dhol groove, and the Voice Booth where the family
// can put their own "WAHEGURU!" into the game. Babbu's rule of sound design: louder is better.
//
// API (CONTRACT.md §7.1): unlock(), update(dt, t), voice(id, opts), sfx(name, opts),
// setDhol(v), requestDhol(v), setMuted(b), muted, setMusic(b), music, clipStatus(),
// openBooth(), closeBooth(), boothOpen, plus start() / reset() lifecycle hooks.
// Extras: voice() also takes {position, combo}; sfx('pickup') takes {combo}.

// ------------------------------------------------------------------ small helpers (no DOM at load)
const noop = () => {};
const EMPTY = Object.freeze({});

function quiet(promiseLike) {
  if (promiseLike && typeof promiseLike.catch === 'function') promiseLike.catch(noop);
}

function readFlag(key, fallback) {
  try {
    const v = window.localStorage.getItem(key);
    return v === null ? fallback : v === '1';
  } catch (e) {
    return fallback;
  }
}

function writeFlag(key, value) {
  try { window.localStorage.setItem(key, value ? '1' : '0'); } catch (e) { /* storage blocked: still works this session */ }
}

function isSafeClipUrl(url) {
  return typeof url === 'string' && url.startsWith('audio/') && !url.includes('..') &&
    !url.includes(':') && !url.includes('//') && !url.includes('\\');
}

function blobToArrayBuffer(blob) {
  if (blob && typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('read failed'));
    reader.readAsArrayBuffer(blob);
  });
}

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      const v = attrs[key];
      if (v === null || v === undefined || v === false) continue;
      if (key === 'class') node.className = v;
      else if (key === 'text') node.textContent = v;
      else node.setAttribute(key, v === true ? '' : String(v));
    }
  }
  for (const kid of kids) if (kid !== null && kid !== undefined) node.append(kid);
  return node;
}

function makeTake(blob, raw) {
  return { blob: blob || null, raw: raw || null, buffer: null, offset: 0, length: 0, gain: 1, peak: 0, failed: false, decoding: false };
}

// Trim leading/trailing silence and normalise loudness once, at decode time, so a recording that
// starts with half a second of breath still lands its "WAHEGURU!" right on the pickup.
function analyseTake(take, buffer) {
  const data = buffer.getChannelData(0);
  const n = data.length;
  let peak = 0;
  for (let i = 0; i < n; i += 2) {
    const a = data[i] < 0 ? -data[i] : data[i];
    if (a > peak) peak = a;
  }
  const threshold = Math.max(0.008, peak * 0.08);
  let first = 0;
  while (first < n && Math.abs(data[first]) < threshold) first++;
  let last = n - 1;
  while (last > first && Math.abs(data[last]) < threshold) last--;
  const sr = buffer.sampleRate;
  take.buffer = buffer;
  take.peak = peak;
  take.offset = Math.max(0, first / sr - 0.02);
  take.length = Math.min(buffer.duration - take.offset, (last - first) / sr + 0.16);
  if (!(take.length > 0.05)) { take.offset = 0; take.length = buffer.duration; }
  take.gain = peak > 0.0001 ? Math.min(3, Math.max(0.5, 0.75 / peak)) : 1;
}

// ------------------------------------------------------------------ module
// ---------------------------------------------------------------- Punjabi music (procedural)
// The background score, all synthesised live. Normal play: a relaxed bhangra groove at 96 BPM:
// soft dhol (dagga bass side and tilli stick side) in the swung chaal rhythm, a twangy tumbi
// riff, an algoza (twin wooden flutes) melody drifting in now and then, and a light bass.
// A chase: full-tilt bhangra at 168 BPM: pounding dhol with rolls, chimta jingles on the
// off-beats, a fast tumbi riff in Kafi (S R g m P D n, the minor-ish mode of Punjabi folk) and
// urgent algoza stabs. Plucked strings are Karplus-Strong renders played through playbackRate.
const SITAR_SA = 138.59;                       // C#3 tonic, kept for the bass and the tumba
const LEVEL_SITAR = 0.22;                      // normal groove: bus level before the master
const LEVEL_CHASE = 0.24;                      // chase: a little more present
const SW = { S: 1, R: 9 / 8, g: 6 / 5, G: 5 / 4, m: 4 / 3, P: 3 / 2, D: 5 / 3, n: 9 / 5, N: 15 / 8 };

function xorshift(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

// One plucked string (see the tumbi and tumba banks below). Returns {data, f}.
function renderPluck(sr, f0, seconds, opts = {}) {
  const decay = opts.decay ?? 0.9985;
  const bright = opts.bright ?? 0.6;
  const blend = opts.blend ?? 0.42;
  const buzz = opts.buzz ?? 0.3;
  const contact = opts.contact ?? 0.65;
  const pickPos = opts.pickPos ?? 0.12;
  const rnd = xorshift(opts.seed || 7);
  const len = Math.max(1, Math.floor(sr * seconds));
  const out = new Float32Array(len);
  const N = Math.max(2, Math.round(sr / f0));
  const line = new Float32Array(N);
  let lp = 0;
  for (let i = 0; i < N; i++) { lp += bright * ((rnd() * 2 - 1) - lp); line[i] = lp; }
  const pk = Math.max(1, Math.round(N * pickPos));
  const ex = line.slice();
  let mean = 0;
  for (let i = 0; i < N; i++) { line[i] = ex[i] - 0.9 * ex[(i - pk + N) % N]; mean += line[i]; }
  mean /= N;
  let peak0 = 0;
  for (let i = 0; i < N; i++) { line[i] -= mean; peak0 = Math.max(peak0, Math.abs(line[i])); }
  const th = contact * (peak0 || 1);
  let idx = 0, prev = 0;
  for (let i = 0; i < len; i++) {
    const cur = line[idx];
    out[i] = cur;
    let y = decay * ((1 - blend) * cur + blend * prev);
    prev = cur;
    const a = y < 0 ? -y : y;
    if (a > th) y = (y < 0 ? -1 : 1) * (th + (a - th) * (1 - buzz));
    line[idx] = y;
    if (++idx >= N) idx = 0;
  }
  let sum = 0, cnt = 0;
  for (let i = Math.floor(sr * 0.03); i < Math.min(len, Math.floor(sr * 0.25)); i++) { sum += out[i] * out[i]; cnt++; }
  const rms = cnt ? Math.sqrt(sum / cnt) : 0;
  const g = rms > 0 ? 0.24 / rms : 1;
  const fadeIn = Math.min(len, Math.floor(sr * 0.0015));
  const fadeOut = Math.min(len, Math.floor(sr * 0.08));
  for (let i = 0; i < len; i++) {
    let v = Math.tanh(out[i] * g * 1.1) / 1.1;
    if (i < fadeIn) v *= i / fadeIn;
    if (i > len - fadeOut) v *= (len - i) / fadeOut;
    out[i] = v;
  }
  return { data: out, f: sr / N };
}

// Riffs and tunes, as swara names; ' = upper octave, . = lower, - = rest.
const CALM = {
  bpm: 96,
  scale: ['S', 'R', 'G', 'P', 'D'],                       // Bilawal pentatonic: sunny
  tumbi: [
    ["S'", "S'", 'D', 'P', 'G', 'P', 'D', "S'"],
    ['G', 'G', 'R', 'S', 'R', 'G', 'P', 'G'],
    ['P', 'D', "S'", 'D', 'P', 'G', 'R', 'S'],
    ['-', 'G', 'P', 'D', "S'", '-', 'D', 'P'],
  ],
  algoza: [
    [['G', 2], ['P', 1], ['D', 1], ['P', 2], ['G', 2]],
    [["S'", 3], ['D', 1], ['P', 2], ['G', 1], ['R', 1]],
    [['P', 2], ['G', 1], ['R', 1], ['S', 4]],
  ],
  bass: ['S', 'S', 'P.', 'S'],
};
const CHASE = {
  bpm: 168,
  tumbi: [
    ["S'", 'n', 'D', 'n', "S'", 'n', 'D', 'P', 'm', 'P', 'D', 'n', "S'", "R'", "S'", 'n'],
    ['D', 'P', 'm', 'P', 'D', 'P', 'm', 'g', 'R', 'g', 'm', 'P', 'D', 'P', 'm', 'g'],
    ['S', 'R', 'g', 'm', 'P', 'D', 'n', "S'", "R'", "S'", 'n', 'D', 'P', 'm', 'g', 'R'],
    ["S'", "S'", 'n', "S'", "R'", "S'", 'n', 'D', 'n', 'n', 'D', 'n', "S'", 'n', 'D', 'P'],
  ],
  order: [0, 0, 1, 2, 0, 3, 1, 2],
  algoza: ["S'", "R'", 'n', "g'"],
  bass: ['S', 'S', 'n.', 'S', 'g', 'g', 'm', 'P.'],
};
function swRatio(name) {
  let n = name, oct = 1;
  if (n.endsWith("'")) { oct = 2; n = n.slice(0, -1); } else if (n.endsWith('.')) { oct = 0.5; n = n.slice(0, -1); }
  return (SW[n] || 1) * oct;
}

// The live player. dest: an AudioNode (the master). update(dt, p) every frame with
// p = {on, night, duck, voice, chase, paused, victory}.
function createSitar(ac, dest) {
  const sr = ac.sampleRate;
  const rng = xorshift(((Math.random() * 4294967296) >>> 0) || 1);

  // ---- buses: calm groove and chase each have their own fader into a shared tone/space chain
  const calmG = ac.createGain(); calmG.gain.value = 0;
  const chaseG = ac.createGain(); chaseG.gain.value = 0;
  calmG.connect(dest); chaseG.connect(dest);
  function strip(out, verbAmt) {
    const tone = ac.createBiquadFilter();
    tone.type = 'peaking'; tone.frequency.value = 2400; tone.Q.value = 0.9; tone.gain.value = 3;
    const soft = ac.createBiquadFilter();
    soft.type = 'lowpass'; soft.frequency.value = 7000; soft.Q.value = 0.5;
    tone.connect(soft); soft.connect(out);
    const echo = ac.createDelay(0.6); echo.delayTime.value = 0.18;
    const fb = ac.createGain(); fb.gain.value = verbAmt;
    soft.connect(echo); echo.connect(fb); fb.connect(echo); fb.connect(out);
    return tone;
  }
  const calmIn = strip(calmG, 0.2);
  const chaseIn = strip(chaseG, 0.16);
  const calmDrums = ac.createGain(); calmDrums.gain.value = 0.55; calmDrums.connect(calmG);
  const chaseDrums = ac.createGain(); chaseDrums.gain.value = 0.95; chaseDrums.connect(chaseG);

  // ---- plucked banks, rendered over a few frames so Start never stutters
  const banks = { tumbi: [], tumba: [] };
  const toBuffer = (r) => { const b = ac.createBuffer(1, r.data.length, sr); b.getChannelData(0).set(r.data); return { buf: b, f: r.f }; };
  const jobs = [];
  // tumbi: one high steel string, bright and twangy, short ring
  for (const seed of [13, 29]) jobs.push(() => banks.tumbi.push(toBuffer(renderPluck(sr, SITAR_SA * 4, 1.1, { seed, decay: 0.996, bright: 0.92, blend: 0.28, buzz: 0.12, contact: 0.8, pickPos: 0.06 }))));
  // tumba / bass: a round low pluck
  jobs.push(() => banks.tumba.push(toBuffer(renderPluck(sr, SITAR_SA / 2, 1.6, { seed: 41, decay: 0.9992, bright: 0.35, blend: 0.5, buzz: 0.05, contact: 0.9, pickPos: 0.2 }))));
  let noiseBuf = null;
  jobs.push(() => {
    const len = Math.floor(sr * 0.4);
    noiseBuf = ac.createBuffer(1, len, sr);
    const d = noiseBuf.getChannelData(0);
    const r = xorshift(505);
    for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
  });

  function pluck(bank, baseHz, ratio, when, vel, out, bendFrom) {
    const pick = bank[Math.floor(rng() * bank.length)];
    if (!pick) return;
    const src = ac.createBufferSource();
    src.buffer = pick.buf;
    const base = baseHz / pick.f;
    src.playbackRate.setValueAtTime(base * (bendFrom || ratio), when);
    if (bendFrom) src.playbackRate.linearRampToValueAtTime(base * ratio, when + 0.06);
    const g = ac.createGain();
    g.gain.value = vel;
    src.connect(g); g.connect(out);
    src.onended = () => { try { src.disconnect(); g.disconnect(); } catch (e) { /* gone */ } };
    src.start(when);
    src.stop(when + pick.buf.duration);
  }
  function env(g, t, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function osc(type, f0, f1, t, attack, dur, peak, out) {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
    const g = ac.createGain();
    env(g, t, peak, attack, dur);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + attack + dur + 0.02);
    o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) { /* gone */ } };
  }
  function hiss(t, type, freq, q, dur, peak, out) {
    if (!noiseBuf) return;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain();
    env(g, t, peak, 0.002, dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(t, rng() * 0.3); src.stop(t + dur + 0.03);
    src.onended = () => { try { src.disconnect(); f.disconnect(); g.disconnect(); } catch (e) { /* gone */ } };
  }
  // dhol: dagga = the big bass side hit with a curved stick; tilli = the thin cane on the treble side
  function dagga(t, acc, out) {
    osc('sine', 150, 52, t, 0.003, 0.42, 0.9 * acc, out);
    osc('triangle', 95, 60, t, 0.002, 0.12, 0.3 * acc, out);
    hiss(t, 'lowpass', 900, 0.7, 0.05, 0.25 * acc, out);
  }
  function tilli(t, acc, out) {
    hiss(t, 'bandpass', 3800, 2.5, 0.06, 0.42 * acc, out);
    osc('triangle', 820, 780, t, 0.001, 0.07, 0.16 * acc, out);
  }
  // chimta: the long fire tongs with jingles, struck on the off-beats
  function chimta(t, acc, out) {
    hiss(t, 'highpass', 6500, 0.8, 0.14, 0.2 * acc, out);
    osc('square', 2350, 2350, t, 0.001, 0.09, 0.025 * acc, out);
    osc('square', 3170, 3170, t + 0.012, 0.001, 0.08, 0.02 * acc, out);
  }
  // algoza: two wooden flutes played together, slightly apart in pitch, breathy, with vibrato
  function algoza(freq, t, dur, peak, out) {
    for (const det of [1, 1.0045]) {
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.value = freq * det;
      const vib = ac.createOscillator();
      vib.frequency.value = 5.4 + rng() * 0.6;
      const vg = ac.createGain();
      vg.gain.value = freq * 0.012;
      vib.connect(vg); vg.connect(o.frequency);
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = freq * 3.2;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * 0.5, t + 0.06);
      g.gain.setValueAtTime(peak * 0.5, t + Math.max(0.07, dur - 0.12));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(lp); lp.connect(g); g.connect(out);
      o.start(t); vib.start(t); o.stop(t + dur + 0.05); vib.stop(t + dur + 0.05);
      o.onended = () => { try { o.disconnect(); vib.disconnect(); vg.disconnect(); lp.disconnect(); g.disconnect(); } catch (e) { /* gone */ } };
    }
    hiss(t, 'bandpass', freq * 2, 1.2, Math.min(0.25, dur), peak * 0.18, out);   // breath
  }
  const TUMBI_HZ = SITAR_SA * 4;     // tumbi bank is rendered at this pitch
  const MEL_SA = SITAR_SA * 4;       // tumbi Sa (C#5): bright and high, like the real thing
  const FLUTE_SA = SITAR_SA * 2;     // algoza Sa (C#4): warm, not shrill

  // ---- normal groove: 16 swung sixteenths per bar
  const C_STEP = 60 / CALM.bpm / 4;
  const C_DAGGA = { 0: 1, 3: 0.65, 8: 0.9, 11: 0.6 };
  const C_TILLI = { 2: 0.7, 6: 0.9, 7: 0.4, 10: 0.7, 14: 0.9, 15: 0.45 };
  let calmAt = 0, calmStep = 0, calmLevel = 0, calmRiff = 0, flutePhrase = -1;
  function scheduleCalm(now, night) {
    while (calmAt < now + 0.2) {
      const s = calmStep % 16, bar = Math.floor(calmStep / 16);
      const swing = s % 2 ? C_STEP * 0.3 : 0;
      const t = Math.max(calmAt + swing, now + 0.01);
      const dk = night ? 0.55 : 1;
      if (C_DAGGA[s] !== undefined) dagga(t, C_DAGGA[s] * dk, calmDrums);
      if (C_TILLI[s] !== undefined) tilli(t, C_TILLI[s] * dk, calmDrums);
      if (s % 4 === 0) {
        const root = CALM.bass[(s / 4) | 0];
        pluck(banks.tumba, SITAR_SA / 2, swRatio(root) * 2, t, 0.5, calmIn);
      }
      // tumbi: a riff on even bars of each 4-bar phrase, quiet answers on the rest
      if (s === 0 && bar % 4 === 0) calmRiff = Math.floor(rng() * CALM.tumbi.length);
      if (s % 2 === 0 && (bar % 4 === 0 || bar % 4 === 2 || (bar % 4 === 1 && s >= 8))) {
        const note = CALM.tumbi[calmRiff][(s / 2) | 0];
        if (note !== '-') pluck(banks.tumbi, TUMBI_HZ, swRatio(note) * (MEL_SA / TUMBI_HZ), t, s % 8 === 0 ? 0.42 : 0.3, calmIn, s % 8 === 0 && rng() < 0.3 ? swRatio(note) * 0.94 : 0);
      }
      // algoza: every 8 bars a phrase floats over the top (more often at night)
      if (s === 0 && bar % (night ? 4 : 8) === 4) flutePhrase = Math.floor(rng() * CALM.algoza.length);
      if (s === 0 && flutePhrase >= 0 && bar % (night ? 4 : 8) === 4) {
        let tt = t;
        for (const [n, beats] of CALM.algoza[flutePhrase]) {
          const dur = beats * C_STEP * 2;
          algoza(FLUTE_SA * swRatio(n), tt, dur * 0.95, 0.16, calmIn);
          tt += dur;
        }
        flutePhrase = -1;
      }
      calmStep++;
      calmAt += C_STEP;
    }
  }

  // ---- chase: straight sixteenths, flat out
  const X_STEP = 60 / CHASE.bpm / 4;
  const X_DAGGA = { 0: 1, 3: 0.8, 6: 0.7, 8: 1, 11: 0.8, 14: 0.7 };
  let chaseAt = 0, chaseStep = 0, chaseLevel = 0, chaseHold = 0;
  function scheduleChase(now) {
    while (chaseAt < now + 0.2) {
      const s = chaseStep % 16, bar = Math.floor(chaseStep / 16);
      const t = Math.max(chaseAt, now + 0.01);
      const fill = bar % 4 === 3 && s >= 8;
      if (X_DAGGA[s] !== undefined && !fill) dagga(t, X_DAGGA[s], chaseDrums);
      if (fill) { tilli(t, 0.9, chaseDrums); if (s % 2 === 0) dagga(t, 0.7, chaseDrums); }
      else if (s % 2 === 1 || s === 4 || s === 12) tilli(t, s % 4 === 3 ? 0.9 : 0.6, chaseDrums);
      if (s % 4 === 2) chimta(t, 1, chaseDrums);
      if (s % 2 === 0) {
        const root = CHASE.bass[(s / 2) | 0];
        pluck(banks.tumba, SITAR_SA / 2, swRatio(root) * 2, t, s % 4 === 0 ? 0.55 : 0.35, chaseIn);
      }
      const riff = CHASE.tumbi[CHASE.order[bar % CHASE.order.length]];
      const note = riff[s];
      pluck(banks.tumbi, TUMBI_HZ, swRatio(note) * (MEL_SA / TUMBI_HZ), t, s % 4 === 0 ? 0.5 : 0.34, chaseIn);
      if (s === 0 && bar % 2 === 0) {
        const n = CHASE.algoza[(bar / 2) % CHASE.algoza.length | 0];
        algoza(FLUTE_SA * swRatio(n), t, X_STEP * 6, 0.2, chaseIn);
      }
      chaseStep++;
      chaseAt = t + X_STEP;
    }
  }

  function update(dt, p) {
    if (jobs.length) { jobs.shift()(); return; }
    const now = ac.currentTime;
    if (p.on && p.chase) chaseHold = now + 3.5;
    const chaseOn = p.on && !p.victory && now < chaseHold;
    const chaseWant = chaseOn ? LEVEL_CHASE * (1 - 0.35 * Math.min(1, p.voice || 0)) * (p.paused ? 0.5 : 1) : 0;
    chaseLevel += (chaseWant - chaseLevel) * (1 - Math.exp(-(chaseWant > chaseLevel ? 3 : 0.9) * dt));
    chaseG.gain.setTargetAtTime(chaseLevel, now, 0.05);
    if (chaseLevel > 0.003 || chaseWant > 0) {
      if (!chaseAt || chaseAt < now - 0.5) { chaseAt = now + 0.05; chaseStep = 0; }
      scheduleChase(now);
    } else {
      chaseAt = 0;
    }
    const calmScale = 1 - Math.min(1, chaseLevel / (LEVEL_CHASE * 0.5));
    const calmWant = p.on ? LEVEL_SITAR * calmScale * (1 - 0.9 * Math.min(1, p.duck || 0)) * (p.paused ? 0.55 : 1) * (p.victory ? 0.15 : 1) : 0;
    calmLevel += (calmWant - calmLevel) * (1 - Math.exp(-(calmWant > calmLevel ? 0.7 : 2.5) * dt));
    calmG.gain.setTargetAtTime(calmLevel, now, 0.05);
    if (calmLevel > 0.004 || calmWant > 0) {
      if (!calmAt || calmAt < now - 0.5) { calmAt = now + 0.1; calmStep = 0; }
      scheduleCalm(now, (p.night || 0) > 0.5);
    } else {
      calmAt = 0;
    }
  }

  return { update, get ready() { return jobs.length === 0; }, get chasing() { return chaseLevel > 0.01; }, bus: calmG };
}

function init(ctx) {
  const { THREE, util } = ctx;
  const voiceLines = () => (ctx.content && ctx.content.voiceLines) || EMPTY;

  // ---------------------------------------------------------------- settings
  let muted = readFlag(LS_MUTED, false);
  let musicOn = readFlag(LS_MUSIC, true);

  // ---------------------------------------------------------------- audio graph
  let ac = null;
  let unlocked = false;
  let master = null, compressor = null;
  let voiceBus = null, sfxBus = null, ambBus = null, musicBus = null;
  let whiteBuf = null;
  const hasPanner = () => !!(ac && typeof ac.createStereoPanner === 'function');

  function makeBus(level) {
    const g = ac.createGain();
    g.gain.value = level;
    g.connect(master);
    return g;
  }

  function makeWhiteNoise(seconds) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function makePinkNoise(seconds) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.969 * b2 + w * 0.153852; b3 = 0.8665 * b3 + w * 0.3104856;
      b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    return buf;
  }

  // A seamless 2-second loop of one cricket: 4.4 kHz song, 5 chirps of 3 pulses each.
  function makeCricketLoop() {
    const sr = ac.sampleRate;
    const len = Math.floor(sr * 2);
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const carrier = 4400, chirpRate = 2.5, pulseRate = 35;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const chirpPhase = (t * chirpRate) % 1;
      if (chirpPhase > 0.3) { d[i] = 0; continue; }
      const pulsePhase = (t * pulseRate) % 1;
      const pulse = pulsePhase < 0.45 ? Math.sin(Math.PI * pulsePhase / 0.45) : 0;
      const chirpIndex = Math.floor(t * chirpRate);
      const amp = 0.75 + 0.25 * Math.sin(chirpIndex * 2.1);
      d[i] = Math.sin(2 * Math.PI * carrier * t) * pulse * amp * 0.5;
    }
    return buf;
  }

  function ensureContext() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ac = new AC({ latencyHint: 'interactive' });
    } catch (e) {
      try { ac = new AC(); } catch (e2) { ac = null; return null; }
    }
    compressor = ac.createDynamicsCompressor();
    compressor.threshold.value = -14;
    compressor.knee.value = 18;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.004;
    compressor.release.value = 0.25;
    master = ac.createGain();
    master.gain.value = muted ? 0 : LEVEL_MASTER;
    master.connect(compressor);
    compressor.connect(ac.destination);
    voiceBus = makeBus(LEVEL_VOICE);
    sfxBus = makeBus(LEVEL_SFX);
    ambBus = makeBus(0);
    musicBus = makeBus(0);
    whiteBuf = makeWhiteNoise(2);
    decodePending();
    return ac;
  }

  function gestureActive() {
    const ua = navigator.userActivation;
    return ua ? !!ua.isActive : true;
  }

  function unlock() {
    if (!gestureActive() || !ensureContext()) return;
    try { quiet(ac.resume()); } catch (e) { /* resumed later by the next tap */ }
    if (unlocked) return;
    unlocked = true;
    // iOS Safari: playing one silent sample inside the gesture fully opens the audio session.
    try {
      const b = ac.createBuffer(1, 1, ac.sampleRate);
      const s = ac.createBufferSource();
      s.buffer = b;
      s.connect(ac.destination);
      s.start();
    } catch (e) { /* not needed elsewhere */ }
    if (ctx.isTouch) primeSpeech();
    startAmbience();
    if (!sitar) { try { sitar = createSitar(ac, master); } catch (e) { sitar = null; } }
    decodePending();
  }

  // Resume after the tab comes back, or after iOS interrupts the session for a phone call.
  document.addEventListener('visibilitychange', () => {
    if (!ac || !unlocked) return;
    try { quiet(document.hidden ? ac.suspend() : ac.resume()); } catch (e) { /* ignore */ }
  });
  const kick = () => {
    if (!unlocked) { unlock(); return; }
    if (ac && unlocked && ac.state !== 'running' && !document.hidden) {
      try { quiet(ac.resume()); } catch (e) { /* ignore */ }
    }
  };
  window.addEventListener('pointerdown', kick, true);
  window.addEventListener('keydown', kick, true);

  function isLive() {
    return !!ac && unlocked && ac.state !== 'closed';
  }

  // ---------------------------------------------------------------- spatial helper
  const spatial = { pan: 0, gain: 1 };
  const camRight = new THREE.Vector3();
  function computeSpatial(position) {
    spatial.pan = 0;
    spatial.gain = 1;
    const cam = ctx.camera;
    if (!position || !cam || typeof position.x !== 'number') return spatial;
    const dx = position.x - cam.position.x;
    const dy = (position.y || 0) - cam.position.y;
    const dz = position.z - cam.position.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    camRight.setFromMatrixColumn(cam.matrixWorld, 0);
    const side = (dx * camRight.x + dy * camRight.y + dz * camRight.z) / Math.max(d, 1.5);
    spatial.pan = util.clamp(side, -1, 1) * 0.6;
    spatial.gain = util.clamp(1 - (d - 12) / 55, 0.18, 1);
    return spatial;
  }

  // An output stage for one sound: gain (+ optional stereo pan) into a bus. Disconnected later.
  function makeOutput(bus, volume, pan) {
    const g = ac.createGain();
    g.gain.value = volume;
    if (pan && hasPanner()) {
      const p = ac.createStereoPanner();
      p.pan.value = util.clamp(pan, -1, 1);
      g.connect(p);
      p.connect(bus);
      g._panner = p;
    } else {
      g.connect(bus);
    }
    return g;
  }

  function releaseOutput(g, seconds, onDone) {
    setTimeout(() => {
      try { g.disconnect(); } catch (e) { /* already gone */ }
      if (g._panner) { try { g._panner.disconnect(); } catch (e) { /* already gone */ } }
      if (onDone) onDone();
    }, (seconds + 0.3) * 1000);
  }

  // ---------------------------------------------------------------- synthesis building blocks
  function envGain(t, attack, peak, dur, hold = 0) {
    const g = ac.createGain();
    const p = g.gain;
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(Math.max(0.0002, peak), t + attack);
    if (hold > 0) p.setValueAtTime(Math.max(0.0002, peak), t + attack + hold);
    p.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, attack + hold + 0.01));
    return g;
  }

  // Oscillator with an envelope; frequency glides f0 -> f1 over `glide` seconds.
  function tone(dest, t, type, f0, f1, dur, peak, attack = 0.004, glide = dur, hold = 0) {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + glide);
    const g = envGain(t, attack, peak, dur, hold);
    o.connect(g);
    g.connect(dest);
    o.start(t);
    o.stop(t + dur + 0.03);
    return o;
  }

  // Filtered white noise with an envelope; filter frequency glides f0 -> f1.
  function noise(dest, t, ftype, f0, f1, q, dur, peak, attack = 0.002, glide = dur, hold = 0) {
    const s = ac.createBufferSource();
    s.buffer = whiteBuf;
    s.loop = true;
    const f = ac.createBiquadFilter();
    f.type = ftype;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(10, f1), t + glide);
    f.Q.value = q;
    const g = envGain(t, attack, peak, dur, hold);
    s.connect(f);
    f.connect(g);
    g.connect(dest);
    s.start(t, Math.random() * 1.5);
    s.stop(t + dur + 0.03);
    return f;
  }

  // LFO into an AudioParam (vibrato on detune, tremolo on gain...). Returns the depth gain node.
  function wobble(param, t, dur, rate, depth, type = 'sine') {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.value = rate;
    const g = ac.createGain();
    g.gain.value = depth;
    o.connect(g);
    g.connect(param);
    o.start(t);
    o.stop(t + dur + 0.03);
    return g;
  }

  function bell(dest, t, f, dur, peak) {
    for (let i = 0; i < BELL_PARTIALS.length; i++) {
      const p = BELL_PARTIALS[i];
      tone(dest, t, 'sine', f * p[0], f * p[0], dur * p[2], peak * p[1], 0.002);
    }
  }

  function chime(dest, t, f, dur, peak) {
    tone(dest, t, 'sine', f, f, dur, peak, 0.002);
    tone(dest, t, 'sine', f * 2.76, f * 2.76, dur * 0.4, peak * 0.3, 0.002);
  }

  function brass(dest, t, f, dur, peak) {
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 2;
    lp.frequency.setValueAtTime(700, t);
    lp.frequency.linearRampToValueAtTime(3600, t + 0.05);
    lp.frequency.exponentialRampToValueAtTime(1500, t + dur);
    const g = envGain(t, 0.02, peak, dur, dur * 0.55);
    lp.connect(g);
    g.connect(dest);
    const o1 = ac.createOscillator();
    const o2 = ac.createOscillator();
    o1.type = 'sawtooth';
    o2.type = 'sawtooth';
    o1.frequency.value = f;
    o2.frequency.value = f;
    o2.detune.value = 9;
    o1.connect(lp);
    o2.connect(lp);
    if (dur > 0.4) {
      const vib = wobble(o1.detune, t + 0.15, dur, 5.5, 12);
      vib.connect(o2.detune);
    }
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.03); o2.stop(t + dur + 0.03);
  }

  function fmSyllable(dest, t, fa, fb, dur, peak) {
    const car = ac.createOscillator();
    car.frequency.setValueAtTime(fa, t);
    car.frequency.linearRampToValueAtTime(fb * 1.15, t + dur * 0.35);
    car.frequency.exponentialRampToValueAtTime(fb, t + dur);
    const mod = ac.createOscillator();
    mod.frequency.setValueAtTime(fa * 1.41, t);
    mod.frequency.linearRampToValueAtTime(fb * 1.41, t + dur);
    const mg = ac.createGain();
    mg.gain.setValueAtTime(fa * 2.6, t);
    mg.gain.linearRampToValueAtTime(fa * 1.2, t + dur);
    mod.connect(mg);
    mg.connect(car.frequency);
    const g = envGain(t, 0.012, peak, dur, dur * 0.35);
    car.connect(g);
    g.connect(dest);
    car.start(t); mod.start(t);
    car.stop(t + dur + 0.03); mod.stop(t + dur + 0.03);
  }

  // A monkey "ook": buzzy source through two moving formants ("oo" opening to "ah"), then a "k".
  function ook(dest, t, f, peak) {
    const src = ac.createOscillator();
    src.type = 'sawtooth';
    src.frequency.setValueAtTime(f, t);
    src.frequency.linearRampToValueAtTime(f * 1.35, t + 0.06);
    src.frequency.exponentialRampToValueAtTime(f * 0.95, t + 0.2);
    const f1 = ac.createBiquadFilter();
    f1.type = 'bandpass';
    f1.Q.value = 4;
    f1.frequency.setValueAtTime(320, t);
    f1.frequency.linearRampToValueAtTime(760, t + 0.12);
    const f2 = ac.createBiquadFilter();
    f2.type = 'bandpass';
    f2.Q.value = 5;
    f2.frequency.setValueAtTime(880, t);
    f2.frequency.linearRampToValueAtTime(1150, t + 0.12);
    const f2g = ac.createGain();
    f2g.gain.value = 0.6;
    const g = envGain(t, 0.02, peak, 0.22, 0.08);
    src.connect(f1); f1.connect(g);
    src.connect(f2); f2.connect(f2g); f2g.connect(g);
    g.connect(dest);
    src.start(t);
    src.stop(t + 0.25);
    noise(dest, t + 0.2, 'bandpass', 2600, 2600, 2, 0.035, peak * 0.25);
  }

  // ---------------------------------------------------------------- SFX recipes
  // Each takes (out, t, rate, opts) and returns its length in seconds.
  const SYNTHS = {
    // Bright rising-sixth chime with a shimmer on top; climbs a little with the combo.
    pickup(o, t, r, opts) {
      const combo = opts.combo !== undefined ? opts.combo : (ctx.state && ctx.state.combo) || 0;
      const k = r * Math.pow(2, (Math.min(combo, 25) * 0.2) / 12);
      const a = 1046.5 * k, b = 1760 * k;
      tone(o, t, 'triangle', a, a, 0.09, 0.2);
      tone(o, t, 'sine', a * 2, a * 2, 0.06, 0.05);
      tone(o, t + 0.055, 'triangle', b, b, 0.34, 0.22, 0.003);
      tone(o, t + 0.06, 'sine', b * 2, b * 2, 0.3, 0.05).detune.value = 7;
      tone(o, t + 0.08, 'sine', b * 3, b * 3, 0.22, 0.022).detune.value = -6;
      return 0.45;
    },
    // Sparkly major arpeggio, then a dusting of glitter.
    golden(o, t, r) {
      const notes = [1046.5, 1318.5, 1568, 2093, 2637, 3136];
      for (let i = 0; i < notes.length; i++) {
        const f = notes[i] * r, st = t + i * 0.045;
        tone(o, st, 'triangle', f, f, 0.38, 0.17);
        tone(o, st, 'sine', f * 2, f * 2, 0.2, 0.035);
      }
      noise(o, t + 0.2, 'highpass', 6500, 6500, 0.7, 0.85, 0.045, 0.08);
      for (let i = 0; i < 7; i++) {
        const f = (3000 + Math.random() * 3200) * r;
        tone(o, t + 0.22 + Math.random() * 0.7, 'sine', f, f, 0.12, 0.03, 0.002);
      }
      return 1.15;
    },
    // A proper bell for the special turbans.
    'pickup-special'(o, t, r) {
      bell(o, t, 880 * r, 1.3, 0.2);
      bell(o, t + 0.08, 1318.5 * r, 1.0, 0.11);
      return 1.4;
    },
    // Turbans tumbling everywhere: a descending jingle cascade.
    scatter(o, t, r) {
      const notes = [2093, 1760, 1568, 1318.5, 1174.7, 1046.5, 880, 784];
      for (let i = 0; i < notes.length; i++) {
        const st = t + i * 0.045;
        chime(o, st, notes[i] * r, 0.25, 0.13 * (1 - i * 0.06));
        noise(o, st, 'bandpass', 7000, 7000, 4, 0.05, 0.05);
      }
      return 0.75;
    },
    // Cartoon bonk: pitch-dropping knock plus a woodblock tok.
    hit(o, t, r) {
      tone(o, t, 'sine', 520 * r, 90 * r, 0.24, 0.5, 0.002, 0.12);
      tone(o, t, 'triangle', 260 * r, 70 * r, 0.09, 0.1, 0.002);
      noise(o, t, 'bandpass', 1400 * r, 1400 * r, 6, 0.045, 0.28);
      return 0.3;
    },
    // Slide whistle all the way down, then a little plop.
    faint(o, t, r) {
      const w = ac.createOscillator();
      w.frequency.setValueAtTime(1500 * r, t);
      w.frequency.exponentialRampToValueAtTime(260 * r, t + 0.9);
      wobble(w.detune, t, 1, 7, 35);
      const g = envGain(t, 0.04, 0.22, 1.0, 0.7);
      w.connect(g);
      g.connect(o);
      w.start(t);
      w.stop(t + 1.05);
      noise(o, t, 'bandpass', 1500 * r, 260 * r, 8, 0.95, 0.03, 0.05, 0.9);
      tone(o, t + 0.95, 'sine', 180 * r, 90 * r, 0.16, 0.25, 0.003);
      return 1.2;
    },
    // Soft boing with a wobble that settles.
    jump(o, t, r) {
      const b = tone(o, t, 'sine', 180 * r, 420 * r, 0.22, 0.25, 0.006, 0.12);
      const vib = wobble(b.detune, t, 0.22, 22, 60);
      vib.gain.setValueAtTime(60, t);
      vib.gain.linearRampToValueAtTime(0, t + 0.22);
      return 0.25;
    },
    land(o, t, r) {
      tone(o, t, 'sine', 140 * r, 45 * r, 0.18, 0.45, 0.002, 0.12);
      noise(o, t, 'lowpass', 500, 500, 0.7, 0.09, 0.25);
      return 0.22;
    },
    splash(o, t, r) {
      noise(o, t, 'bandpass', 2600 * r, 600 * r, 0.8, 0.55, 0.35, 0.01);
      noise(o, t, 'highpass', 4000, 4000, 0.7, 0.25, 0.08, 0.005);
      for (let i = 0; i < 4; i++) {
        const f = (500 + Math.random() * 400) * r;
        tone(o, t + 0.08 + i * (0.05 + Math.random() * 0.05), 'sine', f, f * 1.8, 0.06, 0.07, 0.003);
      }
      return 0.7;
    },
    // Parrot screech: two FM syllables through a nasal band-pass. "SQUAWK!"
    squawk(o, t, r) {
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2200 * r;
      bp.Q.value = 0.8;
      bp.connect(o);
      fmSyllable(bp, t, 1250 * r, 1650 * r, 0.17, 0.32);
      fmSyllable(bp, t + 0.21, 1550 * r, 1150 * r, 0.2, 0.28);
      return 0.5;
    },
    monkey(o, t, r) {
      ook(o, t, 170 * r, 0.5);
      ook(o, t + 0.27, 196 * r, 0.42);
      return 0.55;
    },
    // Mosquito whine that drifts past your ear.
    buzz(o, t, r) {
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1500;
      bp.Q.value = 1.2;
      const g = envGain(t, 0.35, 0.07, 1.45, 0.6);
      bp.connect(g);
      g.connect(o);
      const a = ac.createOscillator();
      const b = ac.createOscillator();
      a.type = 'sawtooth';
      b.type = 'sawtooth';
      for (const osc of [a, b]) {
        osc.frequency.setValueAtTime(600 * r, t);
        osc.frequency.linearRampToValueAtTime(680 * r, t + 0.7);
        osc.frequency.linearRampToValueAtTime(590 * r, t + 1.45);
        osc.connect(bp);
        osc.start(t);
        osc.stop(t + 1.5);
      }
      b.detune.value = 18;
      wobble(a.detune, t, 1.5, 26, 14).connect(b.detune);
      return 1.5;
    },
    // Bibi's chappal: "PHATAK!"
    chappal(o, t, r) {
      noise(o, t, 'highpass', 1200 * r, 1200 * r, 0.7, 0.07, 0.6, 0.001);
      noise(o, t, 'bandpass', 700 * r, 700 * r, 1.5, 0.12, 0.35, 0.001);
      tone(o, t, 'sine', 200 * r, 70 * r, 0.08, 0.35, 0.001);
      noise(o, t + 0.045, 'highpass', 1500 * r, 1500 * r, 0.7, 0.05, 0.15, 0.001);
      return 0.2;
    },
    // Turban Tornado: a rising, whirling whoosh.
    spin(o, t, r) {
      const trem = ac.createGain();
      trem.gain.value = 0.55;
      trem.connect(o);
      wobble(trem.gain, t, 1, 10, 0.45);
      noise(trem, t, 'bandpass', 300 * r, 3200 * r, 2.5, 0.95, 0.32, 0.3, 0.85);
      tone(o, t, 'sine', 160 * r, 640 * r, 0.9, 0.05, 0.3);
      return 1.0;
    },
    whoosh(o, t, r) {
      noise(o, t, 'bandpass', 1800 * r, 350 * r, 1.6, 0.36, 0.35, 0.08);
      return 0.4;
    },
    // Two cheerful chimes and the dhaba kettle coming to the boil.
    checkpoint(o, t, r) {
      bell(o, t, 784 * r, 0.9, 0.17);
      bell(o, t + 0.14, 1046.5 * r, 1.1, 0.17);
      const ks = t + 0.32;
      const k = tone(o, ks, 'sine', 2300 * r, 2550 * r, 1.0, 0.065, 0.28, 0.8, 0.45);
      wobble(k.detune, ks, 1.0, 6, 15);
      noise(o, ks, 'bandpass', 2400 * r, 2650 * r, 12, 1.0, 0.05, 0.28, 0.8, 0.45);
      return 1.45;
    },
    powerup(o, t, r) {
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.Q.value = 6;
      lp.frequency.setValueAtTime(600, t);
      lp.frequency.exponentialRampToValueAtTime(5000, t + 0.55);
      lp.connect(o);
      tone(lp, t, 'sawtooth', 220 * r, 880 * r, 0.6, 0.16, 0.02, 0.55);
      const sparkle = [1318.5, 1661.2, 1975.5];
      for (let i = 0; i < sparkle.length; i++) {
        const f = sparkle[i] * r;
        tone(o, t + 0.45 + i * 0.07, 'triangle', f, f, 0.25, 0.1);
      }
      return 0.9;
    },
    // Magical shimmer: a Lydian cluster that blooms with a tremolo.
    compass(o, t, r) {
      const trem = ac.createGain();
      trem.gain.value = 0.6;
      trem.connect(o);
      wobble(trem.gain, t, 1.4, 8, 0.4);
      const notes = [1046.5, 1318.5, 1480, 1975.5, 2349.3];
      for (let i = 0; i < notes.length; i++) {
        const f = notes[i] * r;
        tone(trem, t + i * 0.07, 'sine', f, f, 1.2, 0.055, 0.15, 1.2, 0.3);
      }
      noise(o, t, 'highpass', 7000, 7000, 0.7, 1.1, 0.03, 0.3);
      return 1.45;
    },
    // Triumphant fanfare: da-da-da-DAAA, da-DAAAAA, with dhol booms underneath.
    victory(o, t, r) {
      const seq = [[392, 0, 0.12], [523.3, 0.13, 0.12], [659.3, 0.26, 0.12], [784, 0.39, 0.45], [659.3, 0.86, 0.14]];
      for (let i = 0; i < seq.length; i++) brass(o, t + seq[i][1], seq[i][0] * r, seq[i][2], 0.14);
      const chord = [523.3, 659.3, 784, 1046.5];
      for (let i = 0; i < chord.length; i++) brass(o, t + 1.02, chord[i] * r, 1.2, 0.09);
      bell(o, t + 1.05, 1174.7 * r, 1.4, 0.08);
      dholBass(o, t + 0.39, 0.9);
      dholBass(o, t + 1.02, 1.0);
      SYNTHS.golden(o, t + 1.25, r * 1.5);
      return 2.6;
    },
    // A rishta aunty's bangles: two quick jingly shakes.
    aunty(o, t, r) {
      for (let shake = 0; shake < 2; shake++) {
        for (let i = 0; i < 6; i++) {
          const st = t + shake * 0.3 + i * 0.03 + Math.random() * 0.015;
          const f = (2800 + Math.random() * 2400) * r;
          tone(o, st, 'sine', f, f, 0.09, 0.05, 0.001);
          tone(o, st, 'sine', f * 1.47, f * 1.47, 0.06, 0.025, 0.001);
          noise(o, st, 'highpass', 6000, 6000, 0.7, 0.03, 0.04);
        }
      }
      return 0.65;
    },
    click(o, t, r) {
      tone(o, t, 'sine', 1900 * r, 1300 * r, 0.03, 0.15, 0.001);
      noise(o, t, 'highpass', 3000, 3000, 0.7, 0.015, 0.05);
      return 0.06;
    },
    step(o, t, r) {
      const f = (500 + Math.random() * 300) * r;
      noise(o, t, 'lowpass', f, f, 0.8, 0.07, 0.18, 0.005);
      tone(o, t, 'sine', 90 * r, 60 * r, 0.05, 0.08, 0.003);
      return 0.1;
    },
  };

  const lastSfx = Object.create(null);
  let activeSfx = 0;
  const sfxDone = () => { activeSfx--; };

  function sfx(name, opts) {
    const recipe = SYNTHS[name];
    if (!recipe || muted) return;
    if (!isLive() && gestureActive()) unlock();
    if (!isLive()) return;
    const o = opts || EMPTY;
    const now = ac.currentTime;
    const gap = SFX_GAP[name] !== undefined ? SFX_GAP[name] : 0.04;
    const last = lastSfx[name];
    if (last !== undefined && now - last < gap) return;
    if (activeSfx >= MAX_ACTIVE_SFX && name !== 'victory' && name !== 'golden') return;
    lastSfx[name] = now;
    const s = computeSpatial(o.position);
    const volume = (o.volume !== undefined ? o.volume : 1) * s.gain;
    const rate = o.rate !== undefined ? o.rate : 1;
    const out = makeOutput(sfxBus, volume, s.pan);
    let dur = 0.5;
    try {
      dur = recipe(out, now + 0.005, rate, o) || 0.5;
    } catch (e) {
      console.warn('[turbans] sfx', name, e);
    }
    activeSfx++;
    releaseOutput(out, dur, sfxDone);
  }

  // ---------------------------------------------------------------- voice clips
  const clips = Object.create(null);    // id -> { recorded: [take], bundled: [take] }
  function clipEntry(id) {
    return clips[id] || (clips[id] = { recorded: [], bundled: [] });
  }

  // Clips decode before the first tap via an OfflineAudioContext (no autoplay warning, no
  // gesture needed); AudioBuffers are context-independent, so they play fine on the real one.
  let offline = null;
  function decoder() {
    if (ac) return ac;
    if (offline) return offline;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return null;
    try { offline = new OAC(1, 1, 48000); } catch (e) { offline = null; }
    return offline;
  }

  function decodeAudio(arrayBuffer) {
    return new Promise((resolve, reject) => {
      try {
        const dec = decoder();
        if (!dec) { reject(new Error('no audio decoder')); return; }
        const p = dec.decodeAudioData(arrayBuffer, resolve, reject);
        if (p && typeof p.then === 'function') p.then(resolve, reject);
      } catch (e) {
        reject(e);
      }
    });
  }

  async function decodeTake(take) {
    if (!decoder() || take.buffer || take.failed || take.decoding) return;
    take.decoding = true;
    try {
      const ab = take.raw || await blobToArrayBuffer(take.blob);
      take.raw = null; // decodeAudioData detaches it anyway
      analyseTake(take, await decodeAudio(ab));
    } catch (e) {
      take.failed = true;
    }
    take.decoding = false;
    if (boothIsOpen) refreshAllRows();
  }

  function decodePending() {
    if (!decoder()) return;
    for (const id of Object.keys(clips)) {
      const c = clips[id];
      for (const take of c.recorded) decodeTake(take);
      for (const take of c.bundled) decodeTake(take);
    }
  }

  function countUsable(list) {
    let n = 0;
    for (let i = 0; i < list.length; i++) if (!list[i].failed) n++;
    return n;
  }

  function pickDecoded(list) {
    const n = list.length;
    if (!n) return null;
    const start = Math.floor(Math.random() * n);
    for (let i = 0; i < n; i++) {
      const take = list[(start + i) % n];
      if (take.buffer) return take;
    }
    return null;
  }

  function playableTake(id) {
    const c = clips[id];
    if (!c) return null;
    return pickDecoded(c.recorded) || pickDecoded(c.bundled);
  }

  function statusOf(id) {
    const c = clips[id];
    const rec = c ? countUsable(c.recorded) : 0;
    if (rec) return { source: 'recorded', takes: rec };
    const bun = c ? countUsable(c.bundled) : 0;
    if (bun) return { source: 'bundled', takes: bun };
    return { source: 'tts', takes: 0 };
  }

  function clipStatus() {
    const out = {};
    for (const id of Object.keys(voiceLines())) out[id] = statusOf(id);
    return out;
  }

  const activeVoices = [];   // { src, g, done }
  function pruneVoices() {
    for (let i = activeVoices.length - 1; i >= 0; i--) if (activeVoices[i].done) activeVoices.splice(i, 1);
  }

  function stopVoice(entry) {
    if (entry.done) return;
    const now = ac.currentTime;
    try {
      entry.g.gain.cancelScheduledValues(now);
      entry.g.gain.setTargetAtTime(0, now, 0.012);
      entry.src.stop(now + 0.06);
    } catch (e) { /* already stopped */ }
  }

  function playClip(id, take, rate, volume, position) {
    pruneVoices();
    while (activeVoices.length >= MAX_CLIP_VOICES) stopVoice(activeVoices.shift());
    const now = ac.currentTime;
    const jitter = id === 'waheguru_golden' ? 0.88 + Math.random() * 0.04 : 0.94 + Math.random() * 0.18;
    const src = ac.createBufferSource();
    src.buffer = take.buffer;
    src.playbackRate.value = util.clamp(jitter * rate, 0.5, 2);
    const s = computeSpatial(position);
    const g = makeOutput(voiceBus, volume * take.gain * (0.75 + 0.25 * s.gain), s.pan * 0.5);
    src.connect(g);
    const entry = { src, g, done: false };
    src.onended = () => {
      entry.done = true;
      try { src.disconnect(); g.disconnect(); if (g._panner) g._panner.disconnect(); } catch (e) { /* gone */ }
    };
    src.start(now + 0.003, take.offset, take.length);
    activeVoices.push(entry);
    return true;
  }

  // ---------------------------------------------------------------- browser voice (TTS)
  let ttsVoice = null;
  let lastTts = -10;
  let speechPrimed = false;

  function chooseTtsVoice() {
    const ss = window.speechSynthesis;
    if (!ss) return;
    let list = [];
    try { list = ss.getVoices() || []; } catch (e) { list = []; }
    const lang = (v) => String(v.lang || '').replace('_', '-').toLowerCase();
    ttsVoice = list.find((v) => lang(v) === 'en-in') ||
      list.find((v) => lang(v).startsWith('en') && /india/i.test(v.name || '')) ||
      list.find((v) => lang(v) === 'en-gb') ||
      list.find((v) => lang(v).startsWith('en')) || null;
  }

  function primeSpeech() {
    const ss = window.speechSynthesis;
    if (speechPrimed || !ss || typeof window.SpeechSynthesisUtterance !== 'function') return;
    speechPrimed = true;
    try {
      const u = new window.SpeechSynthesisUtterance(' ');
      u.volume = 0;
      ss.speak(u);
    } catch (e) { /* not supported */ }
  }

  function speak(id, line, rate, volume, priority, combo) {
    const ss = window.speechSynthesis;
    if (!ss || typeof window.SpeechSynthesisUtterance !== 'function') return false;
    const now = performance.now() / 1000;
    const busy = ss.speaking || ss.pending;
    if (!priority && (busy || now - lastTts < TTS_GAP)) return false;
    const text = util.randomLine(line.tts) || line.text || line.label;
    if (!text) return false;
    try {
      if (busy) ss.cancel();
      const u = new window.SpeechSynthesisUtterance(text);
      const ch = ctx.content && ctx.content.characters && ctx.state && ctx.content.characters[ctx.state.character];
      const v = (ch && ch.voice) || { pitch: 1, rate: 1 };
      if (ttsVoice) { u.voice = ttsVoice; u.lang = ttsVoice.lang; } else u.lang = 'en-IN';
      const golden = id === 'waheguru_golden' ? 0.9 : 1;
      const excite = id === 'waheguru' ? 1 + Math.min(combo || 0, 40) * 0.008 : 1;
      u.pitch = util.clamp((v.pitch || 1) * excite, 0, 2);
      u.rate = util.clamp((v.rate || 1) * rate * golden, 0.5, 1.8);
      u.volume = util.clamp(volume, 0, 1);
      ss.speak(u);
    } catch (e) {
      return false;
    }
    lastTts = now;
    return true;
  }

  if (window.speechSynthesis) {
    chooseTtsVoice();
    try { window.speechSynthesis.addEventListener('voiceschanged', chooseTtsVoice); } catch (e) {
      try { window.speechSynthesis.onvoiceschanged = chooseTtsVoice; } catch (e2) { /* no voices event */ }
    }
  }

  // ---------------------------------------------------------------- voice()
  function voice(id, opts) {
    const line = voiceLines()[id];
    if (!line || muted) return false;
    const o = opts || EMPTY;
    if (!isLive() && gestureActive()) unlock();
    const rate = o.rate !== undefined ? o.rate : 1;
    const volume = o.volume !== undefined ? o.volume : 1;
    const combo = o.combo || 0;
    // Fun escalation: a long streak pitches the shout up a touch.
    const excite = id === 'waheguru' ? 1 + Math.min(combo, 40) * 0.003 : 1;
    if (isLive()) {
      let take = playableTake(id);
      if (!take && VOICE_ALIASES[id]) take = playableTake(VOICE_ALIASES[id]);
      if (take) return playClip(id, take, rate * excite, volume, o.position);
    }
    return speak(id, line, rate, volume, !!o.priority, combo);
  }

  // ---------------------------------------------------------------- loading clips
  async function loadBundled() {
    let manifest = null;
    try {
      const res = await fetch('audio/manifest.json', { cache: 'no-cache' });
      if (!res.ok) return;
      manifest = await res.json();
    } catch (e) {
      return;
    }
    if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) return;
    const jobs = [];
    for (const id of Object.keys(manifest)) {
      const urls = manifest[id];
      if (!Array.isArray(urls)) continue;
      for (const url of urls.slice(0, 6)) {
        if (!isSafeClipUrl(url)) continue;
        jobs.push(fetch(url)
          .then((r) => (r.ok ? r.arrayBuffer() : null))
          .then((ab) => { if (ab && ab.byteLength) clipEntry(id).bundled.push(makeTake(null, ab)); })
          .catch(noop));
      }
    }
    await Promise.all(jobs);
    decodePending();
    if (boothIsOpen) refreshAllRows();
  }

  // IndexedDB: db 'turbans-voice', store 'clips', records {id, takes: [Blob, ...]}.
  let dbPromise = null;
  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve) => {
      try {
        if (!window.indexedDB) { resolve(null); return; }
        const req = window.indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          try {
            const db = req.result;
            if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'id' });
          } catch (e) { /* resolved as unavailable below */ }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
    return dbPromise;
  }

  async function dbRequest(mode, makeRequest) {
    const db = await openDb();
    if (!db) return { ok: false, value: null };
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(DB_STORE, mode);
        const req = makeRequest(tx.objectStore(DB_STORE));
        let value = null;
        req.onsuccess = () => { value = req.result; };
        tx.oncomplete = () => resolve({ ok: true, value });
        tx.onerror = () => resolve({ ok: false, value: null });
        tx.onabort = () => resolve({ ok: false, value: null });
      } catch (e) {
        resolve({ ok: false, value: null });
      }
    });
  }

  async function loadRecorded() {
    const res = await dbRequest('readonly', (store) => store.getAll());
    if (!res.ok || !Array.isArray(res.value)) return;
    for (const row of res.value) {
      if (!row || typeof row.id !== 'string' || !Array.isArray(row.takes)) continue;
      const blobs = row.takes.filter((b) => b instanceof Blob).slice(-MAX_TAKES);
      clipEntry(row.id).recorded = blobs.map((b) => makeTake(b, null));
    }
    decodePending();
    if (boothIsOpen) refreshAllRows();
  }

  async function saveRecorded(id) {
    const takes = clipEntry(id).recorded.map((t) => t.blob).filter(Boolean);
    const res = takes.length
      ? await dbRequest('readwrite', (store) => store.put({ id, takes }))
      : await dbRequest('readwrite', (store) => store.delete(id));
    return res.ok;
  }

  loadRecorded().catch(noop);
  loadBundled().catch(noop);

  // ---------------------------------------------------------------- dhol
  let dholBase = 0;
  let dholReq = 0;
  let dholLevel = 0;
  let dholSilentFor = 0;
  const dhol = { timer: 0, step: 0, bar: 0, next: 0, tumbiBars: 0, motif: TUMBI_MOTIFS[0] };

  function dholBass(dest, t, accent) {
    tone(dest, t, 'sine', 105, 58, 0.55, 0.7 * accent, 0.003, 0.12);
    tone(dest, t, 'triangle', 210, 116, 0.12, 0.12 * accent, 0.002, 0.08);
    noise(dest, t, 'lowpass', 260, 260, 0.7, 0.07, 0.25 * accent);
  }

  function tilli(dest, t, accent) {
    noise(dest, t, 'bandpass', 3800, 3800, 1.4, 0.045, 0.28 * accent, 0.001);
    tone(dest, t, 'sine', 560, 480, 0.08, 0.1 * accent, 0.001);
  }

  function tumbi(dest, t, f) {
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = f * 2;
    bp.Q.value = 3;
    bp.connect(dest);
    tone(bp, t, 'square', f * 1.02, f, 0.22, 0.09, 0.002, 0.03);
    tone(dest, t, 'sine', f, f, 0.18, 0.04, 0.002);
  }

  function dholStepLength(step) {
    const beat = 60 / DHOL_BPM;
    return beat * (step % 2 === 0 ? DHOL_SWING : 1 - DHOL_SWING);
  }

  function playDholStep(step, bar, t) {
    if (step === 0) {
      if (dhol.tumbiBars > 0) dhol.tumbiBars--;
      if (!dhol.tumbiBars && dholLevel > 0.3 && Math.random() < 0.28) {
        dhol.tumbiBars = 2;
        dhol.motif = TUMBI_MOTIFS[Math.floor(Math.random() * TUMBI_MOTIFS.length)];
      }
    }
    if (muted || dholLevel < 0.01) return; // keep time, skip the sound
    const human = 0.92 + Math.random() * 0.16;
    const nudge = (Math.random() - 0.5) * 0.006;
    const b = CHAAL_BASS[step], k = CHAAL_TILLI[step];
    if (b) dholBass(musicBus, t + nudge, b * human);
    if (k) tilli(musicBus, t + nudge, k * human);
    if (bar % 4 === 3 && step >= 6) tilli(musicBus, t + dholStepLength(step) * 0.5, 0.7); // little roll into the next phrase
    if (dhol.tumbiBars > 0) {
      const n = dhol.motif[step];
      if (n >= 0) tumbi(musicBus, t, TUMBI_SCALE[n]);
    }
  }

  function dholTick() {
    if (!ac) return;
    const now = ac.currentTime;
    if (dhol.next < now - 0.2) dhol.next = now + 0.03; // fell behind (tab throttled): rejoin cleanly
    while (dhol.next < now + 0.1) {
      playDholStep(dhol.step, dhol.bar, dhol.next);
      dhol.next += dholStepLength(dhol.step);
      dhol.step = (dhol.step + 1) % 8;
      if (dhol.step === 0) dhol.bar++;
    }
  }

  function startDhol() {
    if (dhol.timer || !ac) return;
    dhol.step = 0;
    dhol.bar = 0;
    dhol.tumbiBars = 0;
    dhol.next = ac.currentTime + 0.06;
    dhol.timer = setInterval(dholTick, 25);
  }

  function stopDhol() {
    if (!dhol.timer) return;
    clearInterval(dhol.timer);
    dhol.timer = 0;
  }

  function setDhol(v) {
    dholBase = util.clamp(Number(v) || 0, 0, 1);
  }

  function requestDhol(v) {
    if (v > dholReq) dholReq = v > 1 ? 1 : v;
  }

  // ---------------------------------------------------------------- ambience
  let amb = null;
  let sitar = null;
  let ambNight = 0;
  let birdTimer = 2, frogTimer = 3, owlTimer = 25, waterTimer = 0, frogFactor = 0;
  const lastSet = { music: -1, amb: -1, day: -1, night: -1, rustle: -1 };

  function setSmooth(key, param, value, tc) {
    if (Math.abs(lastSet[key] - value) < 0.002) return;
    lastSet[key] = value;
    param.setTargetAtTime(value, ac.currentTime, tc);
  }

  function startAmbience() {
    if (amb || !ac) return;
    const now = ac.currentTime;
    const dayG = ac.createGain();
    const nightG = ac.createGain();
    const rustleMix = ac.createGain();
    dayG.gain.value = 0;
    nightG.gain.value = 0;
    rustleMix.gain.value = 0;
    dayG.connect(ambBus);
    nightG.connect(ambBus);
    rustleMix.connect(ambBus);

    // Leaf rustle: looping pink noise through a soft band, breathing with two slow gust LFOs.
    const rustle = ac.createBufferSource();
    rustle.buffer = makePinkNoise(3);
    rustle.loop = true;
    const band = ac.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.value = 1300;
    band.Q.value = 0.5;
    const gust = ac.createGain();
    gust.gain.value = 0.5;
    rustle.connect(band);
    band.connect(gust);
    gust.connect(rustleMix);
    for (const [rate, depth] of [[0.09, 0.28], [0.31, 0.12]]) {
      const lfo = ac.createOscillator();
      lfo.frequency.value = rate;
      const lg = ac.createGain();
      lg.gain.value = depth;
      lfo.connect(lg);
      lg.connect(gust.gain);
      lfo.start(now);
    }
    rustle.start(now);

    // Crickets: one seamless loop, three insects at different pitches, places and phases.
    const cricket = makeCricketLoop();
    for (const [rate, pan, level, offset] of [[1, -0.55, 0.5, 0], [1.09, 0.6, 0.38, 0.7], [0.93, 0.1, 0.22, 1.3]]) {
      const src = ac.createBufferSource();
      src.buffer = cricket;
      src.loop = true;
      src.playbackRate.value = rate;
      const g = makeOutput(nightG, level, pan);
      src.connect(g);
      src.start(now, offset);
    }
    amb = { dayG, nightG, rustleMix };
  }

  function ambOutput(dest, volume, pan, seconds) {
    const g = makeOutput(dest, volume, pan);
    releaseOutput(g, seconds);
    return g;
  }

  function playBird() {
    const t = ac.currentTime + 0.02;
    const pan = Math.random() * 1.6 - 0.8;
    const roll = Math.random();
    if (roll < 0.33) {
      // Two- or three-note whistle.
      const o = ambOutput(amb.dayG, 0.5 + Math.random() * 0.5, pan, 0.9);
      const f = 2000 + Math.random() * 600;
      tone(o, t, 'sine', f, f * 1.35, 0.16, 0.1, 0.01, 0.12);
      tone(o, t + 0.2, 'sine', f * 1.3, f * 0.9, 0.22, 0.09, 0.01);
      if (Math.random() < 0.4) tone(o, t + 0.48, 'sine', f * 1.1, f * 1.4, 0.15, 0.07, 0.01);
    } else if (roll < 0.58) {
      // Rapid trill.
      const o = ambOutput(amb.dayG, 0.4 + Math.random() * 0.4, pan, 0.8);
      const base = 3200 + Math.random() * 1000;
      const n = 7 + Math.floor(Math.random() * 6);
      for (let i = 0; i < n; i++) {
        const f = base * (1 - i * 0.012);
        tone(o, t + i * 0.05, 'sine', f, f * 1.06, 0.045, 0.06, 0.004);
      }
    } else if (roll < 0.8) {
      // The koel of every Punjabi summer: "ku-OOO", rising each time.
      const o = ambOutput(amb.dayG, 0.45 + Math.random() * 0.35, pan, 2);
      const reps = 2 + Math.floor(Math.random() * 2);
      for (let k = 0; k < reps; k++) {
        const f = 620 * (1 + k * 0.09), st = t + k * 0.55;
        tone(o, st, 'sine', f, f * 1.45, 0.24, 0.09, 0.02, 0.16);
        tone(o, st + 0.22, 'sine', f * 1.45, f * 1.5, 0.3, 0.08, 0.02);
      }
    } else {
      // A distant hornbill: gruff "kok-kok-kok", muffled by the canopy.
      const o = ambOutput(amb.dayG, 0.35 + Math.random() * 0.25, pan * 0.6, 1.0);
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1300;
      lp.connect(o);
      const n = 3 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) tone(lp, t + i * 0.16, 'sawtooth', 380, 320, 0.1, 0.1, 0.008);
    }
  }

  function playFrog() {
    const t = ac.currentTime + 0.02;
    const o = ambOutput(amb.nightG, 0.5 + Math.random() * 0.5, Math.random() * 1.4 - 0.7, 0.6);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 650;
    bp.Q.value = 2.5;
    const am = ac.createGain();
    am.gain.value = 0.5;
    bp.connect(am);
    am.connect(o);
    wobble(am.gain, t, 0.4, 52, 0.5, 'square');
    const f = 110 + Math.random() * 40;
    tone(bp, t, 'sawtooth', f, f * 0.8, 0.11, 0.3, 0.01);
    tone(bp, t + 0.15, 'sawtooth', f * 1.05, f * 0.82, 0.12, 0.26, 0.01);
  }

  function playOwl() {
    const t = ac.currentTime + 0.02;
    const o = ambOutput(amb.nightG, 0.6, Math.random() * 1.2 - 0.6, 1.3);
    tone(o, t, 'sine', 410, 380, 0.38, 0.08, 0.07, 0.38, 0.1);
    tone(o, t + 0.5, 'sine', 400, 360, 0.55, 0.08, 0.08, 0.55, 0.15);
  }

  // How much of the area around the player is water / swamp (sampled every 1.5 s).
  function measureWater() {
    const p = ctx.player && ctx.player.position;
    const world = ctx.world;
    if (!p || !world || typeof world.heightAt !== 'function') return 0.15;
    const wl = typeof world.WATER_LEVEL === 'number' ? world.WATER_LEVEL : 0;
    let wet = 0;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.2566, r = i === 0 ? 0 : 16;
      const x = p.x + Math.cos(a) * r, z = p.z + Math.sin(a) * r;
      const h = world.heightAt(x, z);
      if (h < wl + 0.3) wet++;
      else if (typeof world.biomeAt === 'function' && world.biomeAt(x, z) === 'swamp') wet += 0.8;
    }
    return util.clamp(wet / 3, 0, 1);
  }

  function updateAmbience(dt) {
    if (!amb) return;
    const mode = ctx.state && ctx.state.mode;
    const nf = util.clamp((ctx.sky && ctx.sky.nightFactor) || 0, 0, 1);
    ambNight = util.damp(ambNight, nf, 1.2, dt);
    const day = 1 - ambNight;
    const ambTarget = musicOn ? LEVEL_AMBIENCE * (mode === 'paused' ? 0.55 : 1) * (1 - 0.45 * dholLevel) * (1 - 0.6 * lineDuck) : 0;
    setSmooth('amb', ambBus.gain, ambTarget, 0.25);
    setSmooth('day', amb.dayG.gain, day, 0.3);
    setSmooth('night', amb.nightG.gain, ambNight, 0.3);
    setSmooth('rustle', amb.rustleMix.gain, 0.55 * (1 - 0.6 * ambNight), 0.3);
    if (!musicOn || muted) return;

    birdTimer -= dt;
    if (birdTimer <= 0) {
      if (day > 0.25) playBird();
      birdTimer = (1.4 + Math.random() * 3.4) / Math.max(0.35, day);
    }
    waterTimer -= dt;
    if (waterTimer <= 0) {
      waterTimer = 1.5;
      frogFactor = measureWater();
    }
    frogTimer -= dt;
    if (frogTimer <= 0) {
      if (ambNight > 0.4 && frogFactor > 0.05) playFrog();
      frogTimer = (0.7 + Math.random() * 1.9) / Math.max(0.2, frogFactor);
    }
    owlTimer -= dt;
    if (owlTimer <= 0) {
      if (ambNight > 0.6) playOwl();
      owlTimer = 18 + Math.random() * 22;
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    let target = dholReq > dholBase ? dholReq : dholBase;
    dholReq = 0;
    const st = ctx.state;
    if (st) {
      // Fallbacks in case the owning module isn't requesting: victory is always full dhol,
      // and a bhangra boost always gets a groove.
      if (st.mode === 'victory') target = 1;
      else if (st.mode === 'playing' && st.boostUntil > (ctx.time || 0) && target < 0.6) target = 0.6;
    }
    if (!musicOn || !isLive()) target = 0;
    dholLevel = util.damp(dholLevel, target, target > dholLevel ? 5 : 1.6, dt);
    if (target === 0 && dholLevel < 0.003) dholLevel = 0;
    if (!ac) return;

    if (target > 0.001 || dholLevel > 0.01) {
      dholSilentFor = 0;
      if (!dhol.timer && isLive()) startDhol();
    } else if (dhol.timer) {
      dholSilentFor += dt;
      if (dholSilentFor > 1) stopDhol();
    }
    setSmooth('music', musicBus.gain, LEVEL_MUSIC * Math.pow(dholLevel, 1.25), 0.06);
    updateAmbience(dt);
    if (sitar && isLive()) {
      const mode = st && st.mode;
      const chase = (mode === 'playing' || mode === 'paused') && !!ctx.hazards?.chasing;
      sitar.update(dt, { on: musicOn && !muted, night: ambNight, duck: chase ? 0 : Math.max(dholLevel, lineDuck), voice: lineDuck, chase, paused: mode === 'paused', victory: mode === 'victory' });
    }
    if (pendingIntro) tryIntro();
    // Character lines (boss voice notes, focus music) duck the sitar and the jungle under them.
    let want = 0;
    for (let i = activeLines.length - 1; i >= 0; i--) {
      const h = activeLines[i];
      if (!h.playing) { activeLines.splice(i, 1); continue; }
      if (h.duck > want) want = h.duck;
    }
    lineDuck = util.damp(lineDuck, want, want > lineDuck ? 6 : 1.5, dt);
    if (lineDuck < 0.002) lineDuck = 0;
  }

  // ---------------------------------------------------------------- character lines
  // Bundled/recorded clips played at their natural pitch on the intro path (no jitter, no
  // shared compressor): Bikraam's and Papaji's voice notes and their focus music.
  // playLine(id, {volume=1, duck=0..1, avoid=takeIndex}) -> handle {index, duration, playing, stop(fade)} | null
  const activeLines = [];
  let lineDuck = 0;
  function lineTakes(id) {
    const c = clips[id];
    if (!c) return [];
    const rec = c.recorded.filter((t) => t.buffer);
    return rec.length ? rec : c.bundled.filter((t) => t.buffer);
  }
  function lineReady(id) { return lineTakes(id).length > 0; }
  function playLine(id, opts = {}) {
    if (!isLive() || muted) return null;
    const list = lineTakes(id);
    if (!list.length) return null;
    let idx = Math.floor(Math.random() * list.length);
    if (list.length > 1 && idx === opts.avoid) idx = (idx + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
    const take = list[idx];
    const src = ac.createBufferSource();
    src.buffer = take.buffer;
    const g = ac.createGain();
    g.gain.value = Number.isFinite(opts.volume) ? opts.volume : 1;
    src.connect(g);
    g.connect(introChain().input);
    const h = {
      id, index: idx, duration: take.length, playing: true, duck: opts.duck || 0,
      stop(fade = 0.2) {
        if (!h.playing) return;
        h.playing = false;
        try { g.gain.setTargetAtTime(0, ac.currentTime, Math.max(0.01, fade / 3)); src.stop(ac.currentTime + fade + 0.05); } catch (e) { /* already stopped */ }
      },
    };
    src.onended = () => { h.playing = false; try { src.disconnect(); g.disconnect(); } catch (e) { /* gone */ } };
    src.start(ac.currentTime + 0.01, take.offset, take.length);
    activeLines.push(h);
    return h;
  }
  function stopLines(fade = 0.25) { for (const h of activeLines) h.stop(fade); }

  // ---------------------------------------------------------------- character intros
  // The player's own recordings, bundled as audio/intro-<character>.m4a (manifest id intro_<id>).
  // Played when a character card is picked on the title screen, and once at Start if that
  // character's intro hasn't been heard yet. Picking another character cuts the previous one.
  let introVoice = null;
  let pendingIntro = null;
  let introOut = null;
  const introHeard = new Set();
  // Absolute playback gain for intros that were mastered loud on purpose (Bibi's is pre-limited
  // to full scale). Others keep their normal level: peak-normalised gain x the master level.
  const INTRO_LEVEL = { bibi: 1.0 };

  // Intros get their own path straight to the speakers: a safety limiter, then a mute-aware
  // gain. Skipping the shared compressor keeps a loud intro loud while the jungle plays.
  function introChain() {
    if (introOut) return introOut;
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -0.3; lim.knee.value = 0; lim.ratio.value = 20;
    lim.attack.value = 0.002; lim.release.value = 0.15;
    const out = ac.createGain();
    out.gain.value = muted ? 0 : 1;
    lim.connect(out);
    out.connect(ac.destination);
    introOut = { input: lim, out };
    return introOut;
  }
  function playIntro(id) {
    if (!id) return;
    introHeard.add(id);
    if (introVoice && ac) { stopVoice(introVoice); introVoice = null; }
    pendingIntro = { id, until: performance.now() + 3000 };
    tryIntro();
  }
  function tryIntro() {
    if (!pendingIntro) return;
    if (performance.now() > pendingIntro.until || muted) { pendingIntro = null; return; }
    if (!isLive()) return;
    const take = playableTake('intro_' + pendingIntro.id);
    if (!take) return;                       // still decoding (or no clip for them yet)
    const introId = pendingIntro.id;
    pendingIntro = null;
    const src = ac.createBufferSource();
    src.buffer = take.buffer;
    const lvl = INTRO_LEVEL[introId];
    const g = ac.createGain();
    g.gain.value = lvl != null ? lvl : take.gain * LEVEL_MASTER;
    g.connect(introChain().input);
    src.connect(g);
    const entry = { src, g, done: false };
    src.onended = () => {
      entry.done = true;
      try { src.disconnect(); g.disconnect(); } catch (e) { /* gone */ }
    };
    src.start(ac.currentTime + 0.01, take.offset, take.length);
    introVoice = entry;
  }

  // ---------------------------------------------------------------- settings API
  function setMuted(b) {
    muted = !!b;
    writeFlag(LS_MUTED, muted);
    if (ac && master) master.gain.setTargetAtTime(muted ? 0 : LEVEL_MASTER, ac.currentTime, 0.03);
    if (ac && introOut) introOut.out.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.03);
    if (muted && window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    }
    if (boothIsOpen) refreshAllRows();
  }

  function setMusic(b) {
    musicOn = !!b;
    writeFlag(LS_MUSIC, musicOn);
  }

  // ---------------------------------------------------------------- game events
  const ev = ctx.events;
  ev.on('character:select', (e) => playIntro(e && e.character));
  // With a boss intro cutscene running, the hero's own intro waits until it's over.
  let introAfterCut = null;
  ev.on('game:start', (e) => {
    const ch = e && e.character;
    if (!ch || introHeard.has(ch)) return;
    if (ctx.state.mode === 'cutscene') introAfterCut = ch; else playIntro(ch);
  });
  ev.on('cutscene:start', () => { if (introVoice && ac) stopVoice(introVoice); introVoice = null; pendingIntro = null; });
  ev.on('cutscene:end', () => { if (introAfterCut) { const ch = introAfterCut; introAfterCut = null; playIntro(ch); } });
  ev.on('mode', (e) => { if (e && (e.mode === 'title' || e.mode === 'victory')) stopLines(0.4); });
  ev.on('turban:collect', (e) => {
    const kind = (e && e.kind) || 'normal';
    const position = e && e.position;
    const combo = (e && e.combo) || 0;
    const volume = e && e.loose ? 0.85 : 1;
    if (kind === 'golden') {
      voice('waheguru_golden', { position, volume });
      sfx('golden', { position });
    } else {
      voice('waheguru', { position, combo, volume });
      sfx(kind === 'normal' ? 'pickup' : 'pickup-special', { position, combo });
    }
  });
  ev.on('combo:milestone', (m) => { if (m && m.voice) voice(m.voice, { priority: true }); });
  ev.on('player:hit', (e) => {
    const position = e && e.position;
    voice('oye', { priority: true, position });
    sfx('hit', { position });
    sfx('scatter', { position });
  });
  ev.on('player:faint', () => {
    voice('hai', { priority: true });
    sfx('faint');
  });
  ev.on('quest:victory', () => {
    voice('fateh', { priority: true });
    sfx('victory');
  });
  ev.on('quest:stage', (e) => { if (e && e.stage > 0) sfx('compass'); });
  ev.on('player:jump', () => sfx('jump', { volume: 0.45 }));
  ev.on('player:land', (e) => {
    const fall = (e && e.fallSpeed) || 0;
    if (fall > 8) sfx('land', { volume: util.clamp(0.4 + (fall - 8) / 12, 0.4, 1) });
  });
  ev.on('player:splash', (e) => sfx('splash', { position: e && e.position }));
  ev.on('checkpoint', () => sfx('checkpoint'));
  ev.on('powerup', (e) => {
    // The dhaba's chai power-up arrives with the checkpoint kettle; don't stack a sweep on it.
    if (e && e.type === 'chai' && ac && lastSfx.checkpoint !== undefined && ac.currentTime - lastSfx.checkpoint < 0.6) return;
    sfx('powerup');
  });
  ev.on('hazard:stunned', (e) => sfx('whoosh', { position: e && e.position }));
  ev.on('player:ability', (e) => {
    const who = e && e.character;
    // Bibi gets no sound here: player.js whooshes when the chappal actually leaves her hand
    // (THROW_RELEASE, 0.2 s later), past whoosh's SFX_GAP, so a whoosh here would double it.
    // Babbu's and Jasmeet's are same-tick duplicates of player.js's and are merged by SFX_GAP.
    if (who === 'babbu') sfx('spin');
    else if (who === 'jasmeet') sfx('powerup', { rate: 1.25 });
  });

  // ---------------------------------------------------------------- Voice Booth
  let booth = null;
  let boothIsOpen = false;
  let recordAvailable = null;   // null = not checked yet
  let recording = null;

  function injectStyle() {
    if (document.getElementById('vb-style')) return;
    const style = el('style', { id: 'vb-style' });
    style.textContent = BOOTH_STYLE;
    document.head.appendChild(style);
  }

  function buildBooth() {
    injectStyle();
    const lines = voiceLines();
    const rows = Object.create(null);
    const list = el('div', { class: 'vb-list', role: 'list' });
    for (const id of Object.keys(lines)) {
      const line = lines[id];
      const label = line.label || id;
      const badge = el('span', { class: 'vb-badge', id: `vb-badge-${id}` });
      const info = el('div', { class: 'vb-info' },
        el('div', { class: 'vb-label', id: `vb-label-${id}` }, label, badge),
        line.when ? el('div', { class: 'vb-when', text: line.when }) : null,
        line.text ? el('div', { class: 'vb-say', text: `“${line.text}”` }) : null);
      const play = el('button', { type: 'button', class: 'vb-btn vb-play', id: `vb-play-${id}`, 'data-act': 'play', 'data-id': id, 'aria-label': `Play ${label}`, text: '▶ Play' });
      const add = el('button', { type: 'button', class: 'vb-btn', id: `vb-add-${id}`, 'data-act': 'add', 'data-id': id, 'aria-label': `Add a clip for ${label}`, text: 'Add clip' });
      const file = el('input', { type: 'file', accept: 'audio/*', class: 'vb-file', id: `vb-file-${id}`, tabindex: '-1', 'aria-hidden': 'true' });
      const rec = el('button', { type: 'button', class: 'vb-btn vb-rec', id: `vb-rec-${id}`, 'data-act': 'rec', 'data-id': id, 'aria-pressed': 'false', 'aria-label': `Record ${label}`, text: 'Record' });
      const clear = el('button', { type: 'button', class: 'vb-btn', id: `vb-clear-${id}`, 'data-act': 'clear', 'data-id': id, 'aria-label': `Clear your takes for ${label}`, text: 'Clear' });
      const fill = el('span', { class: 'vb-meter-fill' });
      const time = el('span', { class: 'vb-meter-time' });
      const meter = el('div', { class: 'vb-meter', id: `vb-meter-${id}`, hidden: true },
        el('div', { class: 'vb-meter-bar', role: 'presentation' }, fill), time);
      const note = el('p', { class: 'vb-note', id: `vb-note-${id}`, 'aria-live': 'polite' });
      const row = el('div', { class: 'vb-row', role: 'listitem', id: `vb-row-${id}`, 'aria-labelledby': `vb-label-${id}` },
        info, el('div', { class: 'vb-actions' }, play, add, rec, clear, file), meter, note);
      file.addEventListener('change', () => {
        const f = file.files && file.files[0];
        file.value = '';
        if (f) acceptFile(id, f);
      });
      list.appendChild(row);
      rows[id] = { row, badge, play, add, rec, clear, file, meter, fill, time, note, label };
    }

    const close = el('button', { type: 'button', class: 'vb-btn vb-x', id: 'vb-close', 'data-act': 'close', 'aria-label': 'Close Voice Booth', text: '×' });
    const norec = el('p', { class: 'vb-norec', id: 'vb-norec', hidden: true, text: BOOTH_NO_RECORD });
    const done = el('button', { type: 'button', class: 'vb-btn vb-done', id: 'vb-done', 'data-act': 'close', text: 'Done' });
    const panel = el('div', { class: 'vb-panel', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'vb-title', 'aria-describedby': 'vb-intro', tabindex: '-1' },
      el('div', { class: 'vb-scroll' },
        el('div', { class: 'vb-head' },
          el('div', null,
            el('span', { class: 'vb-kicker', text: 'Your voice, your jungle' }),
            el('h2', { class: 'vb-title', id: 'vb-title', text: 'Voice Booth' })),
          close),
        el('p', { class: 'vb-intro', id: 'vb-intro', text: BOOTH_INTRO }),
        norec,
        list,
        el('div', { class: 'vb-foot' },
          el('p', { text: `Up to ${MAX_TAKES} takes per line; the game picks one at random each time. One big shout per clip is perfect.` }),
          done)));
    const root = el('div', { id: 'vb-root', hidden: true }, panel);

    panel.addEventListener('click', onBoothClick);
    root.addEventListener('pointerdown', (e) => { if (e.target === root && !recording) closeBooth(); });
    booth = { root, panel, rows, norec, close, lastFocus: null };
  }

  function setNote(id, text, isError) {
    const r = booth && booth.rows[id];
    if (!r) return;
    r.note.textContent = text || '';
    r.note.classList.toggle('is-error', !!isError);
  }

  function badgeFor(id) {
    const st = statusOf(id);
    if (st.source === 'recorded') return { src: 'recorded', text: `Your take ×${st.takes}` };
    if (st.source === 'bundled') return { src: 'bundled', text: st.takes > 1 ? `Game clip ×${st.takes}` : 'Game clip' };
    const alias = VOICE_ALIASES[id];
    if (alias && statusOf(alias).source !== 'tts') return { src: 'tts', text: `Uses ${(voiceLines()[alias] || {}).label || alias} clip` };
    return { src: 'tts', text: 'Stand-in voice' };
  }

  function refreshRow(id) {
    const r = booth && booth.rows[id];
    if (!r) return;
    const b = badgeFor(id);
    r.badge.textContent = b.text;
    r.badge.setAttribute('data-src', b.src);
